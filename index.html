<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- 主题色跟品牌标记同一个朱（app/src/style.css 的 --lg-zhu） -->
    <meta name="theme-color" content="#a82a24" />
    <title>生活指南</title>
    <meta
      name="description"
      content="把《生活手册》变成能照着做的卡片：113 篇手册、518 张卡。今天只给该做的那几件，到点自己提醒，断几天不清零。"
    />

    <!-- 社交预览：分享出去时的那张图（brand/og.html 渲出来的，1200×630） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="生活指南" />
    <meta property="og:title" content="生活指南 —— 把《生活手册》变成能照着做的卡片" />
    <meta
      property="og:description"
      content="113 篇手册 · 518 张卡 · 到点自己提醒你 · 断几天不清零。"
    />
    <!-- og:image 只认绝对 URL：部署时给 OG_IMAGE_URL（vite.config.ts 会替换）。
         本地 / 桌面 / 手机这三个壳没有域名，占位符落成相对路径。 -->
    <meta property="og:image" content="https://life.newzone.top/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="生活指南：一张卡，三行，盖一颗印" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="生活指南 —— 把《生活手册》变成能照着做的卡片" />
    <meta name="twitter:description" content="113 篇手册 · 518 张卡 · 到点自己提醒你 · 断几天不清零。" />
    <meta name="twitter:image" content="https://life.newzone.top/og.png" />

    <!-- 资源用相对路径：同一份产物在子路径（web）、app://（桌面）、
         capacitor://（手机）下都能找到（vite.config.ts 的 base: "./"） -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- 卡片数据是首屏的关键资源：让浏览器在下载 JS 的同时就开始取它，
         别等 JS 执行完才发现还要再等一个 cards.json 的请求。
         credentials 与 main.tsx 的 fetch 一致（omit），否则预加载会被丢弃。 -->
    <link rel="preload" href="./cards.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script type="module" crossorigin src="./assets/index-D647rtlj.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/jsxRuntime-KX8FZvxK.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CzoQivz6.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
