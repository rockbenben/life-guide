<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生活指南 · 原型</title>
<style>
:root{
  --ink:#2a2420; --paper:#faf6ef; --card:#fffdf9; --line:#e6ded2;
  --zhu:#a72b2a; --zhu-soft:#f3e2e0; --muted:#8a8078; --ok:#4a7c59;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e8e0d6;--paper:#1c1814;--card:#241f1a;--line:#3a332c;
        --zhu:#e08a86;--zhu-soft:#3a2a28;--muted:#9c9188;--ok:#7fb08c}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
     background:var(--paper);color:var(--ink);
     padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
h1{font-size:22px;margin:0;font-weight:700}
.date{color:var(--muted);font-size:13px}

/* ---- 分档选择：这是「选择」那一层 ---- */
.tiers{display:flex;gap:8px;margin:16px 0 6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tiers::-webkit-scrollbar{display:none}
.tier{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;
      background:var(--card);color:var(--muted);font-size:14px;cursor:pointer;
      transition:.15s}
.tier[aria-pressed=true]{background:var(--zhu);border-color:var(--zhu);color:#fff}
.tier-hint{color:var(--muted);font-size:12.5px;min-height:18px;margin-bottom:14px}

/* ---- 卡片：提醒 + 选择 + 指南 融在一张卡上 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
      margin-bottom:10px;overflow:hidden;transition:.2s}
.card.done{opacity:.55}
.card.done .title{text-decoration:line-through}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 12px;cursor:pointer}
.check{flex:0 0 26px;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;
       margin-top:2px;display:grid;place-items:center;font-size:15px;color:transparent;transition:.15s}
.card.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.body{flex:1;min-width:0}
.title{font-weight:650;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
       background:var(--zhu-soft);color:var(--zhu);flex:0 0 auto}
.badge.opt{background:transparent;color:var(--muted);border:1px solid var(--line)}
.dose{margin-top:3px;font-size:14px;color:var(--ink);opacity:.92}
.dose b{color:var(--zhu)}
.meta{margin-top:3px;font-size:12.5px;color:var(--muted)}
.chev{flex:0 0 auto;color:var(--muted);font-size:12px;transition:.2s;margin-top:6px}
.card.open .chev{transform:rotate(180deg)}

/* 展开即「指南」层 */
.guide{display:none;padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:2px}
.card.open .guide{display:block}
.guide ol{margin:12px 0 0;padding-left:20px}
.guide li{margin:5px 0;font-size:14.5px}
.watch{margin-top:12px;padding:9px 11px;border-radius:9px;background:var(--zhu-soft);
      font-size:13.5px;color:var(--zhu)}
.watch b{display:block;margin-bottom:2px;font-size:12px;opacity:.8}
.note{margin-top:10px;padding:8px 11px;border-radius:9px;background:var(--paper);
      font-size:13.5px;border:1px dashed var(--line)}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.imgs figure{margin:0}
.imgs img{width:100%;border-radius:9px;border:1px solid var(--line);display:block;
          background:var(--paper);aspect-ratio:4/3;object-fit:contain}
.imgs figcaption{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.imgnote{font-size:12px;color:var(--muted);margin-top:8px;font-style:normal}
.src{display:block;margin-top:10px;font-size:12px;color:var(--muted)}

/* ---- 分档卡片 ---- */
.seg{margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.seg-h{font-weight:650;font-size:14px}
.seg-i{margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.seg-i .w{font-size:12px;color:var(--muted)}
.seg-i .d{font-weight:600;font-size:14.5px;margin:2px 0}
.seg-i .x{font-size:13px;color:var(--muted)}

footer{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
       background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);
       border-top:1px solid var(--line);text-align:center}
button.reset{font:inherit;font-size:13.5px;color:var(--muted);background:none;
             border:1px solid var(--line);border-radius:999px;padding:7px 18px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>今天</h1>
    <span class="date" id="date"></span>
  </header>

  <div class="tiers" id="tiers"></div>
  <div class="tier-hint" id="tierHint"></div>

  <main id="list"></main>

  <div class="card" style="padding:14px">
    <div style="font-weight:650;font-size:15px" id="choiceTitle"></div>
    <div style="font-size:13px;color:var(--muted);margin:3px 0 2px" id="choiceWhy"></div>
    <div class="seg" id="segments"></div>
    <div class="watch" id="choiceNote"></div>
    <a class="src" id="choiceSrc"></a>
  </div>
</div>

<footer><button class="reset" id="reset">重置今日勾选</button></footer>

<script src="./data.js"></script>
<script>
const D = window.PROTO_DATA;
const KEY = 'life-guide-proto-v1';
let tier = 'full';
let done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let open = new Set();

document.getElementById('date').textContent =
  new Date().toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'long'});

function visible() {
  const t = D.tiers.find(x => x.id === tier);
  if (tier === 'busy') return D.actions.filter(a => a.inBusy);
  return D.actions;
}

function renderTiers() {
  document.getElementById('tiers').innerHTML = D.tiers.map(t =>
    `<button class="tier" data-id="${t.id}" aria-pressed="${t.id===tier}">${t.label}</button>`
  ).join('');
  const t = D.tiers.find(x => x.id === tier);
  document.getElementById('tierHint').textContent = t.hint;
}

function renderList() {
  document.getElementById('list').innerHTML = visible().map(a => {
    const isDone = done.has(a.id), isOpen = open.has(a.id);
    const busyTag = a.inBusy ? '<span class="badge opt">五分钟内</span>' : '';
    const steps = a.steps.map(s => `<li>${s}</li>`).join('');
    const watch = a.watch ? `<div class="watch"><b>注意</b>${a.watch}</div>` : '';
    const note  = a.note  ? `<div class="note">${a.note}</div>` : '';
    // 图片按 URL 引用，不嵌二进制；alt 文字来自手册原文，是唯一信息量所在
    const imgs = (a.images || []).map(im =>
      `<figure><img src="${im.url}" alt="${im.alt}" loading="lazy"><figcaption>${im.alt}</figcaption></figure>`
    ).join('');
    const imgBlock = imgs
      ? `<div class="imgs">${imgs}</div>`
      : `<p class="imgnote">（原文无配图）</p>`;
    const imgNote = a.imageNote ? `<div class="note">${a.imageNote}</div>` : '';
    return `<div class="card ${isDone?'done':''} ${isOpen?'open':''}" data-id="${a.id}">
      <div class="card-head">
        <div class="check" data-act="toggle">✓</div>
        <div class="body">
          <div class="title">${a.title}<span class="badge">${a.tier}</span>${busyTag}</div>
          <div class="dose"><b>${a.dose}</b></div>
          <div class="meta">${a.when}${a.intensity?' · '+a.intensity:''}${a.why?' · '+a.why:''}</div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="guide">
        <ol>${steps}</ol>
        ${note}${imgBlock}${imgNote}${watch}
        <a class="src" href="#">来自《${a.source.replace('.md','')}》 →</a>
      </div>
    </div>`;
  }).join('');
}

function renderChoice() {
  const c = D.choices;
  document.getElementById('choiceTitle').textContent = c.title;
  document.getElementById('choiceWhy').textContent = c.why;
  document.getElementById('segments').innerHTML = c.segments.map(s =>
    `<div class="seg-i">
       <div class="w">${s.when}</div>
       <div class="d">${s.do}</div>
       <div class="x">${s.dose}</div>
       <div class="x" style="color:var(--zhu)">⚠ ${s.avoid}</div>
     </div>`).join('');
  document.getElementById('choiceNote').innerHTML = `<b>要有心理准备</b>${c.effectNote}`;
  document.getElementById('choiceSrc').textContent = `来自《${c.source.replace('.md','')}》 →`;
}

document.getElementById('tiers').addEventListener('click', e => {
  const b = e.target.closest('.tier'); if (!b) return;
  tier = b.dataset.id; renderTiers(); renderList();
});

document.getElementById('list').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id;
  if (e.target.closest('[data-act="toggle"]')) {
    done.has(id) ? done.delete(id) : done.add(id);
    localStorage.setItem(KEY, JSON.stringify([...done]));
  } else {
    open.has(id) ? open.delete(id) : open.add(id);
  }
  renderList();
});

document.getElementById('reset').addEventListener('click', () => {
  done.clear(); localStorage.setItem(KEY, '[]'); renderList();
});

renderTiers(); renderList(); renderChoice();
</script>
</body>
</html>
