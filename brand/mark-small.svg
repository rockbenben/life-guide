<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    生活指南 · 小尺寸简版
    完整标记在 16px 上会糊成一团 —— 缩略图要另画，不是换个滤镜
    （html-shot 的 --small 就是干这个的）。

    这里只留最认得出的两笔：人 + 胸口那颗印。
    印的描边去掉了（16px 上那圈纸色只剩几个像素，反而糊）。
  -->
  <rect width="1024" height="1024" rx="224" fill="#a82a24"/>
  <circle cx="512" cy="300" r="128" fill="#fbf6ec"/>
  <path d="M302 806 V626 A210 210 0 0 1 722 626 V806 Z" fill="#fbf6ec"/>
  <rect x="448" y="588" width="128" height="128" rx="32" fill="#a82a24"/>
</svg>
