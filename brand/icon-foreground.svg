<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    自适应图标的前景层（透明）：只画标记本身，缩到中间的安全区里 ——
    Android 会按任意形状切边缘，图形超出安全区就会被切掉。

    人形的中心在 (512, 496)，缩 0.62 倍后落在安全区中间。
  -->
  <g transform="translate(512 512) scale(0.62) translate(-512 -496)">
    <circle cx="512" cy="286" r="106" fill="#fbf6ec"/>
    <path d="M322 812 V640 A190 190 0 0 1 702 640 V812 Z" fill="#fbf6ec"/>
    <rect x="427" y="560" width="170" height="170" rx="38" fill="#a82a24"
          stroke="#fbf6ec" stroke-width="26"/>
  </g>
</svg>
