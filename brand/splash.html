<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>生活指南 · 启动画面</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 2732px;
        height: 2732px;
        background: #fbf6ec;
        position: relative;
        display: grid;
        place-items: center;
      }
      /* 纸上的横格：跟 App 里的手帖一样 */
      .ruled {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 119px,
          rgba(168, 42, 36, 0.05) 119px 120px
        );
      }
      .plate {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 84px;
      }
      .mark {
        width: 620px;
        height: 620px;
        border-radius: 136px;
        background: #a82a24;
        position: relative;
        box-shadow: 0 30px 70px rgba(36, 31, 26, 0.16);
      }
      .mark .head {
        position: absolute;
        left: 39.6%; top: 17.6%;
        width: 20.7%; height: 20.7%;
        background: #fbf6ec;
        border-radius: 50%;
      }
      .mark .body {
        position: absolute;
        left: 31.4%; top: 43.9%;
        width: 37.1%; height: 35.4%;
        background: #fbf6ec;
        border-radius: 18.6% 18.6% 0 0 / 42% 42% 0 0;
      }
      .mark .stamp {
        position: absolute;
        left: 41.7%; top: 54.7%;
        width: 16.6%; height: 16.6%;
        background: #a82a24;
        border-radius: 22%;
        box-shadow: 0 0 0 2.4px #fbf6ec;
      }
      .name {
        font-family: "Songti SC", SimSun, "Noto Serif CJK SC", serif;
        font-size: 132px;
        letter-spacing: 26px;
        color: #241f1a;
        font-weight: 700;
        margin-left: 26px;
      }
    </style>
  </head>
  <body>
    <div class="ruled"></div>
    <div class="plate">
      <div class="mark">
        <div class="head"></div>
        <div class="body"></div>
        <div class="stamp"></div>
      </div>
      <div class="name">生活指南</div>
    </div>
  </body>
</html>
