<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>生活指南 · 社交预览</title>
    <style>
      :root {
        --paper: #fbf6ec;
        --sheet: #fffcf6;
        --rule: #e3d9c6;
        --ink: #241f1a;
        --ink-2: #5b5347;
        --ink-3: #8a8073;
        --zhu: #a82a24;
        --zhu-soft: #f7e9e6;
        --moss: #3f6b4b;
        --indigo: #2f5e8c;
      }
      * { box-sizing: border-box; }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      }
      /* 手帖的横格纸：极淡的线，不抢内容 */
      .ruled {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 43px,
          rgba(168, 42, 36, 0.055) 43px 44px
        );
      }
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 78% 18%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 60%),
          radial-gradient(80% 70% at 6% 96%, rgba(168, 42, 36, 0.05), rgba(168, 42, 36, 0) 70%);
      }

      .left {
        position: absolute;
        left: 78px;
        top: 118px;
        width: 560px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      /* 字标旁边是品牌标记本身（图标那张） */
      .mark {
        width: 74px;
        height: 74px;
        flex: none;
        border-radius: 17px;
        background: var(--zhu);
        position: relative;
      }
      .mark .head {
        position: absolute;
        left: 39.6%; top: 17.6%;
        width: 20.7%; height: 20.7%;
        background: var(--paper);
        border-radius: 50%;
      }
      .mark .body {
        position: absolute;
        left: 31.4%; top: 43.9%;
        width: 37.1%; height: 35.4%;
        background: var(--paper);
        border-radius: 18.6% 18.6% 0 0 / 42% 42% 0 0;
      }
      .mark .stamp {
        position: absolute;
        left: 41.7%; top: 54.7%;
        width: 16.6%; height: 16.6%;
        background: var(--zhu);
        border-radius: 22%;
        box-shadow: 0 0 0 2.4px var(--paper);
      }
      h1 {
        margin: 0;
        font-family: "Songti SC", SimSun, "Noto Serif CJK SC", "Source Han Serif SC", serif;
        font-size: 92px;
        line-height: 1;
        letter-spacing: 6px;
        font-weight: 700;
      }
      .rule {
        width: 96px;
        height: 5px;
        margin: 30px 0 26px;
        background: var(--zhu);
      }
      .tag {
        margin: 0;
        font-size: 33px;
        line-height: 1.5;
        color: var(--ink-2);
        letter-spacing: 1px;
      }
      .facts {
        margin: 26px 0 0;
        font-size: 21px;
        color: var(--ink-3);
        letter-spacing: 0.5px;
      }
      .facts b { color: var(--zhu); font-weight: 700; }

      /* 右边：App 的清单行长什么样 */
      .stack {
        position: absolute;
        right: 70px;
        top: 88px;
        width: 440px;
        height: 460px;
      }
      .sheet {
        position: absolute;
        width: 410px;
        background: var(--sheet);
        border: 1px solid var(--rule);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(36, 31, 26, 0.12);
        padding: 20px 22px;
      }
      .back {
        top: 0;
        right: 6px;
        transform: rotate(4deg);
        opacity: 0.72;
      }
      .front {
        top: 104px;
        left: 0;
        transform: rotate(-2.5deg);
        z-index: 2;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 15px 0;
        border-top: 1px solid var(--rule);
      }
      .row:first-of-type { border-top: 0; }
      .when {
        width: 46px;
        flex: none;
        font-size: 15px;
        color: var(--ink-3);
      }
      .txt { flex: 1 1 auto; }
      .nm { display: block; font-size: 21px; font-weight: 700; letter-spacing: 0.5px; }
      .sub { display: block; font-size: 16px; color: var(--ink-2); margin-top: 4px; }
      .sealbox {
        width: 34px;
        height: 34px;
        flex: none;
        border: 3px solid var(--zhu);
        border-radius: 6px;
        background: var(--zhu-soft);
      }
      .sealbox.done { background: var(--zhu); border-color: var(--zhu); }
      .cardname {
        font-size: 17px;
        color: var(--ink-3);
        letter-spacing: 2px;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="ruled"></div>
    <div class="wash"></div>

    <div class="left">
      <div class="brand">
        <div class="mark">
          <div class="head"></div>
          <div class="body"></div>
          <div class="stamp"></div>
          <div class="stamp"></div>
        </div>
        <h1>生活指南</h1>
      </div>
      <div class="rule"></div>
      <p class="tag">把《生活手册》变成<br />能照着做的卡片</p>
      <p class="facts">
        113 篇手册 · <b>402</b> 个能照着做的动作 · 到点自己提醒你
      </p>
    </div>

    <div class="stack">
      <div class="sheet back">
        <div class="cardname">今天 · 日间</div>
        <div class="row">
          <span class="when">日间</span>
          <span class="txt">
            <span class="nm">晒太阳补维生素 D</span>
          </span>
          <span class="sealbox done"></span>
        </div>
      </div>

      <div class="sheet front">
        <div class="cardname">今天 · 早晨</div>
        <div class="row">
          <span class="when">早晨</span>
          <span class="txt">
            <span class="nm">起床后晒 15 分钟晨光</span>
            <span class="sub">起床后 3 小时内，暴露在 2500 Lux 以上</span>
          </span>
          <span class="sealbox done"></span>
        </div>
        <div class="row">
          <span class="when">早晨</span>
          <span class="txt">
            <span class="nm">轻握牙刷轻轻刷</span>
            <span class="sub">别用力</span>
          </span>
          <span class="sealbox"></span>
        </div>
        <div class="row">
          <span class="when">随时</span>
          <span class="txt">
            <span class="nm">轻洗睫毛根部给眼睛补油</span>
            <span class="sub">早晚各一次</span>
          </span>
          <span class="sealbox"></span>
        </div>
      </div>
    </div>
  </body>
</html>
