<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    生活指南 · 标记母版
    一张卡（三行契约：名 / 做什么 / 剂量）+ 盖在末行旁的印。
    纯几何，不含文字：图标在任何尺寸、任何平台上都一样。
    配色取自 app/src/style.css：朱 #a82a24 · 纸 #fbf6ec
  -->
  <rect width="1024" height="1024" rx="224" fill="#a82a24"/>

  <!-- 卡 -->
  <rect x="225" y="287" width="574" height="451" rx="51" fill="#fbf6ec"/>

  <!-- 三行：名 / 做什么 / 剂量 -->
  <rect x="307" y="358" width="369" height="37" rx="18.5" fill="#a82a24"/>
  <rect x="307" y="461" width="266" height="37" rx="18.5" fill="#a82a24"/>
  <rect x="307" y="563" width="184" height="37" rx="18.5" fill="#a82a24"/>

  <!-- 印：App 里每天盖的那一颗 -->
  <rect x="573" y="512" width="205" height="205" rx="41" fill="#a82a24" stroke="#fbf6ec" stroke-width="32"/>
</svg>
