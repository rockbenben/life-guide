# 发版流水线：tag 是唯一的版本源。
#
# 流程：validate（tag⇄版本 + 测试）→ prepare（建草稿）→ build（Windows / macOS / Linux 桌面 + Android）
#       → publish（校验资产 → SHA256SUMS → 人工审批 → 发布 → 核验）。
#
# 为什么这么排：
#
#   · **tag 是唯一版本源**。发版提交先把各 package.json 的版本改成 x.y.z，再打 tag；
#     validate 这一步断言 tag 与版本一致，不一致直接失败 —— 免得出现
#     「tag 是 v0.1.2、包里却写着 0.1.1」这种半年后才发现的怪事。
#   · **红树不发布**：build 与 publish 都 needs: validate，测试不过就没人发版。
#   · **先草稿、后审批、再发布**：publish 走 `release` environment（人工审批），
#     草稿里能改发布说明、改完再放行 —— 半成品不会被人下载到。
#   · **一个 OS 一个 job**：同一 OS 的 x64 / arm64 必须放在同一次 electron-builder
#     调用里 —— 分 job 打会各写同名 latest*.yml，谁后跑谁赢。
#   · **打包一律 --publish never**：发布由唯一的 publish job 做，
#     否则每个 job 各自抢着发，会发出半成品。
#   · **产物不走 artifact 中转**（2026-10-28 改）：Actions 的 artifact 存储是
#     **账户级共享**的配额（GitHub Free 500 MB，与 Packages 共用），而这一版要发的
#     产物约 1.6 GB —— 走 artifact 中转必然撑爆配额（实测账户已用 11.5 GB，
#     连 157 MB 都传不上去）。所以每个构建 job 直接把产物传到这个 release 草稿上，
#     publish 只读 API。**release 资产不占 artifact 配额**，这是绕开它的正路。
#     校验和也不再靠把 1.6 GB 下一遍 —— GitHub 的资产 API 每个资产都带
#     `digest`（sha256:…），服务端算的，跟用户下载下来算的同一个值。
#
# 只维护在默认分支。tag 触发时跑的是**被打 tag 那个提交里的这份文件**，
# 所以修了工作流要用包含修复的提交重新打 tag。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发的 tag（如 v0.1.1）'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NODE: '26'

jobs:
  validate:
    name: 校验版本并跑测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0

      - id: version
        name: tag 与各 package.json 的版本要对得上
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG 不是 vX.Y.Z"; exit 1; }
          v="${TAG#v}"
          for f in package.json app/package.json content/package.json desktop/package.json mobile/package.json; do
            pkg=$(node -p "require('./$f').version")
            [ "$pkg" = "$v" ] || { echo "::error::$f 是 $pkg，与 tag $v 对不上"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      # Electron ≥ 42 不再靠 postinstall 下载二进制了，得显式装
      - run: npx install-electron
      - run: npm run content:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop

  # 先把草稿建好，后面几个构建 job 往同一个草稿里传产物。
  # 草稿只建一次：几个 job 并行时「按 tag 找」会撞上草稿标签被 GitHub
  # 改成 untagged-xxx 的老问题，所以下面都按 release id 传。
  prepare:
    name: 建发布草稿
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
      - name: 建草稿（正文先放占位，这一版特有的说明在放行审批前补）
        id: draft
        shell: bash
        run: |
          mkdir -p dist
          node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

  # 每个 OS 一个 job：同一 OS 的 x64 / arm64 必须在同一次 electron-builder
  # 调用里打，否则 latest*.yml 会互相覆盖。全部 --publish never，由 publish 统一放行。
  build-desktop-win:
    name: 打包桌面端（Windows）
    needs: [validate, prepare]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run app:build
      - name: 打包（NSIS 双架构安装包 + 双架构免安装版）
        # 产物名在 desktop/package.json 里定死了（ASCII）：
        # GitHub 的附件名只吃 ASCII，中文会被换成 default.exe ——
        # 而且更新清单 latest*.yml 里记的就是这个文件名，对不上就更新不了。
        run: npx electron-builder --projectDir desktop --win nsis portable --x64 --arm64 --publish never
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest.yml dist/
          ls -l dist
      - name: 传到发布草稿
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  build-desktop-mac:
    name: 打包桌面端（macOS）
    needs: [validate, prepare]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run app:build
      - name: 打包（dmg + zip；zip 是更新载体）
        # 还没有 Developer ID：显式关闭证书自动发现，产出未签名包。
        # 未签名的 macOS 版不接自动更新（desktop/lib/updater.mjs 里如实说明）。
        run: npx electron-builder --projectDir desktop --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest-mac.yml dist/
          ls -l dist
      - name: 传到发布草稿
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  build-desktop-linux:
    name: 打包桌面端（Linux）
    needs: [validate, prepare]
    # 22.04 的 glibc 更老，兼容面更广（house style）
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run app:build
      - name: 打包（AppImage 更新载体 + deb / rpm）
        # 没有原生模块，x64 runner 可以交叉打 arm64。
        run: npx electron-builder --projectDir desktop --linux AppImage deb rpm --x64 --arm64 --publish never
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          # 逐个拷而不是一次 cp 多个通配符：
          # 某个通配符没匹配到文件时，bash 会把它当字面量传下去，cp 报
          # "No such file or directory" 就把整步带崩 ——
          # Linux 就没有 .blockmap（那是 NSIS 与 macOS 才有的增量下载用）。
          for f in desktop/release/*.AppImage desktop/release/*.deb desktop/release/*.rpm desktop/release/latest-linux*.yml; do
            [ -e "$f" ] && cp "$f" dist/
          done
          ls -l dist
      - name: 传到发布草稿
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  build-android:
    name: 打包 Android
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npm run app:build
      - run: npm run sync --workspace @life-guide/mobile
      # Capacitor 8 的 Android 端要 JDK 21（source/target 21）。
      # runner 上的默认 JDK 是 17，不显式装的话会报 "invalid source release: 21"。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android 的版本跟着 tag
        run: node scripts/sync-android-version.mjs "${TAG#v}"
      - name: 编译 APK
        working-directory: mobile/android
        run: |
          # gradlew 在仓库里没有可执行位（Windows 上提交出来的）
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          # Gradle 出来的是 app-debug.apk；GitHub 的附件名只吃 ASCII
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/LifeGuide-${TAG#v}.apk"
          ls -l dist
      - name: 传到发布草稿
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  publish:
    name: 发布
    needs: [validate, prepare, build-desktop-win, build-desktop-mac, build-desktop-linux, build-android]
    runs-on: ubuntu-latest
    environment: release # 人工审批闸门：草稿改好了再放行
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      # 建草稿与传附件要跑仓库里的脚本（scripts/release-draft.mjs）
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'

      - name: 校验资产并生成校验和
        # 四条更新清单的版本与指向、15 个产物在不在、清单指的是不是对的载体，
        # 全在这里查；SHA256SUMS 用 GitHub 资产 API 给的 sha256 拼（服务端算的）。
        run: node scripts/release-assets.mjs checksums

      - name: 把校验和传上去
        run: node scripts/release-draft.mjs checksums

      - id: plan
        name: 要不要做来源证明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # artifact attestation：私有仓库在普通套餐下不支持
          # （要 GitHub Enterprise Cloud）。仓库转公开后这一步自动生效。
          if [ "$(gh api "repos/$REPO" --jq .private)" = "false" ]; then
            echo "attest=true" >> "$GITHUB_OUTPUT"
          else
            echo "attest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库还是私有的，这一步跳过来源证明（公开后自动生效）"
          fi

      - name: 来源证明（attestation）
        if: steps.plan.outputs.attest == 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: checksums/SHA256SUMS

      - name: 发布并设为 latest
        shell: bash
        run: |
          # 用 release id，不按 tag 找：
          # 草稿的标签名在 GitHub 侧会变成 "untagged-xxx"，按 tag 找会落空。
          [ -n "$RELEASE_ID" ] || { echo "::error::没有拿到 release id"; exit 1; }
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true >/dev/null

      - name: 发布后核验（像用户那样去取）
        shell: bash
        run: |
          # API 是准的；下载重定向会慢几分钟
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] \
            || { echo "::error::releases/latest 不是 $TAG"; exit 1; }
          private=$(gh api "repos/$REPO" --jq .private)
          for m in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            if [ "$private" = "true" ]; then
              # 私有仓库：releases/latest/download 那个链接匿名取不到
              # （它认的是浏览器会话，不是 API 令牌）→ 走 API 取附件。
              aid=$(gh api "repos/$REPO/releases/latest" --jq ".assets[] | select(.name==\"$m\") | .id")
              [ -n "$aid" ] || { echo "::error::release 上没有 $m"; exit 1; }
              gh api "repos/$REPO/releases/assets/$aid" -H "Accept: application/octet-stream" \
                | grep -q "^version: $VERSION$" \
                || { echo "::error::$m 的版本不对"; exit 1; }
            else
              ok=
              for _ in $(seq 1 10); do
                curl -fsSL "https://github.com/$REPO/releases/latest/download/$m" | grep -q "^version: $VERSION$" && { ok=1; break; }
                sleep 60
              done
              [ -n "$ok" ] || { echo "::error::公开的 $m 十分钟后还是旧的"; exit 1; }
            fi
          done
