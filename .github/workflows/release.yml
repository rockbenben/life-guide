# 发版：tag 是唯一版本源。
#
# 产物直接上传到公开 Release，不走 Actions artifact 中转（artifact 存储是账户级
# 配额，release 资产不占）。prepare 先创建公开 Release（make_latest=false），
# 各平台构建 job 按 release id 上传；全部资产与四份 updater feed 校验通过后，
# publish 才补 SHA256SUMS、做 attestation，最后由独立队列切换 latest。上传期间用户可见该版本，
# latest 仍停在上一完整版本。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发的 tag（如 v0.1.1）'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NODE: '26'

jobs:
  validate:
    name: 校验版本并跑测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0

      - id: version
        name: tag 与各 package.json 的版本要对得上
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG 不是 vX.Y.Z"; exit 1; }
          v="${TAG#v}"
          for f in package.json app/package.json content/package.json desktop/package.json mobile/package.json; do
            pkg=$(node -p "require('./$f').version")
            [ "$pkg" = "$v" ] || { echo "::error::$f 是 $pkg，与 tag $v 对不上"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-desktop-metadata.mjs
      # Electron ≥ 42 不再靠 postinstall 下载二进制了，得显式装
      - run: node node_modules/electron/install.js
      - run: npm run content:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop

      # 发布说明必须在这一版的提交里。
      #
      # **为什么在 validate 里查**（而不是等 prepare 用它时才发现）：
      # 少了说明就停下来，别把 1.6 GB 的产物打出来才发现正文是空的。
      #
      # **漏了说明怎么办**：`scripts/release-notes.mjs` 会先看工作区
      # （这里就是被打 tag 的那个提交），再看默认分支 —— tag 推上去之后才发现
      # 漏写时，把说明提交到默认分支、重跑这个 job 就行，不必动 tag
      #（产物是按那个提交打的）。
      - name: 这一版的发布说明要在
        shell: bash
        run: node scripts/release-notes.mjs --check

  # 先创建公开 Release，后续构建通过同一个 release id 上传产物。
  prepare:
    name: 创建公开 Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
      - name: 创建公开 Release（正文来自版本库）
        id: release
        shell: bash
        run: |
          mkdir -p dist
          node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

  # 每个 OS 一个 job：同一 OS 的 x64 / arm64 必须在同一次 electron-builder
  # 调用里打，否则 latest*.yml 会互相覆盖。全部 --publish never，由 publish 统一放行。
  build-desktop-win:
    name: 打包桌面端（Windows）
    needs: [validate, prepare]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run app:build
      - name: 打包（NSIS 双架构安装包 + 双架构免安装版）
        # 产物名在 desktop/package.json 里定死了（ASCII）：
        # GitHub 的附件名只吃 ASCII，中文会被换成 default.exe ——
        # 而且更新清单 latest*.yml 里记的就是这个文件名，对不上就更新不了。
        run: npx electron-builder --projectDir desktop --win nsis portable --x64 --arm64 --publish never
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest.yml dist/
          ls -l dist
      - name: 上传 Release 资产
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  build-desktop-mac:
    name: 打包桌面端（macOS）
    needs: [validate, prepare]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run app:build
      - name: 打包（dmg + zip；zip 是更新载体）
        # 还没有 Developer ID：显式关闭证书自动发现，产出未签名包。
        # 未签名的 macOS 版不接自动更新（desktop/lib/updater.mjs 里如实说明）。
        run: npx electron-builder --projectDir desktop --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest-mac.yml dist/
          ls -l dist
      - name: 上传 Release 资产
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  build-desktop-linux:
    name: 打包桌面端（Linux）
    needs: [validate, prepare]
    # 22.04 的 glibc 更老，兼容面更广（house style）
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run app:build
      - name: 打包（AppImage 更新载体 + deb / rpm）
        # 没有原生模块，x64 runner 可以交叉打 arm64。
        run: npx electron-builder --projectDir desktop --linux AppImage deb rpm --x64 --arm64 --publish never
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          # 逐个拷而不是一次 cp 多个通配符：
          # 某个通配符没匹配到文件时，bash 会把它当字面量传下去，cp 报
          # "No such file or directory" 就把整步带崩 ——
          # Linux 就没有 .blockmap（那是 NSIS 与 macOS 才有的增量下载用）。
          for f in desktop/release/*.AppImage desktop/release/*.deb desktop/release/*.rpm desktop/release/latest-linux*.yml; do
            [ -e "$f" ] && cp "$f" dist/
          done
          ls -l dist
      - name: 上传 Release 资产
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

  build-android:
    name: 打包 Android
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    env:
      # runner 上下文只在 step 级可用，写进 job 级 env 会让 GitHub 拒绝整个
      # workflow（2026-11-09 实测：Unrecognized named-value: 'runner'）。
      # 用 job 级可用的 github.workspace；keystore 只在本 job 期间存在，
      # 末尾的「清理临时签名文件」step 会删掉它。
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/life-guide-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
          fetch-depth: 0
      - name: 准备固定的 Android 发布签名
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - run: npm ci
      - run: npm run app:build
      - run: npm run sync --workspace @life-guide/mobile
      # Capacitor 8 的 Android 端要 JDK 21（source/target 21）。
      # runner 上的默认 JDK 是 17，不显式装的话会报 "invalid source release: 21"。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android 的版本跟着 tag
        run: node scripts/sync-android-version.mjs "${TAG#v}"
      - name: 编译 APK
        working-directory: mobile/android
        run: |
          # gradlew 在仓库里没有可执行位（Windows 上提交出来的）
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: 核验 APK 签名
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: 收拢产物
        shell: bash
        run: |
          mkdir -p dist
          # GitHub 的附件名只吃 ASCII
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/LifeGuide-${TAG#v}.apk"
          ls -l dist
      - name: 上传 Release 资产
        shell: bash
        run: node scripts/release-draft.mjs dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      - name: 清理临时签名文件
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"

  publish:
    name: 发布
    needs: [validate, prepare, build-desktop-win, build-desktop-mac, build-desktop-linux, build-android]
    runs-on: ubuntu-latest
    # Release 已公开，构建期间各平台逐步补齐。全部资产和清单验证后上传
    # SHA256SUMS 作为完成标记，再由 promote-latest 处理 latest。
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      # 历史脚本名 release-draft.mjs 保留；当前实现直接公开并上传。
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'

      - name: 校验资产并生成校验和
        # 四条更新清单的版本与指向、15 个产物在不在、清单指的是不是对的载体，
        # 全在这里查；SHA256SUMS 用 GitHub 资产 API 给的 sha256 拼（服务端算的）。
        run: node scripts/release-assets.mjs checksums

      - name: 把校验和传上去
        run: node scripts/release-draft.mjs checksums

      - id: plan
        name: 要不要做来源证明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # artifact attestation：私有仓库在普通套餐下不支持
          # （要 GitHub Enterprise Cloud）。仓库转公开后这一步自动生效。
          if [ "$(gh api "repos/$REPO" --jq .private)" = "false" ]; then
            echo "attest=true" >> "$GITHUB_OUTPUT"
          else
            echo "attest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库还是私有的，这一步跳过来源证明（公开后自动生效）"
          fi

      - name: 来源证明（attestation）
        if: steps.plan.outputs.attest == 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: checksums/SHA256SUMS

  promote-latest:
    name: 切换 latest
    needs: [validate, prepare, publish]
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ env.TAG }}'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
      - name: 核对版本并切换 latest
        id: latest
        run: node scripts/release-latest.mjs

      - name: 发布后核验（像用户那样去取）
        if: steps.latest.outputs.selected == 'true'
        shell: bash
        run: |
          # API 是准的；下载重定向会慢几分钟
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] \
            || { echo "::error::releases/latest 不是 $TAG"; exit 1; }
          private=$(gh api "repos/$REPO" --jq .private)
          for m in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            if [ "$private" = "true" ]; then
              # 私有仓库：releases/latest/download 那个链接匿名取不到
              # （它认的是浏览器会话，不是 API 令牌）→ 走 API 取附件。
              aid=$(gh api "repos/$REPO/releases/latest" --jq ".assets[] | select(.name==\"$m\") | .id")
              [ -n "$aid" ] || { echo "::error::release 上没有 $m"; exit 1; }
              gh api "repos/$REPO/releases/assets/$aid" -H "Accept: application/octet-stream" \
                | grep -q "^version: $VERSION$" \
                || { echo "::error::$m 的版本不对"; exit 1; }
            else
              ok=
              for _ in $(seq 1 10); do
                curl -fsSL "https://github.com/$REPO/releases/latest/download/$m" | grep -q "^version: $VERSION$" && { ok=1; break; }
                sleep 60
              done
              [ -n "$ok" ] || { echo "::error::公开的 $m 十分钟后还是旧的"; exit 1; }
            fi
          done
