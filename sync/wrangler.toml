name = "life-guide-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 每个空间拥有独立的 SQLite Durable Object，存储密文及版本。
[[durable_objects.bindings]]
name = "SYNC_SPACES"
class_name = "SyncSpace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncSpace"]

# 允许哪些来源来读写（逗号分隔）。
# 不配 = 全放行。建议配上自己的地址：
#   vars = { ALLOWED_ORIGINS = "https://life.newzone.top,http://localhost:5173" }
[vars]
ALLOWED_ORIGINS = ""
