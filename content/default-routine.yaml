# 默认清单：App 第一次打开时放进「我的日常」的那几张，次序即显示次序。
#
# 三部分：
#   1. 《每天固定做的几件事》—— 快照的目录页（the-savvy-life-manual/README.md）里那两节清单：
#      「时间紧的日子：这几件优先」5 件 +「完整版·每天必做」5 项（清洁拆成刷牙/牙线/洗脸）。
#   1b.「有余力就做」5 项（2026-10-31 加）—— 同一节里那一档「做完更好，不做也不塌」。
#      作者定的：这几件是**动作**，与清单里原有的性质一致，所以铺进日常。
#   1c.「原文写着每天/每周做」的好习惯（2026-10-31 加）—— 作者定的：
#      「都加，有好的习惯都应该进入。不应该因为[数量或分类]就排除」。
#      这一批是**手册里明写着频次的动作卡**（27 张里挑掉重复与不合适的，见下）。
#   2. 每个时段的补充（下面「按天补」那几行）—— 原来白天一档一张都没有，
#      早晨/晚间也各只有两三张。用户提的：「三个时间段经常只有一个推荐，怎么可能呢」。
#      补的都是手册里本来就写着「每天做」的动作，审阅时逐张签过字。
#
# **为什么清单长到 40 多张**：这一屏回答的是「现在做什么」，
# 但「好习惯多」不等于「今天都要做」—— App 侧因此给这一段加了折叠
# （先铺前 N 张，其余收在「还有 N 件」里，见 app/src/ui/TodayLog.tsx）。
# **次序仍是策展**：手册的每日清单在前，其余按主题排。
#
# 次序规则：按时段排（早晨 → 日间 → 晚间 → 随时），同一时段内按手册清单里的次序。
#   刷牙归「随时」：手册的每日清单自己写着「顺序不重要，每天做就行」，
#   而「晚间清洁」那一节也把刷牙算了进去 —— 早晚都做，就不锁死在早晨。
#   洗脸留在早晨：原文专门有一节讲「早上不用洗面奶」的风险。
#   随时那一档也照排（早晚都做、时间不定的动作），但它每天都在。
#
# 例外：睑缘清洗放在早晨段里、洗脸前面。
#   它的 slot 是 anytime（早晚各一次），但手册的「时间紧的日子」把它排在第 2 位
#   （紧跟晨光），所以次序跟着那份清单走。App 是按**卡上的 slot** 过滤时段的
#   （app/src/domain/daily.ts 的 todaysCards），段落的分组只是给人看的注释 ——
#   睑缘清洗在每一段里都会出现，位置就是这一行。
#
# 每张卡的 slot 决定它出现在哪一段（morning / daytime / evening / anytime）——
# App 是按卡上的 slot 过滤时段的（app/src/domain/daily.ts 的 todaysCards），
# 两边对不上，首启那一屏就会空掉或重复。
#
# **没有改任何卡的 slot**：这一批卡的 slot 在内容层就是 anytime
# （原文没说它们只属于某一段），改 slot 去均摊各段是拿界面好看换内容失真。
#
# 用户随时可以移出、自己挑、自己挪次序；顶部那颗「重置为默认」就是回到这一份。
#
# 校验（R15）：每个 id 都要存在、都要已签字、不能重复 —— 少一个，首启就少一张。
source: the-savvy-life-manual/README.md
