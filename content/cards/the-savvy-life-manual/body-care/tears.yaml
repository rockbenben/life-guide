      - id: cotton-pad
        text: "做法 用化妆棉也可以：把眼周专用的化妆棉用温水打湿，同样轻柔洗约 5 次"
        quote: "做法 ② 用化妆棉也可以：把眼周专用的化妆棉用温水打湿，同样轻柔洗约 5 次"
