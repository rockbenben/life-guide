    name: "轻洗睫毛根部给眼睛补油"
    source:
      anchor: "睑缘清洗：每天 10 秒"
    # 原文写的是「早晚各一次」，早晚都做，所以不固定到某个时段。
    slot: anytime

    remind:
      text: "每天 10 秒、早晚各一次、连续做 2 周"
      quote: "每天 10 秒、早晚各一次、连续做 2 周"

    dose:
      - value: 10
        unit: "秒"
        what: "每次清洗时长"
        quote: "每天 10 秒"
      - value: 1
        unit: "次"
        what: "早晚各一次"
        quote: "早晚各一次"
      - value: 2
        unit: "周"
        what: "连续做"
        quote: "连续做 2 周"
      - value: 5
        unit: "次"
        what: "来回轻洗"
        quote: "来回轻柔地洗约 5 次"
