# 覆盖清单：这个文件里哪些内容明确不抽成卡，以及为什么。
#
# 本篇只抽「睑缘清洗」这一张卡。热敷、眨眼训练、滴眼药水都是各自独立的做法，
# 泪膜结构与油脂不足的成因是背景知识——都不是「把手指洗一洗」这一招。
#
# 注意：开篇小节里「觉得还是干涩，就再加50℃ 热敷」被本卡的 info 禁忌引用，
# 所以标题小节不在 ignore 里。
#
ignore:
  sections:
    - anchor: "更干涩时的对策：50℃ 热敷"
      reason: "热敷（温罨法）是睑缘清洗之外的另一套做法，器具、水温、时长都另有一套，本篇只抽睑缘清洗"
    - anchor: "眨眼要「眨完整」"
      reason: "眼轮匝肌操是另一套肌肉训练，和睑缘清洗不是同一个动作，混在一起会让人以为做一遍就够"
    - anchor: "眼轮匝肌操（眼科医生有田玲子）"
      reason: "同上：这是被忽略的「眨眼要「眨完整」」小节里的四步训练，不属于睑缘清洗"
    - anchor: "最后：滴眼药水的正确姿势"
      reason: "滴药姿势属于用药方法，睑缘清洗不涉及滴眼药水，另开一卡更清楚"
    - anchor: "泪是一层「油＋水＋黏膜」的三明治"
      reason: "泪膜三层结构与油脂不足的统计是背景知识，说明为什么要洗，但没给出动作"
    - anchor: "油脂为什么会不够"
      reason: "睑板腺出口被堵的三个场景是成因分析（饮食油腻、头屑、眼妆），属背景，本卡只解决怎么清洁"

