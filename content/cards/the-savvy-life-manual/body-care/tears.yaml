        text: "做法 开始前先洗净双手：用温水打湿指尖，顺着睫毛根部，来回轻柔地洗约 5 次"
        quote: "做法 ① 开始前先洗净双手：用温水打湿指尖，顺着睫毛根部，来回轻柔地洗约 5 次"
