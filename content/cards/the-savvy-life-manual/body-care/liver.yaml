  - id: alt-cause-differential
    status: reviewed
    source:
      anchor: 'ALT 30 是一条新的就医线'
    remind:
      text: 'ALT 超过 30 可能对应脂肪肝、多种肝炎或已经进展下去的肝病'
      quote: 'ALT 超过 30 的原因不止脂肪肝一种，还可能是病毒性肝炎、酒精性肝炎、自身免疫性肝炎，以及已经进展下去的肝硬化、肝癌。'
    steps:
      - id: inspect-liver-ultrasound
        text: '脂肪肝在超声图像上的特征是，肝脏看上去比肾脏更白。'
        quote: '脂肪肝在超声图像上的特征是，肝脏看上去比肾脏更白。'
      - id: distinguish-liver-causes
        text: 'ALT 超过 30 的原因不止脂肪肝一种，还可能是病毒性肝炎、酒精性肝炎、自身免疫性肝炎，以及已经进展下去的肝硬化、肝癌。'
        quote: 'ALT 超过 30 的原因不止脂肪肝一种，还可能是病毒性肝炎、酒精性肝炎、自身免疫性肝炎，以及已经进展下去的肝硬化、肝癌。'
    notices:
      - level: info
        text: 'ALT 超过 30 的原因不止脂肪肝一种，还可能是病毒性肝炎、酒精性肝炎、自身免疫性肝炎，以及已经进展下去的肝硬化、肝癌。'
        quote: 'ALT 超过 30 的原因不止脂肪肝一种，还可能是病毒性肝炎、酒精性肝炎、自身免疫性肝炎，以及已经进展下去的肝硬化、肝癌。'
