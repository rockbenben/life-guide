  - id: three-t-amount-and-technique
    status: reviewed
    source:
      anchor: "3T 涂法：量、手法、频率"
    slot: anytime
    remind:
      text: "按部位用足量，并把 30 回涂开动作做得缓慢轻柔。"
      quote:
        - 量：足量。
        - 手法：涂 30 回。
        - 因为皮肤怕摩擦，这 30 回要缓慢、轻柔地涂开，不是来回使劲搓。
        - 量：足量。标准是 1FTU（Finger Tip Unit），即从食指第一关节挤出的一条。这一条够涂两个手掌的面积，涂到纸巾能粘住的程度就是够。说明书给的换算参考是：两个手掌的面积，大致相当于手臂从肘部往下那一段。各部位用量是：
    dose:
