    slot: anytime
    remind:
      text: "痒时先控制抓挠冲动，不要靠抓挠缓解。"
      quote:
        - "痒了就想抓，抓了更痒，这一步有明确的生理原因：角质层非常怕摩擦。"
        - "也就是说，抓挠不是缓解，是往回推这台机器的棘轮。"
        - "控制住抓挠冲动这件事本身就是治疗的一部分。"
