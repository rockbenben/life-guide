  - id: sweat-precautions
    status: reviewed
    source:
      anchor: 注意事项
    slot: anytime
    remind:
      text: 平时几乎不出汗的人避免一开始就剧烈出汗，把汗量一点点加上去；出汗后尽快冲洗擦干；运动或温浴时补水并同步补盐。
      quote:
        - 平时几乎不出汗的人，不要一上来就猛出。
        - 没有出汗习惯的人，一开始就要避免剧烈出汗，而是一点点把汗量加上去。
        - 出汗之后应尽快用淋浴冲洗，或用毛巾擦干。
        - 运动或温浴过程中一旦感觉身体不适，请立即中止。
        - 在进行暑热适应训练时，除了补水，别忘了同步补充盐分。
    steps:
      - id: avoid-intense-sweating-at-first
        text: 没有出汗习惯的人，一开始就要避免剧烈出汗，而是一点点把汗量加上去。
        quote: 没有出汗习惯的人，一开始就要避免剧烈出汗，而是一点点把汗量加上去。
      - id: increase-sweat-gradually
        text: 没有出汗习惯的人，一开始就要避免剧烈出汗，而是一点点把汗量加上去。
        quote: 没有出汗习惯的人，一开始就要避免剧烈出汗，而是一点点把汗量加上去。
      - id: rinse-or-dry-skin
        text: 出汗之后应尽快用淋浴冲洗，或用毛巾擦干。
        quote: 出汗之后应尽快用淋浴冲洗，或用毛巾擦干。
      - id: stop-if-unwell
        text: 运动或温浴过程中一旦感觉身体不适，请立即中止。
        quote: 运动或温浴过程中一旦感觉身体不适，请立即中止。
      - id: replenish-water-and-salt
        text: 在进行暑热适应训练时，除了补水，别忘了同步补充盐分。
        quote: 在进行暑热适应训练时，除了补水，别忘了同步补充盐分。
