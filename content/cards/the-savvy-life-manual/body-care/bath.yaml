cards:
  - id: tub-internal-muscle-exercises
    status: reviewed
    name: "泡澡时摆动腿和手臂"
    source:
      anchor: '在浴缸里练「内肌」：浮力让外肌卸力'
    slot: anytime
    remind:
      text: '手臂钟摆运动腿钟摆运动要慢不要过量'
      quote:
        - '手臂钟摆运动'
        - '腿钟摆运动'
        - '要慢'
        - '不要过量'
    dose:
      - value: 10
        unit: '次'
        what: '单侧摆动次数'
        quote: '各 10 次为 1 组'
      - value: 1
        valueMax: 3
        unit: '组'
        what: '建议组数'
        quote: '在不勉强的范围内做 1～3 组'
    steps:
      - id: arm-palm-forward
        text: '手掌朝内，手臂向正前方伸直'
        quote:
          - '手掌朝内，手臂'
          - '向正前方伸直'
      - id: arm-shoulder-swing
        text: '肩关节左右慢慢摆动'
        quote:
          - '肩关节'
          - '左右慢慢摆动'
      - id: arm-repetitions
        text: '各 10 次为 1 组在不勉强的范围内做 1～3 组'
        quote:
          - '各 10 次为 1 组'
          - '在不勉强的范围内做 1～3 组'
      - id: leg-lift-suspend
        text: '双脚在水中抬起、悬空'
        quote:
          - '双脚'
          - '在水中抬起、悬空'
      - id: leg-hip-swing
        text: '髋关节左右慢慢摆动'
        quote:
          - '髋关节'
          - '左右慢慢摆动'
      - id: leg-repetitions
        text: '各 10 次为 1 组同样做 1～3 组'
        quote:
          - '各 10 次为 1 组'
          - '同样做 1～3 组'
    cautions:
      - level: info
        text: '要慢动作太猛，反而是外肌先被刺激到不要过量'
        quote:
          - '要慢'
          - '动作太猛，反而是外肌先被刺激到'
          - '不要过量'
      - level: info
        text: '每周 2～3 次就够别间隔 3 天以上'
        quote:
          - '每周 2～3 次就够'
          - '别间隔 3 天以上'
      - level: info
        text: '浴缸太窄时屈膝也没关系'
        quote:
          - '浴缸太窄时'
          - '屈膝也没关系'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: cf3fb6cc559897fe

