  - id: bath-safety-basics
    status: reviewed
    source:
      anchor: '安全：说明书写明的几条'
    slot: anytime
    remind:
      text: '按安全要点泡澡：不够时间可分次，出浴不要猛地站起，泡前后补水。'
      quote:
        - '泡不够 10 分钟也有效'
        - '出浴缸时不要猛地站起来'
        - '为防止脱水，泡澡前后都要好好补水'
