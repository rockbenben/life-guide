        text: '分成几次泡也照样有健康效果中途可以冲洗身体或为了休息而出浴缸'
        quote:
          - '分成几次泡也照样有健康效果'
          - '中途可以冲洗身体'
          - '或为了休息而出浴缸'
      - id: stand-slowly
        text: '出浴缸时不要猛地站起来'
        quote: '出浴缸时不要猛地站起来'
      - id: hydrate-around-bath
        text: '为防止脱水，泡澡前后都要好好补水'
        quote: '为防止脱水，泡澡前后都要好好补水'
