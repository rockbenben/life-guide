  - id: squat-posture-key
    status: draft
    source:
      anchor: '改订版新增：深蹲姿势的一个关键'
    slot: anytime
    remind:
      text: '深蹲时夹紧肩胛骨并把下巴往回收'
      quote: '「尽量把肩胛骨往中间夹、把下巴往回收」'
    steps:
      - id: key-engage-core
        text: '先有意识地收紧腹横肌（想象把肚脐下方轻轻往里收），一边让骨盆前倾，一边慢慢弯膝'
        quote: '先有意识地收紧腹横肌（想象把肚脐下方轻轻往里收），一边让骨盆前倾，一边慢慢弯膝'
      - id: key-upper-body
        text: '这时身体不要向前倒，要尽量把肩胛骨夹到身后，并且尽量把下巴往回收、不要让头往前伸'
        quote: '这时身体不要向前倒，要尽量把肩胛骨夹到身后，并且尽量把下巴往回收、不要让头往前伸'
      - id: key-back-straight
        text: '一边保持背部挺直的姿势，一边做深蹲'
        quote: '一边保持背部挺直的姿势，一边做深蹲'
    cautions:
      - level: info
        text: '这个姿势如果做不到位，会给腰部或肌肉带来负担、进而引起腰痛，请务必留意。'
