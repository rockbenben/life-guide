cards:
  - id: single-leg-stand
    status: reviewed
    source:
      anchor: '第 3 位：单脚站立'
    slot: anytime
    remind:
      text: '扶稳后抬起一只脚并按原定时间保持'
      quote:
        - 把一只脚抬高约 5 cm，保持 30 秒到 1 分钟
        # 「左右分别做」是第 4 步那句；「扶稳后」要有出处：防跌倒的准备在第 1 步
        - 保持 30 秒到 1 分钟，左右分别做
        - 先做好防跌倒的准备：务必在椅子或墙等可以扶住的地方备好手，再开始。椅子必须是稳固的。
    effect:
      text: '有防止跌倒的效果'
      quote: '有防止跌倒的效果'
    dose:
      - value: 5
        unit: 'cm'
        what: '抬脚高度'
        quote: '把一只脚抬高约 5 cm'
        approximate: true
      # 「30 秒到 1 分钟」是**一条**范围，不拆成下限/上限两条（AGENTS.md §5.2）。
      # 换算成同一单位（1 分钟 = 60 秒）要写出算式。
      - value: 30
        valueMax: 60
        unit: '秒'
        what: '保持时长'
        quote: '保持 30 秒到 1 分钟，左右分别做'
        derived:
          formula: '原文 30 秒到 1 分钟；1 分钟 = 60 秒，所以是 30～60 秒'
    steps:
      - id: single-leg-prepare
        text: '先做好防跌倒的准备：务必在椅子或墙等可以扶住的地方备好手，再开始。椅子必须是稳固的。'
