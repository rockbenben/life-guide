      - id: single-leg-position
        text: '双手放在腰上，眼睛睁开，把一只脚抬高约 5 cm。'
        quote: '双手放在腰上，眼睛睁开，把一只脚抬高约 5 cm。'
      - id: single-leg-align
        text: '姿势要求是支撑脚大脚趾的根部、肚脐、鼻尖连成一条直线。'
        quote: '姿势要求是支撑脚大脚趾的根部、肚脐、鼻尖连成一条直线。'
      - id: single-leg-hold
        text: '保持 30 秒到 1 分钟，左右分别做'
        quote: '保持 30 秒到 1 分钟，左右分别做'
        duration:
          basis: quote
          sec: 30
          quote: 保持 30 秒到 1 分钟，左右分别做
      - id: single-leg-supported
        text: '撑不住单脚站的人，就在椅子等处轻轻搭着手练习'
        quote: '撑不住单脚站的人，就在椅子等处轻轻搭着手练习'
