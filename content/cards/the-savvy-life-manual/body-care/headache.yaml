  - id: migraine-treatments
    status: draft
    source:
      anchor: '偏头痛有对症药，也有预防药'
    remind:
      text: '区分发作时使用的对症药与每天服用的预防药，并核对效果、副作用、费用和限制。'
      quote:
        - 头痛发作时吃的「偏头痛用药」（以其中一种药为例）
        - 不论有没有头痛，每天都吃，用来减少发作频率
        - 药物种类多，效果和副作用各不相同；其中也有孕妇不能使用等限制
        - 先给两条能立刻用的判断线。吃药这条：每月服药 10 天以上（有的药要 15 天以上）可能已经是「药物过度使用性头痛」，吃了 3～4
          次症状还不见好，就带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。就医这条：每周 2
          天以上在吃市售镇痛药、说不清自己属于哪种头痛、疼痛和平时不同、格外剧烈、或者头痛已经妨碍到生活——这四类都该先去医院咨询一次。偏头痛的对症药和预防药差在哪、去了医院除了拿药还能拿到什么、怎么找头痛专科医生，见后面。^[「頭痛」のトリセツ]
        - 这个病最大的问题是没人知道：调查结果显示，连医疗从业者中也只有 73.5%
          听说过。对策其实很简单——说明书同时提到，有药企已经在自家产品的说明文档上直接呼吁注意「吃过头」，并在自己的官网推广 MOH 的科普。
    steps:
      - id: compare-acute-medicine
        text: '头痛消失后 24 小时以内不复发的概率，是普通镇痛药的 1.3 倍出现喉咙被勒紧一样的感觉或倦怠乏力这类轻微副作用的概率，是普通镇痛药的 1.6
          倍（但严重副作用与普通镇痛药相同）费用含诊疗费约 1,100 日元'
        quote:
          - '头痛消失后 24 小时以内不复发的概率，是普通镇痛药的 1.3 倍'
          - '出现喉咙被勒紧一样的感觉或倦怠乏力这类轻微副作用的概率，是普通镇痛药的 1.6 倍（但严重副作用与普通镇痛药相同）'
          - '费用含诊疗费约 1,100 日元'
      - id: understand-preventive-medicine
        text: '不论有没有头痛，每天都吃，用来减少发作频率药物种类多，效果和副作用各不相同；其中也有孕妇不能使用等限制费用含诊疗费与处方费约 700～1,400
          日元（效果好的预防药也有超过 1 万日元的高价款）以上都是大致标准，实际金额随诊疗内容不同。'
        quote:
          - '不论有没有头痛，每天都吃，用来减少发作频率'
          - '药物种类多，效果和副作用各不相同；其中也有孕妇不能使用等限制'
