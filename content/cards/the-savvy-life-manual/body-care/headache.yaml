cards:
  - id: headache-care-thresholds
    status: reviewed
    name: "头痛什么时候该就医"
    source:
      anchor: '头痛什么时候该去医院？每月吃药超 10 天别再忍'
    remind:
      text: '核对服药频率与头痛表现；出现异常或影响生活时，先咨询医生。'
      quote:
        - 每月服药 10 天以上
        - 有的药要 15 天以上
        - 说不清自己属于哪种头痛
        - 疼痛和平时不同、格外剧烈
        - 头痛已经妨碍到生活
        - 先给两条能立刻用的判断线。吃药这条：每月服药 10 天以上（有的药要 15 天以上）可能已经是「药物过度使用性头痛」，吃了 3～4
          次症状还不见好，就带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。就医这条：每周 2
          天以上在吃市售镇痛药、说不清自己属于哪种头痛、疼痛和平时不同、格外剧烈、或者头痛已经妨碍到生活——这四类都该先去医院咨询一次。偏头痛的对症药和预防药差在哪、去了医院除了拿药还能拿到什么、怎么找头痛专科医生，见后面。^[「頭痛」のトリセツ]
    steps:
      - id: check-medication-frequency
        text: '每月服药 10 天以上有的药要 15 天以上'
        quote:
          - 每月服药 10 天以上
          - 有的药要 15 天以上
          - 先给两条能立刻用的判断线。吃药这条：每月服药 10 天以上（有的药要 15 天以上）可能已经是「药物过度使用性头痛」，吃了 3～4
            次症状还不见好，就带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。就医这条：每周 2
            天以上在吃市售镇痛药、说不清自己属于哪种头痛、疼痛和平时不同、格外剧烈、或者头痛已经妨碍到生活——这四类都该先去医院咨询一次。偏头痛的对症药和预防药差在哪、去了医院除了拿药还能拿到什么、怎么找头痛专科医生，见后面。^[「頭痛」のトリセツ]
      - id: recognize-care-signals
        text: '说不清自己属于哪种头痛疼痛和平时不同、格外剧烈头痛已经妨碍到生活'
        quote:
          - '说不清自己属于哪种头痛'
          - '疼痛和平时不同、格外剧烈'
          - '头痛已经妨碍到生活'
    notices:
      - level: seek-care
        text: '每周 2 天以上在吃市售镇痛药、说不清自己属于哪种头痛、疼痛和平时不同、格外剧烈、或者头痛已经妨碍到生活——这四类都该先去医院咨询一次。'
        quote: '每周 2 天以上在吃市售镇痛药、说不清自己属于哪种头痛、疼痛和平时不同、格外剧烈、或者头痛已经妨碍到生活——这四类都该先去医院咨询一次。'
      - level: with-doctor
        text: '吃了 3～4 次症状还不见好，就带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。'
        quote: '吃了 3～4 次症状还不见好，就带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。'
