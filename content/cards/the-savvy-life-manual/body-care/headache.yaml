  - id: medication-overuse-headache
    status: draft
    name: "止痛药别吃过量"
    source:
      anchor: '忍过头反而更糟：药物过度使用性头痛'
    remind:
      text: '核对止痛药使用是否过量，并在怀疑药物过度使用性头痛时咨询专业人员。'
      quote:
        - 不按用法用量使用，反过来会让头痛恶化。
        - 就可能患上「药物使用过度导致的头痛」（简称 MOH）。
        - 头痛起来就靠止痛药顶着、吃了又反复，自己也说不清属于哪一种——日本人因偏头痛去医疗机构就诊的只有约
          20%，在国际比较里是最低的；药企做的「日本人头痛对策排行榜」里，第 1 名是「忍耐」，占
          55.9%。可忍过头并不是省钱，吃止痛药吃多了反而会让头痛更糟。
        - 这个病最大的问题是没人知道：调查结果显示，连医疗从业者中也只有 73.5%
          听说过。对策其实很简单——说明书同时提到，有药企已经在自家产品的说明文档上直接呼吁注意「吃过头」，并在自己的官网推广 MOH 的科普。
    steps:
      - id: check-overuse-threshold
        text: '如果每月服药 10 天以上（依药品种类不同，有的要 15 天以上），就可能患上「药物使用过度导致的头痛」（简称
          MOH）。这个病最大的问题是没人知道：调查结果显示，连医疗从业者中也只有 73.5% 听说过。'
        quote:
          - '如果每月服药 10 天以上（依药品种类不同，有的要 15 天以上），就可能患上「药物使用过度导致的头痛」（简称 MOH）。'
          - '这个病最大的问题是没人知道：调查结果显示，连医疗从业者中也只有 73.5% 听说过。'
      - id: consult-after-no-improvement
        text: '如果吃了 3～4 次症状还是没好转，请带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。'
        quote: '如果吃了 3～4 次症状还是没好转，请带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。'
    notices:
      - level: with-doctor
        text: '如果吃了 3～4 次症状还是没好转，请带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。'
        quote: '如果吃了 3～4 次症状还是没好转，请带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。'
  - id: headache-self-check-signals
    status: reviewed
    name: "头痛的四类自检信号"
    source:
      anchor: '该去医院了吗：四类自检信号'
    remind:
      text: '按用药频率、类型难辨、疼痛异常和生活影响进行自检；出现就医信号时咨询医疗机构。'
      quote:
        - '每周 2 天以上服用市售镇痛药'
        - '说不清自己的头痛到底怎么回事'
        - '和平时不同、疼痛剧烈的头痛'
        - '只要头痛已经妨碍到生活，就属于治疗对象。请先去医疗机构咨询一次。'
    steps:
      - id: check-frequent-analgesic-use
        text: '每周 2 天以上服用市售镇痛药每月服药 10 天以上，很可能已经是 MOH 了。即使还没到 10 天，每周 2 天以上服药，也处在「MOH
          预备军」的状态，需要留意。'
        quote:
          - '每周 2 天以上服用市售镇痛药'
          - '每月服药 10 天以上，很可能已经是 MOH 了。'
          - '即使还没到 10 天，每周 2 天以上服药，也处在「MOH 预备军」的状态，需要留意。'
      - id: leave-type-diagnosis-to-specialist
        text: '说不清自己的头痛到底怎么回事不同类型的头痛对策完全不同，所以别自己判断，交给专科医生诊断。'
        quote:
          - '说不清自己的头痛到底怎么回事'
          - '不同类型的头痛对策完全不同，所以别自己判断，交给专科医生诊断。'
      - id: seek-care-for-unusual-severe-pain
        text: '和平时不同、疼痛剧烈的头痛可能涉及蛛网膜下腔出血等关乎生命的疾病，请尽早就诊。'
        quote:
          - '和平时不同、疼痛剧烈的头痛'
          - '可能涉及蛛网膜下腔出血等关乎生命的疾病，请尽早就诊。'
      - id: consult-when-life-is-affected
        text: '只要头痛已经妨碍到生活，就属于治疗对象。请先去医疗机构咨询一次。'
        quote: '只要头痛已经妨碍到生活，就属于治疗对象。请先去医疗机构咨询一次。'
    notices:
      - level: seek-care
        text: '和平时不同、疼痛剧烈的头痛可能涉及蛛网膜下腔出血等关乎生命的疾病，请尽早就诊。'
        quote:
          - '和平时不同、疼痛剧烈的头痛'
          - '可能涉及蛛网膜下腔出血等关乎生命的疾病，请尽早就诊。'
      - level: with-doctor
        text: '不同类型的头痛对策完全不同，所以别自己判断，交给专科医生诊断。'
        quote: '不同类型的头痛对策完全不同，所以别自己判断，交给专科医生诊断。'
