          - '以上都是大致标准，实际金额随诊疗内容不同。'
      - id: use-matching-headache-treatment
        text: '不是偏头痛的其他头痛，也有各自对应的处方药与疗法。'
        quote: '不是偏头痛的其他头痛，也有各自对应的处方药与疗法。'
    notices:
      - level: with-doctor
        text: '药物种类多，效果和副作用各不相同；其中也有孕妇不能使用等限制以上都是大致标准，实际金额随诊疗内容不同。'
