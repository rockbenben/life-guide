        text: '好消息是这几年偏头痛药物不断开发，找到适合自己的药就能改善生活。'
        quote: '好消息是这几年偏头痛药物不断开发，找到适合自己的药就能改善生活。'
  - id: headache-hospital-care
    status: draft
    source:
      anchor: '去了医院，除了拿药还能拿到什么'
    remind:
      text: '就医时除拿药外，还可接受问诊、头痛日记、生活习惯指导，并查询专科医生。'
      quote:
        - 医院主要用两种方法彻底追查原因：
        - 医师问诊——仔细提问，从生活里那些不起眼的线索入手，一步步找到原因。
        - 头痛日记——每天记录头痛症状与当天的行动，这样能更准确地把握自己的头痛到底是什么引起的。
        - 先给两条能立刻用的判断线。吃药这条：每月服药 10 天以上（有的药要 15 天以上）可能已经是「药物过度使用性头痛」，吃了 3～4
          次症状还不见好，就带着这件事去咨询医生、牙医、药师或登录销售员（登録販売者）。就医这条：每周 2
          天以上在吃市售镇痛药、说不清自己属于哪种头痛、疼痛和平时不同、格外剧烈、或者头痛已经妨碍到生活——这四类都该先去医院咨询一次。偏头痛的对症药和预防药差在哪、去了医院除了拿药还能拿到什么、怎么找头痛专科医生，见后面。^[「頭痛」のトリセツ]
        - 这个病最大的问题是没人知道：调查结果显示，连医疗从业者中也只有 73.5%
          听说过。对策其实很简单——说明书同时提到，有药企已经在自家产品的说明文档上直接呼吁注意「吃过头」，并在自己的官网推广 MOH 的科普。
    steps:
      - id: use-medical-interview
        text: '医师问诊——仔细提问，从生活里那些不起眼的线索入手，一步步找到原因。'
        quote: '医师问诊——仔细提问，从生活里那些不起眼的线索入手，一步步找到原因。'
      - id: keep-headache-diary
        text: '头痛日记——每天记录头痛症状与当天的行动，这样能更准确地把握自己的头痛到底是什么引起的。'
        quote: '头痛日记——每天记录头痛症状与当天的行动，这样能更准确地把握自己的头痛到底是什么引起的。'
      - id: improve-lifestyle-and-plan-exercise
        text: '改善头痛离不开改善生活习惯；弄清原因后，关键就是尽可能避开那个原因。头痛发作期最好不动，但要在医生指导下进行。务必先和医生商量，再去实践。'
        quote:
          - '改善头痛离不开改善生活习惯；弄清原因后，关键就是尽可能避开那个原因。'
          - '头痛发作期最好不动，但要在医生指导下进行。务必先和医生商量，再去实践。'
      - id: find-headache-specialist
        text: '日本头痛学会官网上有一张按都道府县分类的专科医生一览表：https://www.jhsnet.net/ichiran.html'
        quote:
          - '日本头痛学会官网上有一张按都道府县分类的专科医生一览表：'
          - 'https://www.jhsnet.net/ichiran.html'
      - id: check-referral-and-department
        text: '注意：去大学医院或综合医院就诊，有时需要介绍状（紹介状）。附近没有头痛专科医生的人，建议先咨询脑神经内科。'
        quote:
          - '注意：去大学医院或综合医院就诊，有时需要介绍状（紹介状）。'
          - '附近没有头痛专科医生的人，建议先咨询脑神经内科。'
      - id: seek-surrounding-support
        text: '要提升头痛的治疗效果和生活质量，周边人的理解不可或缺——就算你没有头痛的经历，也可以借这件事加深对头痛的了解。'
