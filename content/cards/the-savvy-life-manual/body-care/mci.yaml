  - id: community-support-center
    status: draft
    source:
      anchor: '门诊和交流的烦恼，去这里问'
    remind:
      text: '向地域包括支援中心咨询就诊与交流的烦恼'
      quote:
        - 为地区居民的生活烦恼提供倾听的综合咨询窗口
        - 说明书把最后一页整页给了地域包括支援中心，并写明认知症本人与家属都推荐去。
    steps:
      - id: find-center
        text: '查询方式是都道府县官网，或直接向你所在自治体的窗口询问'
        quote: '查询方式是都道府县官网，或直接向你所在自治体的窗口询问'
      - id: find-medical-institution
        text: '中心掌握该地区对认知症较为了解的医疗机构信息，会结合咨询者的状况提供合适的医疗机构信息。'
        quote: '中心掌握该地区对认知症较为了解的医疗机构信息，会结合咨询者的状况提供合适的医疗机构信息。'
      - id: help-refusing-patient
        text: '中心的职员有时会替家人去确认拒绝就诊者本人的心情，也会在本人能安心就诊的前提下帮忙对接医疗机构'
        quote: '中心的职员有时会替家人去确认拒绝就诊者本人的心情，也会在本人能安心就诊的前提下帮忙对接医疗机构'
      - id: find-social-place
        text: '中心会告诉你住处附近有哪些交流的场所'
        quote: '中心会告诉你住处附近有哪些交流的场所'
    notices:
