        text: '可以免费咨询'
        quote: '可以免费咨询'
      - level: info
        text: '设施数量包含支所在内，全日本 9,000 处以上；你所在的自治体一定有。'
        quote: '设施数量包含支所在内，全日本 9,000 处以上；你所在的自治体一定有。'
