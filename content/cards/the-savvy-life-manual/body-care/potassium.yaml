  - id: potassium-card-overview
    status: reviewed
    name: "一天吃够 1200mg 钾"
    source:
      anchor: '钾活卡片：一天凑满 4 张，补足 1200mg'
    slot: anytime
    remind:
      text: '正餐每天加入 4 张以上钾活卡片；整套共 36 张，按颜色与每张对应的食材和分量取用。'
      quote:
        - '每天在正餐里加入 4 张以上'
        - '整套共 36 张卡片，下面按颜色列出每张对应的食材和分量（绿色 11 张、粉色 9 张、红黄 7 张、蓝橙 9 张），照着分量取量即可。'
    dose:
      - value: 4
        unit: '张'
        what: '每天在正餐里加入的卡片数'
        quote: '每天在正餐里加入 4 张以上'
      - value: 300
        unit: 'mg'
        what: '每张卡片提供的钾量'
        quote: '每张卡片 = 300mg 钾'
      - value: 1200
        unit: 'mg'
        what: '每天额外补钾的目标量'
        quote: '4 张 × 300mg = 1200mg，这就是整套卡片每天要额外补上的目标线。'
    steps:
      - id: potassium-card-check-header
        text: '每张卡片 = 300mg 钾、每天在正餐里加入 4 张以上'
        quote: '每张卡片 = 300mg 钾、每天在正餐里加入 4 张以上'
      - id: potassium-card-group-counts
        text: '整套共 36 张卡片，下面按颜色列出每张对应的食材和分量（绿色 11 张、粉色 9 张、红黄 7 张、蓝橙 9 张），照着分量取量即可。'
        quote: '整套共 36 张卡片，下面按颜色列出每张对应的食材和分量（绿色 11 张、粉色 9 张、红黄 7 张、蓝橙 9 张），照着分量取量即可。'
      - id: potassium-card-calculate-target
        text: '4 张 × 300mg = 1200mg，这就是整套卡片每天要额外补上的目标线。'
        quote: '4 张 × 300mg = 1200mg，这就是整套卡片每天要额外补上的目标线。'
