  - id: green-potassium-foods
    status: draft
    name: "用绿色卡补钾"
    source:
      anchor: '绿色卡：蔬菜、水果与豆荚（11 张）'
    slot: anytime
    remind:
      text: '绿色卡覆盖蔬菜、水果与豆荚；香蕉的单卡分量是 2/3 根 80g，密度高的食物用量较少。'
      quote:
        - 值得注意的是，香蕉的分量偏小（2/3 根 80g），香蕉这类密度高的食物，一张卡对应的量就少。
        - 「钾活卡片」的用法只有两条，两句话就印在每张卡的表头：每张卡片 = 300mg 钾、每天在正餐里加入 4 张以上——4 张 × 300mg = 1200mg，这就是整套卡片每天要额外补上的目标线。整套共 36 张卡片，下面按颜色列出每张对应的食材和分量（绿色 11 张、粉色 9 张、红黄 7 张、蓝橙 9 张），照着分量取量即可。前提只有一句：摄取钾是"减盐"的辅助手段，不能代替减盐。^[「カリ活カード」のトリセツ]
    steps:
      - id: green-celery
        text: '芹菜1 根 70g'
        quote: [ '芹菜', '1 根 70g' ]
      - id: green-cabbage
        text: '卷心菜160g'
        quote: [ '卷心菜', '160g' ]
      - id: green-lettuce
        text: '生菜150g'
        quote: [ '生菜', '150g' ]
      - id: green-eggplant
        text: '茄子中等 1.5 根 140g'
        quote: [ '茄子', '中等 1.5 根 140g' ]
      - id: green-edamame
        text: '毛豆50g'
        quote: [ '毛豆', '50g' ]
      - id: green-corn
        text: '玉米罐头1 罐 230g'
        quote: [ '玉米罐头', '1 罐 230g' ]
      - id: green-orange
        text: '橙子（去皮）2 个 200g'
        quote: [ '橙子（去皮）', '2 个 200g' ]
      - id: green-mandarin
        text: '橘子2 个 200g'
        quote: [ '橘子', '2 个 200g' ]
      - id: green-banana
        text: '香蕉2/3 根 80g'
        quote: [ '香蕉', '2/3 根 80g' ]
      - id: green-avocado
        text: '牛油果1/2 个 50g'
        quote: [ '牛油果', '1/2 个 50g' ]
