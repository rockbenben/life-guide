cards:
  - id: toe-exercise
    status: reviewed
    source:
      anchor: "脚趾锻炼"
    # 原文只说「泡澡时、睡觉前也可以做」，没有限定时段，放 anytime。
    slot: anytime

    remind:
      text: "每天至少 15 次，缓慢进行脚趾闭合和展开"
      quote: "每天至少 15 次，缓慢进行脚趾闭合和展开"

    dose:
      - value: 15
        unit: 次
        what: "脚趾闭合和展开"
        quote: "每天至少 15 次，缓慢进行脚趾闭合和展开"

    effect:
      text: "锻炼脚趾可以增强脚部抓地力，带来多种好处，包括防止扭伤、提高平衡能力和增强步行速度。而做过脚趾训练的老人跌倒风险显著下降"
      quote:
        - "锻炼脚趾可以增强脚部抓地力，带来多种好处，包括防止扭伤、提高平衡能力和增强步行速度。"
        - "而做过脚趾训练的老人跌倒风险显著下降"

    # 原文没给这组动作做一遍要多久，15 次张开合上的快慢也没写，按 D7 标 unknown，不编数。
    duration:
      basis: unknown

    steps:
      - id: prep
        text: "你可以选择任何姿势进行训练。初期可以坐在椅子上，脚后跟着地，脚趾稍微抬起，这样更容易掌握训练要领。"
        quote: "你可以选择任何姿势进行训练。初期可以坐在椅子上，脚后跟着地，脚趾稍微抬起，这样更容易掌握训练要领。"
        images:
          - "https://img.newzone.top/2024-10-29-16-21-54.png?imageMogr2/format/webp"

      - id: open-close
        text: "每天至少 15 次，缓慢进行脚趾闭合和展开说明书特意强调：目的不是凑够次数，而是有意识地、慢慢地活动脚趾才有效"
        quote:
          - "每天至少 15 次，缓慢进行脚趾闭合和展开"
          - "说明书特意强调：目的不是凑够次数，而是有意识地、慢慢地活动脚趾才有效"
        images:
          - "https://img.newzone.top/2024-10-29-16-23-06.png?imageMogr2/format/webp"

      - id: assist
        text: "做不标准的时候有专门的补救法：蜷成「拳」弯不过去，就用手帮忙；张开时合不拢，就把手指插进脚趾之间辅助"
        quote: "做不标准的时候有专门的补救法：蜷成「拳」弯不过去，就用手帮忙；张开时合不拢，就把手指插进脚趾之间辅助"

      - id: towel
        text: "说明书另有一个应用动作是毛巾抓握——用脚趾把毛巾往自己这边拉拢，两个人以上比谁拉得快更好玩"
        quote: "说明书另有一个应用动作是毛巾抓握——用脚趾把毛巾往自己这边拉拢，两个人以上比谁拉得快更好玩"
        images:
          - "https://img.newzone.top/2024-10-29-16-24-14.png?imageMogr2/format/webp"

    cautions:
      - level: stop
        text: "小腿抽筋或感到疼痛就立刻停"
        quote: "小腿抽筋或感到疼痛就立刻停"
