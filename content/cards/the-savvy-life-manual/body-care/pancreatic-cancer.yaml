          - CT：用造影剂这种药让影像更容易看清，有机会发现 7 毫米这样的小癌。
      - id: endoscopic-ultrasound
        text: "能发现更小的癌。内镜进不去胰腺，但可以把它放到紧挨着的胃或十二指肠里，照着超声高精细地观察胰腺。"
        quote:
          - "能发现更小的癌。"
          - "内镜进不去胰腺，但可以把它放到紧挨着的胃或十二指肠里，照着超声高精细地观察胰腺。"
      - id: cytology-examination
        text: "细胞学检查（細胞診）这是更早期、在癌还结成块之前就能发现的办法。先把一根细管插到胰腺，采集分泌液；如果有癌，脱落的东西就在这层分泌液里，于是用显微镜去找「癌细胞」。"
        quote:
          - "细胞学检查（細胞診）"
          - "这是更早期、在癌还结成块之前就能发现的办法。"
