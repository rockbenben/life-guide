  - id: pancreatic-cancer-mortality-and-sources
    status: reviewed
    name: "死亡数与生存率的出处"
    source:
      anchor: "死亡数与生存率：说明书照录的两个出处"
    remind:
      text: "了解胰腺癌死亡人数排名、生存率数据及其出处。"
      quote:
        - 胰腺癌因老龄化等原因，死亡人数正在急增；在最新数据里，已经超过胃癌，排到第 3 位。
        - 第 1 位 肺癌、第 2 位 大肠癌、第 3 位 胰腺癌、第 4 位 胃癌
        - Japan Pancreatic Cancer Registry
        - Egawa et al. Pancreas 2012;41:985-992
        - 这份 2026 年 7 月 16 日播放的说明书（品番 YKMY-153）把整件事压缩成了一组对照：胰腺癌整体的 5 年生存率约 11%；而在 1cm 以内发现，5 年生存率会跳到 80%。^[「すい臓がん対策」の取扱説明書（品番 YKMY-153）]
    steps:
      - id: mortality-trend
        text: "胰腺癌因老龄化等原因，死亡人数正在急增；在最新数据里，已经超过胃癌，排到第 3 位。"
        quote: "胰腺癌因老龄化等原因，死亡人数正在急增；在最新数据里，已经超过胃癌，排到第 3 位。"
      - id: mortality-ranking
        text: "第 1 位 肺癌、第 2 位 大肠癌、第 3 位 胰腺癌、第 4 位 胃癌死亡人数一年超过 4 万人"
        quote:
          - "第 1 位 肺癌、第 2 位 大肠癌、第 3 位 胰腺癌、第 4 位 胃癌"
          - "死亡人数一年超过 4 万人"
      - id: mortality-source
        text: "国立癌症研究中心癌症信息服务「癌症统计」"
        quote: "国立癌症研究中心癌症信息服务「癌症统计」"
      - id: survival-chart-sources
        text: "正文页那张 11% 与 80% 的对照图，图下注明的出处是 Japan Pancreatic Cancer Registry。背面那张 5 年生存率图，图下注明的出处是 Egawa et al. Pancreas 2012;41:985-992。"
        quote:
