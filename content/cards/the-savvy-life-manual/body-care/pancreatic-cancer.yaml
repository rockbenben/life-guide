  - id: pancreatic-anatomy-and-functions
    status: reviewed
    name: "胰腺的位置与作用"
    source:
      anchor: "为什么偏偏是胰腺"
    remind:
      text: "了解胰腺的位置、大小、转移特点与主要作用。"
      quote:
        - "第一，胰腺在身体的深处。"
        - "胰腺位于肝脏和胃的背后，是身体最深处的地方；大小大约只有 15 厘米。"
        - "因为位置深、体积小，在 X 线等检查里很难成像，早期发现因此困难"
        - "胰腺很小，所以癌只是稍微变大一点就容易发生转移"
        - "分泌分解脂肪、糖类和脂质的液体，送往胃之后的十二指肠"
        - "「胰岛素是唯一下降血糖值的激素」"
    steps:
      - id: pancreatic-location
        text: "第一，胰腺在身体的深处。胰腺位于肝脏和胃的背后，是身体最深处的地方；大小大约只有 15 厘米。"
        quote:
          - "第一，胰腺在身体的深处。"
          - "胰腺位于肝脏和胃的背后，是身体最深处的地方；大小大约只有 15 厘米。"
      - id: difficult-early-imaging
        text: "因为位置深、体积小，在 X 线等检查里很难成像，早期发现因此困难"
        quote: "因为位置深、体积小，在 X 线等检查里很难成像，早期发现因此困难"
      - id: metastatic-tendency
        text: "第二，它太小，所以癌稍微一大就转移。胰腺很小，所以癌只是稍微变大一点就容易发生转移"
        quote:
          - "第二，它太小，所以癌稍微一大就转移。"
          - "胰腺很小，所以癌只是稍微变大一点就容易发生转移"
      - id: digestive-function
        text: "分泌分解脂肪、糖类和脂质的液体，送往胃之后的十二指肠吃下的食物先被胃酸泡成粥状，再由来自胰腺的消化液分解到能被吸收的程度。"
        quote:
          - "分泌分解脂肪、糖类和脂质的液体，送往胃之后的十二指肠"
          - "吃下的食物先被胃酸泡成粥状，再由来自胰腺的消化液分解到能被吸收的程度。"
      - id: insulin-function
        text: "「胰岛素是唯一下降血糖值的激素」一进食，胰腺就分泌胰岛素，从而把血糖降下来。"
        quote:
          - "「胰岛素是唯一下降血糖值的激素」"
          - "一进食，胰腺就分泌胰岛素，从而把血糖降下来。"
    notices:
      - level: info
        text: "但如果癌还处在小的早期，多半还留在胰腺内部，因此可以用手术整个切除"
        quote: "但如果癌还处在小的早期，多半还留在胰腺内部，因此可以用手术整个切除"
