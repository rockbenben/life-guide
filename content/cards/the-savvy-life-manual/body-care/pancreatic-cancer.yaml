  - id: pancreatic-cancer-early-tests
    status: reviewed
    name: "胰腺癌的三种早期检查"
    source:
      anchor: "三种检查，各自能看到什么"
    remind:
      text: "了解早期检查各自能够看到什么。"
      quote:
        - "用造影剂这种药让影像更容易看清，有机会发现 7 毫米这样的小癌。"
        - "能发现更小的癌。"
        - "这是更早期、在癌还结成块之前就能发现的办法。"
    steps:
      - id: ct-detection
        text: "用造影剂这种药让影像更容易看清，有机会发现 7 毫米这样的小癌。"
        quote:
