  - id: zinc-supplement-workflow
    status: reviewed
    name: "按锌卡挑食材补锌"
    source:
      anchor: '掉发、长痘、感冒总不好？缺锌怎么补'
    slot: anytime
    remind:
      text: '先判断是否需要补锌，再按锌卡选食材，最后给低锌鱼、肉加酱'
      quote:
        - '动手之前，先用身体发出的六个信号确认自己要不要补'
        - '再对着「锌卡」挑食材'
        - '最后用「Zun 酱」给锌含量本身就低的鱼、肉加料'
    effect:
      text: '2014 年在日本进行的研究研究者向 92 名学生传授锌含量高的食材和菜谱两周后血中锌最多提升了 40%'
      quote:
        - '2014 年在日本进行的研究'
        - '研究者向 92 名学生传授锌含量高的食材和菜谱'
        - '两周后血中锌最多提升了 40%'
    steps:
      - id: assess-signals
        text: '动手之前，先用身体发出的六个信号确认自己要不要补'
        quote: '动手之前，先用身体发出的六个信号确认自己要不要补'
      - id: choose-foods
        text: '再对着「锌卡」挑食材金卡 1mg 以上银卡 0.6mg 以上不足 1mg铜卡最低一档可低至 0.2mg生白米 150g 只有 0.9mg'
        quote:
          - '再对着「锌卡」挑食材'
          - '金卡 1mg 以上'
          - '银卡 0.6mg 以上不足 1mg'
          - '铜卡最低一档可低至 0.2mg'
          - '生白米 150g 只有 0.9mg'
      - id: add-zun-sauce
        text: '最后用「Zun 酱」给锌含量本身就低的鱼、肉加料2 大勺含锌 0.4mg'
        quote:
          - '最后用「Zun 酱」给锌含量本身就低的鱼、肉加料'
          - '2 大勺含锌 0.4mg'
