  - id: zinc-deficiency-signals
    status: reviewed
    source:
      anchor: 身体发出的六个信号
    slot: anytime
    remind:
      text: '先按身体发出的信号初筛，再对照血中锌结果'
      quote:
        - '动手之前，先用身体发出的六个信号确认自己要不要补'
        - '医学上有两条判定线'
    steps:
      - id: notice-signals
        text: '脱发皮肤疾患口腔炎味觉障碍（吃东西没味道）容易疲劳此外，感冒迟迟不好也是被点名的信号'
        quote:
          - '脱发'
          - '皮肤疾患'
          - '口腔炎'
          - '味觉障碍（吃东西没味道）'
          - '容易疲劳'
          - '此外，感冒迟迟不好也是被点名的信号'
      - id: compare-thresholds
        text: '医学上有两条判定线：血中锌 60μg/dL 未满为「锌缺乏症」，60～80μg/dL 未满为「潜在性锌缺乏」。'
        quote: '医学上有两条判定线：血中锌 60μg/dL 未满为「锌缺乏症」，60～80μg/dL 未满为「潜在性锌缺乏」。'
      - id: check-population
        text: '说明书引用的判断是，血中锌低于 60μg/dL 的日本人最多可能占到 30%——将近三分之一。'
        quote: '说明书引用的判断是，血中锌低于 60μg/dL 的日本人最多可能占到 30%——将近三分之一。'
    cautions:
      - level: info
        text: '这些症状太容易被归给「最近太累了」。'
        quote: '这些症状太容易被归给「最近太累了」。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 9ce98f416081edba
    name: 对照六个缺锌信号
  - id: zinc-loss-scenarios
    status: reviewed
    name: "识别让锌流失的三种情况"
    source:
      anchor: 三种会让锌悄悄漏掉的场景
    slot: anytime
    remind:
      text: '识别饮酒、妊娠与哺乳期和服药等锌流失场景；用药相关问题咨询主治医生'
      quote:
        - '日本《锌缺乏症诊疗指针 2025》列出的三个高风险场景是饮酒、妊娠与哺乳期、以及服药'
        - '这一段涉及用药，不要凭感觉调整剂量或自行判断，说明书明确写着要一定咨询主治医生'
    steps:
      - id: identify-alcohol
        text: '饮酒——在肝脏工作的锌酶大量被用于分解酒精，结果是身体其他部位的锌被「借走」而不归还。说明书也提到，饮酒与锌流失的详细关联尚未完全查清，个体差异很大。'
        quote: '饮酒——在肝脏工作的锌酶大量被用于分解酒精，结果是身体其他部位的锌被「借走」而不归还。说明书也提到，饮酒与锌流失的详细关联尚未完全查清，个体差异很大。'
      - id: identify-pregnancy
        text: '妊娠与哺乳——锌要经由脐带从母体输送给胎儿，哺乳期则要通过母乳送达，因此准妈妈容易偏缺。妊产期的推荐摄入量比同龄人要多 2～3mg。'
        quote: '妊娠与哺乳——锌要经由脐带从母体输送给胎儿，哺乳期则要通过母乳送达，因此准妈妈容易偏缺。妊产期的推荐摄入量比同龄人要多 2～3mg。'
      - id: identify-medicines
        text: '服药——高血压、糖尿病等药物中，有的作用就是排出锌，或阻碍锌的吸收。'
        quote: '服药——高血压、糖尿病等药物中，有的作用就是排出锌，或阻碍锌的吸收。'
    cautions:
      - level: with-doctor
        text: '这一段涉及用药，不要凭感觉调整剂量或自行判断，说明书明确写着要一定咨询主治医生。'
        quote: '这一段涉及用药，不要凭感觉调整剂量或自行判断，说明书明确写着要一定咨询主治医生。'
    segments:
      - id: pregnancy-lactation
        when: [ pregnant ]
        action:
          text: '关注妊产期比同龄人更高的锌推荐摄入量'
          quote: '妊产期的推荐摄入量比同龄人要多 2～3mg'
        avoid:
          - text: '不要凭感觉调整剂量或自行判断'
            quote: '不要凭感觉调整剂量或自行判断'
    review:
      by: benson
      date: 2026-10-22
      hash: d36c5fc125e30e21
  - id: zun-sauce
    status: reviewed
    name: "做一锅锌酱淋鱼和菜"
    source:
      anchor: '一勺就能加的「锌酱」'
    # 原文是「对着锌卡挑当天的食材」—— 什么时候吃都行。
    slot: anytime
    remind:
      text: '做好 Zun 酱，随手淋给鱼、鸡胸肉和蔬菜'
      quote:
        - '针对鱼、鸡胸肉和蔬菜这类锌含量本身就低的食材'
        - '节目组开发了一份能随手淋上去的特制酱「Zun 酱」（ズンソース）'
    dose:
      - value: 6
        unit: 大勺
        what: 洋葱碎用量
        quote: '6 大勺（约半个）'
      - value: 1
        unit: 小勺
        what: 蒜末用量
        quote: '1 小勺'
      - value: 1
        unit: 小勺
        what: 姜末用量
        quote: '1 小勺'
      - value: 3
        unit: 大勺
        what: 米油用量
        quote: '3 大勺'
      - value: 4
        unit: 大勺
        what: 蚝油用量
        quote: '4 大勺'
      - value: 2
        unit: 大勺
        what: 酱油用量
        quote: '2 大勺'
      - value: 2
        unit: 大勺
        what: 醋用量
        quote: '2 大勺'
      - value: 100
        unit: mL
        what: 水用量
        quote: '100mL'
      - value: 2
        unit: 小勺
        what: 砂糖用量
        quote: '2 小勺'
      - value: 6
        unit: 大勺
        what: 综合坚果用量
        quote: '6 大勺'
    duration:
      basis: derived
      sec: 240
      formula: '2 分钟（炒制按最短时长）+ 2 分钟（小火再煮）= 240 秒'
    steps:
      - id: prepare-groups
        text: '为方便阅读，下面把材料分成「先下锅炒的料」和「后加的调味液」两组——实际是一锅完成的单一酱汁'
        quote: '为方便阅读，下面把材料分成「先下锅炒的料」和「后加的调味液」两组——实际是一锅完成的单一酱汁'
      - id: saute-a
        text: '平底锅倒入米油，放入 A 组材料，开中火炒 2～3 分钟，炒到香味出来。'
        quote: '平底锅倒入米油，放入 A 组材料，开中火炒 2～3 分钟，炒到香味出来。'
      - id: simmer-b
        text: '加入 B 组材料煮沸，转小火再煮约 2 分钟——全程保持「小泡不断冒」的状态。'
        quote: '加入 B 组材料煮沸，转小火再煮约 2 分钟——全程保持「小泡不断冒」的状态。'
      - id: add-nuts
        text: '关火后加入切碎的混合坚果。'
        quote: '关火后加入切碎的混合坚果。'
      - id: store-sauce
        text: '成品冷藏可存 3～4 天。'
        quote: '成品冷藏可存 3～4 天。'
    cautions:
      - level: info
        text: '注意酱里也含盐分，介意的人别用过头。'
        quote: '注意酱里也含盐分，介意的人别用过头。'
    review:
      by: benson
      date: 2026-10-22
      hash: d6f3c7577e58094c
