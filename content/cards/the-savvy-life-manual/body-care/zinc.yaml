        text: '鰤鱼 2 块、Zun 酱 3 大勺、酒 2 大勺、少许盐、小麦粉、米油、青葱各适量。鰤鱼两面撒盐，薄薄裹一层面粉。平底锅倒入米油烧热，放入鰤鱼，中火煎至两面都上色。用厨房纸吸掉煎出的油，转小火，加入 Zun 酱和酒，收汁到浓稠。青葱切成 5cm 段，在刷过油的锅里烤出颜色并撒盐。盘中盛第 3 步的鱼，佐以第 4 步的葱。'
