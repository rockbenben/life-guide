cards:
  - id: correct-nail-length-and-toe-corner
    status: reviewed
    name: "指甲剪到齐平别太短"
    source:
      anchor: 指甲剪太短，指尖发粗？剪到齐平才对
    slot: anytime
    remind:
      text: 把指甲剪到与指尖齐平，不要剪得过短
      quote:
        - 剪得过短，指尖就难以发力，皮肤也容易变得粗糙。
        - 专家认可的正确长度，是与指尖齐平。
    effect:
      text: 剪得过短，指尖就难以发力，皮肤也容易变得粗糙。
      quote: 剪得过短，指尖就难以发力，皮肤也容易变得粗糙。
    steps:
      - id: trim-to-fingertip-level
        text: 专家认可的正确长度，是与指尖齐平。
        quote: 专家认可的正确长度，是与指尖齐平。
      - id: round-toe-corners-slightly
        text: '脚趾甲先水平修剪，边角再稍微磨圆。第四条的原因是「角不要修过头」：角修得太平，指甲的角就会嵌进肉里。'
        quote:
          - 脚趾甲先水平修剪，边角再稍微磨圆。
          - 第四条的原因是「角不要修过头」：角修得太平，指甲的角就会嵌进肉里。
    cautions:
      - level: info
        text: 第四条的原因是「角不要修过头」：角修得太平，指甲的角就会嵌进肉里。
        quote: 第四条的原因是「角不要修过头」：角修得太平，指甲的角就会嵌进肉里。
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 682338d3ac3967f0
  - id: trim-nails-safely
    status: reviewed
    source:
      anchor: 剪指甲的正确方法
    slot: anytime
    remind:
      text: 与指尖齐平，分段慢慢剪，剪后用锉刀打磨；脚趾甲先水平修剪，再稍微磨圆
      quote:
        - 指甲应与指尖齐平，不要剪得过短。
        - 不要一次性剪掉太多。
        - 所以要用剪口前端一点一点往前推，从指甲的弯曲部分慢慢剪。
        - 剪完指甲后，用锉刀把切口打磨平滑；剪刀越锋利越不容易撕裂甲面。
        - 建议先水平修剪，然后将边角稍微打磨圆滑。
    images:
      - "https://img.newzone.top/2024-10-16-13-37-03.png?imageMogr2/format/webp"
    steps:
      - id: trim-to-fingertip-level
        text: 指甲应与指尖齐平，不要剪得过短。
        quote: 指甲应与指尖齐平，不要剪得过短。
      - id: trim-gradually
        text: 所以要用剪口前端一点一点往前推，从指甲的弯曲部分慢慢剪。
        quote: 所以要用剪口前端一点一点往前推，从指甲的弯曲部分慢慢剪。
      - id: file-nail-edges
        text: 剪完指甲后，用锉刀把切口打磨平滑；剪刀越锋利越不容易撕裂甲面。
        quote: 剪完指甲后，用锉刀把切口打磨平滑；剪刀越锋利越不容易撕裂甲面。
      - id: trim-toenails-horizontal
        text: 建议先水平修剪，然后将边角稍微打磨圆滑。
        quote: 建议先水平修剪，然后将边角稍微打磨圆滑。
    cautions:
      - level: info
        text: 不要一次性剪掉太多。指甲由三层叠成，一次剪得过大，弧度会被压扁、剪口瞬间受力，上层随即剥离
        quote: 不要一次性剪掉太多。指甲由三层叠成，一次剪得过大，弧度会被压扁、剪口瞬间受力，上层随即剥离
    review:
      by: benson
      date: 2026-10-21
      hash: 9e7adbf575842c45
  - id: preserve-fingertip-support
