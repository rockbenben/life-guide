  - id: three-control-methods
    status: reviewed
    source:
      anchor: '说明书的三个控制术'
    slot: anytime
    remind:
      text: '今天按适用方向选择渐进减重、限酒或补牛奶'
      quote:
        - 3% 减肥（针对稍胖的人）
        - 遵守酒精的适量线（针对喝多的人）
        - 每天一杯牛奶（针对排不出去的人）
        - 所以这篇不是一味忌口，而是两件事：把该补的补上——每天饮水 2000–3000 毫升、每天一杯牛奶，适量喝咖啡、适量吃樱桃；把该避开的避开——红肉、内脏和香肠制品、海鲜（尤其甲壳类和贝类）、酒精（重点避开啤酒与烈酒）、含果糖饮料与高果糖食品，同时控制体重、改善代谢状态。植物嘌呤在任何情况下都可以放心食用，新鲜水果里的天然果糖适量摄入也是安全的。
    dose:
      - value: 3
        unit: '%'
        what: 减重比例目标
        quote: '3% 减肥（针对稍胖的人）'
      - value: 300
        unit: 千卡
        what: 每日热量摄入缺口
        quote: '每天少摄入 300 千卡、连续坚持 2 个月'
      - value: 2
        unit: 个月
        what: 连续坚持时长
        quote: '每天少摄入 300 千卡、连续坚持 2 个月'
      - value: 20
        valueMax: 25
        unit: 克
        what: 每日酒精上限范围
        quote: '一天的酒精量控制在 20～25 克以内，配合阿尔帕喝法。'
      - value: 1
        unit: 杯
        what: 每日牛奶份量
        quote: '每天一杯牛奶（针对排不出去的人）'
    steps:
      - id: gradual-weight-loss
        text: '3% 减肥（针对稍胖的人）——尿酸排不出去的关键是内脏脂肪，所以减重很重要；但急剧减肥反而会把尿酸顶上去。'
        quote: '3% 减肥（针对稍胖的人）——尿酸排不出去的关键是内脏脂肪，所以减重很重要；但急剧减肥反而会把尿酸顶上去。'
      - id: reduce-daily-calories
        text: '每天少摄入 300 千卡、连续坚持 2 个月。'
