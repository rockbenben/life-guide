      - id: use-calorie-reduction-table
        text: '说明书为此专门做了一张「100 千卡削减表」，把各种食物对应的热量列成一张纸，方便对照。'
        quote: '说明书为此专门做了一张「100 千卡削减表」，把各种食物对应的热量列成一张纸，方便对照。'
      - id: follow-alcohol-line
        text: '一天的酒精量控制在 20～25 克以内，配合阿尔帕喝法。'
        quote:
          - 一天的酒精量控制在 20～25 克以内，配合阿尔帕喝法。
          - ② 遵守酒精的适量线（针对喝多的人）——见「控制酒精摄入」一节，一天的酒精量控制在 20～25 克以内，配合阿尔帕喝法。
      - id: drink-daily-milk
        text: '每天一杯牛奶（针对排不出去的人）——酪蛋白 → 丙氨酸这条路径，见「每天一杯牛奶」一节。'
        quote: '每天一杯牛奶（针对排不出去的人）——酪蛋白 → 丙氨酸这条路径，见「每天一杯牛奶」一节。'
    cautions:
      - level: stop
        text: '急剧减肥反而会把尿酸顶上去'
