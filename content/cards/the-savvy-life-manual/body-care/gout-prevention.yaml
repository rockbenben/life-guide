  - id: daily-water-and-milk
    status: reviewed
    name: "多喝水加一杯牛奶"
    source:
      anchor: '尿酸高、痛风？多喝水 + 每天一杯牛奶'
    # 原文只说每天多喝水、每天一杯牛奶，没给具体时段。
    slot: anytime
    remind:
      text: '今天按目标饮水，并安排一杯牛奶'
      quote:
        - '每天饮水 2000–3000 毫升'
        - '每天一杯牛奶，适量喝咖啡、适量吃樱桃'
    dose:
      - value: 2000
        valueMax: 3000
        unit: 毫升
        what: 每日饮水目标范围
        quote: '每天饮水 2000–3000 毫升'
      - value: 1
        unit: 杯
        what: 每日牛奶份量
        quote: '每天一杯牛奶，适量喝咖啡、适量吃樱桃'
    steps:
      - id: drink-enough-water
        text: '充足饮水有助于促进尿酸通过尿液排出，是最基本、最有效的措施之一。'
        quote:
          - 充足饮水有助于促进尿酸通过尿液排出，是最基本、最有效的措施之一。
          - 先把两个数字摆出来：尿酸值超过 7.0 mg/dL 就诊断为高尿酸血症，放任不管就会发展为痛风；说明书给的溶解结晶目标更保守，是 6.0 mg/dL 以下（据《高尿酸血症·痛风的治疗指南 第3版》）。^[「尿酸値」のトリセツ（2025年1月9日放送）]
      - id: choose-milk-or-yogurt
        text: '低脂牛奶和酸奶与尿酸水平改善相关（具体幅度各研究不一，方向可信、量级不统一）。'
        quote: '低脂牛奶和酸奶与尿酸水平改善相关（具体幅度各研究不一，方向可信、量级不统一）。'
    notices:
      - level: info
        text: '尿酸值超过 7.0 mg/dL 就诊断为高尿酸血症说明书给的溶解结晶目标更保守，是 6.0 mg/dL 以下（据《高尿酸血症·痛风的治疗指南 第3版》）。'
        quote:
          - '尿酸值超过 7.0 mg/dL 就诊断为高尿酸血症'
          - '说明书给的溶解结晶目标更保守，是 6.0 mg/dL 以下（据《高尿酸血症·痛风的治疗指南 第3版》）。'
      - level: info
        text: '其中的酪蛋白和乳清蛋白具有抑制尿酸生成和促进排泄的作用。'
        quote: '其中的酪蛋白和乳清蛋白具有抑制尿酸生成和促进排泄的作用。'
      - level: info
        text: '一项跟踪 4.7 万名男性 12 年的队列研究发现，乳制品摄入最高的一组比最低的一组痛风风险低约 44%。'
        quote: '一项跟踪 4.7 万名男性 12 年的队列研究发现，乳制品摄入最高的一组比最低的一组痛风风险低约 44%。'
    cautions:
      - level: info
        text: '注意这是「吃得多的比吃得少的」相对差距，不是「每天喝 250 毫升就能减半」，而且是观察性研究、只能说明相关。'
        quote: '注意这是「吃得多的比吃得少的」相对差距，不是「每天喝 250 毫升就能减半」，而且是观察性研究、只能说明相关。'
    review:
      by: benson
      date: 2026-10-21
      hash: bd416eb139740755

  - id: address-uric-acid-excretion
    status: reviewed
    source:
      anchor: '控制高尿酸，从认识根本原因开始'
    slot: anytime
    remind:
      text: '今天从改善排泄与代谢入手，而不只靠限制高嘌呤食物'
      quote:
        - 因此，想要控制尿酸水平，仅靠限制高嘌呤食物远远不够。
        - 控制体重、改善代谢状态，并限制酒精摄入
        - 减少内脏脂肪的积聚
        - 体检单上「尿酸高」这一项亮红灯？近年高尿酸血症和痛风的发病率持续上升，而大多数高尿酸患者的问题并不在「摄入过多」，而在「排泄不足」——背后与胰岛素抵抗和乳酸积聚密切相关。
    steps:
      - id: control-weight-and-metabolism
        text: '控制体重、改善代谢状态，并限制酒精摄入'
        quote: '控制体重、改善代谢状态，并限制酒精摄入'
      - id: reduce-visceral-fat
        text: '减少内脏脂肪的积聚'
        quote: '减少内脏脂肪的积聚'
      - id: limit-alcohol
        text: '控制体重、改善代谢状态，并限制酒精摄入'
        quote: '控制体重、改善代谢状态，并限制酒精摄入'
    notices:
      - level: info
        text: '尿酸排泄减少才是高尿酸血症的主要原因，而其背后则与胰岛素抵抗和乳酸积聚密切相关。'
        quote: '尿酸排泄减少才是高尿酸血症的主要原因，而其背后则与胰岛素抵抗和乳酸积聚密切相关。'
      - level: info
        text: '只有约两成来自饮食，剩下八成是体内自己产生的'
        quote: '只有约两成来自饮食，剩下八成是体内自己产生的'
      - level: info
        text: '通常与内脏脂肪过多有关，会抑制肾脏对尿酸的排泄功能。'
        quote: '通常与内脏脂肪过多有关，会抑制肾脏对尿酸的排泄功能。'
      - level: info
        text: '在酒精代谢过程中大量产生，会与尿酸竞争排泄路径，进一步加重尿酸潴留。'
        quote: '在酒精代谢过程中大量产生，会与尿酸竞争排泄路径，进一步加重尿酸潴留。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 5632253a1f0f79b9
    name: 控体重改善尿酸代谢

