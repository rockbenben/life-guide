  - id: foot-glute-ball-massage
    status: reviewed
    source:
      anchor: "日常调理方法"
    slot: anytime
    remind:
      text: "脚冷时用 3 号垒球按压一侧臀部中央，每侧按压 30 秒。"
      quote: "脚冷就用 3 号垒球按压一侧臀部中央，每侧 30 秒、每天 1 到 2 次"
    dose:
      - value: 30
        unit: "秒"
        what: "每侧臀部按压时长"
        quote: "每侧臀部按压 30 秒，每天进行 1 到 2 次。"
    duration:
      basis: quote
      sec: 30
      quote: "每侧臀部按压 30 秒，每天进行 1 到 2 次。"
    steps:
      - id: lie-down-place-ball
        text: "仰面躺下，将垒球放在一侧臀部中央的位置。"
        quote: "仰面躺下，将垒球放在一侧臀部中央的位置。"
      - id: raise-contralateral-hip
        text: "把放球那一侧的对侧臀部抬起，身体倾斜约 45 度，用体重压住球上的穴位。"
        quote: "把放球那一侧的对侧臀部抬起，身体倾斜约 45 度，用体重压住球上的穴位。"
      - id: press-glute-ball
        text: "每侧臀部按压 30 秒，每天进行 1 到 2 次。"
        quote: "每侧臀部按压 30 秒，每天进行 1 到 2 次。"
        # 按压那一步 30 秒（2026-10-30 加）；躺下与抬对侧臀那两步是准备，没有时长
        duration:
          basis: quote
          sec: 30
          quote: "每侧臀部按压 30 秒，每天进行 1 到 2 次。"
    cautions:
      - level: info
        text: "按到痛就减力"
        quote: "按到痛就减力"
      - level: stop
        text: "有骨科疾病或关节出现疼痛症状的人不要做"
        quote: "有骨科疾病或关节出现疼痛症状的人不要做"
