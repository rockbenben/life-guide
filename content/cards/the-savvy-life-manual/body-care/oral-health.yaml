cards:
  - id: oral-frail-self-check
    status: reviewed
    name: "自查口腔功能是否下降"
    source:
      anchor: '5 项自查：中 2 项就算口腔衰弱'
    slot: anytime
    remind:
      text: '今天完成口腔衰弱自查'
      quote:
        - 任何人都能简单掌握自己状况
        - 它把口的衰老叫作「オーラルフレイル（口腔衰弱）」，并把「口的机能会左右寿命」这件「意外的关系」摆在了封面之后第一页。
    dose:
      - value: 5
        unit: '项'
        what: '口腔衰弱自查项目数'
        quote: '5 项里有 2 项以上符合，即被判定为「口腔衰弱」。'
    steps:
      - id: check-own-teeth
        text: '自己的牙少于 20 颗'
        quote: '自己的牙少于 20 颗'
      - id: check-hard-food
        text: '半年以前起就难咬硬的东西'
        quote: '半年以前起就难咬硬的东西'
      - id: check-choking
        text: '喝茶或喝汤会呛'
        quote: '喝茶或喝汤会呛'
      - id: check-dry-mouth
        text: '口里容易干'
        quote: '口里容易干'
      - id: check-tongue-mobility
        text: '滑舌变差'
        quote: '滑舌变差'
      - id: summarize-result
        text: '5 项里有 2 项以上符合，即被判定为「口腔衰弱」。'
        quote: '5 项里有 2 项以上符合，即被判定为「口腔衰弱」。'
    cautions:
      - level: info
        text: '镶的假牙和金属冠要算作自己的牙但种植牙不算自己的牙'
        quote:
          - '镶的假牙和金属冠要算作自己的牙'
          - '但种植牙不算自己的牙'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: ae25f826cae280ba

  - id: tongue-aaue-exercise
    status: draft
    name: "舌尖舌根发声训练"
    source:
      anchor: '做什么：三个舌力动作，外加唱歌'
    slot: anytime
    remind:
      text: '今天做舌尖和舌根同时受力的发声训练'
      quote:
        - 把舌用力顶到上颚
        - 保持这个状态把嘴张开，交替发出「アー」「ウー」的声音。
        - 这个动作的效果是：舌尖和舌根同时得到锻炼。
    effect:
      text: '舌尖和舌根同时得到锻炼。'
      quote: '舌尖和舌根同时得到锻炼。'
    dose:
      - value: 10
        unit: '次'
        what: '每次训练中「アーウー」动作次数'
        quote: '「アーウー」算 1 次，这个动作做 10 次。'
      - value: 3
        unit: '组'
        what: '包含本动作在内的每日训练组数'
        quote: '1 天 3 组'
    steps:
      - id: aaue-lift-tongue
        text: '把舌用力顶到上颚'
        quote: '把舌用力顶到上颚'
      - id: aaue-open-and-sound
        text: '保持这个状态把嘴张开，交替发出「アー」「ウー」的声音。'
        quote: '保持这个状态把嘴张开，交替发出「アー」「ウー」的声音。'
      - id: aaue-mouth-shape
        text: '「アー」时把嘴大幅张开，「ウー」时把嘴收成尖的形状。'
        quote: '「アー」时把嘴大幅张开，「ウー」时把嘴收成尖的形状。'
      - id: aaue-repeat
        text: '「アーウー」算 1 次，这个动作做 10 次。'
        quote: '「アーウー」算 1 次，这个动作做 10 次。'
    cautions:
      - level: stop
        text: '有疼痛的人，请不要勉强进行。'
        quote: '有疼痛的人，请不要勉强进行。'
      - level: with-doctor
        text: '口的功能已经在衰退、平时吃东西会呛，或有基础疾病的人，请先咨询牙科医生再开始。'
        quote: '口的功能已经在衰退、平时吃东西会呛，或有基础疾病的人，请先咨询牙科医生再开始。'
      - level: info
        text: '请在自己做得到的范围内进行。'
        quote: '请在自己做得到的范围内进行。'

