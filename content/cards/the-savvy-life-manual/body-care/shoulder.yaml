  - id: shoulder-arm-elevation-ratio
    status: reviewed
    name: "举手时留意肩臂 1:2"
    source:
      anchor: "肩的活动该是1比2：改订版肩部说明书"
    slot: anytime
    remind:
      text: "举手时留意肩胛骨和上臂骨的活动比例"
      quote: "手臂往上举 180 度，肩胛骨应该走 60 度、上臂骨应该走 120 度，这个 1 比 2 医学上叫「肩甲上腕节奏」。"
    steps:
