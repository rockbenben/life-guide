  - id: cross-legged-hip-stretch
    status: reviewed
    name: "盘腿拉伸"
    source:
      anchor: "盘腿拉伸：整套动作的第一招"
    slot: anytime
    remind:
      text: "整套肩部动作开始时先做盘腿拉伸"
      quote: "节目组要求放在最前面做——在三个肩胛骨动作和肩袖练习之前。"
    dose:
      - value: 5
        unit: 次
        what: 每侧盘腿拉伸次数
        quote: "左右各 5 次，共 10 次。"
      - value: 10
        unit: 次
        what: 双侧盘腿拉伸总次数
        quote: "左右各 5 次，共 10 次。"
      - value: 5
        unit: 秒
        what: 每次前倾保持时长
        quote: "慢慢数 5 秒"
    steps:
      - id: set-cross-legged-position
        text: "坐姿盘起一条腿，把脚踝搭到另一条腿上，搭上去的脚保持水平；双手握拳，拳面叠在小腿上"
        quote: "坐姿盘起一条腿，把脚踝搭到另一条腿上，搭上去的脚保持水平；双手握拳，拳面叠在小腿上"
      - id: lean-forward-and-hold
        text: "背部保持伸直，像是把胸口靠向拳头一样慢慢把上半身向前倾。倾到臀部到大腿后侧那条肌肉被拉开的感觉，慢慢数 5 秒，然后换另一侧。"
        quote: "背部保持伸直，像是把胸口靠向拳头一样慢慢把上半身向前倾。倾到臀部到大腿后侧那条肌肉被拉开的感觉，慢慢数 5 秒，然后换另一侧。"
    cautions:
      - level: stop
        text: "有脱臼史、或者做动作时感到强烈疼痛：整套都不要做。"
        quote: "有脱臼史、或者做动作时感到强烈疼痛：整套都不要做。"
      - level: stop
        text: "盘腿拉伸时出现强烈疼痛要停下，特别是臀部以外的部位，即腰部、膝盖、髋关节出现疼痛时要中止。"
        quote: "盘腿拉伸时出现强烈疼痛要停下，特别是臀部以外的部位，即腰部、膝盖、髋关节出现疼痛时要中止。"
    review:
      by: benson
