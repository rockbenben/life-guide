        text: "脚部的血管堵塞引起的病，正式名称是末梢动脉疾患"
        quote: "脚部的血管堵塞引起的病，正式名称是末梢动脉疾患"
      - id: occlusion-risk-factors
        text: "册子特别点名：糖尿病、肾脏病、吸烟、高血压、高胆固醇这几类人更容易发生动脉硬化，需要留意。"
        quote: "册子特别点名：糖尿病、肾脏病、吸烟、高血压、高胆固醇这几类人更容易发生动脉硬化，需要留意。"
    notices:
