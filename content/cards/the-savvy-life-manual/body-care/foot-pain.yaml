  - id: compression-stockings-use
    status: reviewed
    source:
      anchor: "弹力袜的效果与正确穿法"
    remind:
      text: "册子因此给了四步穿法"
      quote:
        - 册子因此给了四步穿法
        - 册子在最后用高亮框写明：糖尿病患者，以及走路时小腿肚会痛、怀疑是足梗塞的人，请不要使用弹力袜。 具体请咨询专门处理下肢静脉瘤的血管外科等医生。
    effect:
      text: "和之前相比，脚部浮肿的减少量达到 213 mL 以上"
      quote: "和之前相比，脚部浮肿的减少量达到 213 mL 以上"
    steps:
      - id: stocking-grip-heel
        text: "把手伸进袜子里，捏住脚跟的部分"
        quote: "把手伸进袜子里，捏住脚跟的部分"
      - id: stocking-turn-and-fold
        text: "就那样把袜子翻过来，对折成两半"
        quote: "就那样把袜子翻过来，对折成两半"
      - id: stocking-start-at-toe
        text: "上下确认，把袜口撑开，从脚尖开始套进去"
        quote: "上下确认，把袜口撑开，从脚尖开始套进去"
      - id: stocking-roll-to-front
        text: "最后把翻过来的那部分翻回正面"
        quote: "最后把翻过来的那部分翻回正面"
    notices:
      - level: info
        text: "这是对能感觉到浮肿的被试测得的结果"
        quote: "这是对能感觉到浮肿的被试测得的结果"
      - level: info
        text: "节目请以站立工作为职业的警备会社（保安公司）人员配合，实测了弹性裤袜（弹力袜）的效果"
        quote: "节目请以站立工作为职业的警备会社（保安公司）人员配合，实测了弹性裤袜（弹力袜）的效果"
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: ae5295703f7b15f9
    name: 弹力袜的四步穿法

