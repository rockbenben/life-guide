  - id: foot-occlusion-hidden-signals
    status: draft
    name: "足梗塞为什么难察觉"
    source:
      anchor: "为什么这么危险的事，你却察觉不到"
    remind:
      text: "了解足梗塞可能被当成老毛病、身体绕路或感觉不到疼而更难察觉。"
      quote:
        - 年纪一大就容易发疼，很多人把它归给「年龄的错」，休息一下疼痛缓解就不再理会。
        - 于是症状缓解、疼痛也减轻了，反而更难察觉。
        - 糖尿病患者如果已经出现神经障碍，就可能感觉不到疼痛，需要格外留意。
        - 当成老毛病。年纪一大就容易发疼，很多人把它归给「年龄的错」，休息一下疼痛缓解就不再理会。
        - 节目这次展示的是一位查出足梗塞的人的「脚的动脉」实物：石灰化。这是动脉硬化血管上出现的变化之一——动脉硬化让血管内侧鼓起瘤状物，血液中的钙附着上去，血管就变得像骨头一样硬。册子特别点名：糖尿病、肾脏病、吸烟、高血压、高胆固醇这几类人更容易发生动脉硬化，需要留意。^[「足のSOS」痛み・むくみに潜む危機のトリセツ]
    steps:
      - id: hidden-old-pain
        text: "年纪一大就容易发疼，很多人把它归给「年龄的错」，休息一下疼痛缓解就不再理会。"
        quote: "年纪一大就容易发疼，很多人把它归给「年龄的错」，休息一下疼痛缓解就不再理会。"
      - id: hidden-collateral-route
        text: "即使是大血管堵住了，人体也会新造血管、把细血管扩张来勉强把营养送过去，于是症状缓解、疼痛也减轻了，反而更难察觉。"
        quote: "即使是大血管堵住了，人体也会新造血管、把细血管扩张来勉强把营养送过去，于是症状缓解、疼痛也减轻了，反而更难察觉。"
      - id: hidden-neuropathy
        text: "糖尿病患者如果已经出现神经障碍，就可能感觉不到疼痛，需要格外留意。"
        quote: "糖尿病患者如果已经出现神经障碍，就可能感觉不到疼痛，需要格外留意。"
    notices:
      - level: info
        text: "于是症状缓解、疼痛也减轻了，反而更难察觉。糖尿病患者如果已经出现神经障碍，就可能感觉不到疼痛，需要格外留意。"
        quote:
          - "于是症状缓解、疼痛也减轻了，反而更难察觉。"
          - "糖尿病患者如果已经出现神经障碍，就可能感觉不到疼痛，需要格外留意。"

  - id: three-minute-foot-self-check
    status: reviewed
    source:
      anchor: "不用去医院的三分钟自查"
    remind:
      text: "现在按册子的方法自查脚的缺血警讯。"
      quote:
        - 册子给了三条判断方法，你可以现在就对一下自己的脚
        - 平躺下来把脚抬高约 1 分钟，看看脚的颜色会不会变差。抬高后缺血更明显，颜色改变就是警讯。
    duration:
      basis: quote
      sec: 180
      quote: "这篇给两件能立刻上手的事：不用去医院的三分钟自查，以及ABI 检查的风险计分表；脚部浮肿的部分单独放在后面。"
    steps:
      - id: self-check-elevated-foot
        text: "平躺下来把脚抬高约 1 分钟，看看脚的颜色会不会变差。抬高后缺血更明显，颜色改变就是警讯。"
        quote: "平躺下来把脚抬高约 1 分钟，看看脚的颜色会不会变差。抬高后缺血更明显，颜色改变就是警讯。"
      - id: self-check-walking-pain
        text: "连续走 5 分钟左右，有没有小腿肚疼痛，而且伴随脚的颜色变差。"
        quote: "连续走 5 分钟左右，有没有小腿肚疼痛，而且伴随脚的颜色变差。"
      - id: self-check-nonhealing-wound
        text: "脚上有没有超过 2 周都不愈合的伤口。"
        quote: "脚上有没有超过 2 周都不愈合的伤口。"
    notices:
      - level: seek-care
        text: "三条中有任何一条对上，就去血管外科、心脏血管外科或循环器内科和专科医生聊聊。"
        quote: "三条中有任何一条对上，就去血管外科、心脏血管外科或循环器内科和专科医生聊聊。"
      - level: info
        text: "即使已经出现症状，也不会马上就连到截肢生活习惯的改善、投药、运动疗法都能抑制进展，还可以通过导管治疗或搭桥手术来改善血流。"
        quote:
          - "即使已经出现症状，也不会马上就连到截肢"
          - "生活习惯的改善、投药、运动疗法都能抑制进展，还可以通过导管治疗或搭桥手术来改善血流。"
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: 08d76638662a78da
    name: 三分钟自查脚的缺血警讯

  - id: abi-screening-and-risk-score
    status: draft
    name: "ABI 检查与风险计分"
    source:
      anchor: "早期发现：ABI 检查与风险计分表"
    remind:
      text: "了解 ABI 检查和风险计分表。"
      quote:
        - ABI（踝肱指数，足压检查）是册子重点推荐的早期发现手段
        - 这篇给两件能立刻上手的事：不用去医院的三分钟自查，以及ABI 检查的风险计分表；脚部浮肿的部分单独放在后面。
    steps:
      - id: abi-pressure-measurement
        text: "同时测量脚踝和手臂的血压，用两个数值来判断脚的血管有没有堵塞"
        quote: "同时测量脚踝和手臂的血压，用两个数值来判断脚的血管有没有堵塞"
      - id: abi-score-diabetes
        text: "糖尿病 4 分"
        quote: "糖尿病 4 分"
      - id: abi-score-smoking
        text: "吸烟 4 分"
        quote: "吸烟 4 分"
      - id: abi-score-dialysis
        text: "肾脏病（透析）4 分"
        quote: "肾脏病（透析）4 分"
      - id: abi-score-nondialysis
        text: "肾脏病（未透析）2 分"
        quote: "肾脏病（未透析）2 分"
      - id: abi-score-cholesterol
        text: "高胆固醇 3 分"
        quote: "高胆固醇 3 分"
      - id: abi-score-hypertension
        text: "高血压 2 分"
        quote: "高血压 2 分"
      - id: abi-score-over-fifty
        text: "年龄超过 50 岁 1 分"
        quote: "年龄超过 50 岁 1 分"
      - id: abi-score-over-sixty-five
        text: "年龄超过 65 岁 4 分"
        quote: "年龄超过 65 岁 4 分"
      - id: abi-score-total
        text: "合计 7 分以上的人，建议每年做一次足部血压检查。"
        quote: "合计 7 分以上的人，建议每年做一次足部血压检查。"
    notices:
      - level: with-doctor
        text: "如果脚的血压比手臂还低，就要怀疑脚的血管堵住了。"
        quote: "如果脚的血压比手臂还低，就要怀疑脚的血管堵住了。"
      - level: info
        text: "年龄到 50 岁以上，风险本身就会升高。"
        quote: "年龄到 50 岁以上，风险本身就会升高。"
      - level: info
        text: "这项检查在全国的综合医院和血管专科诊所里已经相当普及。"
        quote: "这项检查在全国的综合医院和血管专科诊所里已经相当普及。"

  - id: venous-reflux-and-edema
    status: reviewed
    name: "静脉逆流引起的脚肿"
    source:
      anchor: "脚浮肿：另一个 SOS，来自静脉的「逆流」"
    remind:
      text: "留意脚一到下午就肿、按下去久久不弹回来的静脉逆流信号。"
      quote: "脚一到下午就肿、按下去久久不弹回来，册子把它归到另一个机制上——静脉的逆流。"
    steps:
      - id: edema-venous-reflux
        text: "脚一到下午就肿、按下去久久不弹回来，册子把它归到另一个机制上——静脉的逆流。"
        quote: "脚一到下午就肿、按下去久久不弹回来，册子把它归到另一个机制上——静脉的逆流。"
      - id: edema-valve-cause
        text: "但长时间站立工作或久坐，会让血液淤积，瓣膜就关不严了。"
        quote: "但长时间站立工作或久坐，会让血液淤积，瓣膜就关不严了。"
      - id: edema-study-result
        text: "节目请 16 位受困扰的志愿者做了检查，结果是：有 4 人的静脉里看到了血液逆流（判断依据是静脉回声检查）。"
        quote: "节目请 16 位受困扰的志愿者做了检查，结果是：有 4 人的静脉里看到了血液逆流（判断依据是静脉回声检查）。"
    notices:
      - level: with-doctor
        text: "已经损坏的瓣膜不会自然痊愈；放着不管，血液反复淤积，还可能引起下肢静脉瘤（也就是曲张的静脉）。"
        quote: "已经损坏的瓣膜不会自然痊愈；放着不管，血液反复淤积，还可能引起下肢静脉瘤（也就是曲张的静脉）。"
    review:
