  - id: foot-occlusion-and-risk
    status: reviewed
    name: "足梗塞是什么病"
    source:
      anchor: "「足梗塞」到底是什么病"
    remind:
      text: "脚部的血管堵塞引起的病，正式名称是末梢动脉疾患"
      quote: "脚部的血管堵塞引起的病，正式名称是末梢动脉疾患"
    steps:
