  - id: buttocks-training-selection
    status: reviewed
    source:
      anchor: "臀部下垂矫正：骨盆自检"
    slot: anytime
    remind:
      text: "先判断骨盆前倾或后倾，再选择对应的臀部训练。"
      quote: "先用对墙站立法分清自己是哪一种：背靠墙站，头、臀部和脚后跟都贴墙，腰后能塞进拳头是前倾、只能塞进手掌是后倾，照结果选对应的训练。"
    dose:
      - value: 2
        unit: "组"
        what: "所有训练早晚各做的组数"
        quote: "所有训练都是早晚各 2 组"
    steps:
      - id: select-tilt
        text: "先用对墙站立法分清自己是哪一种：背靠墙站，头、臀部和脚后跟都贴墙，腰后能塞进拳头是前倾、只能塞进手掌是后倾，照结果选对应的训练。"
        quote: "先用对墙站立法分清自己是哪一种：背靠墙站，头、臀部和脚后跟都贴墙，腰后能塞进拳头是前倾、只能塞进手掌是后倾，照结果选对应的训练。"
      - id: select-matching-routine
        text: "前倾做提臀 20 下 + 腹肌锻炼 10 下，后倾做后弓步每侧 20 次、强化髂腰肌每侧 10 次、肩带拉伸 10 次；另外还有把目标步幅提到 65 厘米的大踏步走法。"
        quote: "前倾做提臀 20 下 + 腹肌锻炼 10 下，后倾做后弓步每侧 20 次、强化髂腰肌每侧 10 次、肩带拉伸 10 次；另外还有把目标步幅提到 65 厘米的大踏步走法。"
    cautions:
      - level: stop
        text: "注意：说明书在训练页下方连印了两条同样的警示——有整形外科疾患、或关节／膝盖等部位会痛的人，请不要做这些动作。"
        quote: "注意：说明书在训练页下方连印了两条同样的警示——有整形外科疾患、或关节／膝盖等部位会痛的人，请不要做这些动作。"
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: c81edf5660b0a1b6
    name: 按骨盆类型选训练

  - id: pelvis-wall-self-check
    status: reviewed
    source:
      anchor: "骨盆自检"
    slot: anytime
    images:
      - "https://img.newzone.top/2024-10-18-07-17-13.png?imageMogr2/format/webp"
    remind:
      text: "背靠墙站立，先判断腰后能塞进拳头还是只能塞进手掌。"
      quote:
        - 你可以通过以下方法自检骨盆位置：
        - 背靠墙站立，头、臀部和脚后跟均靠墙。
        - 先用对墙站立法分清自己是哪一种：背靠墙站，头、臀部和脚后跟都贴墙，腰后能塞进拳头是前倾、只能塞进手掌是后倾，照结果选对应的训练。所有训练都是早晚各 2 组——前倾做提臀 20 下 + 腹肌锻炼 10 下，后倾做后弓步每侧 20 次、强化髂腰肌每侧 10 次、肩带拉伸 10 次；另外还有把目标步幅提到 65 厘米的大踏步走法。^[「お尻」のトリセツ（品番 TYMK-007）]
    steps:
      - id: wall-contact
        text: "背靠墙站立，头、臀部和脚后跟均靠墙。"
        quote: "背靠墙站立，头、臀部和脚后跟均靠墙。"
      - id: read-anterior-tilt
        text: "能塞进拳头：说明书说这指向骨盆前倾。"
        quote: "能塞进拳头：说明书说这指向骨盆前倾。"
      - id: read-posterior-tilt
        text: "只能塞进手掌：说明指向骨盆后倾，建议进行骨盆后倾型“臀部训练”。"
        quote: "只能塞进手掌：说明指向骨盆后倾，建议进行骨盆后倾型“臀部训练”。"
      - id: train-without-diagnosis
        text: "感觉腰后空、想改善体态，练臀部力量和核心确实有帮助，但不必先给自己「确诊」前倾。"
        quote: "感觉腰后空、想改善体态，练臀部力量和核心确实有帮助，但不必先给自己「确诊」前倾。"
    cautions:
      - level: info
        text: "但这是一种民间自测法，没有经过验证——腰后能塞进多少东西，受腰椎前凸度、体脂和臀肌厚度影响，不能据此判断骨盆倾角。"
        quote: "但这是一种民间自测法，没有经过验证——腰后能塞进多少东西，受腰椎前凸度、体脂和臀肌厚度影响，不能据此判断骨盆倾角。"
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: c43ec17f40462a8c
    name: 靠墙查骨盆前后倾

  - id: posterior-reverse-lunge
