cards:
  - id: check-glasses-eye-effort
    status: reviewed
    name: "判断眼镜合不合适"
    source:
      anchor: '远近都看得清的眼镜反而更累：8 成的人戴错了'
    slot: anytime
    remind:
      text: '判断眼镜是否合适时，不要只看看得清，还要看眼睛是否少出力'
      quote: '原因在于，合适与否不取决于「看不看得清」，而取决于你的眼睛出不出力。'
    steps:
      - id: identify-eye-effort
        text: '眼镜明明验了、配了，看东西也清楚，可一天下来就是眼睛酸、脖子硬、太阳穴疼。这不一定是用眼过度——这副眼镜本身可能一直在逼你的眼睛用力。'
        quote:
          - '眼镜明明验了、配了，看东西也清楚，可一天下来就是眼睛酸、脖子硬、太阳穴疼。'
          - '这不一定是用眼过度——这副眼镜本身可能一直在逼你的眼睛用力。'
      - id: check-misfit-prevalence
        text: '眼镜明明验了、配了，看东西也清楚，可一天下来就是眼睛酸、脖子硬、太阳穴疼。眼科医梶田雅義看过 4 万人以上的眼睛，报告称 8 成的人戴着不合适的眼镜。'
        quote:
          - '眼镜明明验了、配了，看东西也清楚，可一天下来就是眼睛酸、脖子硬、太阳穴疼。'
          - '眼科医梶田雅義看过 4 万人以上的眼睛，报告称 8 成的人戴着不合适的眼镜。'
    review:
      by: benson
      date: 2026-10-21
      hash: d440ed040f72265c
  - id: watch-ciliary-muscle-strain
    status: reviewed
    source:
      anchor: '不对的眼镜，让肌肉一直绷着'
    slot: anytime
    remind:
      text: '判断眼镜是否合适时，留意睫状肌是否一直处在负担状态'
      quote: '说明书强调，不合适的眼镜会让这块肌肉一直处在负担状态。'
    steps:
      - id: understand-ciliary-role
        text: '睫状肌就是负责调节焦距的那块肌肉。'
        quote: '睫状肌就是负责调节焦距的那块肌肉。'
      - id: consider-near-viewing
        text: '可说明书指出，现代生活中看近距离的时间被大幅拉长，看远处的时间反而很短——一副按远视做好的镜片，被拿去承担绝大部分的近距离用眼需求。'
        quote: '可说明书指出，现代生活中看近距离的时间被大幅拉长，看远处的时间反而很短——一副按远视做好的镜片，被拿去承担绝大部分的近距离用眼需求。'
      - id: suspect-lens-after-strain
        text: '于是疲劳会攒成一系列身体不适：眼疲劳、肩周僵硬、头痛、头晕。这几种不适同时出现、又查不出别的原因时，镜片本身值得怀疑。'
        quote:
          - '于是疲劳会攒成一系列身体不适：眼疲劳、肩周僵硬、头痛、头晕。'
          - '这几种不适同时出现、又查不出别的原因时，镜片本身值得怀疑。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 9268e2761552a706
    name: 眼镜不合会让眼睛累
  - id: confirm-needed-viewing-distance
    status: reviewed
    source:
      anchor: '配镜时最常踩的坑'
    slot: anytime
    remind:
      text: '配镜测试镜片时，不要只检查远处视野'
      quote: '装配测试镜片时，多数人只做一件事：透过镜片看远处，确认视野是否清晰。'
    steps:
      - id: include-necessary-distance
        text: '说明书把这种做法称为配镜环节里最常被踩的坑：「必要的距离没有看」。'
        quote: '说明书把这种做法称为配镜环节里最常被踩的坑：「必要的距离没有看」。'
      - id: account-for-near-work
        text: '节目组实测了一天的注视距离，发现在眼科界被归为远距离的 5 米以上注视时间，一天只有 62 分钟。剩下的时间，眼睛几乎都在近距离用。'
        quote:
          - '节目组实测了一天的注视距离，发现在眼科界被归为远距离的 5 米以上注视时间，一天只有 62 分钟。'
          - '剩下的时间，眼睛几乎都在近距离用。'
      - id: plan-for-digital-use
        text: '也就是说，一副为远距离配的眼镜，被人用来看手机和电脑——睫状肌要为此持续付出更多。'
        quote: '也就是说，一副为远距离配的眼镜，被人用来看手机和电脑——睫状肌要为此持续付出更多。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 006265affe446828
    name: 配镜别只测远处视野
  - id: measure-eye-burden-by-use
    status: reviewed
    source:
      anchor: '让眼睛少出力：测一次负担度'
    slot: anytime
    remind:
      text: '去眼科或眼镜店前，先确认能否按实际用途测睫状肌负担度'
      quote:
        - 去之前先做功课：通过官网或电话确认对方有没有这台装置。
        - 有的话，直接让对方按你的实际用途测量负担度，而不是只测远视。
        - 睫状肌就是负责调节焦距的那块肌肉。说明书强调，不合适的眼镜会让这块肌肉一直处在负担状态。
    steps:
      - id: confirm-burden-device
        text: '近几年出现了一种叫调节功能解析装置的检测设备，能测量睫状肌的负担程度，眼科和眼镜店已经开始引进。通过官网或电话确认对方有没有这台装置。'
        quote:
          - '近几年出现了一种叫调节功能解析装置的检测设备，能测量睫状肌的负担程度，眼科和眼镜店已经开始引进。'
          - '通过官网或电话确认对方有没有这台装置。'
      - id: choose-knowledgeable-clinic
        text: '装置不常见时，眼科医梶田雅義给的挑选建议是：擅长斜视和弱视的眼科，通常也是眼镜知识比较丰富的眼科。可以先看医院官网确认。'
        quote:
          - '装置不常见时，眼科医梶田雅義给的挑选建议是：擅长斜视和弱视的眼科，通常也是眼镜知识比较丰富的眼科。'
          - '可以先看医院官网确认。'
      - id: describe-purpose
        text: '准确说明这副眼镜是拿来做什么的——近距离工作用、驾驶用还是看远用，医生的判断会完全不同。'
        quote: '准确说明这副眼镜是拿来做什么的——近距离工作用、驾驶用还是看远用，医生的判断会完全不同。'
      - id: confirm-distance-after-fitting
        text: '装上调节好的测试镜片后再确认。平时看近处时间长的人，一定要确认必要的视距，不能只测远处。'
        quote:
          - '装上调节好的测试镜片后再确认。'
          - '平时看近处时间长的人，一定要确认必要的视距，不能只测远处。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: 1c904ca7f4093446
    name: 测一次睫状肌负担度
  - id: clean-lenses-with-water
    status: reviewed
    source:
      anchor: '镜片脏了用水洗，不是用布擦'
    slot: anytime
    remind:
      text: '清洁镜片时先用流水冲掉砂粒，再分别用纸巾吸水和用擦镜布去油'
      quote:
        - '用流水把正反两面都彻底冲干净，这一步不能省。'
        - '水珠用纸巾吸掉。'
        - '油污交给擦镜布处理。'
        - '用流水把砂粒冲掉之后，镜片上剩下的油膜才交给擦镜布。'
    dose:
      - value: 1
        unit: '个月'
        what: '擦镜布手洗间隔'
        quote: '擦镜布本身也要洗：它也会积灰，建议一个月手洗一次。'
    steps:
      - id: rinse-both-sides
        text: '用流水把正反两面都彻底冲干净，这一步不能省。'
        quote: '用流水把正反两面都彻底冲干净，这一步不能省。'
      - id: absorb-droplets
        text: '水珠用纸巾吸掉。'
        quote: '水珠用纸巾吸掉。'
      - id: remove-oil
        text: '油污交给擦镜布处理。'
        quote: '油污交给擦镜布处理。'
      - id: wash-cloth-monthly
        text: '擦镜布本身也要洗：它也会积灰，建议一个月手洗一次。'
        quote: '擦镜布本身也要洗：它也会积灰，建议一个月手洗一次。'
    cautions:
      - level: stop
        text: '说明书这一页讲的是清洁，结论有点反直觉：不要用眼镜布擦镜片。'
        quote: '说明书这一页讲的是清洁，结论有点反直觉：不要用眼镜布擦镜片。'
      - level: info
        text: '镜片表面附着肉眼看不见的细小砂粒和铁粉。察觉不到它们、直接把布压上去来回擦，这些颗粒就会被推着划进镜片表面。'
        quote:
          - '镜片表面附着肉眼看不见的细小砂粒和铁粉。'
          - '察觉不到它们、直接把布压上去来回擦，这些颗粒就会被推着划进镜片表面。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: bf0ceaa3c52484b1
    name: 镜片先冲水再擦
  - id: seek-eye-care-for-strain
    status: reviewed
    source:
      anchor: '出现这些不适，先看眼科'
    slot: anytime
    remind:
      text: '出现眼疲劳、肩周僵硬、头痛、头晕时先看眼科'
      quote: '说明书给出的就医信号是那四种由对焦肌肉过度使用带来的不适——眼疲劳、肩周僵硬、头痛、头晕。'
    steps:
      - id: seek-care
        text: '这些症状出现时，先别急着买新镜片，去眼科查一下。'
        quote: '这些症状出现时，先别急着买新镜片，去眼科查一下。'
      - id: describe-viewing-distance
        text: '找医生时，把日常真实的注视距离说清楚是最有用的一步：一天里看手机多久、看电脑多久、看远处多久。'
        quote: '找医生时，把日常真实的注视距离说清楚是最有用的一步：一天里看手机多久、看电脑多久、看远处多久。'
      - id: find-measurement-site
        text: '看诊当天如果常去的眼镜店或眼科没有调节功能解析装置，就按上面说的方式确认能测睫状肌负担度的地方。'
        quote: '看诊当天如果常去的眼镜店或眼科没有调节功能解析装置，就按上面说的方式确认能测睫状肌负担度的地方。'
      - id: explain-use-and-distance
        text: '验光配镜时只确认「远处看不看得清」是不够的。描述用途、确认必要的视距，比任何一次单独的视力检查都更能决定这副眼镜是否合适。'
        quote:
          - '验光配镜时只确认「远处看不看得清」是不够的。'
          - '描述用途、确认必要的视距，比任何一次单独的视力检查都更能决定这副眼镜是否合适。'
    cautions:
      - level: with-doctor
        text: '这些症状出现时，先别急着买新镜片，去眼科查一下。'
        quote: '这些症状出现时，先别急着买新镜片，去眼科查一下。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
