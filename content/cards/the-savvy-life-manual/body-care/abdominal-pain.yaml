  - id: abdominal-pain-autonomic-training
    status: reviewed
    source:
      anchor: "用自律训练法切断这个循环"
    slot: anytime
    remind:
      text: "单次 15 到 20 分钟、每天早晚各 1 次、连续 1 个月左右"
      quote: "单次 15 到 20 分钟、每天早晚各 1 次、连续 1 个月左右"
    effect:
      text: "作用是调整自主神经的平衡，让腹痛发作的频率和疼痛程度下降。"
      quote: "作用是调整自主神经的平衡，让腹痛发作的频率和疼痛程度下降。"
    dose:
      - value: 15
        valueMax: 20
        unit: "分钟"
        what: "单次练习时长"
        quote: "单次 15 到 20 分钟"
      - value: 1
        unit: "次"
        what: "每天早晚各 1 次练习"
        quote: "每天早晚各 1 次"
      - value: 1
        unit: "月"
        what: "连续练习周期"
        quote: "连续 1 个月左右"
        approximate: true
    duration:
      basis: derived
      sec: 900
      formula: "15 分钟 × 60 秒/分钟 = 900 秒（取原文单次时长下限）"
    steps:
      - id: prepare-room
        text: "准备：找一间光线昏暗的房间，坐在椅子上把腰背放松，腰带之类的束缚松开，双手放在膝上。"
        quote: "准备：找一间光线昏暗的房间，坐在椅子上把腰背放松，腰带之类的束缚松开，双手放在膝上。"
      - id: opening-mantra
        text: "闭上眼睛，在心里反复默念「心情正悠然平静、慢慢安定下来」。"
        quote: "闭上眼睛，在心里反复默念「心情正悠然平静、慢慢安定下来」。"
      - id: muscle-focus
        text: "把注意力集中在惯用手上，在心里反复默念「右手（或者左手）软绵绵的，非常沉重」。"
        quote: "把注意力集中在惯用手上，在心里反复默念「右手（或者左手）软绵绵的，非常沉重」。"
      - id: muscle-order
        text: "接着按另一只手 → 右脚 → 左脚的顺序依次进行。双手双脚都觉得沉重了，就结束。"
        quote:
          - "接着按另一只手 → 右脚 → 左脚的顺序依次进行。"
          - "双手双脚都觉得沉重了，就结束。"
      - id: temperature-focus
        text: "注意力同样放在惯用手上，在心里反复默念「右手（或者左手）暖暖的，非常温热」。"
        quote: "注意力同样放在惯用手上，在心里反复默念「右手（或者左手）暖暖的，非常温热」。"
      - id: temperature-order
        text: "再按另一只手 → 右脚 → 左脚的顺序做一遍，双手双脚都感到温热了，就结束。"
        quote: "再按另一只手 → 右脚 → 左脚的顺序做一遍，双手双脚都感到温热了，就结束。"
      - id: elimination
        text: "闭着眼睛大幅度伸懒腰，再反复用力握拳、松开，让身体回到日常状态。"
        quote: "闭着眼睛大幅度伸懒腰，再反复用力握拳、松开，让身体回到日常状态。"
