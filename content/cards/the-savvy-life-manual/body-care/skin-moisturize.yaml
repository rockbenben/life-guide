cards:
  - id: moisturize-3t
    status: reviewed
    name: "全身涂保湿霜：3T 涂法"
    source:
      anchor: "什么是 3T 涂抹法？"
    # 早晚各涂一次，单一时段装不下，放 anytime。
    slot: anytime

    remind:
      text: "每天早晚各涂一次保湿霜，用足量，每个部位轻柔地涂抹 30 次"
      quote: "每天早晚各涂一次、用足量保湿霜、每个部位轻柔地涂抹 30 次"

    dose:
      - value: 2
        unit: 次/天
        what: "早晚各涂一次"
        quote: "每天两次：建议早晚各一次进行涂抹。"
      - value: 30
        unit: 次
        what: "每个部位涂抹"
        quote: "涂抹 30 次：每个部位轻柔地涂抹 30 次，以便保湿霜能够更好地被皮肤吸收。"
      - value: 1
        unit: FTU
        what: "用量标准是一个指尖单元"
        quote: "通常的用量标准是“1FTU”（指尖单元），即从食指末端指节长度挤出的量。"

    # 原文没给涂抹耗时（涂多大面积、多长时间都取决于人），按 D7 标 unknown，不编数。
    duration:
      basis: unknown

    steps:
      - id: amount
        text: "通常的用量标准是“1FTU”（指尖单元），即从食指末端指节长度挤出的量。这足以涂抹两个手掌大小的皮肤面积。"
        quote:
          - "通常的用量标准是“1FTU”（指尖单元），即从食指末端指节长度挤出的量。"
          - "这足以涂抹两个手掌大小的皮肤面积。"
        images:
          - "https://img.newzone.top/2024-10-14-09-57-13.png?imageMogr2/format/webp"

      - id: amount-by-part
        text: "根据不同的身体部位，保湿霜的用量也会有所不同。以下图示提供了各个部位的推荐用量，确保全身皮肤都能得到充分的保湿。请注意，“背中”不仅指后背，还包括臀部的区域。"
        quote:
          - "根据不同的身体部位，保湿霜的用量也会有所不同。以下图示提供了各个部位的推荐用量，确保全身皮肤都能得到充分的保湿。"
          - "请注意，“背中”不仅指后背，还包括臀部的区域。"
        images:
          - "https://img.newzone.top/2024-10-14-09-58-55.png?imageMogr2/format/webp"

      - id: thirty
        text: "建议在每个部位涂抹 30 次，以确保保湿霜均匀分布并完全吸收"
        quote: "建议在每个部位涂抹 30 次，以确保保湿霜均匀分布并完全吸收"

      - id: gentle
        text: "由于皮肤对摩擦很敏感，涂抹时要缓慢而轻柔。尤其是面部皮肤更为娇嫩，建议减少次数。"
        quote:
          - "由于皮肤对摩擦很敏感，涂抹时要缓慢而轻柔。"
          - "尤其是面部皮肤更为娇嫩，建议减少次数。"

      - id: circle
        text: "推荐手法：轻轻打圈（くるくる塗る）把保湿霜铺开，让它填进皮肤的凹凸里"
        quote: "推荐手法：轻轻打圈（くるくる塗る）把保湿霜铺开，让它填进皮肤的凹凸里"

    cautions:
      - level: stop
        text: "用力揉搓是不行的——涂抹要轻柔扩散"
        quote: "用力揉搓是不行的——涂抹要轻柔扩散"
      - level: stop
        text: "特应性皮炎患者有因此恶化的可能，严禁用力搓揉"
        quote: "特应性皮炎患者有因此恶化的可能，严禁用力搓揉"
      - level: stop
        text: "仍发痒，或出现红肿、湿疹，应立即停用并咨询皮肤科"
        quote: "仍发痒，或出现红肿、湿疹，应立即停用并咨询皮肤科"
      - level: with-doctor
        text: "肝素类成分可能因促进血行而引起瘙痒，需挑选合适的产品并向皮肤科咨询"
        quote: "肝素类成分可能因促进血行而引起瘙痒，需挑选合适的产品并向皮肤科咨询"
      - level: info
        text: "保湿剂并非对所有瘙痒都有效——瘙痒也可能源自内脏或精神方面，应先请皮肤科确认原因"
        quote: "保湿剂并非对所有瘙痒都有效——瘙痒也可能源自内脏或精神方面，应先请皮肤科确认原因"
