  - id: heartburn-prevention
    status: reviewed
    source:
      anchor: '防止胃灼热的措施'
    remind:
      text: '饭后保持正确姿势睡前避免饮酒左侧卧位睡觉'
      quote:
        - 饭后保持正确姿势
        - 睡前避免饮酒
        - 左侧卧位睡觉
        - 饭后保持正确姿势：吃完饭后，避免弯腰或前倾，这会对胃部施加压力，使胃酸更容易回流。坐直或在沙发上靠坐，避免对胃部的额外挤压。
    images:
      - 'https://img.newzone.top/2024-10-17-04-51-42.png?imageMogr2/format/webp'
    steps:
      - id: upright-after-meal
        text: '吃完饭后，避免弯腰或前倾，这会对胃部施加压力，使胃酸更容易回流。坐直或在沙发上靠坐，避免对胃部的额外挤压。'
        quote: '吃完饭后，避免弯腰或前倾，这会对胃部施加压力，使胃酸更容易回流。坐直或在沙发上靠坐，避免对胃部的额外挤压。'
      - id: loose-belt-and-weight
        text: '腰带勒得过紧和体重超重都会增加胃酸反流的风险。'
        quote: '腰带勒得过紧和体重超重都会增加胃酸反流的风险。'
      - id: avoid-alcohol-before-bed
        text: '酒精会使连接胃和食道的肌肉放松，从而增加胃酸反流的可能性。'
        quote:
          - 酒精会使连接胃和食道的肌肉放松，从而增加胃酸反流的可能性。
          - 睡前避免饮酒：酒精会使连接胃和食道的肌肉放松，从而增加胃酸反流的可能性。
      - id: sleep-on-left-side
        text: '当你左侧卧时，胃的入口会朝上，能有效减少胃酸反流的发生；而右侧卧时，胃的入口朝下，更容易发生反流。'
        quote: '当你左侧卧时，胃的入口会朝上，能有效减少胃酸反流的发生；而右侧卧时，胃的入口朝下，更容易发生反流。'
    notices:
      - level: info
        text: '胃灼热主要是由于胃酸反流引起的，以下措施可以帮助预防和缓解：'
        quote: '胃灼热主要是由于胃酸反流引起的，以下措施可以帮助预防和缓解：'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: 38feab20f8bbbe1a
    name: 防止胃灼热

  - id: h-pylori-screening
    status: reviewed
    name: "幽门螺杆菌的检查"
    source:
      anchor: '第三部分：幽门螺杆菌——胃癌的成因与检查'
    remind:
      text: '了解幽门螺杆菌的感染时间点、检查方式，以及家庭成员共同检查的要点'
      quote:
        - '胃癌的 95% 由幽门螺杆菌引起，日本每年发病在 10 万人以上。'
        - '关键时间点在感染年龄'
        - '检查有三种方式：血液、粪便、内镜。'
        - '家里有人感染，其他人一定要一起检查。'
    steps:
      - id: cause-and-burden
        text: '胃癌的 95% 由幽门螺杆菌引起，日本每年发病在 10 万人以上。'
        quote: '胃癌的 95% 由幽门螺杆菌引起，日本每年发病在 10 万人以上。'
      - id: infection-course
        text: '主要在 5 岁前后、也就是婴幼儿期感染10 岁以后几乎不会自然消失10 岁以后的「新发感染」多数属于一过性'
        quote:
          - '主要在 5 岁前后、也就是婴幼儿期感染'
          - '10 岁以后几乎不会自然消失'
          - '10 岁以后的「新发感染」多数属于一过性'
      - id: test-methods
        text: '检查有三种方式：血液、粪便、内镜。'
        quote: '检查有三种方式：血液、粪便、内镜。'
      - id: screening-settings-and-costs
        text: '健诊和人間ドック可以做，费用数百日元到 3,000 日元左右；消化内科也能做，主要靠内镜，但也可以用呼气或粪便检测，费用数千日元加诊察费；做了内镜、被诊断为慢性胃炎等情况，可以用保险；认定医可在日本幽门螺旋杆菌学会官网查。'
        quote:
          - '健诊和人間ドック可以做，费用数百日元到 3,000 日元左右；'
          - '消化内科也能做，主要靠内镜，但也可以用呼气或粪便检测，费用数千日元加诊察费；做了内镜、被诊断为慢性胃炎等情况，可以用保险；'
          - '认定医可在日本幽门螺旋杆菌学会官网查。'
      - id: family-screening
        text: '感染途径的 8 成是亲子感染——家里有人感染，其他人一定要一起检查。'
        quote: '感染途径的 8 成是亲子感染——家里有人感染，其他人一定要一起检查。'
      - id: early-detection-and-treatment
        text: '尽早发现、尽早治疗'
        quote: '尽早发现、尽早治疗'
    notices:
      - level: info
        text: '费用因地区和检查方式而异，以受理机构说明为准。'
        quote: '费用因地区和检查方式而异，以受理机构说明为准。'
