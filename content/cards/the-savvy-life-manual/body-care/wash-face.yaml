# 覆盖清单：这个文件里哪些内容明确不抽成卡，以及为什么。
#
# 本篇只抽「五步洗脸法」这一张卡。
#
# 注意：「科普」小节里关于水温的两条（温度过高／过低）和早上用不用洗面奶的两条
# 已经被抽成 cautions，所以该小节不在 ignore 里；
# 但「为什么要起泡」只是原理解释，没有新动作，列在这里。
# 「洗完脸怎么涂才对」是洗脸之后的另一个动作（涂保湿产品），本卡只覆盖洗脸本身。
#
ignore:
  sections:
    - anchor: "为什么要起泡"
      reason: "泡沫吸附油污的原理说明，是「为什么」不是「怎么做」，五步法里已经有起泡方法"
    - anchor: "洗完脸怎么涂才对"
      reason: "爽肤水与保湿霜的涂抹手法是洗脸之后的另一个动作，本卡只覆盖洗脸本身"
    - anchor: "什么时候该停、该看医生"
      reason: "停手与就医判断属于「何时该看医生」类卡片，不是洗脸动作"

  images:
    - url: "https://img.newzone.top/2024-10-16-11-15-38.png?imageMogr2/format/webp"
      reason: "泡沫显微对比图是「为什么要起泡」的原理示意，不是洗脸动作示意图"

cards:
  - id: face-wash
    status: reviewed
    name: "用绵密泡沫洗脸"
    source:
      anchor: "五步洗脸法与起泡方法"
    # 原文专门有一节讲「早上一定要用洗面奶洁面」，这一遍是重点，所以放 morning。
    slot: morning

    remind:
      text: "5 步洗脸：绵密泡沫 → 额头、脸颊到鼻筋轻打圈 → 32～34℃ 温凉水冲洗 → 毛巾轻轻吸干 → 保湿"
      quote: "洗脸一共 5 步，外加一个起泡方法：极其绵密的泡沫 → 从 额头、脸颊到鼻筋，全程只用泡沫轻轻打圈、尽量不碰皮肤 → 32～34℃ 温凉水冲洗 → 毛巾轻轻吸干、不来回擦 → 保湿"

    dose:
      - value: 5
        unit: "步"
        what: "洗脸步骤"
        quote: "洗脸一共 5 步"
      # 范围是一行，不拆成「下限 / 上限」两条 —— 原文写的是「32 到 34℃ 的温凉水」，
      # 拆开就成了两条各自带界说的内容（而且两条引的是同一句）。
      - value: 32
        valueMax: 34
        unit: "℃"
        what: "温凉水冲洗脸部"
        quote: "用 32 到 34℃ 的温凉水冲洗脸部"
      - value: 2
        unit: "分钟"
        what: "搓出绵密的泡"
        quote: "约 1 分 30 秒到 2 分钟搓出绵密的泡"

    # 「1 分 30 秒」换算成秒是推算，单独记在 derived 里，不混进原文照抄的 dose。
    derived:
      - label: "搓泡时长下限"
        value: 90
        unit: "秒"
        formula: "1 分 30 秒 = 60 秒 + 30 秒 = 90 秒"

    # 原文只给了起泡那一步的时长（1 分 30 秒到 2 分钟），
    # 没有说整套洗脸（含冲洗、擦干、保湿）要多久，所以不推算，basis=unknown。
    duration:
      basis: unknown

    steps:
      - id: foam
        text: "使用极其绵密的泡沫来洗脸"
        quote: "使用极其绵密的泡沫来洗脸"
      - id: order
        text: "洗脸顺序：额头 → 脸颊 → 鼻筋。在此过程中，尽量避免用手直接碰触脸部，只用泡沫轻轻打圈"
        quote: "洗脸顺序：额头 → 脸颊 → 鼻筋。在此过程中，尽量避免用手直接碰触脸部，只用泡沫轻轻打圈"
      - id: rinse
        text: "温水冲洗：用 32 到 34℃ 的温凉水冲洗脸部"
        quote: "温水冲洗：用 32 到 34℃ 的温凉水冲洗脸部"
      - id: dry
        text: "擦干方法：使用毛巾轻轻吸干脸部，不要来回擦动"
        quote: "擦干方法：使用毛巾轻轻吸干脸部，不要来回擦动"
      - id: moisturize
        text: "保湿：洗脸后务必使用保湿产品，如爽肤水和保湿霜"
        quote: "保湿：洗脸后务必使用保湿产品，如爽肤水和保湿霜"
      - id: lather-prep
        text: "先把手洗干净；手掌微微凹成小窝，盛取适量洁面乳"
        quote: "① 先把手洗干净；② 手掌微微凹成小窝，盛取适量洁面乳"
      - id: lather
        text: "搓到大致起泡；画圈带动周围空气混入；约 1 分 30 秒到 2 分钟搓出绵密的泡"
        quote: "③ 搓到大致起泡；④ 画圈带动周围空气混入；⑤ 约 1 分 30 秒到 2 分钟搓出绵密的泡"

    cautions:
      - level: info
        text: "早上不用洗面奶洗脸，会导致皮肤氧化，增加痤疮、炎症、老年斑和皱纹的风险"
        quote: "早上不用洗面奶洗脸，会导致皮肤氧化，增加痤疮、炎症、老年斑和皱纹的风险"
      - level: info
        text: "皮肤的保护脂质短则 6 小时就会开始氧化，因此需要及时清洁"
        quote: "皮肤的保护脂质短则 6 小时就会开始氧化，因此需要及时清洁"
      - level: info
        text: "温度过高：会洗掉保护皮肤的皮脂，导致干燥"
        quote: "温度过高：会洗掉保护皮肤的皮脂，导致干燥"
      - level: info
        text: "温度过低：同样会让细胞之间的结合松弛"
        quote: "温度过低：同样会让细胞之间的结合松弛"
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 5459da49c16570ea
    variants:
      busy:
        include:
          - foam
          - order
          - rinse
          - dry
          - moisturize
