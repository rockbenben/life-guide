  - id: lung-cancer-smoking-and-adenocarcinoma
    status: reviewed
    name: "不吸烟也会得的肺腺癌"
    source:
      anchor: "不吸烟的人也有：第 2 种肺癌「肺腺癌」"
    remind:
      text: "了解不吸烟者也可能患肺腺癌，以及肺癌的其他可能原因。"
      quote:
        - "「我不抽烟所以没关系」是说明书要打掉的核心误解。"
        - "除了香烟，说明书还列出被考虑为肺癌原因的有害化学物质、大气污染、女性激素，但也直说详细机制尚未解明，原因不明的病例很多。"
    steps:
      - id: unrelated-share
        text: "肺癌死亡中，约每 5 人有 2 人与香烟无关（说明书对女性的拆分更高，女性里约 63%）。"
        quote: "肺癌死亡中，约每 5 人有 2 人与香烟无关（说明书对女性的拆分更高，女性里约 63%）。"
      - id: female-split
        text: "具体比例：男女合计 60%「吸烟・被动吸烟」／40%「不能说与香烟有关」；只看女性，则是 37%／63%。"
        quote: "具体比例：男女合计 60%「吸烟・被动吸烟」／40%「不能说与香烟有关」；只看女性，则是 37%／63%。"
      - id: adenocarcinoma-frequency
        text: "它在肺癌里发生频率最高，占全体约一半，而且近年患者数在增加。"
        quote: "它在肺癌里发生频率最高，占全体约一半，而且近年患者数在增加。"
      - id: deep-and-metastasis
        text: "多数发生在肺的深处，从小就会转移，且自觉症状少。"
        quote: "多数发生在肺的深处，从小就会转移，且自觉症状少。"
      - id: location-effect
        text: "说明书解释了原因：肺是空气通道层层分支的迷宫结构；长在肺入口附近的癌（如扁平上皮癌）比较受烟影响，而长在肺的深处的癌（如肺腺癌）被认为受烟的影响较小。"
        quote: "说明书解释了原因：肺是空气通道层层分支的迷宫结构；长在肺入口附近的癌（如扁平上皮癌）比较受烟影响，而长在肺的深处的癌（如肺腺癌）被认为受烟的影响较小。"
      - id: other-causes
        text: "除了香烟，说明书还列出被考虑为肺癌原因的有害化学物质、大气污染、女性激素，但也直说详细机制尚未解明，原因不明的病例很多。"
        quote: "除了香烟，说明书还列出被考虑为肺癌原因的有害化学物质、大气污染、女性激素，但也直说详细机制尚未解明，原因不明的病例很多。"
      - id: study-basis
        text: "推算依据是说明书所引 Inoue M 等人的论文（Ann Oncol 2012;23:1362-1369）。"
        quote: "推算依据是说明书所引 Inoue M 等人的论文（Ann Oncol 2012;23:1362-1369）。"
    notices:
      - level: info
        text: "「我不抽烟所以没关系」是说明书要打掉的核心误解。"
        quote: "「我不抽烟所以没关系」是说明书要打掉的核心误解。"
    review:
      by: benson
      date: 2026-10-21
      hash: 360d983e3d13f3bb

  - id: lung-cancer-xray-double-reading
    status: draft
    name: "X 光的双重阅片"
    source:
      anchor: "「X 光太旧了」——日本有「双重阅片」"
    remind:
      text: "了解肺癌筛查的 X 线检查、读片方式和证据范围。"
      quote:
        - 国家推荐的肺癌检查主要是 X 线（胸部 X 线）检查
        - 由 2 名医生各自仔细判读影像的「双重阅片」被写进了国家基准。
        - 肺癌是日本死亡人数最多的癌症——可在一项街头调查里，「国家推荐的 5 种癌症筛查」中最不想去查的，恰恰就是肺癌筛查。
        - 判读影像的专业人员叫读片医生。为提高诊断精度，由 2 名医生各自仔细判读影像的「双重阅片」被写进了国家基准。
    steps:
      - id: common-concerns
        text: "不去查的人里，有一个常见的理由是「レントゲン能查出癌吗」「机器太旧了吧」。"
        quote: "不去查的人里，有一个常见的理由是「レントゲン能查出癌吗」「机器太旧了吧」。"
      - id: xray-method
        text: "国家推荐的肺癌检查主要是 X 线（胸部 X 线）检查，辐射影响相对少、非常短时间就结束。"
        quote: "国家推荐的肺癌检查主要是 X 线（胸部 X 线）检查，辐射影响相对少、非常短时间就结束。"
      - id: double-reading
        text: "判读影像的专业人员叫读片医生。由 2 名医生各自仔细判读影像的「双重阅片」被写进了国家基准。这是日本独有的制度。"
        quote:
          - "判读影像的专业人员叫读片医生。"
          - "由 2 名医生各自仔细判读影像的「双重阅片」被写进了国家基准。"
          - "这是日本独有的制度。"
      - id: evidence-scope
        text: "正因如此，「X 线肺癌筛查能降低死亡率」这样的数据，日本以外并没有。"
        quote: "正因如此，「X 线肺癌筛查能降低死亡率」这样的数据，日本以外并没有。"
    notices:
      - level: info
        text: "这是日本独有的制度。"
        quote: "这是日本独有的制度。"

  - id: lung-cancer-survival-statistics
    status: reviewed
    name: "早期与进展期的生存率"
    source:
      anchor: "「早期发现」到底差多少：说明书给的数字"
    remind:
      text: "比较早期与进展期肺癌的净生存率，并看清统计口径。"
      quote:
        - 早期发现（Ⅰ期）的 5 年净生存率：81.9%
        - 进展后发现（Ⅳ期）的 5 年净生存率：8.6%
        - 这份说明书只提供筛查指引，不是诊断或治疗建议。表里的对象年龄与间隔抄自国家指针，但每个自治体可能不同；「81.9%／8.6%」是肺癌的 5 年净生存率、且分母口径有限，不要当成自己做完筛查就能拿到的结果。该做哪些、间隔多久，请以所在市町村发放的通知为准，或直接问癌症筛查窗口；已有上面前述症状的，请先看医生，不要靠对照这张表自我判断。
    steps:
      - id: stage-comparison
        text: "早期发现（Ⅰ期）的 5 年净生存率：81.9%进展后发现（Ⅳ期）的 5 年净生存率：8.6%"
        quote:
          - "早期发现（Ⅰ期）的 5 年净生存率：81.9%"
          - "进展后发现（Ⅳ期）的 5 年净生存率：8.6%"
      - id: early-detection
        text: "「自觉症状少，所以早期的肺癌不做检查就几乎发现不了。」"
        quote: "「自觉症状少，所以早期的肺癌不做检查就几乎发现不了。」"
      - id: statistics-scope
        text: "这里的「生存率」指的是从诊断时起的 5 年净生存率（ネット・サバイバル），按通知自己的注脚，是只把该癌症本身算作死因来推算的数据出自国立癌症研究中心「院内癌症登录生存率集计」（2015 年诊断例）而且它只讲肺癌，不是所有癌症的通用数字。"
        quote:
          - "这里的「生存率」指的是从诊断时起的 5 年净生存率（ネット・サバイバル），按通知自己的注脚，是只把该癌症本身算作死因来推算的"
          - "数据出自国立癌症研究中心「院内癌症登录生存率集计」（2015 年诊断例）"
          - "而且它只讲肺癌，不是所有癌症的通用数字。"
