  - id: lung-cancer-screening-access
    status: reviewed
    name: "筛查通知与咨询窗口"
    source:
      anchor: "什么时候该去医院、该问谁"
    remind:
      text: "确认筛查通知、咨询窗口与后续检查安排。"
      quote:
        - 问所在市町村的癌症筛查窗口，或直接看市町村官网。
        - 筛查结果出来是「需进一步精密检查」
        - 随后务必去做精密检查
        - 这是那份随节目一起发放的肺癌筛查通知里的内容。它把两个阶段的差距摆成了饼图：
    steps:
      - id: ask-window
        text: "问所在市町村的癌症筛查窗口，或直接看市町村官网。"
        quote: "问所在市町村的癌症筛查窗口，或直接看市町村官网。"
      - id: missing-notice
        text: "即使这次没收到通知，很多市町村也会以某种形式向符合对象的人寄送筛查通知。"
        quote: "即使这次没收到通知，很多市町村也会以某种形式向符合对象的人寄送筛查通知。"
      - id: further-exam
        text: "筛查结果出来是「需进一步精密检查」按通知上的写法随后务必去做精密检查"
        quote:
          - "筛查结果出来是「需进一步精密检查」"
          - "按通知上的写法"
          - "随后务必去做精密检查"
      - id: project-info
        text: "说明书指向「希望之虹项目」。"
        quote:
          - 说明书指向「希望之虹项目」。
          - 想知道这套筛查的来龙去脉：说明书指向「希望之虹项目」。
