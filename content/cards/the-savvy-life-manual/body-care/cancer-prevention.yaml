  - id: lung-cancer-urgent-symptoms
    status: reviewed
    name: "出现警示症状尽快就医"
    source:
      anchor: "什么时候该去医院、该问谁"
    remind:
      text: "出现警示症状时尽快就医，不要等待下一次筛查。"
      quote:
        - "血痰、长期的咳嗽、胸痛、声音嘶哑、气短"
        - "不要等下一次筛查，直接去医院"
    steps:
      - id: no-wait
        text: "它没有列症状清单。因为肺癌初期几乎无症状，「等出现症状再去」这个策略本身就不成立。"
