  - id: iron-daily-three-mg-plan
    status: reviewed
    name: "每天补 3mg 铁"
    source:
      anchor: '每天补 3mg：一张可以照着点的铁活卡'
    # 原文是「吃饭时把主食换成高铁版本」加下午加餐 —— 跟着三餐走，不落某一段。
    slot: anytime
    remind:
      text: '早餐和晚餐把白米饭换成糙米饭，下午加餐吃烤红薯。'
      quote:
        - '早餐和晚餐的白米饭换成糙米饭：每碗从 0.15mg 升到 1mg，一天两碗净增约 1.7mg。'
        - '下午加餐吃一个烤红薯（200g）：再增 1.5mg。'
    dose:
      - value: 1
        unit: 碗
        what: '每碗白米饭换成糙米饭'
        quote: '早餐和晚餐的白米饭换成糙米饭：每碗从 0.15mg 升到 1mg，一天两碗净增约 1.7mg。'
      - value: 200
        unit: g
        what: '下午加餐的烤红薯份量'
        quote: '下午加餐吃一个烤红薯（200g）：再增 1.5mg。'
      - value: 1.5
        unit: mg
        what: '烤红薯的补铁量'
        quote: '下午加餐吃一个烤红薯（200g）：再增 1.5mg。'
      - value: 3.2
        unit: mg
        what: '一天合计补铁量'
        quote: '一天合计 +3.2mg，超过所需的 3mg。'
    steps:
      - id: replace-rice-with-brown-rice
        text: '早餐和晚餐的白米饭换成糙米饭：每碗从 0.15mg 升到 1mg，一天两碗净增约 1.7mg。'
        quote: '早餐和晚餐的白米饭换成糙米饭：每碗从 0.15mg 升到 1mg，一天两碗净增约 1.7mg。'
      - id: add-roasted-sweet-potato
        text: '下午加餐吃一个烤红薯（200g）：再增 1.5mg。'
        quote: '下午加餐吃一个烤红薯（200g）：再增 1.5mg。'
      - id: distinguish-iron-card-colors
        text: '红色＝血红素铁绿色＝非血红素铁黄色＝维生素 C'
        quote:
          - '红色＝血红素铁'
          - '绿色＝非血红素铁'
          - '黄色＝维生素 C'
      - id: pair-vitamin-c
        text: '黄色＝维生素 C帮非血红素铁吸收吃绿卡食物时配一张黄卡最划算'
        quote:
          - '黄色＝维生素 C'
          - '帮非血红素铁吸收'
          - '吃绿卡食物时配一张黄卡最划算'
    review:
      by: benson
      date: 2026-10-21
      hash: c5b088405a012b0b

  - id: iron-recommended-intake
    status: reviewed
    source:
      anchor: '推荐摄入量：补多少才算够'
    slot: anytime
    remind:
      text: '查看铁推荐摄入量，既避免不足，也避免过量。'
      quote: '人体内的铁会被高效循环利用，真正吸收和排出的量都不多。所以知道推荐摄入量很重要——既避免不足，也避免过量。'
    dose:
      - value: 10.5
        unit: mg
        what: '15～49 岁女性每日铁推荐量'
        quote: '15～49 岁女性的铁推荐量约 10.5mg。'
        approximate: true
    steps:
      - id: check-intake-table
        text: '日本铁推荐摄入量（mg）（日本人膳食营养素参考摄入量 2020 年版，厚生劳动省）'
        quote: '日本铁推荐摄入量（mg）（日本人膳食营养素参考摄入量 2020 年版，厚生劳动省）'
      - id: check-pregnancy-add-on
        text: '女性孕期与哺乳期在此基础上另加：'
        quote: '女性孕期与哺乳期在此基础上另加：'
    cautions:
      - level: with-doctor
        text: '贫血最常见的原因是「缺铁性贫血」。但也不排除其他原因——一旦被诊断为贫血，请咨询医生。'
        quote: '贫血最常见的原因是「缺铁性贫血」。但也不排除其他原因——一旦被诊断为贫血，请咨询医生。'
    segments:
      - id: adult-menstruating-intake
        when: [ age:adult, menstruating ]
        action:
          text: '查看女性月经期栏的铁推荐摄入量。'
          quote: '女性（月经期）'
        dose:
          text: '成年女性月经期每日铁推荐摄入量为 10.5～11mg。'
          quote:
            - '日本铁推荐摄入量（mg）'
            - '18～64 岁'
            - '10.5～11'
      - id: pregnancy-add-on
        when: [ pregnant ]
        action:
          text: '孕期与哺乳期在基础推荐摄入量上另加铁。'
          quote: '女性孕期与哺乳期在此基础上另加：'
        dose:
          text: '孕早期另加 2.5mg，孕中晚期另加 9.5mg。'
          quote:
            - '孕早期'
            - '+2.5mg'
            - '孕中晚期'
            - '+9.5mg'
        avoid:
          - text: '一旦被诊断为贫血，请咨询医生。'
            quote: '一旦被诊断为贫血，请咨询医生'
    review:
      by: AI（作者授权代签）
      date: 2026-10-28
      hash: 71d93f53d5162294
    name: 按年龄查每日铁推荐量

  - id: iron-overload-liver-safety
