  - id: stored-iron-role
    status: reviewed
    source:
      anchor: '贮藏铁：身体的备用铁仓库'
    slot: anytime
    remind:
      text: '出现肌肉疲乏无力、大脑烦躁失眠或肌肤干燥粗糙时，留意贮藏铁不足。'
      quote: '一旦「贮藏铁」不足，所有这些需要铁作原料的生命活动都会卡顿，身体各处便开始出现各种不适：肌肉疲乏无力、大脑烦躁失眠、肌肤干燥粗糙。'
    steps:
      - id: learn-hemoglobin-role
        text: '食物中的铁大部分进入血液，成为血红蛋白的原料，负责把氧气运到全身。'
        quote: '食物中的铁大部分进入血液，成为血红蛋白的原料，负责把氧气运到全身。'
      - id: learn-stored-iron-location
        text: '暂时用不上的铁，则以「贮藏铁」的形式主要储存在肝脏等部位。'
        quote: '暂时用不上的铁，则以「贮藏铁」的形式主要储存在肝脏等部位。'
      - id: learn-stored-iron-functions
        text: '肌肉的能量生产大脑的神经传导物质生成皮肤的生成'
        quote:
          - '肌肉的能量生产'
          - '大脑的神经传导物质生成'
          - '皮肤的生成'
      - id: watch-deficiency-symptoms
        text: '一旦「贮藏铁」不足，所有这些需要铁作原料的生命活动都会卡顿，身体各处便开始出现各种不适：肌肉疲乏无力、大脑烦躁失眠、肌肤干燥粗糙。'
        quote: '一旦「贮藏铁」不足，所有这些需要铁作原料的生命活动都会卡顿，身体各处便开始出现各种不适：肌肉疲乏无力、大脑烦躁失眠、肌肤干燥粗糙。'
