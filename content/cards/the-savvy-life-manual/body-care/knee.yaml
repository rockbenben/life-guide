  - id: knee-pain-three-ways
    status: reviewed
    source:
      anchor: 医生亲测的膝痛改善三招
    slot: anytime
    remind:
      text: 减重一成、每天 1 组缓负荷练膝、鞋里加外侧中垫。
      quote:
        - 体重减 1 成，疼痛就会缓和。
        - 抬起单脚保持 10 秒，然后放下休息 3 秒，注意让负荷落在大腿前侧。次数是每侧 10 次，每天至少做 1 组。
        - O 型腿的人，膝内侧受负担、软骨更容易磨损。放进外侧偏高的中垫可以减少膝上负担，走路也更顺。
    effect:
      text: 体重减 1 成，疼痛就会缓和。
      quote: 体重减 1 成，疼痛就会缓和。
    steps:
      - id: reduce-weight
        text: 所以对膝盖来说，减重才是最直接的近路——体重减 1 成，疼痛就会缓和。
        quote: 所以对膝盖来说，减重才是最直接的近路——体重减 1 成，疼痛就会缓和。
      - id: strength-lift-leg
        text: 抬起单脚保持 10 秒，然后放下休息 3 秒，注意让负荷落在大腿前侧。
        quote: 抬起单脚保持 10 秒，然后放下休息 3 秒，注意让负荷落在大腿前侧。
      - id: strength-rest
        text: 放下休息 3 秒
        quote: 放下休息 3 秒
      - id: strength-repeat
        text: 次数是每侧 10 次，每天至少做 1 组。
        quote: 次数是每侧 10 次，每天至少做 1 组。
      - id: add-wedge-insole
        text: 放进外侧偏高的中垫可以减少膝上负担，走路也更顺。
        quote: 放进外侧偏高的中垫可以减少膝上负担，走路也更顺。
      - id: make-insured-insole
        text: 这种鞋垫可以在医疗机构用保险制作。
        quote: 这种鞋垫可以在医疗机构用保险制作。
    cautions:
      - level: with-doctor
        text: 疼得厉害时请先到整形外科就诊。
        quote: 疼得厉害时请先到整形外科就诊。
      - level: stop
        text: 膝盖发热或疼痛明显时不要做。
        quote: 膝盖发热或疼痛明显时不要做。
      - level: with-doctor
        text: 疼得厉害时请先到整形外科就诊。
        quote: 疼得厉害时请先到整形外科就诊。
      - level: with-doctor
        text: 疼得厉害时请先到整形外科就诊。
        quote: 疼得厉害时请先到整形外科就诊。
