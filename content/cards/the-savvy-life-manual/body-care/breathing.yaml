    steps:
      - id: shoulder-circle-lift
        text: "双脚打开与肩同宽。吸气：抬起双肩，用鼻子深深吸气。呼气：放下双肩，用嘴缓缓呼气。要点：像画圆一样转动肩膀（大幅回转）。"
        quote:
          - "双脚打开与肩同宽。"
          - "①吸气：抬起双肩，用鼻子深深吸气。"
          - "②呼气：放下双肩，用嘴缓缓呼气。"
          - "要点：像画圆一样转动肩膀（大幅回转）。"
        images:
          - "https://img.newzone.top/20261016065629012.jpeg?imageMogr2/format/webp"
      - id: inhale-stretch-left-right
        text: "双脚打开与肩同宽。吸气：头向一侧倒，对侧的手朝斜下方伸展，同时深深吸气。呼气：缓缓吐气，同时回到原位。要点：这个动作左右两边都要做。"
        quote:
          - "双脚打开与肩同宽。"
          - "①吸气：头向一侧倒，对侧的手朝斜下方伸展，同时深深吸气。"
          - "②呼气：缓缓吐气，同时回到原位。"
          - "要点：这个动作左右两边都要做。"
        images:
          - "https://img.newzone.top/20261016065629451.jpeg?imageMogr2/format/webp"
      - id: inhale-stretch-rounded-back
        text: "双脚打开与肩同宽。吸气：双手在身前十指交叉，边把背部弓成圆形边深深吸气。呼气：缓缓吐气，同时回到原位。"
        quote:
          - "双脚打开与肩同宽。"
          - "①吸气：双手在身前十指交叉，边把背部弓成圆形边深深吸气。"
          - "②呼气：缓缓吐气，同时回到原位。"
      - id: exhale-stretch-chest-open
        text: "双脚打开与肩同宽。呼气：双手在腰后交叉伸展，边挺起胸膛边缓缓呼气。吸气：缓缓吸气，同时回到原位。要点：让肩胛骨向身体中线靠拢。"
        quote:
          - "双脚打开与肩同宽。"
          - "①呼气：双手在腰后交叉伸展，边挺起胸膛边缓缓呼气。"
          - "②吸气：缓缓吸气，同时回到原位。"
          - "要点：让肩胛骨向身体中线靠拢。"
        images:
          - "https://img.newzone.top/20261016065629829.jpeg?imageMogr2/format/webp"
    cautions:
