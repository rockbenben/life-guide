  - id: exercise-triggered-food-allergy
    status: reviewed
    name: "饭后运动的危险窗口"
    source:
      anchor: "饭后 2～4 小时：运动的危险窗口"
    remind:
      text: "饭后要运动就不要吃小麦；饭后不运动，小麦可以照常吃。"
      quote:
        - "如果饭后要运动 → 不要吃小麦"
        - "如果饭后不运动 → 小麦可以照常吃"
    steps:
      - id: recognize-exercise-trigger
        text: "光吃了没事，一运动就发病食物依赖性运动诱发过敏性休克"
        quote:
          - "光吃了没事，一运动就发病"
          - "食物依赖性运动诱发过敏性休克"
      - id: exercise-load-test
        text: "一种是在跑步机上进行的运动负荷试验，先吃下作为过敏原的食物，再真的动起来，确认会不会出现症状"
        quote: "一种是在跑步机上进行的运动负荷试验，先吃下作为过敏原的食物，再真的动起来，确认会不会出现症状"
      - id: note-other-triggers
        text: "这些因素同样容易诱发过敏：压力、疲劳、酒精、止痛药、睡眠不足、洗澡"
        quote: "这些因素同样容易诱发过敏：压力、疲劳、酒精、止痛药、睡眠不足、洗澡"
    cautions:
      - level: info
        text: "饭后 2～4 小时内运动，可能会出现症状"
        quote: "饭后 2～4 小时内运动，可能会出现症状"
    notices:
      - level: with-doctor
        text: "担心的话请直接咨询过敏专科医生"
        quote: "担心的话请直接咨询过敏专科医生"
      - level: info
        text: "它需要多名能随时应急处置的医生在场，能做这个检查的机构很少"
        quote: "它需要多名能随时应急处置的医生在场，能做这个检查的机构很少"
