  - id: pollen-food-cross-reactivity
    status: reviewed
    source:
      anchor: "躲开花粉，同时也是躲开食物过敏"
    remind:
      text: "食物过敏可能由花粉引起；花粉和果蔬的蛋白质有相似片段，免疫系统会把两者混淆。"
      quote: "元凶是食物过敏由花粉引起。原因在于花粉和果蔬的蛋白质有相似片段，免疫系统两边都会误判。"
    steps:
      - id: tree-pollen-foods
        text: "苹果、桃、樱桃、大豆、猕猴桃 ← 4～6 月与1～6 月开花树木的花粉"
        quote: "苹果、桃、樱桃、大豆、猕猴桃 ← 4～6 月与1～6 月开花树木的花粉"
      - id: grass-pollen-foods
        text: "甜瓜、西瓜 ← 一种禾本科杂草（5～6 月）的花粉"
        quote: "甜瓜、西瓜 ← 一种禾本科杂草（5～6 月）的花粉"
      - id: ragweed-pollen-foods
        text: "甜瓜、西瓜 ← 豚草（8～10 月）的花粉"
        quote: "甜瓜、西瓜 ← 豚草（8～10 月）的花粉"
      - id: mugwort-pollen-foods
        text: "芹菜、芒果 ← 艾草（8～10 月）的花粉"
        quote: "芹菜、芒果 ← 艾草（8～10 月）的花粉"
      - id: cedar-pollen-foods
        text: "番茄 ← 柳杉、丝杉（2～4 月）的花粉"
        quote: "番茄 ← 柳杉、丝杉（2～4 月）的花粉"
    cautions:
      - level: info
        text: "柳杉、丝杉花粉过敏的人，吃番茄可能出事"
        quote: "柳杉、丝杉花粉过敏的人，吃番茄可能出事"
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: bedb56891d4b75da
    name: 花粉和食物会交叉过敏

  - id: pollen-season-prevention
    status: reviewed
    source:
      anchor: "躲开花粉，同时也是躲开食物过敏"
    remind:
      text: "别把房间的窗户一直开着认真戴口罩"
      quote:
        - 别把房间的窗户一直开着
        - 认真戴口罩
        - 这份说明书的主线只有一句：食物过敏的起因，未必是「吃」。能直接照做的有三件：花粉季别把房间的窗户一直开着、认真戴口罩；饭后要运动就别吃小麦，不运动就照常吃（危险窗口在饭后 2～4 小时）；以及日本专门的过敏专科医生检索网站和一份不含蛋、奶、小麦粉的玛德琳风蛋糕配方。^[「食物アレルギー」のトリセツ]
    effect:
      text: "由花粉引起的食物过敏，有可能通过不碰花粉、不吸入花粉来不让症状恶化目前还没有食物过敏的人，也可能因此得到预防"
      quote:
        - "由花粉引起的食物过敏，有可能通过不碰花粉、不吸入花粉来不让症状恶化"
        - "目前还没有食物过敏的人，也可能因此得到预防"
    steps:
      - id: keep-window-closed
        text: "别把房间的窗户一直开着"
        quote:
          - 别把房间的窗户一直开着
          - 这份说明书的主线只有一句：食物过敏的起因，未必是「吃」。能直接照做的有三件：花粉季别把房间的窗户一直开着、认真戴口罩；饭后要运动就别吃小麦，不运动就照常吃（危险窗口在饭后 2～4 小时）；以及日本专门的过敏专科医生检索网站和一份不含蛋、奶、小麦粉的玛德琳风蛋糕配方。^[「食物アレルギー」のトリセツ]
      - id: wear-mask
        text: "认真戴口罩"
        quote: "认真戴口罩"
    notices:
      - level: with-doctor
        text: "症状改善存在个人差异，务必遵过敏专科医生的指导。"
        quote: "症状改善存在个人差异，务必遵过敏专科医生的指导。"
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 9a1c8f172f872b11
    name: 花粉季关窗戴口罩

