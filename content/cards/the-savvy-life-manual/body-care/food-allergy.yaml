  - id: non-oral-allergy-routes
    status: reviewed
    name: "不经口的过敏通路"
    source:
      anchor: "四种「不是吃了」的过敏通路"
    remind:
      text: "致敏原来自肌肉和黏膜的接触，而不是消化道"
      quote: "致敏原来自肌肉和黏膜的接触，而不是消化道"
    steps:
      - id: tick-and-meat
        text: "牛肉、猪肉被蜱虫叮咬养狗的人"
        quote:
          - "牛肉、猪肉"
          - "被蜱虫叮咬"
          - "养狗的人"
      - id: feather-and-poultry
        text: "鸡肉、鸡蛋吸入了羽毛养鹦鹉的人"
        quote:
          - "鸡肉、鸡蛋"
          - "吸入了羽毛"
          - "养鹦鹉的人"
      - id: latex-and-fruit
        text: "牛油果、香蕉使用乳胶手套医护人员"
        quote:
          - "牛油果、香蕉"
          - "使用乳胶手套"
          - "医护人员"
      - id: jellyfish-and-natto
        text: "纳豆被水母蜇到冲浪者、潜水者"
        quote:
          - "纳豆"
          - "被水母蜇到"
          - "冲浪者、潜水者"
    notices:
      - level: info
        text: "蜱虫唾液里的过敏原与牛猪肉的过敏原有相似结构羽毛里的过敏原与蛋、鸡肉的过敏原同理天然乳胶手套里的过敏原与香蕉、牛油果的过敏原形似水母的毒刺里含有聚γ-谷氨酸，而纳豆黏滑的主要成分也是聚γ-谷氨酸——所以被蜇过一次的人，之后吃纳豆免疫就会误判"
        quote:
          - "蜱虫唾液里的过敏原与牛猪肉的过敏原有相似结构"
          - "羽毛里的过敏原与蛋、鸡肉的过敏原同理"
          - "天然乳胶手套里的过敏原与香蕉、牛油果的过敏原形似"
          - "水母的毒刺里含有聚γ-谷氨酸，而纳豆黏滑的主要成分也是聚γ-谷氨酸——所以被蜇过一次的人，之后吃纳豆免疫就会误判"
      - level: info
        text: "上表列的原因不必然导致过敏，表中的食物也只是代表品，实际情况可能不同"
        quote: "上表列的原因不必然导致过敏，表中的食物也只是代表品，实际情况可能不同"
    review:
      by: benson
