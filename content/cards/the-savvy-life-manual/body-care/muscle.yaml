coverage: complete
ignore:
  sections:
    - anchor: "40 岁后腿脚没劲、肌肉流失？每周 60 分钟稍快走"
      reason: "导语主要是肌肉流失、疾病风险等背景概述；其中重复的稍快走处方已由稍快走训练卡和动作要领卡覆盖。"
    - anchor: "40 岁，是肌肉的分水岭"
      reason: "说明年龄相关肌肉量下降及疾病风险，没有可独立执行的动作，按背景知识不抽卡。"
    - anchor: "流失的偏偏是最该保住的「速肌」"
      reason: "解释慢肌、速肌及年龄衰减机制；其需要增加负荷的可执行结论已并入稍快走卡。"
    - anchor: "为什么走得快，负荷就更大"
      reason: "用可视化实验解释快走负荷更大的原因；速度与自检要求已在稍快走动作要领卡中表达，无需单列原理卡。"
  images: []
