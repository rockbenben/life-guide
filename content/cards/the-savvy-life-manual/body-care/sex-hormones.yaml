  - id: contraceptive-risks
    status: reviewed
    source:
      anchor: 低剂量避孕药的副作用与风险
    remind:
      text: 开始服药时约 3 成会出现恶心、浮肿、头痛、异常出血，多数几周至 3 个月内消退；另要留意血栓、癌症风险与将来怀孕。
      quote:
        - 开始服用时，约3 成会出现恶心、浮肿、头痛、异常出血等，但多数会在几天至 3 个月内消退；
        - 服用者每万人 3～9 人，未服用者为 1～5 人。
        - ⚠️ 年龄提示：血栓风险随年龄上升。因此40 岁以上需与医生商讨（慎重投药），50 岁以上原则上不使用。不受年龄限制的替代选项是**「黄体激素制剂」**。
        - 但说明书引述的数据是，停药 5 年以后会回到与未服药者相同的水平。
        - 低剂量避孕药的问答由东京齿科大学市川综合医院妇产科准教小川真理子医师担任监修。
        - 说明书认为激素制剂的服用不影响将来的怀孕，并给出两项调查：
