    status: reviewed
    source:
      anchor: 用法与费用
    remind:
      text: 周期给药与连续给药都要与医生商讨；除药物外还有宫内黄体激素释放系统；确诊月经困难症后适用医保。
      quote:
        - 周期给药：约服用 3 周，停药约 1 周，如此循环；
        - 连续服用 5 年以上为 1.9 倍
