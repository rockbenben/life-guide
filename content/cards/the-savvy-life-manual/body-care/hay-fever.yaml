cards:
  - id: early-medication
    status: reviewed
    name: "花粉过敏提前用药"
    source:
      anchor: '花粉过敏别等症状：提前用药平均改善 54%'
    remind:
      text: '花粉飞散前或症状刚出现时先处理，不要等症状变重；用药前咨询药剂师或医生'
      quote:
        - '说明书把这一点直接称为铁则：预防发作和防止重症化，首选是在花粉飞散前、症状刚出现时就用药，而不是等症状变重。'
        - '用药是否适合提前开始、具体怎么服用，请先咨询药剂师或医生。'
    effect:
      text: '国内针对提前用药效果的研究显示，花粉过敏的各项症状平均改善 54%，多篇论文认可，指南也推荐。'
      quote: '国内针对提前用药效果的研究显示，花粉过敏的各项症状平均改善 54%，多篇论文认可，指南也推荐。'
    steps:
      - id: act-before-severity
        text: '预防发作和防止重症化，首选是在花粉飞散前、症状刚出现时就用药，而不是等症状变重。用药是否适合提前开始、具体怎么服用，请先咨询药剂师或医生。'
        quote:
          - '预防发作和防止重症化，首选是在花粉飞散前、症状刚出现时就用药，而不是等症状变重。'
          - '用药是否适合提前开始、具体怎么服用，请先咨询药剂师或医生。'
    notices:
      - level: with-doctor
        text: '并非所有花粉过敏的药都适合提前使用请咨询药剂师或医生，并严格遵守用法用量。'
        quote:
          - '并非所有花粉过敏的药都适合提前使用'
          - '请咨询药剂师或医生，并严格遵守用法用量。'
