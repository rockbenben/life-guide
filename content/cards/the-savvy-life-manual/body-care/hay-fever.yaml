  - id: early-histamine-action
    status: reviewed
    source:
      anchor: '关键在"早"：组胺要抢"座位"'
    remind:
      text: '组胺与受体结合后可引起打喷嚏、流鼻涕；为避免重症化应尽早用药'
      quote:
        - '花粉的变应原进到体内后，会扮演 SOS 信号，和组胺及其受体结合，于是出现打喷嚏、流鼻涕这类症状。'
        - '要避免重症化，重要的是阻止组胺和受体结合，办法就是尽早用药。'
    steps:
      - id: recognize-histamine-symptoms
        text: '花粉的变应原进到体内后，会扮演 SOS 信号，和组胺及其受体结合，于是出现打喷嚏、流鼻涕这类症状。'
        quote: '花粉的变应原进到体内后，会扮演 SOS 信号，和组胺及其受体结合，于是出现打喷嚏、流鼻涕这类症状。'
      - id: block-histamine-receptor
        text: '要避免重症化，重要的是阻止组胺和受体结合，办法就是尽早用药。'
        quote: '要避免重症化，重要的是阻止组胺和受体结合，办法就是尽早用药。'
      - id: preoccupy-receptor
        text: '而在花粉飞散之前就吃药，药物成分会先和受体结合，把位置占住，组胺就结合不上去。'
        quote: '而在花粉飞散之前就吃药，药物成分会先和受体结合，把位置占住，组胺就结合不上去。'
    notices:
      - level: info
        text: '症状严重时，是组胺已经占了受体这张"座位"；而在花粉飞散之前就吃药，药物成分会先和受体结合，把位置占住，组胺就结合不上去。'
        quote: '症状严重时，是组胺已经占了受体这张"座位"；而在花粉飞散之前就吃药，药物成分会先和受体结合，把位置占住，组胺就结合不上去。'
    review:
      by: AI（作者授权代签）
