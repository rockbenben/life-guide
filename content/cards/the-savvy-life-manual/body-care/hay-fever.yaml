  - id: pollen-barrier-mask
    status: reviewed
    name: "用口罩挡花粉"
    source:
      anchor: '花粉挡住：15 位医生的票选，以及口罩里加一层'
    remind:
      text: '优先用口罩避粉，并可在口罩里加一层过滤材料'
      quote:
        - 为了缓解症状、推迟发病，避开花粉本身很重要。
        - 排在第 1 位的口罩还可以再加一层。
        - 排在第 1 位的口罩还可以再加一层。普通不织布口罩大约能减少 70% 的花粉侵入；说明书介绍了环境省也推荐的内层口罩做法，作用是把花粉侵入压到 99%。做法是用不织布口罩叠一层过滤材料：
    effect:
      text: '普通不织布口罩大约能减少 70% 的花粉侵入；说明书介绍了环境省也推荐的内层口罩做法，作用是把花粉侵入压到 99%。'
      quote: '普通不织布口罩大约能减少 70% 的花粉侵入；说明书介绍了环境省也推荐的内层口罩做法，作用是把花粉侵入压到 99%。'
    dose:
      - value: 2
        unit: 枚
        what: 纱布用量
        quote: '准备的东西是：不织布口罩、纱布 2 枚、棉。'
    steps:
      - id: rank-avoidance-methods
        text: '说明书请以"把花粉重症化降到零"为目标的医疗团队里的 15 位医生投票，问哪种避粉方法最有效，排序如下：口罩花粉多的日子减少外出收进室内的衣物先抖掉花粉进家门之前先抖掉身上的花粉洗鼻'
        quote:
          - '说明书请以"把花粉重症化降到零"为目标的医疗团队里的 15 位医生投票，问哪种避粉方法最有效，排序如下：'
          - '口罩'
          - '花粉多的日子减少外出'
          - '收进室内的衣物先抖掉花粉'
          - '进家门之前先抖掉身上的花粉'
          - '洗鼻'
      - id: shake-pollen-before-entry
        text: '节目实测了第 3、4 两条：先抖掉花粉再进屋、先抖掉花粉再收衣物，确实能减少带入室内的花粉。'
        quote: '节目实测了第 3、4 两条：先抖掉花粉再进屋、先抖掉花粉再收衣物，确实能减少带入室内的花粉。'
      - id: add-mask-filter
        text: '做法是用不织布口罩叠一层过滤材料：'
        quote: '做法是用不织布口罩叠一层过滤材料：'
      - id: place-inner-gauze
        text: '先在口罩里放 1 枚纱布，防止材料露出来'
        quote: '先在口罩里放 1 枚纱布，防止材料露出来'
      - id: wrap-cotton-filter
        text: '把棉叠好，再用另一枚纱布裹住'
        quote: '把棉叠好，再用另一枚纱布裹住'
      - id: position-filter
        text: '把裹好的这一块放在口罩鼻孔对应的位置'
        quote: '把裹好的这一块放在口罩鼻孔对应的位置'
      - id: adjust-cotton-thickness
        text: '觉得呼吸困难时，可以把棉的厚度减半之类的调整。'
        quote: '觉得呼吸困难时，可以把棉的厚度减半之类的调整。'
    notices:
      - level: info
        text: '觉得呼吸困难时，可以把棉的厚度减半之类的调整。'
        quote: '觉得呼吸困难时，可以把棉的厚度减半之类的调整。'
