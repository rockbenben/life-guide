  - id: skin-pollen-barrier
    status: draft
    source:
      anchor: '没打喷嚏，皮肤也可能中招'
    remind:
      text: '出现皮肤不适时，用面霜或粉底形成外层屏障，并靠日常护肤维持内层屏障'
      quote:
        - 外层屏障：用面霜或粉底覆盖，防止花粉附着在皮肤上
        - 内层屏障：靠日常护肤让皮肤保持健康，减少花粉侵入
        - 花粉过敏最麻烦的地方不是发作起来有多难受，而是你总在症状已经变重之后才开始处理。说明书把这一点直接称为铁则：预防发作和防止重症化，首选是在花粉飞散前、症状刚出现时就用药，而不是等症状变重。这一篇讲清它的机制，以及说明书给出的避粉动作和就医指征。^[「花粉症」のトリセツ]
    steps:
      - id: outer-skin-barrier
        text: '外层屏障：用面霜或粉底覆盖，防止花粉附着在皮肤上'
        quote: '外层屏障：用面霜或粉底覆盖，防止花粉附着在皮肤上'
      - id: inner-skin-barrier
        text: '内层屏障：靠日常护肤让皮肤保持健康，减少花粉侵入'
        quote: '内层屏障：靠日常护肤让皮肤保持健康，减少花粉侵入'
    notices:
      - level: info
        text: '即使没有花粉过敏，皮肤问题也可能由花粉引起。'
        quote: '即使没有花粉过敏，皮肤问题也可能由花粉引起。'
      - level: seek-care
        text: '如果伴随过度发红或干燥，建议到皮肤科就诊。'
        quote: '如果伴随过度发红或干燥，建议到皮肤科就诊。'
    name: 花粉也会让皮肤过敏

