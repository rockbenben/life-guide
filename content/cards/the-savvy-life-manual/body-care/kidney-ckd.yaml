    name: 口渴就补水，别等

  - id: kidney-egfr-trend
    status: reviewed
    name: "用 eGFR 看肾功能趋势"
    source:
      anchor: '用 eGFR 把肾功能「看见」'
    remind:
      text: '用血液检查中的 eGFR 观察肾功能长期趋势，不要只看单次数值。'
      quote:
        - 'eGFR 属于血液检查项目，多数体检单上会有。'
        - '单次数值意义有限，要看长期走势：'
    steps:
      - id: read-egfr
        text: '它标示过滤血液的肾小球还剩下百分之多少的功能'
        quote: '它标示过滤血液的肾小球还剩下百分之多少的功能'
      - id: calculate-egfr
        text: '万一没有这一项，也可以只用「肌酐值 + 年龄」推算出来。'
        quote: '万一没有这一项，也可以只用「肌酐值 + 年龄」推算出来。'
      - id: creatinine-check
        text: '肌酐本身是 40～74 岁人群特定体检的推荐项目'
        quote: '肌酐本身是 40～74 岁人群特定体检的推荐项目'
      - id: example-result
        text: '一份体检单上肌酐 0.84 mg/dl、eGFR 90.2 ml/min/1.73m²。'
        quote: '一份体检单上肌酐 0.84 mg/dl、eGFR 90.2 ml/min/1.73m²。'
      - id: urine-protein
        text: '尿蛋白是和 eGFR 并列的重要项目。'
        quote: '尿蛋白是和 eGFR 并列的重要项目。'
      - id: read-trend
        text: 'eGFR 从 50 多岁、60 多岁开始，一年大约下降 0.8～1.0。如果下降速度比这更快，就意味着肾功能可能正在恶化。'
        quote:
          - 'eGFR 从 50 多岁、60 多岁开始，一年大约下降 0.8～1.0。'
          - '如果下降速度比这更快，就意味着肾功能可能正在恶化。'
      - id: local-monitoring
        text: '熊本市从 2009 年就开始推进慢性肾病对策在体检等场合调查肾功能时把 eGFR 列出来岐阜县从 2022 年开始，把 eGFR 的历年变化做成图表让患者一起看。'
        quote:
          - '熊本市从 2009 年就开始推进慢性肾病对策'
          - '在体检等场合调查肾功能时把 eGFR 列出来'
          - '岐阜县从 2022 年开始，把 eGFR 的历年变化做成图表让患者一起看。'
      - id: local-outcomes
        text: '一旦 eGFR 或尿检结果不好，基层医生就把患者介绍给肾脏专科医生，形成了一套机制新发透析患者的增长因此被压住了。患者的意识发生了变化，主动去改善生活习惯的人正在增加。'
        quote:
          - '一旦 eGFR 或尿检结果不好，基层医生就把患者介绍给肾脏专科医生，形成了一套机制'
          - '新发透析患者的增长因此被压住了。'
          - '患者的意识发生了变化，主动去改善生活习惯的人正在增加。'
    notices:
      - level: info
        text: '如果下降速度比这更快，就意味着肾功能可能正在恶化。'
        quote: '如果下降速度比这更快，就意味着肾功能可能正在恶化。'
    review:
      by: benson
      date: 2026-10-22
      hash: daf25e96d18caa4e

  - id: kidney-egfr-early-table
    status: reviewed
    source:
      # 草稿把「早见表」写成了「早发表」，这里指回快照里的真实小节标题
      anchor: 'eGFR 早见表怎么查'
    remind:
      text: '用年龄和血清肌酐值查 eGFR，再对照分级决定是否找家庭医生。'
      quote:
        - '横轴是年龄、纵轴是血清肌酐值，交叉点的数字就是 eGFR'
        - '对照下面的分级，就能知道该做什么：'
    steps:
      - id: read-table-axes
        text: '横轴是年龄、纵轴是血清肌酐值，交叉点的数字就是 eGFR（单位 ml/min/1.73m²）。'
        quote: '横轴是年龄、纵轴是血清肌酐值，交叉点的数字就是 eGFR（单位 ml/min/1.73m²）。'
      - id: table-age-limit
        text: '这张表适用于 18 岁以上，不能用于小儿。'
        quote: '这张表适用于 18 岁以上，不能用于小儿。'
      - id: interpolate-egfr
        text: '如果年龄和肌酐值不是正好落在某一条线上，就取相邻两格数字之间的范围：'
        quote: '如果年龄和肌酐值不是正好落在某一条线上，就取相邻两格数字之间的范围：'
      - id: example-egfr
        text: '女性、40 岁、肌酐 0.61 mg/dleGFR 在 73.5～87.0 之间男性、36 岁、肌酐 0.77 mg/dleGFR 在 85.9～103.3 之间'
