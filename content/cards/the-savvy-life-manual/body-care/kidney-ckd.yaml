  - id: kidney-doctor-thresholds
    status: reviewed
    name: "什么时候找肾脏专科"
    source:
      anchor: '什么时候该去找专科医生'
    remind:
      text: '符合任一 eGFR 或尿蛋白条件时先找家庭医生，确诊后由家庭医生介绍肾脏专科医生。'
      quote:
        - '符合以下任意一条，先找家庭医生'
        - '确诊肾病之后，再由家庭医生介绍肾脏专科医生，两者协作治疗：'
    steps:
      - id: check-egfr-threshold
        text: 'eGFR 在 44 以下（未满 60 岁的人为 59 以下）'
        quote: 'eGFR 在 44 以下（未满 60 岁的人为 59 以下）'
      - id: check-protein-threshold
        text: '尿蛋白为 ＋，或者连续两年达到 ± 以上（±、＋、＋＋、＋＋＋，不含 −）'
        quote: '尿蛋白为 ＋，或者连续两年达到 ± 以上（±、＋、＋＋、＋＋＋，不含 −）'
      - id: treat-underlying-disease
        text: '在医生指导下正确用药，控制糖尿病、高血压运动和饮食等生活习惯的改善也非常有效。'
        quote:
          - '在医生指导下正确用药，控制糖尿病、高血压'
          - '运动和饮食等生活习惯的改善也非常有效。'
    notices:
      - level: seek-care
        text: '符合以下任意一条，先找家庭医生'
        quote: '符合以下任意一条，先找家庭医生'
      - level: with-doctor
        text: '务必先问过主治医生在医生指导下正确用药，控制糖尿病、高血压'
        quote:
          - '务必先问过主治医生'
          - '在医生指导下正确用药，控制糖尿病、高血压'
    review:
      by: benson
