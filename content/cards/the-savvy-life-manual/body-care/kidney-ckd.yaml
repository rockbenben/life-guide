  - id: kidney-dehydration-hypoxia
    status: reviewed
    source:
      anchor: '新认识：脱水，就是肾脏缺氧'
    remind:
      text: '脱水会让肾脏血流量和氧量下降，持续脱水会降低过滤功能。'
      quote:
        - '一旦身体进入脱水状态，流经肾脏的血流量下降，被血液带进来的氧气量也随之减少。'
        - '脱水持续下去，肾组织被破坏、过滤功能随之下降。'
    steps:
      - id: risk-factors
        text: '糖尿病、高血压、肥胖、吸烟脱水导致的肾功能下降'
        quote:
          - '糖尿病、高血压、肥胖、吸烟'
          - '脱水导致的肾功能下降'
      - id: oxygen-mechanism
        text: '肾脏在过滤血液、制造尿液的过程中，会消耗大量氧气，因此天生就容易「缺氧」。'
        quote: '肾脏在过滤血液、制造尿液的过程中，会消耗大量氧气，因此天生就容易「缺氧」。'
      - id: glomeruli
        text: '一个肾脏里就有约 100 万个'
        quote: '一个肾脏里就有约 100 万个'
      - id: oxygen-signal
        text: '脱水状态下肾脏的平均氧浓度信号为 50.9，补水 40 分钟后升到 55.0。'
        quote: '脱水状态下肾脏的平均氧浓度信号为 50.9，补水 40 分钟后升到 55.0。'
      - id: global-pattern
        text: '患者多数是在炎热环境中劳作的农业从业者脱水被认为是主因之一'
        quote:
          - '患者多数是在炎热环境中劳作的农业从业者'
          - '脱水被认为是主因之一'
      - id: summer-hydration
        text: '夏天尤其要当心脱水。而老年人往往察觉不到口渴正在接受高血压治疗的人也是如此这两类人必须主动补水。'
        quote:
          - '夏天尤其要当心脱水。'
          - '而老年人往往察觉不到口渴'
          - '正在接受高血压治疗的人也是如此'
          - '这两类人必须主动补水。'
    notices:
      - level: with-doctor
        text: '夏季 eGFR 会急剧下降，并以此为起点让肾功能进一步恶化。'
        quote: '夏季 eGFR 会急剧下降，并以此为起点让肾功能进一步恶化。'
      - level: info
        text: '脱水被认为是主因之一'
        quote: '脱水被认为是主因之一'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: a3f27453ad7154dc
    name: 脱水就是肾脏缺氧
