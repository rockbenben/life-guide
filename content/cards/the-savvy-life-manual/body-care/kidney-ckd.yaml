  - id: kidney-cardio-cognition-risk
    status: reviewed
    source:
      anchor: '肾脏坏了，会连累心血管和认知'
    remind:
      text: '肾功能轻微下降也会增加心脏病、脑卒中和痴呆风险。'
      quote: '只要肾功能出现轻微下降，心脏病、脑卒中和痴呆的风险就会上升。'
    steps:
      - id: kidney-to-urine
        text: '把血液里的老废物和毒素过滤掉、做成尿。'
        quote: '把血液里的老废物和毒素过滤掉、做成尿。'
      - id: dialysis-schedule
        text: '一旦它坏掉，就需要人工透析——每周 3 次、每次 4～5 小时，把血液一遍遍滤过。'
        quote: '一旦它坏掉，就需要人工透析——每周 3 次、每次 4～5 小时，把血液一遍遍滤过。'
      - id: compare-risk
        text: '患心脏病或脑卒中的风险约为普通人的 3 倍患痴呆的风险为 1.7～2.6 倍'
        quote:
          - '患心脏病或脑卒中的风险约为普通人的 3 倍'
          - '患痴呆的风险为 1.7～2.6 倍'
    notices:
      - level: seek-care
        text: '一旦它坏掉，就需要人工透析'
        quote: '一旦它坏掉，就需要人工透析'
