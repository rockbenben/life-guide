  - id: kidney-hydration-on-thirst
    status: reviewed
    source:
      anchor: '夏天怎么喝水：两个要点'
    remind:
      text: '口渴时立即补水；轻至中度慢性肾病患者按每日饮水目标补水，限水人群先问过主治医生。'
      quote:
        - '一感觉到口渴，不要放着不管，必须马上补水。'
        - '对于轻至中度慢性肾病患者，诊疗指南给出的每日饮水目标是 1～1.5L。'
        - '注意：以下人群可能需要限制饮水，务必先问过主治医生。'
    steps:
      - id: drink-at-once
        text: '一感觉到口渴，不要放着不管，必须马上补水。'
        quote: '一感觉到口渴，不要放着不管，必须马上补水。'
      - id: choose-drink
        text: '茶水等不含糖分的饮料也可以。酒精不行。'
        quote:
          - '茶水等不含糖分的饮料也可以。'
          - '酒精不行。'
      - id: target-intake
        text: '对于轻至中度慢性肾病患者，诊疗指南给出的每日饮水目标是 1～1.5L。'
        quote: '对于轻至中度慢性肾病患者，诊疗指南给出的每日饮水目标是 1～1.5L。'
      - id: proactive-intake
        text: '慢性肾病患者、平时没有喝水习惯的人、高龄者、有中暑风险的人更要主动喝'
        quote: '慢性肾病患者、平时没有喝水习惯的人、高龄者、有中暑风险的人更要主动喝'
    notices:
      - level: with-doctor
        text: '注意：以下人群可能需要限制饮水，务必先问过主治医生。'
        quote: '注意：以下人群可能需要限制饮水，务必先问过主治医生。'
      - level: info
        text: '健康人靠喝水能把肾功能下降防到什么程度，目前还不清楚从长期眼光看，把补水变成习惯是有意义的'
        quote:
          - '健康人靠喝水能把肾功能下降防到什么程度，目前还不清楚'
          - '从长期眼光看，把补水变成习惯是有意义的'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
