    steps:
      - id: stepping
        text: 以每秒 2 步的节奏原地踏步。脚跟要能充分甩动，脸朝正前方，背不驼、挺起胸膛，把大腿抬够高，脚掌踏实踩地。温柔版：浅坐在椅子上，同样以每秒 2 步交替抬高大腿。
        quote:
          - 以每秒 2 步的节奏原地踏步。脚跟要能充分甩动，脸朝正前方，背不驼、挺起胸膛，把大腿抬够高，脚掌踏实踩地。温柔版：浅坐在椅子上，同样以每秒 2 步交替抬高大腿。
          - 这篇先做戒指圈测试（摸小腿肚）和十一项检查（把符合的题目打圈数）看清自己的状态，再练一套每天 1 次、每次 15 分钟的 11 个动作——踏步 100 秒、深呼吸 8 秒 × 3 回、口部体操每音节 8 秒、空气椅 32 秒 × 2 回，多数动作另配「温柔版」，站不稳可以全程坐着做。衰弱也不只是肌力的事，身体、精神·心理、社会性这三方面缠在一起，最后一节会拆开讲。^[「フレイル対策」のトリセツ]
      - id: thigh-hip-strength
        text: 一只脚向前迈出一步，上半身保持笔直，用 2 秒下沉；前脚位置不动，用 2 秒把上半身带回来；左右各 10 次。要点是膝盖不超过脚尖、双膝尽量保持 90 度、上半身不要前倾或后仰，前脚位置不移动、不往后撤。因为容易失去平衡，建议扶着椅子做。温柔版：坐在椅子上，把一条腿抬到离开椅面为止，用 2 秒抬起、2 秒放下，左右各 10 次；膝盖角度保持不变。
        quote: '一只脚向前迈出一步，上半身保持笔直，用 2 秒下沉；前脚位置不动，用 2 秒把上半身带回来；左右各 10 次。要点是膝盖不超过脚尖、双膝尽量保持 90 度、上半身不要前倾或后仰，前脚位置不移动、不往后撤。因为容易失去平衡，建议扶着椅子做。温柔版：坐在椅子上，把一条腿抬到离开椅面为止，用 2 秒抬起、2 秒放下，左右各 10 次；膝盖角度保持不变。'
        duration:
