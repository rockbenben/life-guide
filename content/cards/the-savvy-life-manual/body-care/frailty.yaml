          quote: 坐在椅子上，做「快要站起来」的动作，把屁股稍微抬离椅面，保持 32 秒；然后坐回去休息 16 秒；再来一次 32 秒。要点：屁股抬得越低效果越好；不要憋气；大腿要用力；双脚朝向平行（内八和外八都不行）。膝盖疼时不要勉强。温柔版：坐在椅子上双手放在膝盖上，用 4 秒慢慢站起、再用 4 秒慢慢坐下，重复 10 次，尽量不用手撑、靠腿的力量站起来。
      - id: cognitive-moving
        text: '脚步节奏是「1、2」向前迈一步，「3、4」向后退一步；边踩步边在向前迈出的那一步（图）把答案念出声，图的位置不出声。加法做 1 分钟、减法做 1 分钟。加法的规则是：给「今天的日期」不断加 3（例：今天是 1 号则 1+3=「4」、4+3=「7」……）；减法是从 100 开始不断减 3（100−3=「97」、97−3=「94」……）。答不上来时不要停下脚步，在下一个向前迈步的时机回答；实在想不起来，随便换个数字重新开始也可以——一边动一边继续思考才是关键。'
