      - id: air-chair
        text: 坐在椅子上，做「快要站起来」的动作，把屁股稍微抬离椅面，保持 32 秒；然后坐回去休息 16 秒；再来一次 32 秒。要点：屁股抬得越低效果越好；不要憋气；大腿要用力；双脚朝向平行（内八和外八都不行）。膝盖疼时不要勉强。温柔版：坐在椅子上双手放在膝盖上，用 4 秒慢慢站起、再用 4 秒慢慢坐下，重复 10 次，尽量不用手撑、靠腿的力量站起来。
