      - id: circling-balance
        text: 一只手扶在椅子等支撑物上，用与支撑手相反侧的脚，以 4 秒为一周慢慢地画一个大圆；画 4 圈，再反向画 4 圈；然后左右互换，重复同样的顺、逆时针各 4 圈。温柔版：把一只脚稍微向后抬起，做单脚站立 32 秒，换另一只脚再做 32 秒。
        quote: '一只手扶在椅子等支撑物上，用与支撑手相反侧的脚，以 4 秒为一周慢慢地画一个大圆；画 4 圈，再反向画 4 圈；然后左右互换，重复同样的顺、逆时针各 4 圈。温柔版：把一只脚稍微向后抬起，做单脚站立 32 秒，换另一只脚再做 32 秒。'
        duration:
          basis: quote
          sec: 4
          quote: 一只手扶在椅子等支撑物上，用与支撑手相反侧的脚，以 4 秒为一周慢慢地画一个大圆；画 4 圈，再反向画 4 圈；然后左右互换，重复同样的顺、逆时针各 4 圈。温柔版：把一只脚稍微向后抬起，做单脚站立 32 秒，换另一只脚再做 32 秒。
      - id: oral-gymnastics
        text: 把「パパパパ……」尽可能快、清晰地念 8 秒；「タタタタ……」念 8 秒；「カカカカ……」念 8 秒。「パ」锻炼吸吮、吞饮的肌力，「タ」锻炼把食物压碎的肌力，「カ」锻炼吞咽的肌力。
        quote: '把「パパパパ……」尽可能快、清晰地念 8 秒；「タタタタ……」念 8 秒；「カカカカ……」念 8 秒。「パ」锻炼吸吮、吞饮的肌力，「タ」锻炼把食物压碎的肌力，「カ」锻炼吞咽的肌力。'
