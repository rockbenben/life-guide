article: the-savvy-life-manual/body-care/frailty.md
kind: practice
coverage: partial
ignore:
  sections:
    - anchor: 15 分钟的 11 个动作
      reason: 该小节共有 11 个动作；按动作数上限仅保留踏步、大腿·臀部肌力训练、绕圈平衡、口部体操、空气椅练大腿和身体与认知功能训练，动作②、④、⑦、⑨、⑪未抽入卡片。
    - anchor: 衰弱是三件事缠在一起
      reason: 这一节是衰弱机制、寿命和照护风险的 condition 知识，不属于可执行的 practice 动作，故未抽成卡。
  images:
    all: true
    reason: 本篇图片均为动作示范或资料配图；动作步骤已用文字抽取，图片统一豁免。
cards:
  - id: frailty-self-checks
    status: reviewed
    source:
      anchor: 两项自我检查
    slot: anytime
    remind:
      text: 先做戒指圈测试，再按说明圈出符合的题目
      quote:
        - '用拇指和食指比出一个「戒指圈」。'
        - '手册的记法是：符合的题目打一个圈。'
    steps:
      - id: ring-test
        text: '用拇指和食指比出一个「戒指圈」。卷起非惯用腿的裤脚，脚后跟踩在地面上，弯腰向前。膝盖请保持 90 度。让手的拇指朝后，把戒指圈套在小腿肚最粗的位置。'
        quote:
          - '用拇指和食指比出一个「戒指圈」。'
          - '卷起非惯用腿的裤脚，脚后跟踩在地面上，弯腰向前。膝盖请保持 90 度。'
          - '让手的拇指朝后，把戒指圈套在小腿肚最粗的位置。'
      - id: interpret-ring-result
        text: '刚好套进去：肌肉量充足的可能性高。套不进去、有空隙：肌肉量已经减少的可能性较高，值得重新审视健康状态和生活习惯。'
        quote:
          - '刚好套进去：肌肉量充足的可能性高。'
          - '套不进去、有空隙：肌肉量已经减少的可能性较高，值得重新审视健康状态和生活习惯。'
      - id: answer-checklist
        text: '营养（第 1～2 项）：和差不多同龄的同性相比，有没有在吃健康的食物？蔬菜料理和主菜（肉或鱼）是否两样都每天吃 2 次以上？口部（第 3～4 项）：像「鱿鱼丝」「腌渍黄瓜」这种硬度的东西还能正常咬断吗？喝茶或喝汤会不会呛到？第 3 项答「否」提示可能存在口腔衰弱；第 4 项答「是」则提示误咽风险变高。运动（第 5～7 项）：有没有每周 2 天以上、持续 1 年以上地做一次 30 分钟以上、会出汗的运动？日常生活中有没有每天 1 小时以上的步行或同等身体活动？和差不多同龄的同性相比，自己走路的速度算快吗？社会性·心理（第 8～11 项）：比起去年，外出的次数减少了吗？每天有 1 次以上和别人一起吃饭吗？自己是不是活力满满？最在意的是，是不是总丢三落四？'
        quote:
          - '营养（第 1～2 项）：和差不多同龄的同性相比，有没有在吃健康的食物？蔬菜料理和主菜（肉或鱼）是否两样都每天吃 2 次以上？'
          - '口部（第 3～4 项）：像「鱿鱼丝」「腌渍黄瓜」这种硬度的东西还能正常咬断吗？喝茶或喝汤会不会呛到？第 3 项答「否」提示可能存在口腔衰弱；第 4 项答「是」则提示误咽风险变高。'
          - '运动（第 5～7 项）：有没有每周 2 天以上、持续 1 年以上地做一次 30 分钟以上、会出汗的运动？日常生活中有没有每天 1 小时以上的步行或同等身体活动？和差不多同龄的同性相比，自己走路的速度算快吗？'
          - '社会性·心理（第 8～11 项）：比起去年，外出的次数减少了吗？每天有 1 次以上和别人一起吃饭吗？自己是不是活力满满？最在意的是，是不是总丢三落四？'
      - id: classify-check
        text: '2 个圈以下：低3～4 个圈：中5 个圈以上：高手册的建议是：哪怕只把圈数减少 1 个，也值得回头重新审视健康状态和生活习惯。'
        quote:
          - '2 个圈以下：低'
          - '3～4 个圈：中'
          - '5 个圈以上：高'
          - '手册的建议是：哪怕只把圈数减少 1 个，也值得回头重新审视健康状态和生活习惯。'
    cautions:
      - level: with-doctor
        text: 说明书特别写明，这一项的建议要先看过牙医——在牙医评估之后，再有意识地把带咀嚼难度的食材加进饭里。（原文：「歯科医に診てもらった上で、食事にも、あえてかみごたえのある食材を入れていきましょう」）
        quote: '说明书特别写明，这一项的建议要先看过牙医——在牙医评估之后，再有意识地把带咀嚼难度的食材加进饭里。（原文：「歯科医に診てもらった上で、食事にも、あえてかみごたえのある食材を入れていきましょう」）'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 7fb33fe9bbb8de0c
    name: 先做戒指圈和自查表

  - id: frailty-exercise-safety
    status: reviewed
    source:
      anchor: 开始前的安全事项
    slot: anytime
    remind:
      text: 开始训练前先检查安全条件
      quote:
        - 这套动作全程会用到椅子。
        - 这篇先做戒指圈测试（摸小腿肚）和十一项检查（把符合的题目打圈数）看清自己的状态，再练一套每天 1 次、每次 15 分钟的 11 个动作——踏步 100 秒、深呼吸 8 秒 × 3 回、口部体操每音节 8 秒、空气椅 32 秒 × 2 回，多数动作另配「温柔版」，站不稳可以全程坐着做。衰弱也不只是肌力的事，身体、精神·心理、社会性这三方面缠在一起，最后一节会拆开讲。^[「フレイル対策」のトリセツ]
    steps:
      - id: use-stable-support
        text: 凡是手要扶的动作，都用墙、桌子等不会移动的物品；要用椅子时，选不带脚轮、不会旋转的稳定椅子。
        quote: '凡是手要扶的动作，都用墙、桌子等不会移动的物品；要用椅子时，选不带脚轮、不会旋转的稳定椅子。'
      - id: clear-ground
        text: '运动前检查地面有没有东西，以免踩到摔倒。在不易滑的地面做，穿有防滑的袜子，或赤脚进行。'
        quote:
          - '运动前检查地面有没有东西，以免踩到摔倒。'
          - '在不易滑的地面做，穿有防滑的袜子，或赤脚进行。'
      - id: hydrate-and-avoid-alcohol
        text: 运动前先补充水分；饮酒后请不要做。
        quote: '运动前先补充水分；饮酒后请不要做。'
      - id: choose-gentle-version
        text: 手册为多数动作另附了「温柔版」，效果相同，按自己的状态挑着用。
        quote: '手册为多数动作另附了「温柔版」，效果相同，按自己的状态挑着用。'
    cautions:
      - level: with-doctor
        text: 有基础疾病、对身体状况感到不安的人，请在咨询主治医生后，在不勉强的范围内进行。
        quote: '有基础疾病、对身体状况感到不安的人，请在咨询主治医生后，在不勉强的范围内进行。'
      - level: info
        text: 已经因为基础疾病接受医生运动指导的人，请遵从该指导。
        quote: '已经因为基础疾病接受医生运动指导的人，请遵从该指导。'
      - level: with-doctor
        text: 膝盖、腰等关节疼痛的人，同样要先咨询医生。
        quote: '膝盖、腰等关节疼痛的人，同样要先咨询医生。'
      - level: stop
        text: 运动中或运动后出现疼痛、过度疲劳等身体变化时，立即中止。
        quote: '运动中或运动后出现疼痛、过度疲劳等身体变化时，立即中止。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 3f523a2c2a29d35f
    name: 开练前先确认安全

  - id: daily-frailty-exercise-selection
    status: draft
    source:
      anchor: 15 分钟的 11 个动作
    slot: anytime
    remind:
      text: 按固定节奏完成动作，并配合温柔版
      quote:
        - 每天 1 次、每次 15 分钟，尽量每天做。
        - 这篇先做戒指圈测试（摸小腿肚）和十一项检查（把符合的题目打圈数）看清自己的状态，再练一套每天 1 次、每次 15 分钟的 11 个动作——踏步 100 秒、深呼吸 8 秒 × 3 回、口部体操每音节 8 秒、空气椅 32 秒 × 2 回，多数动作另配「温柔版」，站不稳可以全程坐着做。衰弱也不只是肌力的事，身体、精神·心理、社会性这三方面缠在一起，最后一节会拆开讲。^[「フレイル対策」のトリセツ]
        - ① 踏步｜100 秒：以每秒 2 步的节奏原地踏步。脚跟要能充分甩动，脸朝正前方，背不驼、挺起胸膛，把大腿抬够高，脚掌踏实踩地。温柔版：浅坐在椅子上，同样以每秒 2 步交替抬高大腿。
    effect:
      text: 整套动作在节目里试了 3 个月做效果验证，测得所有项目的平均值都有改善：5 米快走速度提升 16%、边算边走提升 14%、5 次椅子起立速度提升 27%、单脚站立时长提升 134%、腿伸力提升 45%、口操次数提升 16%。
      quote: '整套动作在节目里试了 3 个月做效果验证，测得所有项目的平均值都有改善：5 米快走速度提升 16%、边算边走提升 14%、5 次椅子起立速度提升 27%、单脚站立时长提升 134%、腿伸力提升 45%、口操次数提升 16%。'
