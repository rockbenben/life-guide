  - id: frailty-persistence-and-nutrition
    status: reviewed
    source:
      anchor: 怎么坚持下去，以及吃些什么
    slot: anytime
    remind:
      text: 按手册安排练习节奏，并关注日常营养
      quote:
        - 手册强调日常能做的不只运动，还有饮食——在关注营养状态的同时，可以预防吃得过少和肌力下降。
        - ① 踏步｜100 秒：以每秒 2 步的节奏原地踏步。脚跟要能充分甩动，脸朝正前方，背不驼、挺起胸膛，把大腿抬够高，脚掌踏实踩地。温柔版：浅坐在椅子上，同样以每秒 2 步交替抬高大腿。
    effect:
      text: 节目里每天做的人，约一半说「一开始很难，但坚持 1 个月后就变得轻松了」，也有人在 1～2 个月里感到爬楼梯上下变得更方便。
      quote: '节目里每天做的人，约一半说「一开始很难，但坚持 1 个月后就变得轻松了」，也有人在 1～2 个月里感到爬楼梯上下变得更方便。'
    dose:
      - value: 1
        unit: 克/公斤/天
        what: 健康人每日每公斤体重蛋白质最低参考量
        quote: '健康人是每天每 1 公斤体重 1 克以上，衰弱者则建议每天每 1 公斤体重 1.2～1.5 克以上。'
      - value: 1.2
        valueMax: 1.5
        unit: 克/公斤/天
        what: 衰弱者每日每公斤体重蛋白质建议
        quote: '健康人是每天每 1 公斤体重 1 克以上，衰弱者则建议每天每 1 公斤体重 1.2～1.5 克以上。'
    steps:
      - id: fixed-time
        text: 固定时间做：像「早上 9 点」「晚饭后」，挑一个自己固定在家的时间。
        quote: '固定时间做：像「早上 9 点」「晚饭后」，挑一个自己固定在家的时间。'
      - id: planned-rest
        text: 有计划地休息：把每周固定某一天设为休息日，更有节奏感。
        quote: '有计划地休息：把每周固定某一天设为休息日，更有节奏感。'
      - id: visualize-exercise
        text: 把运动可视化：运动当天在日历上画个圈，动力会更容易积累。
        quote: '把运动可视化：运动当天在日历上画个圈，动力会更容易积累。'
      - id: exercise-together
        text: 找人一起做：和家人、朋友一起，互相鼓励更容易坚持。
        quote: '找人一起做：和家人、朋友一起，互相鼓励更容易坚持。'
      - id: protein-intake
        text: 蛋白质：维持肌肉量与肌力的基础。摄取不足会让肌肉的量和质都下降。
        quote: '蛋白质：维持肌肉量与肌力的基础。摄取不足会让肌肉的量和质都下降。'
      - id: vitamin-d-intake
        text: 维生素 D：对骨骼发育和维持肌力不可或缺，长期不足会推高骨折与跌倒风险。除了从富含维生素 D 的鱼类摄取，日光浴时紫外线也能在皮肤中合成维生素 D，所以适度的日晒是推荐做法。
        quote: '维生素 D：对骨骼发育和维持肌力不可或缺，长期不足会推高骨折与跌倒风险。除了从富含维生素 D 的鱼类摄取，日光浴时紫外线也能在皮肤中合成维生素 D，所以适度的日晒是推荐做法。'
      - id: varied-meals-together
        text: 一天三餐，留意食品的多样性——营养素是协同起作用的，蛋白质也在持续被分解，所以三餐吃得多样才有足够营养；以及与其独自吃饭，不如与人同桌——和别人愉快地用餐不但维护心理健康，还能带动食欲、让人吃到更多种食物。
        quote: '一天三餐，留意食品的多样性——营养素是协同起作用的，蛋白质也在持续被分解，所以三餐吃得多样才有足够营养；以及与其独自吃饭，不如与人同桌——和别人愉快地用餐不但维护心理健康，还能带动食欲、让人吃到更多种食物。'
