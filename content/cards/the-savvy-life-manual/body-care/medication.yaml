  - id: avoid-self-continuing-meds
    status: reviewed
    source:
      anchor: '自己判断继续吃，可能招来副作用'
    remind:
      text: '症状不见好时，不要自行继续服用同一种药或改用作用类似的非处方药。'
      quote: '用了非处方药但症状不见好时，继续吃同一种药、或者换成作用类似的另一种非处方药，都要注意——这种自己判断，有时会带来意外的副作用，也可能让你漏掉真正的疾病。'
    steps:
      - id: assess-non-improvement
        text: '用了非处方药但症状不见好时，继续吃同一种药、或者换成作用类似的另一种非处方药，都要注意——这种自己判断，有时会带来意外的副作用，也可能让你漏掉真正的疾病。'
        quote: '用了非处方药但症状不见好时，继续吃同一种药、或者换成作用类似的另一种非处方药，都要注意——这种自己判断，有时会带来意外的副作用，也可能让你漏掉真正的疾病。'
      - id: watch-gastrointestinal-effects
        text: '这个案例服用的那类止痛药，会抑制「产生疼痛根源」的酶。然而这个酶其实还承担着「保护消化管黏膜」的工作。持续服用损伤了消化管黏膜，引发了出血。'
        quote:
          - 这个案例服用的那类止痛药，会抑制「产生疼痛根源」的酶。然而这个酶其实还承担着「保护消化管黏膜」的工作。
          - 持续服用损伤了消化管黏膜，引发了出血。
          - 说明书接着把镜头转向老年人：年龄渐长、在多家医疗机构就诊的过程中，用药会变多。即使都是治疗必需的药，种类一多，管理就会变难，漏服和吃错也更易发生；而且药物种类和组合本身，也更容易出现副作用等不希望有的症状。
    notices:
      - level: seek-care
        text: '为了缓解背痛而开始服用某类非处方止痛药，2 周之内多次服用，结果出现便血和贫血，被急救送医；检查怀疑是来自小肠的出血，因而住院。'
        quote: '为了缓解背痛而开始服用某类非处方止痛药，2 周之内多次服用，结果出现便血和贫血，被急救送医；检查怀疑是来自小肠的出血，因而住院。'
      - level: info
        text: '自己判断长期用药，还会耽误本应被发现和治疗的疾病。要注意。'
        quote: '自己判断长期用药，还会耽误本应被发现和治疗的疾病。要注意。'
    review:
      by: benson
      date: 2026-10-21
      hash: edbafa10ee916ea5
  - id: read-package-insert
