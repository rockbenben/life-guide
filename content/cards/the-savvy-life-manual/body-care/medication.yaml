  - id: consult-pharmacist
    status: reviewed
    name: "取药与疑问找药剂师"
    source:
      anchor: '药剂师是「最后一道防线」'
    remind:
      text: '取药或对处方有疑问时，向药剂师说明症状、正在使用的药和补充剂。'
      quote:
        - 「今天是什么症状？」「还有在用别的药吗？」
        - 实际在用的非处方药和补充剂、有没有忘记吃药、吃药之后身体状况的变化，这些都是不问患者就无从知道的信息。
        - 对处方内容有疑问时，药剂师会向开处方的医生询问，处方也可能因此被修改。
    steps:
      - id: report-symptoms-and-medicines
        text: '实际在用的非处方药和补充剂、有没有忘记吃药、吃药之后身体状况的变化，这些都是不问患者就无从知道的信息。'
        quote:
          - 实际在用的非处方药和补充剂、有没有忘记吃药、吃药之后身体状况的变化，这些都是不问患者就无从知道的信息。
          - 第三层，也是说明书最想让人放心的部分：影响到的只是一部分药。 它的原话是：因为受影响的只是一部分药，所以并不需要一律避开草本茶和葡萄柚汁；但第一次使用某种药时，需要注意食物和饮料的地方，请去问医生或药剂师。
      - id: request-safety-check
        text: '药的种类和剂量是否合适、有没有重复成分的药、有没有危险的搭配，是从与医生不同的立场做确认的。'
        quote: '药的种类和剂量是否合适、有没有重复成分的药、有没有危险的搭配，是从与医生不同的立场做确认的。'
      - id: ask-about-prescription
        text: '对处方内容有疑问时，药剂师会向开处方的医生询问，处方也可能因此被修改。'
        quote: '对处方内容有疑问时，药剂师会向开处方的医生询问，处方也可能因此被修改。'
    notices:
      - level: info
        text: '药剂师是在防止用药事故、保护患者性命的「最后一道防线」。'
        quote: '药剂师是在防止用药事故、保护患者性命的「最后一道防线」。'
    review:
      by: benson
      date: 2026-10-22
      hash: 8787ae7145991ebe
  - id: elderly-medication-review
    status: reviewed
    name: "请药剂师整理用药"
    source:
      anchor: '老年人的「药越吃越多」，药剂师能帮忙'
    remind:
      text: '药物种类增多时，请药剂师协助整理用药；不要自行减药或停药。'
      quote:
        - 漏服了药、或者没用完剩在那里的药，请去咨询药剂师。
        - ※ 不要因为药多就自行判断地减药或停药。对用药管理和身体状况变化有疑问，请咨询医生或药剂师。
        - 说明书接着把镜头转向老年人：年龄渐长、在多家医疗机构就诊的过程中，用药会变多。即使都是治疗必需的药，种类一多，管理就会变难，漏服和吃错也更易发生；而且药物种类和组合本身，也更容易出现副作用等不希望有的症状。
    steps:
      - id: review-medication-trend
        text: '使用的药达到 6 种以上时，药物有害事件（薬物有害事象）有增加的趋势。要读的是整体趋势（种类越多，频率越高），不是逐档递增。'
        quote:
          - '使用的药达到 6 种以上时，药物有害事件（薬物有害事象）有增加的趋势。'
          - '要读的是整体趋势（种类越多，频率越高），不是逐档递增。'
      - id: organize-dosing
        text: '根据咨询内容和你的生活状况，把同一时间要吃的药分装成一袋的「一包化」、或活用服药日历，和你一起想出不必勉强就能继续用药的办法；必要时，还会向医生提出变更药物或重新评估的申请。'
        quote: '根据咨询内容和你的生活状况，把同一时间要吃的药分装成一袋的「一包化」、或活用服药日历，和你一起想出不必勉强就能继续用药的办法；必要时，还会向医生提出变更药物或重新评估的申请。'
      - id: request-medication-change
        text: '根据咨询内容和你的生活状况，把同一时间要吃的药分装成一袋的「一包化」、或活用服药日历，和你一起想出不必勉强就能继续用药的办法；必要时，还会向医生提出变更药物或重新评估的申请。'
