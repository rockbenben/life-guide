cards:
  - id: otc-ingredient-overlap
    status: reviewed
    name: "非处方药之间会撞成分"
    source:
      anchor: '非处方药之间也会「撞成分」'
    remind:
      text: '服用非处方药前，先核对成分，避免相同成分或相近作用重叠。'
      quote: '即使适应症、功效不同的药，也可能含有相同成分或作用相近的成分——并用之后，相同成分和相同作用就重叠了。'
    steps:
      - id: compare-active-ingredients
        text: '即使适应症、功效不同的药，也可能含有相同成分或作用相近的成分——并用之后，相同成分和相同作用就重叠了。'
        quote: '即使适应症、功效不同的药，也可能含有相同成分或作用相近的成分——并用之后，相同成分和相同作用就重叠了。'
      - id: check-overlapping-effects
        text: '这个例子里，作用相同的成分重叠了 3 项。'
        quote:
          - 这个例子里，作用相同的成分重叠了 3 项。
          - 这时候人很自然会想：「咳嗽就吃止咳药」「鼻水就用鼻炎药」，买两盒分开吃。 说明书的反驳是：即使适应症、功效不同的药，也可能含有相同成分或作用相近的成分——并用之后，相同成分和相同作用就重叠了。
      - id: do-not-assume-otc-safe
        text: '但审查过安全，不等于随便吃都安全。'
        quote: '但审查过安全，不等于随便吃都安全。'
    notices:
      - level: info
        text: '「因为是非处方药所以疗效弱」「副作用少」，这些都不能一概而论。'
        quote: '「因为是非处方药所以疗效弱」「副作用少」，这些都不能一概而论。'
    review:
      by: benson
      date: 2026-10-22
      hash: 4971d74d354e6daa
  - id: food-drink-interactions
    status: reviewed
    name: "用药要核对饮食搭配"
    source:
      anchor: '和饮食的「搭配」也要小心'
    remind:
      text: '用药时核对饮料和食物的影响；首次使用某种药时，向医生或药剂师确认搭配要求。'
      quote:
        - '饮料和食物所含的成分，有时会让药吸收变差，有时反而让作用强烈显现。'
        - '因为受影响的只是一部分药，所以并不需要一律避开草本茶和葡萄柚汁；但第一次使用某种药时，需要注意食物和饮料的地方，请去问医生或药剂师。'
    steps:
      - id: check-caffeine-intake
        text: '止咳药和鼻炎药里，有时会含有咖啡因，目的是抑制嗜意、缓解疼痛。吃这些药时如果又用咖啡来喝，咖啡因的作用会强烈显现，可能引发心悸等副作用。'
        quote:
          - '止咳药和鼻炎药里，有时会含有咖啡因，目的是抑制嗜意、缓解疼痛。'
          - '吃这些药时如果又用咖啡来喝，咖啡因的作用会强烈显现，可能引发心悸等副作用。'
      - id: notice-hidden-saint-johns-wort
        text: '因为它常被混进调配好的草本茶和健康食品里，让人不容易察觉，所以要注意。'
        quote: '因为它常被混进调配好的草本茶和健康食品里，让人不容易察觉，所以要注意。'
      - id: plan-grapefruit-spacing
        text: '这个影响有时会持续好几天，把服用时间错开也可能躲不掉。'
        quote: '这个影响有时会持续好几天，把服用时间错开也可能躲不掉。'
      - id: use-water
        text: '大多数药都是以「用水或温吞水服用」为前提制作的为了减少搭配的风险，遵守这一点也很重要。'
        quote:
          - '大多数药都是以「用水或温吞水服用」为前提制作的'
          - '为了减少搭配的风险，遵守这一点也很重要。'
    notices:
      - level: with-doctor
        text: '因为受影响的只是一部分药，所以并不需要一律避开草本茶和葡萄柚汁；但第一次使用某种药时，需要注意食物和饮料的地方，请去问医生或药剂师。'
        quote: '因为受影响的只是一部分药，所以并不需要一律避开草本茶和葡萄柚汁；但第一次使用某种药时，需要注意食物和饮料的地方，请去问医生或药剂师。'
      - level: info
        text: '因为受影响的只是一部分药，所以并不需要一律避开草本茶和葡萄柚汁；但第一次使用某种药时，需要注意食物和饮料的地方，请去问医生或药剂师。'
        quote: '因为受影响的只是一部分药，所以并不需要一律避开草本茶和葡萄柚汁；但第一次使用某种药时，需要注意食物和饮料的地方，请去问医生或药剂师。'
