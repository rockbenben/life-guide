cards:
  - id: bee-breathing
    status: reviewed
    source:
      anchor: "蜂鸣式呼吸法"
    # 原文说「饭前或睡前效果最好」—— 两个时机都不落一段。
    slot: anytime

    remind:
      text: "放松闭嘴，呼气时发出嗡嗡声，先从 5 次呼吸起步"
      quote:
        - "**② 练蜂鸣式呼吸法**——保持放松，**一边发声**、呼气时发出「嗯～」的嗡嗡声，**先从 5 次呼吸起步**"
        - "效果最好的时候是**饭前或睡前**，姿势坐着躺着都行"

    effect:
      text: "长时间保持深呼吸，即使在紧张时也能帮助你放松。"
      quote: "长时间保持深呼吸，即使在紧张时也能帮助你放松。"

    dose:
      - value: 5
        unit: 次
        what: "呼吸"
        quote: "从 5 次呼吸起步"

    # 原文没给一次练习要多久，也没有说几次算够，duration 写 unknown。
    duration:
      basis: unknown

    steps:
      - id: relax
        text: "放松状态：保持放松，闭上嘴巴。"
        quote: "**放松状态**：保持放松，闭上嘴巴。"
      - id: hum
        text: "呼气时，发出“嗯~”的声音，类似蜜蜂翅膀的嗡嗡声。当感觉气息不足时，再次放松并吸气。"
        quote: "呼气时，发出“嗯~”的声音，类似蜜蜂翅膀的嗡嗡声。当感觉气息不足时，再次放松并吸气。"
      - id: cover-senses
        text: "遮挡耳朵和眼睛：用手物理遮挡耳朵和眼睛，可以帮助你更专注于呼吸声，进一步放松身心。用拇指按住耳朵、用另外四根手指捂住眼睛"
        quote:
          - "**遮挡耳朵和眼睛**：用手物理遮挡耳朵和眼睛，可以帮助你更专注于呼吸声，进一步放松身心。"
          - "用拇指按住耳朵、用另外四根手指捂住眼睛"
        images:
          - "https://img.newzone.top/20261016065630186.jpeg?imageMogr2/format/webp"
      - id: chest
        text: "手掌放在胸前（触摸时可以感觉到骨头的地方）：感受手掌在呼吸时产生的振动，能更容易集中注意力于呼吸声，增强放松效果。掌心贴在胸骨（能摸到骨头的那一段）上时，能感觉到呼吸带来的震动"
        quote:
          - "**手掌放在胸前**（触摸时可以感觉到骨头的地方）：感受手掌在呼吸时产生的振动，能更容易集中注意力于呼吸声，增强放松效果。"
          - "掌心贴在**胸骨**（能摸到骨头的那一段）上时，能感觉到呼吸带来的**震动**"

    cautions:
      - level: stop
        text: "不要勉强拉长时间，硬撑反而适得其反。"
        quote: "**不要勉强拉长时间**，硬撑反而适得其反。"
