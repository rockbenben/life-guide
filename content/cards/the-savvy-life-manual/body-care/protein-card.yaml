article: the-savvy-life-manual/body-care/protein-card.md
kind: practice
coverage: complete
ignore:
  sections:
    - anchor: '一张卡只回答一件事'
      reason: '本节是卡片读法与监修信息的说明，已并入“蛋白质卡：一张卡算清这一份有多少克蛋白质”卡片，没有独立的额外动作。'
  images: []
cards:
  - id: read-protein-card
    status: draft
    name: "读蛋白质卡"
    source:
      anchor: '蛋白质卡：一张卡算清这一份有多少克蛋白质'
    slot: anytime
    remind:
      text: '今天用经神奈川县立保健福祉大学铃木志保子教授监修的卡片，查看每份食物的蛋白质和分量。'
      quote:
        - '整套卡片由'
        - '神奈川县立保健福祉大学铃木志保子教授'
        - '监修'
        - '每张卡左上角星形里的数字'
        - '蛋白质克数'
        - '卡片下方标注对应分量'
    dose:
      - { value: 3, unit: g, what: '白米饭对应分量的蛋白质', quote: [ '3g' ] }
    steps:
      - id: read-star-number
        text: '每张卡左上角星形里的数字蛋白质克数'
        quote: [ '每张卡左上角星形里的数字', '蛋白质克数' ]
      - id: read-portion
        text: '卡片下方标注对应分量'
        quote: [ '卡片下方标注对应分量' ]
      - id: use-white-rice-example
        text: '比如白米饭一张卡是3g蛋白质150g分量（一碗）'
        quote: [ '比如白米饭一张卡是', '3g', '蛋白质', '150g', '分量（一碗）' ]

  - id: plan-three-color-meal
    status: reviewed
    name: "三色搭配凑 20g"
    source:
      anchor: '三色搭配：每餐 3 色、合计 20g 以上'
    slot: anytime
    remind:
      text: '一餐用 3 种颜色的卡片来搭配让菜单更完整合计蛋白质 20g 以上'
      quote:
        - '一餐用 3 种颜色的卡片来搭配'
        - '让菜单更完整'
        - '合计蛋白质 20g 以上'
    dose:
      - { value: 20, unit: g, what: '每餐合计蛋白质', quote: [ '20g' ] }
    steps:
      - id: choose-three-colors
        text: '卡片按食材系分成三种颜色：一餐用 3 种颜色的卡片来搭配'
        quote: [ '卡片按', '食材系', '分成三种颜色：', '一餐用 3 种颜色的卡片来搭配' ]
      - id: read-each-gram
        text: '每张卡的左上角有一个星形数字该份食物的蛋白质克数'
        quote: [ '每张卡的左上角有一个星形数字', '该份食物的蛋白质克数' ]
      - id: sum-to-target
        text: '合计蛋白质 20g 以上'
        quote: [ '合计蛋白质 20g 以上' ]
    cautions:
      - level: with-doctor
        text: '肾脏有疾病的人如果摄入过多蛋白质可能会导致病情进展请务必咨询主治医生'
        quote:
          - '肾脏有疾病的人如果摄入过多蛋白质'
          - '可能会导致病情进展'
          - '请务必'
          - '咨询主治医生'
    review:
      by: benson
      date: 2026-10-21
      hash: 7cb60a78854d2d8c

