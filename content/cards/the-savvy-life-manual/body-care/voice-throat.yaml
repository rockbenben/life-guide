  - id: choose-voice-method
    status: reviewed
    name: "用哼鸣练响嗓音"
    source:
      anchor: 声音不响亮？每天 4 分钟「好的哼鸣」
    slot: anytime
    duration:
      basis: unknown
    remind:
      text: 按问题选方法：声音不响亮做好的哼鸣；声音变哑、变不出来做吸管发声法。好的哼鸣对应节目里的 1 天 4 分钟。
      quote:
        - "节目里的「1 天 4 分钟」指的是好的哼鸣（ハミング），这是把 3000 赫兹做出来的办法；另一套「吸管发声法」针对的是声音变哑，两者不要混为一谈。"
        - "这一套针对的不是「响不响」，而是声音变哑、变不出来。"
    steps:
      - id: select-humming
        text: 节目里的「1 天 4 分钟」指的是好的哼鸣（ハミング），这是把 3000 赫兹做出来的办法；另一套「吸管发声法」针对的是声音变哑，两者不要混为一谈。
        quote:
          - 节目里的「1 天 4 分钟」指的是好的哼鸣（ハミング），这是把 3000 赫兹做出来的办法；另一套「吸管发声法」针对的是声音变哑，两者不要混为一谈。
          - 声音不响亮，多数人会先想到「音调太低」，但说明书指出关键不是高低：人耳结构上最敏感的频段是 3000 赫兹，这个成分强，声音才「通」。它不是天生的音高，而是靠喉腔把声带的声音「响」起来才产生——所以低沉的声音也能练出来。^[「声と喉のアンチエイジング」のトリセツ]
      - id: select-straw
        text: 这一套针对的不是「响不响」，而是声音变哑、变不出来。
        quote: "这一套针对的不是「响不响」，而是声音变哑、变不出来。"
