  - id: voice-practice-limits
    status: reviewed
    source:
      anchor: 守住练习强度的底线
    slot: anytime
    duration:
      basis: unknown
    remind:
      text: 按说明书的参考量练：哼鸣一天 2～4 组，吸管发声法一天 3 组；练完觉得喉咙发累或声音更哑时，退回说明书的量。
      quote:
        - "哼鸣的量被限定在一天 2～4 组（一组是「5 秒 × 10 回」），并且先连续做 2 周再说。"
        - "吸管发声法的量被限定在一天 3 组，而说明书写明一天 50 次是患者康复训练的量，不是普通人的目标。"
        - "这两套方法都以轻声、短时间、按量做为前提；如果练完觉得喉咙发累、声音反而更哑，说明强度过头了，应当退回说明书的量。"
    dose:
