  - id: good-humming-steps
    status: reviewed
    source:
      anchor: 好的哼鸣：四步
    slot: anytime
    duration:
      basis: unknown
    remind:
      text: 依次完成准备呼吸、站直、哼鸣和留空喉腔。
      quote:
        - "好的哼鸣先要好呼吸。"
        - "耳朵对准肩膀的位置站直，下巴稍微后收。"
        - "把手放在后颈和鼻子上，要能摸到振动，然后「嗯——」地哼。可以一边换音高一边找，找到振动最强的那个音，目标是有「芯」的、结实的哼鸣。"
        - "像歌剧演员那样把喉咙打开，说明书给的具体比喻是：喉深处空出「一个鹌鹑蛋」的空间。另外把嘴略微噘起，声音更容易响起；再从鼻子上方把音送出去，就更接近「好的哼鸣」。"
    dose:
      - value: 30
        unit: 秒
        what: 持续呼气时长
        quote: "尽量练到能持续呼 30 秒"
    steps:
      - id: long-breath
        text: 吸气时把两侧肋骨撑开，保持这个感觉慢慢「呼——」出去，尽量练到能持续呼 30 秒。
        quote: "吸气时把两侧肋骨撑开，保持这个感觉慢慢「呼——」出去，尽量练到能持续呼 30 秒。"
      - id: upright-posture
        text: 耳朵对准肩膀的位置站直，下巴稍微后收。
        quote: "耳朵对准肩膀的位置站直，下巴稍微后收。"
      - id: find-vibration
        text: 把手放在后颈和鼻子上，要能摸到振动，然后「嗯——」地哼。可以一边换音高一边找，找到振动最强的那个音，目标是有「芯」的、结实的哼鸣。
        quote: "把手放在后颈和鼻子上，要能摸到振动，然后「嗯——」地哼。可以一边换音高一边找，找到振动最强的那个音，目标是有「芯」的、结实的哼鸣。"
      - id: open-throat
        text: 像歌剧演员那样把喉咙打开，说明书给的具体比喻是：喉深处空出「一个鹌鹑蛋」的空间。另外把嘴略微噘起，声音更容易响起；再从鼻子上方把音送出去，就更接近「好的哼鸣」。
        quote: "像歌剧演员那样把喉咙打开，说明书给的具体比喻是：喉深处空出「一个鹌鹑蛋」的空间。另外把嘴略微噘起，声音更容易响起；再从鼻子上方把音送出去，就更接近「好的哼鸣」。"
    cautions:
      - level: info
        text: 这一整套是低声哼鸣，目的是把声音「响」起来，不是练高音。
        quote: "这一整套是低声哼鸣，目的是把声音「响」起来，不是练高音。"
      - level: info
        text: '说明书的原话是：3000 赫兹与声音的高低几乎没有关系——低沉的嗓音只要有共鸣，同样能练出通达的声音。不需要为了追求共鸣去刻意提高音调。'
        quote:
          - "说明书的原话是：3000 赫兹与声音的高低几乎没有关系——低沉的嗓音只要有共鸣，同样能练出通达的声音。"
          - "不需要为了追求共鸣去刻意提高音调。"
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 5b129c2c0433fbfd
    name: 四步做好的哼鸣

  - id: straw-phonation
    status: reviewed
    source:
      anchor: 另一个方向：吸管发声法
    slot: anytime
    duration:
      basis: derived
      sec: 150
      quote: "说明书指出，5 秒 × 10 次做 3 组对喉咙的抗老有效。"
      formula: "5 秒 × 10 次 × 3 组 = 150 秒"
    remind:
      text: 从约 1～2cm 的吸管深度开始，在容易发出的音高上发「呜——」，再逐步练不同音高。
      quote:
        - "说明书建议从约 1～2cm 的深度开始。"
        - "先在自己容易发出的音高上发「呜——」。"
        - "习惯之后，试着发「呜↗」「呜↘」等不同音高的声音。"
    effect:
      text: 这一法即时有效，做完当下声音就容易发出来；说明书指出，5 秒 × 10 次做 3 组对喉咙的抗老有效。
      quote: "这一法即时有效，做完当下声音就容易发出来；说明书指出，5 秒 × 10 次做 3 组对喉咙的抗老有效。"
    dose:
      - value: 1
        valueMax: 2
        unit: cm
        what: 起始吸管深度
        quote: "把水放进矿泉水瓶之类的容器，插入吸管，一边吹气一边发「呜——」。因为吸管深度不同，喉咙承受的负荷也不同，说明书建议从约 1～2cm 的深度开始。"
        approximate: true
      - value: 5
        unit: 秒
        what: 每次发声时长
        quote: "说明书指出，5 秒 × 10 次做 3 组对喉咙的抗老有效。"
      - value: 10
        unit: 次
        what: 每组发声次数
        quote: "说明书指出，5 秒 × 10 次做 3 组对喉咙的抗老有效。"
      - value: 3
        unit: 组
        what: 每天练习组数
        quote: "说明书指出，5 秒 × 10 次做 3 组对喉咙的抗老有效。"
    steps:
      - id: blow-through-straw
        text: 把水放进矿泉水瓶之类的容器，插入吸管，一边吹气一边发「呜——」。因为吸管深度不同，喉咙承受的负荷也不同，说明书建议从约 1～2cm 的深度开始。
        quote: "把水放进矿泉水瓶之类的容器，插入吸管，一边吹气一边发「呜——」。因为吸管深度不同，喉咙承受的负荷也不同，说明书建议从约 1～2cm 的深度开始。"
