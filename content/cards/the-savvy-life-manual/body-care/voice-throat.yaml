        quote: "哼鸣的量被限定在一天 2～4 组（一组是「5 秒 × 10 回」），并且先连续做 2 周再说。"
      - value: 2
        valueMax: 4
        unit: 组
        what: 每天哼鸣组数
        quote: "哼鸣的量被限定在一天 2～4 组（一组是「5 秒 × 10 回」），并且先连续做 2 周再说。"
      - value: 2
        unit: 周
        what: 连续练习周期
        quote: "哼鸣的量被限定在一天 2～4 组（一组是「5 秒 × 10 回」），并且先连续做 2 周再说。"
      - value: 3
        unit: 组
        what: 每天吸管法练习组数
        quote: "吸管发声法的量被限定在一天 3 组，而说明书写明一天 50 次是患者康复训练的量，不是普通人的目标。"
    steps:
      - id: follow-reference-volume
        text: 哼鸣的量被限定在一天 2～4 组（一组是「5 秒 × 10 回」），并且先连续做 2 周再说。
        quote: "哼鸣的量被限定在一天 2～4 组（一组是「5 秒 × 10 回」），并且先连续做 2 周再说。"
      - id: reduce-if-overdone
        text: 这两套方法都以轻声、短时间、按量做为前提；如果练完觉得喉咙发累、声音反而更哑，说明强度过头了，应当退回说明书的量。
