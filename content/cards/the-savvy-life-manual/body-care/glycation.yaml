ignore:
  sections:
    - anchor: 糖化的自查：10 项检查表 + 饭后 1～2 分钟
      reason: 导语只概述糖化定义及后文两项可执行内容；具体自查和饭后动作已分别在对应小节成卡，不重复抽卡。
    - anchor: 糖化落在身体的哪些地方
      reason: 仅为 AGE 可能影响的身体部位和关联疾病的知识说明，不含可执行的日常动作，故不抽成可勾选卡。
    - anchor: 一项 7 万人规模的研究
      reason: 研究背景和群体风险统计不构成本文的日常动作，也不宜改写成个人诊断或风险承诺。
    - anchor: 被藏起来的风险：餐后高血糖
      reason: 主要介绍餐后高血糖的检测盲区和提示阈值；关键阈值与就医提醒已收录为运动卡的安全提示，不另立日常动作。
    - anchor: 什么时候该去医院
