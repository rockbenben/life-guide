  - id: press-acupoints-basics
    status: reviewed
    source:
      anchor: '按法：三件事'
    slot: anytime
    remind:
      text: '先摸出最敏感的穴位点，以有点痛但按完舒服的力度缓缓加力，保持 3 秒后慢慢松力。'
      quote:
        - '用手指在前后左右摸出最敏感的那个点'
        - '力度以「有点痛、但按完舒服」为准'
        - '缓缓加力，感到舒服后保持 3 秒，然后慢慢松力'
    dose:
      - value: 3
        unit: '秒'
        what: '每次按压的保持时长'
        quote: '保持 3 秒'
    duration:
      basis: quote
      sec: 3
      quote: '慢慢按 3 秒'
    steps:
      - id: find-sensitive-point
        text: '用手指在前后左右摸出最敏感的那个点'
        quote: '用手指在前后左右摸出最敏感的那个点'
      - id: set-comfortable-pressure
        text: '力度以「有点痛、但按完舒服」为准'
        quote: '力度以「有点痛、但按完舒服」为准'
      - id: press-and-release-slowly
        text: '缓缓加力，感到舒服后保持 3 秒，然后慢慢松力'
        quote: '缓缓加力，感到舒服后保持 3 秒，然后慢慢松力'
        # 保持 3 秒（2026-10-30 加）；找点与调力度那两步没有时长
        duration:
          basis: quote
          sec: 3
          quote: '保持 3 秒'
    cautions:
      - level: stop
        text: '硬按可能反而伤到肌肉'
        quote: '硬按可能反而伤到肌肉'
      - level: stop
        text: '用力过度反而会引起炎症'
        quote: '用力过度反而会引起炎症'
