  - id: acupressure-by-symptom
    status: reviewed
    source:
      anchor: 各部位对应的穴位位置
    slot: anytime
    remind:
      text: 疲劳按足三里、腰痛按肾俞和委中、肩僵按肩井和合谷、压力大按内关百会、畏寒按三阴交。
      quote:
        - 疲劳：足三里——膝盖骨下方、外侧凹陷往下四指宽处，被称为万能、长寿之穴。
        - 腰痛：肾俞——沿腰线，在脊椎两侧两指处；不好按的时候，可以在地板上放个网球之类，躺上去压。委中——膝关节背面正中附近。
        - 肩部僵硬：肩井——脖子根部与肩端的中点附近。合谷——拇指与食指的手骨交叉处、偏向食指的那个凹陷。
        - 压力：内关——手腕横纹往里约三指处。百会——两耳最高点连成的线，与鼻梁中线交汇处。
        - 畏寒：三阴交——内脚踝上方四指、紧贴粗骨的后方。
    dose:
      - value: 3
        unit: 秒
        what: 每次按压的保持时长
        quote: 保持 3 秒
    steps:
      - id: fatigue
        text: 疲劳：足三里——膝盖骨下方、外侧凹陷往下四指宽处，被称为万能、长寿之穴。
        quote: 疲劳：足三里——膝盖骨下方、外侧凹陷往下四指宽处，被称为万能、长寿之穴。
      - id: lower-back
