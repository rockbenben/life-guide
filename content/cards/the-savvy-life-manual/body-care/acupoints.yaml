  - id: safe-acupressure-and-care
    status: reviewed
    source:
      anchor: '注意与就医提示'
    slot: anytime
    remind:
      text: '按压保持有点痛但舒服；遇到不明原因或持续不缓解的疼痛，以及下肢麻木无力、大小便异常时，不要靠按穴位处理，先到骨科或神经内科就诊。'
      quote:
        - '按压务必控制在「有点痛但舒服」的程度'
        - '如果疼痛原因不明、持续不缓解，或伴随下肢麻木无力、大小便异常等症状，不要靠按穴位处理，请到骨科或神经内科就诊，先查明病因。'
    steps:
      - id: control-pressure
        text: '按压务必控制在「有点痛但舒服」的程度'
        quote: '按压务必控制在「有点痛但舒服」的程度'
      - id: seek-care-for-warning-signs
        text: '如果疼痛原因不明、持续不缓解，或伴随下肢麻木无力、大小便异常等症状，不要靠按穴位处理，请到骨科或神经内科就诊，先查明病因。'
        quote: '如果疼痛原因不明、持续不缓解，或伴随下肢麻木无力、大小便异常等症状，不要靠按穴位处理，请到骨科或神经内科就诊，先查明病因。'
    cautions:
      - level: stop
        text: '用力过度反而会引起炎症'
        quote: '用力过度反而会引起炎症'
      - level: stop
        text: '穴位按摩不能代替就医，症状持续时请先看专科'
        quote: '穴位按摩不能代替就医，症状持续时请先看专科'
      - level: with-doctor
        text: '穴位并不能改善所有的疾病和症状，请与西医良好配合，作为保持健康的助力'
        quote: '穴位并不能改善所有的疾病和症状，请与西医良好配合，作为保持健康的助力'
