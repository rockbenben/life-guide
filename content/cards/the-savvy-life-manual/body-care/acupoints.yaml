        text: '针和灸等穴位治疗在某些情况下可以适用健康保险，目前适用的是神经痛、风湿病、腰痛症、五十肩、腕管综合征、颈椎扭伤后遗症等（需医生同意），其他疾病则属于全额自费的自由诊疗。'
        quote: '针和灸等穴位治疗在某些情况下可以适用健康保险，目前适用的是神经痛、风湿病、腰痛症、五十肩、腕管综合征、颈椎扭伤后遗症等（需医生同意），其他疾病则属于全额自费的自由诊疗。'
