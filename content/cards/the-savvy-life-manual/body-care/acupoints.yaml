  - id: beauty-basic-four
    status: reviewed
    source:
      anchor: '美容用的 12 个穴位'
    slot: anytime
    remind:
      text: '第一次不妨只做基础的 4 个穴位：太阳、颧髎、颊车、翳风，对着镜子边看边按。'
      quote:
        - '第一次不妨只做「基础的 4 个」，对着镜子边看边按：'
        - '太阳——眉毛外端与眼尾之间、往外约一拇指的凹陷处。'
        - '颧髎——眼尾下方、颧骨下面的凹陷处，沿法令纹方向按。'
        - '颊车——下颌角往内斜一指宽处。'
        - '翳风——耳垂后方的凹陷，用拇指腹按住，同时轻轻捏着耳垂转一转。'
    dose:
      - value: 3
        unit: '次'
        what: '头、肩、脸颊、颈部的穴位每组刺激次数'
        quote: '头、肩、脸颊、颈部的穴位，每组刺激 3 次'
      - value: 5
        unit: '次'
        what: '耳部穴位以拉扯方式的刺激次数'
        quote: '耳部的穴位则以拉扯的方式刺激 5 次'
      - value: 2
        valueMax: 3
        unit: '组'
        what: '全天合计组数'
        quote: '早、中、晚各做，全天合计 2 到 3 组'
      - value: 2
        unit: '周'
        what: '建议先坚持的周数'
        quote: '建议先坚持两周'
    steps:
      - id: locate-taiyang
        text: '太阳——眉毛外端与眼尾之间、往外约一拇指的凹陷处'
        quote: '太阳——眉毛外端与眼尾之间、往外约一拇指的凹陷处'
      - id: press-jianliao
        text: '颧髎——眼尾下方、颧骨下面的凹陷处，沿法令纹方向按'
        quote: '颧髎——眼尾下方、颧骨下面的凹陷处，沿法令纹方向按'
      - id: locate-jiache
        text: '颊车——下颌角往内斜一指宽处'
        quote: '颊车——下颌角往内斜一指宽处'
      - id: press-yifeng
        text: '翳风——耳垂后方的凹陷，用拇指腹按住，同时轻轻捏着耳垂转一转'
        quote: '翳风——耳垂后方的凹陷，用拇指腹按住，同时轻轻捏着耳垂转一转'
      - id: count-one-round
        text: '这一组算作一次'
        quote: '这一组算作一次'
      - id: press-without-pain
        text: '不痛的时候也该按'
        quote: '不痛的时候也该按'
