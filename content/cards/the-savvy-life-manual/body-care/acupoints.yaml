        quote: 腰痛：肾俞——沿腰线，在脊椎两侧两指处；不好按的时候，可以在地板上放个网球之类，躺上去压。委中——膝关节背面正中附近。
      - id: shoulder-stiffness
        text: 肩部僵硬：肩井——脖子根部与肩端的中点附近。合谷——拇指与食指的手骨交叉处、偏向食指的那个凹陷。
        quote: 肩部僵硬：肩井——脖子根部与肩端的中点附近。合谷——拇指与食指的手骨交叉处、偏向食指的那个凹陷。
      - id: stress
