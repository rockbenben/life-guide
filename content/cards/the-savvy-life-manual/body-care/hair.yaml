  - id: scalp-based-hair-care
    status: draft
    source:
      anchor: "洗发频率按头皮定"
    slot: anytime
    remind:
      text: "按头皮出油和头发变脏的速度决定洗发频率，并按发质使用洗发水和护发素"
      quote:
        - 洗多勤看头发多久变脏、变油。
        - 洗发水只上头皮不是整根头发
        - 护发素细软或笔直的只涂发尾，干燥卷曲的涂满全长
        - 轻柔洗发：使用泡沫轻柔地洗发，避免来回搓洗，以减少对头发的摩擦。
        - 头发干燥、缺乏弹性、分叉、不规则、失去光泽——这些大多不是各自独立的毛病，而是指向同一个原因：头发空洞化。它是多种头发问题的根源，源于蛋白质和水分的流失，而过度洗头正是导致这种流失的主要原因之一。节目的实验给了个具体数字：反复用力洗头 5 次，大约六成的头发就出现了空洞。
    steps:
      - id: choose-shampoo-frequency
        text: "直发加油性头皮可以每天洗干燥或卷曲的按需要洗，最少每 2 到 3 周一次。"
        quote:
          - "直发加油性头皮可以每天洗"
          - "干燥或卷曲的按需要洗，最少每 2 到 3 周一次。"
      - id: apply-shampoo-to-scalp
        text: "洗发水只上头皮不是整根头发"
        quote: "洗发水只上头皮不是整根头发"
      - id: apply-conditioner-by-hair-type
        text: "护发素细软或笔直的只涂发尾，干燥卷曲的涂满全长。"
        quote: "护发素细软或笔直的只涂发尾，干燥卷曲的涂满全长。"
      - id: comb-wet-hair-with-wide-teeth
        text: "湿着时头发最脆弱，用宽齿梳而不是刷子，先梳发尾再往上梳。"
        quote: "湿着时头发最脆弱，用宽齿梳而不是刷子，先梳发尾再往上梳。"
      - id: reduce-heat-damage
        text: "减少吹风，用低温或中温档配热保护产品。"
        quote: "减少吹风，用低温或中温档配热保护产品。"
