      reason: "自测血压的操作规范（何时测、静坐多久、几次取均值），是另一件事；血压波动阈值另见 blood-pressure.md"
    - anchor: "血管为什么会变硬：放松它的「肌肉」"
      reason: "原理解释（血管含肌肉、一氧化氮让血管保持柔软），只说明为什么有效，没有可执行动作"
