cards:
  - id: vascular-stretch
    status: reviewed
    name: "做血管拉伸改善硬化"
    source:
      anchor: "血管拉伸术"
    # 早晚各一轮，单一时段装不下，放 anytime。
    slot: anytime

    remind:
      text: "早晚各做一轮血管拉伸：5 个动作、两足各 2 回、每次 30 秒，动作之间休息约 30 秒"
      quote:
        - "5 个动作、两足各 2 回、每次 30 秒，每天早晚各做一轮，动作之间休息约 30 秒"

    dose:
      - value: 5
        unit: 个动作
        what: "拉伸动作"
        quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"
      - value: 2
        unit: 回
        what: "每个动作两足各"
        quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"
      - value: 30
        unit: 秒
        what: "每次保持"
        quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"
        approximate: true
      - value: 30
        unit: 秒
        what: "动作之间休息"
        quote: "动作之间休息约 30 秒是诀窍所在，不要连着做。"
        approximate: true
      - value: 1
        unit: 轮
        what: "每天早晚各做"
        quote: "每天早晚各做一轮"

    # 原文没给耗时，按仓库 AGENTS.md §8「血管拉伸一轮约 7 分钟（推算）」的同一算法推算：
    # 5 个动作 × 2 回 × 30 秒 + 4 次组间休息 × 30 秒 = 420 秒。
    # 读法：把「两足各 2 回」按每组动作 2 回计；若按每只脚各 2 回计则是 720 秒，等人工审阅时定。
    duration:
      basis: derived
      sec: 420
      formula: "5 个动作 × 2 回 × 30 秒 + 4 次组间休息 × 30 秒 = 420 秒（约 7 分钟）"

    steps:
      # 每一步的时长（2026-10-30 加）：原文的规则是「每次 30 秒」——
      # 那是**每个动作**的时长，不是整张卡的总时长（总时长在上面的 duration 里）。
      # 计时器按步走：这一步归零就跳下一步。
      - id: knee-back
        text: "一只脚向前伸出双手扶在膝盖上稳稳地把体重压上去"
        quote:
          - "一只脚向前伸出"
          - "双手扶在膝盖上"
          - "稳稳地把体重压上去"
        images:
          - "https://img.newzone.top/2024-10-14-09-03-58.png?imageMogr2/format/webp"
        duration:
          basis: quote
          sec: 30
          quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"

      - id: heel
        text: "正坐双手向前撑地一只脚向身后伸展保持背部挺直、视线朝前，伸展点在脚根"
        quote:
          - "正坐"
          - "双手向前撑地"
          - "一只脚向身后伸展"
          - "保持背部挺直、视线朝前，伸展点在脚根"
        images:
          - "https://img.newzone.top/2024-10-14-09-05-34.png?imageMogr2/format/webp"
        duration:
          basis: quote
          sec: 30
          quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"

      - id: thigh-front
        text: "双腿伸直坐着双手向后撑地一只脚向身后弯曲保持视线朝前"
        quote:
          - "双腿伸直坐着"
          - "双手向后撑地"
          - "一只脚向身后弯曲"
          - "保持视线朝前"
        images:
          - "https://img.newzone.top/2024-10-14-09-06-05.png?imageMogr2/format/webp"
        duration:
          basis: quote
          sec: 30
          quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"

      - id: calf
        text: "端坐，一膝立起双手撑住重心稳稳向前压注意脚跟不要离开地面"
        quote:
          - "端坐，一膝立起"
          - "双手撑住"
          - "重心稳稳向前压"
          - "注意脚跟不要离开地面"
        images:
          - "https://img.newzone.top/2024-10-14-09-06-41.png?imageMogr2/format/webp"
        duration:
          basis: quote
          sec: 30
          quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"

      - id: hip
        text: "躺下双手抱住一侧膝盖不要抬头伸展点在臀部"
        quote:
          - "躺下"
          - "双手抱住一侧膝盖"
          - "不要抬头"
          - "伸展点在臀部"
        images:
          - "https://img.newzone.top/2024-10-14-09-07-01.png?imageMogr2/format/webp"
        duration:
          basis: quote
          sec: 30
          quote: "共 5 个动作，两足各 2 回、每次 30 秒，动作之间休息约 30 秒，每天早晚各做一轮。"

      # 休息那一步**不计时长**（2026-10-30 定）：原文的规则是
      # 「动作之间休息约 30 秒」—— 休息是**动作之间**的，不是序列里的第 6 个动作。
      # 计时器按列表顺序走，把休息放在末尾会把它走成「做完 5 个动作之后歇一次」，
      # 与原文相反。所以这一步只有文字，没有读数（它不是 0 秒，是不参与计时）。
      # 卡级 duration 记的 420 秒是**整轮**（含两足各 2 回与 4 次组间休息）。
      - id: rest
        text: "动作之间休息约 30 秒是诀窍所在，不要连着做。"
        quote: "动作之间休息约 30 秒是诀窍所在，不要连着做。"

    cautions:
      - level: stop
        text: "有骨科系统疾病、或关节等部位出现疼痛症状的人，请不要进行这套练习。"
        quote: "有骨科系统疾病、或关节等部位出现疼痛症状的人，请不要进行这套练习。"
      - level: stop
        text: "膝、腰等部位已经出现疼痛的人不要做"
        quote: "膝、腰等部位已经出现疼痛的人不要做"
      - level: with-doctor
        text: "有基础疾病、身体状况有不安，或血压偏高、已接受医生运动指导的人，请先咨询家庭医生并遵其指导"
        quote: "有基础疾病、身体状况有不安，或血压偏高、已接受医生运动指导的人，请先咨询家庭医生并遵其指导"
      - level: stop
        text: "饮酒后不宜运动，餐后请隔 30 分钟以上"
        quote: "饮酒后不宜运动，餐后请隔 30 分钟以上"
      - level: info
        text: "除了这套拉伸，每天做 30 分钟有氧运动（如快走）同样能促进血液循环。"
        quote: "除了这套拉伸，每天做 30 分钟有氧运动（如快走）同样能促进血液循环。"
