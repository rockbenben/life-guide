article: the-savvy-life-manual/body-care/weight.md
kind: practice
coverage: partial
ignore:
  sections:
    - anchor: "体重不是越低越好：J 形曲线的两端都在涨"
      reason: "低体重与偏胖的死亡风险背景属于阅读性知识，已将低体重风险提炼为 BMI 卡的禁忌，不另制卡。"
    - anchor: "BMI 是一条 J 形曲线"
      reason: "J 形曲线、分档风险值及高龄者虚弱和肌少症风险属于风险知识，没有对应的可执行动作。"
    - anchor: "瘦得快的代价：两周掉一块牛排的肌肉"
      reason: "步行不足导致肌肉流失的实验结果与机制属于风险背景，已将减少进食的警告提炼为蛋白质卡的禁忌。"
  images: []
cards:
  - id: calculate-bmi-and-compare-body-type
    status: reviewed
    name: "算出自己的 BMI"
    source:
      anchor: "先算出自己的 BMI，再对体型"
    slot: anytime
    remind:
      text: "按身高和体重算出自己的 BMI"
      quote: "BMI 的算法——体重[kg] ÷ 身長[m] ÷ 身長[m]"
    steps:
      - id: calculate-bmi
        text: "体重[kg] ÷ 身長[m] ÷ 身長[m]"
        quote: "体重[kg] ÷ 身長[m] ÷ 身長[m]"
      - id: check-calculation-example
        text: "例如身高 150cm、体重 50kg：50 ÷ 1.5 ÷ 1.5 = 22.2。"
        quote: "例如身高 150cm、体重 50kg：50 ÷ 1.5 ÷ 1.5 = 22.2。"
      - id: compare-adult-standard
        text: "BMI 22 为标准体重、18.5 未满为低体重、25 以上为肥胖"
        quote:
          - BMI 22 为标准体重、18.5 未满为低体重、25 以上为肥胖
          - 体态问卷——说明书提供了一套10 个人体插图的量表，插图按实际 BMI 制作（女性 1～10 号对应 BMI 16.2 到 30.2）。做法是选出「最接近现在的自己」和「自己理想中的体型」两个答案。
      - id: choose-body-types
        text: "做法是选出「最接近现在的自己」和「自己理想中的体型」两个答案。"
        quote: "做法是选出「最接近现在的自己」和「自己理想中的体型」两个答案。"
    cautions:
      - level: stop
        text: "图中的 BMI 数值与低体重、肥胖的划分是成人标准，未成年人不能套用。"
        quote: "图中的 BMI 数值与低体重、肥胖的划分是成人标准，未成年人不能套用。"
      - level: stop
        text: "不是「再瘦一点」，而是偏瘦本身就是风险。"
        quote: "不是「再瘦一点」，而是偏瘦本身就是风险。"
    review:
      by: benson
      date: 2026-10-21
      hash: a98174c263c19217

  - id: calculate-daily-protein-intake
    status: reviewed
    name: "按体重算蛋白质"
