        text: 知道味噌的本事之后，这一份说明书给的是两条能立刻上手的路：一是搞清楚它跟什么材最合拍，二是把它煎一煎把浓缩度拉到极限。
        quote: '知道味噌的本事之后，这一份说明书给的是两条能立刻上手的路：一是搞清楚它跟什么材最合拍，二是把它煎一煎把浓缩度拉到极限。'
