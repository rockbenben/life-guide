    status: reviewed
    name: "味噌增鲜增香"
    source:
      anchor: '味噌：酱爆煎香增浓，番茄牛奶味噌汤'
    slot: anytime
    remind:
      text: 今天用味噌为菜增加鲜味和香气
      quote:
        - '味噌在日本从室町时代起就撑着日本人的餐桌，被人爱了这么多年，理由只有两个字：鲜味和香气。'
        - '知道味噌的本事之后，这一份说明书给的是两条能立刻上手的路：一是搞清楚它跟什么材最合拍，二是把它煎一煎把浓缩度拉到极限。'
    steps:
