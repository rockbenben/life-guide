  - id: temper-acidity-and-odor-with-miso
    status: reviewed
    source:
      anchor: '味噌的本事：压酸味、也压异味'
    slot: anytime
    remind:
      text: 今天用味噌缓和酸味并压住鱼肉的异味
      quote:
        - 关键是味噌能抑制酸味。
        - 同时味噌还有抑制食材难闻气味的能力。
        - 关键是味噌能抑制酸味。味噌里的鲜味成分氨基酸有把酸味变柔和的效果，最典型的例子就是「酢みそ」——醋的强烈酸味一遇到味噌就被缓和掉，从一碟酸醋变成能勾开食欲的调味料。
    steps:
      - id: soften-acidity
        text: 最典型的例子就是「酢みそ」——醋的强烈酸味一遇到味噌就被缓和掉，从一碟酸醋变成能勾开食欲的调味料。
        quote:
          - 最典型的例子就是「酢みそ」——醋的强烈酸味一遇到味噌就被缓和掉，从一碟酸醋变成能勾开食欲的调味料。
          - 这道菜来自 60 多年前一本料理本。被称作怀石料理第一人的辻嘉一（1907～1988），在 1959 年发行的《味噌汁三百六十五日》里，把味噌和意想不到的食材搭配玩到极致，番茄牛奶味噌汤就是其中之一。
      - id: mask-ingredient-odor
        text: 味噌含大豆来源的蛋白质和油脂，这层油会吸附鱼的生臭和肉的腥味。
        quote: '味噌含大豆来源的蛋白质和油脂，这层油会吸附鱼的生臭和肉的腥味。'
      - id: bring-out-miso-aroma
        text: 食材的臭味被封住之后，反过来把味噌丰富的香气引出来，整道菜的味道会整体上一个台阶。
        quote: '食材的臭味被封住之后，反过来把味噌丰富的香气引出来，整道菜的味道会整体上一个台阶。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: a48df9df6d729d05
    name: 用味噌压酸味和异味

  - id: miso-golden-triangle-sauces
    status: reviewed
    name: "用味噌调番茄奶酱"
    source:
      anchor: '法则：乳制品 ＋ 酸味食材 ＋ 味噌'
    slot: anytime
    remind:
      text: 今天按乳制品、酸味食材和味噌的组合做番茄牛奶味噌汁或即拌酱汁
      quote:
        - 三个位置分别是「乳制品」「有酸味的食材」「味噌」。
        - 这一组只要把材料混在一起就好吃，用平底锅或微波炉温一下，味道会更融合。
        - 这就是番茄牛奶味噌汤成立的逻辑：味噌压住食材的臭味，上面再叠加番茄变漂亮之后的酸味和牛奶的脂质带来的深度，两股力量相乘。说明书把这条规律总结成一个公式，记下它，从沙拉酱到主菜的调味，味噌都能大显身手。
    dose:
      - value: 150
        unit: mL
        what: 番茄牛奶味噌汁的水量
        quote: '水 150mL'
      - value: 150
        unit: mL
        what: 番茄牛奶味噌汁的牛乳用量
        quote: '牛乳 150mL'
      - value: 20
        unit: g
        what: 番茄牛奶味噌汁的米味噌用量
        quote: '米味噌（盐分 12%）20g'
    steps:
      - id: build-golden-triangle
        text: 三个位置分别是「乳制品」「有酸味的食材」「味噌」。
        quote: '三个位置分别是「乳制品」「有酸味的食材」「味噌」。'
      - id: prep-tomato-milk-soup
        text: '番茄切成 2cm 见方。锅里放水和牛乳点火，弱火一边搅拌，快沸腾前就关火，再把米味噌化开。'
        quote:
          - '番茄切成 2cm 见方。'
          - '锅里放水和牛乳点火，弱火一边搅拌，快沸腾前就关火，再把米味噌化开。'
      - id: finish-tomato-milk-soup
        text: 加番茄，温热后按喜好撒欧芹，完成。
        quote: '加番茄，温热后按喜好撒欧芹，完成。'
      - id: warm-sauces
        text: 用平底锅或微波炉温一下，味道会更融合。
        quote:
          - 用平底锅或微波炉温一下，味道会更融合。
          - 味噌在日本从室町时代起就撑着日本人的餐桌，被人爱了这么多年，理由只有两个字：鲜味和香气。米味噌由大豆、米曲霉和盐做成，混合之后要「寝かせる」——放一段时间让发酵和熟成推进：米曲霉里的微生物把大豆和米的成分分解，造出葡萄糖和作为鲜味基础的氨基酸；同时酵母菌和乳酸菌工作，从这些成分里做出酒精、有机酸等香气的前提物质。氨基酸再和糖发生「迈拉尔反应」，味噌的浓缩感和鲜味就一层层凝实了。^[「みそ」のトリセツ]
      - id: mix-instant-sauces
        text: '配白身鱼刚刚好！白酱「生奶油 ＋ 食醋 ＋ 米味噌」：生奶油 40g、食醋 7.5g、米味噌（盐分 12%）10g。辣味画龙点睛！适合炸物「酸奶 ＋ 辣酱 ＋ 米味噌」：酸奶 60g、辣酱 10 振（随手一撒的量）、米味噌（盐分 12%）20g。不会输给肉的鲜味！「炼乳 ＋ 巴萨米醋 ＋ 米味噌」：炼乳 4g、巴萨米醋 20g、米味噌（盐分 12%）20g。给黄油煎物增加醇厚感！「黄油 ＋ 芥末 ＋ 味噌」：融化黄油 20g、粗粒芥末 5g、米味噌（盐分 12%）10g。'
        quote:
          - '配白身鱼刚刚好！白酱「生奶油 ＋ 食醋 ＋ 米味噌」：生奶油 40g、食醋 7.5g、米味噌（盐分 12%）10g。'
          - '辣味画龙点睛！适合炸物「酸奶 ＋ 辣酱 ＋ 米味噌」：酸奶 60g、辣酱 10 振（随手一撒的量）、米味噌（盐分 12%）20g。'
          - '不会输给肉的鲜味！「炼乳 ＋ 巴萨米醋 ＋ 米味噌」：炼乳 4g、巴萨米醋 20g、米味噌（盐分 12%）20g。'
          - '给黄油煎物增加醇厚感！「黄油 ＋ 芥末 ＋ 味噌」：融化黄油 20g、粗粒芥末 5g、米味噌（盐分 12%）10g。'
    cautions:
      - level: info
        text: 牛乳加热过度蛋白质容易凝固。不要煮沸，一边搅拌一边温热就好。
        quote: '牛乳加热过度蛋白质容易凝固。不要煮沸，一边搅拌一边温热就好。'
      - level: info
        text: 要连肉一起加热时，味噌容易焦，要加 1 大勺水。
        quote: '要连肉一起加热时，味噌容易焦，要加 1 大勺水。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: ae5053ea62499e78

  - id: sauce-burst-miso-method-and-dishes
    status: reviewed
    source:
      anchor: '酱爆：把味噌的醇厚推到极限'
    slot: anytime
    remind:
      text: 今天用酱爆法做味噌料理
      quote: '中国菜里这叫「酱爆（ジャンバオ）」——用烧到高温的锅里的油把味噌炒香，再和食材裹在一起，是传统做法，要让味噌的醇厚和香气立起来，这一步少不了。'
    steps:
      - id: sear-miso
        text: 基本手法：平底锅加 1 大勺油，把味噌薄薄摊开，两面都煎。煎的程度以味噌边缘微微焦香为准。
        quote: '基本手法：平底锅加 1 大勺油，把味噌薄薄摊开，两面都煎。煎的程度以味噌边缘微微焦香为准。'
      - id: control-heat
        text: 火候：用弱火偏中。味噌容易焦、也可能飞溅；不熟练就先用小火，一边确认煎的程度一边加火。
        quote: '火候：用弱火偏中。味噌容易焦、也可能飞溅；不熟练就先用小火，一边确认煎的程度一边加火。'
      - id: split-miso
        text: 做豚汁、味噌拉面这类要突出味噌香气的菜，只把分量的三分之一拿去酱爆，剩下的在快做好时再放。
        quote: '做豚汁、味噌拉面这类要突出味噌香气的菜，只把分量的三分之一拿去酱爆，剩下的在快做好时再放。'
      - id: cook-tonjiru
        text: '猪五花肉切 3cm 长；胡萝卜和白萝卜切半月片（いちょう切り）；牛蒡切细丝（ささがき）；葱切成 1cm 长斜切；蒟蒻撕成一口大小。先做酱爆：平底锅热油，放入米味噌（大勺 1/2），弱火偏中把它薄薄摊开，两面煎上色，再加入猪肉翻炒。加入切好的蔬菜略炒，加水、盖上盖子，弱火煮到蔬菜变软。关火，加入剩下的味噌（大勺 1 又 1/2）化开。'
        quote:
          - '猪五花肉切 3cm 长；胡萝卜和白萝卜切半月片（いちょう切り）；牛蒡切细丝（ささがき）；葱切成 1cm 长斜切；蒟蒻撕成一口大小。'
          - '先做酱爆：平底锅热油，放入米味噌（大勺 1/2），弱火偏中把它薄薄摊开，两面煎上色，再加入猪肉翻炒。'
          - '加入①切好的蔬菜略炒，加水、盖上盖子，弱火煮到蔬菜变软。'
          - '关火，加入剩下的味噌（大勺 1 又 1/2）化开。'
      - id: cook-ramen
        text: '平底锅放芝麻油、蒜、生姜，中火炒到香味出来。加入的猪五花肉继续炒，再放洋葱、豆芽，然后加入味噌（大勺 2），弱火炒 10 分钟。关火，加入剩下的味噌（大勺 3）化开，再淋上收尾用的芝麻油。另起一锅把中華面按包装标示煮熟，沥干装碗，浇上，按喜好撒玉米和青葱。'
        quote:
          - '平底锅放芝麻油、蒜、生姜，中火炒到香味出来。'
          - '加入①的猪五花肉继续炒，再放洋葱、豆芽，然后加入味噌（大勺 2），弱火炒 10 分钟。'
          - '关火，加入剩下的味噌（大勺 3）化开，再淋上收尾用的芝麻油。'
          - '另起一锅把中華面按包装标示煮熟，沥干装碗，浇上④，按喜好撒玉米和青葱。'
        duration:
          basis: quote
          sec: 600
          quote: 加入①的猪五花肉继续炒，再放洋葱、豆芽，然后加入味噌（大勺 2），弱火炒 10 分钟。
      - id: cook-gratin
        text: '先用黄油做酱爆：平底锅放黄油，中火加热，融化后放入味噌薄薄摊开，两面煎上色。加培根、蘑菇、虾，中火翻炒，虾变色后加入面粉再炒 2 分钟。里加入牛乳煮沸，充分搅拌上浆，加入煮好的通心粉快速拌匀。盛入耐热容器，撒上起司，放进烤面包机烤 10 分钟左右。'
        quote:
          - '先用黄油做酱爆：平底锅放黄油，中火加热，融化后放入味噌薄薄摊开，两面煎上色。'
          - '加培根、蘑菇、虾，中火翻炒，虾变色后加入面粉再炒 2 分钟。'
          - '②里加入牛乳煮沸，充分搅拌上浆，加入煮好的通心粉快速拌匀。'
          - '③盛入耐热容器，撒上起司，放进烤面包机烤 10 分钟左右。'
        duration:
          basis: quote
          sec: 120
          quote: 加培根、蘑菇、虾，中火翻炒，虾变色后加入面粉再炒 2 分钟。
    cautions:
      - level: info
        text: 味噌容易焦、也可能飞溅；不熟练就先用小火，一边确认煎的程度一边加火。
        quote: '味噌容易焦、也可能飞溅；不熟练就先用小火，一边确认煎的程度一边加火。'
      - level: info
        text: 换用米味噌以外的味噌时，请按盐分浓度 12% 换算分量再下锅。
        quote: '换用米味噌以外的味噌时，请按盐分浓度 12% 换算分量再下锅。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: 51ce67ec708232b6
