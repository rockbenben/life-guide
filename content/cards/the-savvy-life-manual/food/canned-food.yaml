ignore:
  sections:
    - anchor: '六道用罐头做的快手食谱'
      reason: '本节未能完整抽卡：受全篇最多六张卡限制，只保留步骤较直接的鲭鱼清汤、鲭鱼卷心菜和鲭鱼茶泡涮；土豆泥焖饭、卡尔马坦风炖菜、油浸沙丁鱼黄油抹面包未另作卡片。'
    - anchor: '另一面：水果罐头与旧罐头'
      reason: '本节仅抽出水果罐头糖浆拌酸奶；关于油浸鱼罐头熟成和旧罐头风味的说明未另作卡片。'
    - anchor: '罐头汁为什么比浓缩高汤还鲜'
      reason: '本节是鲜味浓缩与密封杀菌原理的知识性说明，相关稀释使用原则已合并进“罐头：把汤汁当高汤用，别倒掉”卡片。'
  images: []
cards:
  - id: dilute-canned-stock
    status: reviewed
    source:
      anchor: '罐头：把汤汁当高汤用，别倒掉'
    slot: anytime
    remind:
      text: '把罐头汁稀释后当高汤用，不要直接当汤喝。'
      quote: '罐头最该留住的是汤汁：它是「超浓缩高汤」，日本料理人野崎洋光的用法是稀释后当高汤用，而不是直接当汤喝——鲭鱼罐头汁只放 15ml，其余用水补足。'
    dose:
      - value: 15
        unit: ml
        what: '鲭鱼罐头汁用量'
        quote: '鲭鱼罐头汁只放 15ml，其余用水补足。'
    steps:
      - id: transfer-after-opening
        text: '开罐当天就要倒进别的容器并尽快吃完。'
        quote: '开罐当天就要倒进别的容器并尽快吃完。'
      - id: dilute-canned-stock
        text: '把罐头汁「稀释」后使用。'
        quote:
          - 把罐头汁「稀释」后使用。
          - 而更关键的一点是加的水比普通煮鱼少得多——普通煮鱼的水最后大半都被倒掉了，罐头的液体却留在了罐内。溶进汤里的鲜味成分因此被浓缩。
    cautions:
      - level: info
        text: '被浓缩过的美味如果直接拿来做菜，反而会让菜变咸发涩。'
        quote: '被浓缩过的美味如果直接拿来做菜，反而会让菜变咸发涩。'
    review:
      by: benson
      date: 2026-10-21
      hash: 5f966209dd6fe61b

  - id: opened-can-two-rules
    status: reviewed
    source:
      anchor: '开罐后的两条规则'
    slot: anytime
    remind:
      text: '开罐当天就要倒进别的容器并尽快吃完。'
      quote:
        - 开罐当天就要倒进别的容器并尽快吃完。
        - 转移到别的容器。即使内容物还剩很多，也请立刻倒进别的容器。
    steps:
      - id: move-to-container
        text: '即使内容物还剩很多，也请立刻倒进别的容器。'
        quote: '即使内容物还剩很多，也请立刻倒进别的容器。'
      - id: eat-after-opening
        text: '开罐后外气会进入，罐体本身也会随之劣化。'
        quote:
          - 开罐后外气会进入，罐体本身也会随之劣化。
          - 尽快吃掉。开罐后外气会进入，罐体本身也会随之劣化。
    cautions:
      - level: stop
        text: '厚生劳动省认为对成年人没有影响，但面向孕妇和婴幼儿家长发出提醒：应回避每餐都以罐头为中心的饮食。'
        quote: '厚生劳动省认为对成年人没有影响，但面向孕妇和婴幼儿家长发出提醒：应回避每餐都以罐头为中心的饮食。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
