  - id: blanched-sweet-cabbage
    status: reviewed
    source:
      anchor: '四道食谱，两种变体'
    slot: anytime
    remind:
      text: '用 2.5% 盐水焯出超甜卷心菜'
      quote:
        - 整颗带芯用 2.5% 盐水焯，是本篇的招牌做法。
        - 甜卷心菜 150g（约 1/8 颗）
    dose:
      - value: 2.5
        unit: '%'
        what: '盐水浓度'
        quote: '整颗带芯用 2.5% 盐水焯，是本篇的招牌做法。'
      - value: 300
        valueMax: 350
        unit: 'g'
        what: '每份卷心菜重量'
        quote: '卷心菜 1/4 颗（300～350g）'
      - value: 1.5
        unit: 'L'
        what: '水用量'
        quote: '水 1.5L'
      - value: 37.5
        unit: 'g'
        what: '盐用量'
        quote: '盐 37.5g（约 2～2.5 大勺）'
    duration:
      basis: derived
      sec: 210
      formula: '2 分钟 × 60 + 1 分钟 × 60 + 30 秒 = 210 秒'
    steps:
      - id: boil-salted-water
        text: '水 1.5L盐 37.5g（约 2～2.5 大勺）锅中加水加盐，盖上盖子用大火充分煮沸，把盐完全化开。'
        quote:
          - '水 1.5L'
          - '盐 37.5g（约 2～2.5 大勺）'
          - '锅中加水加盐，盖上盖子用大火充分煮沸，把盐完全化开。'
      - id: add-whole-cabbage
        text: '转小火，把留着芯的卷心菜外层叶子朝下放入。'
        quote: '转小火，把留着芯的卷心菜外层叶子朝下放入。'
      - id: judge-heat
        text: '判断火候：水面刚冒出细密小泡的程度最好；轻轻晃动，让火候也能传到叶子的根部。'
        quote: '判断火候：水面刚冒出细密小泡的程度最好；轻轻晃动，让火候也能传到叶子的根部。'
      - id: blanch-two-minutes
        text: '焯满 2 分钟后，先取出外层叶放进装了水的碗里，余下部分边抖散叶片边继续焯。'
        quote: '焯满 2 分钟后，先取出外层叶放进装了水的碗里，余下部分边抖散叶片边继续焯。'
      - id: blanch-one-more-minute
        text: '再焯 1 分钟，把剩下的叶片也取出，放进 30 秒冷水里浸泡去咸。沥干即可上桌。'
        quote:
          - '再焯 1 分钟，把剩下的叶片也取出，放进 30 秒冷水里浸泡去咸。'
          - '沥干即可上桌。'
    cautions:
      - level: info
        text: '若水量只有 1L，则用盐 25g（2.5% 盐水为最佳）'
        quote: '若水量只有 1L，则用盐 25g（2.5% 盐水为最佳）'
