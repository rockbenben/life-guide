  - id: avocado-meat-roll
    status: reviewed
    source:
      anchor: '混进肉馅的两道主菜'
    slot: anytime
    remind:
      text: '做牛油果肉饼卷时，用肉馅包住水煮蛋，裹上烘焙纸和铝箔后烤制，出炉后等其定形。'
      quote:
        - 牛油果去皮去核压碎；绞肉加盐搅打至出黏性后，与牛油果、洋葱末、面包糠混合均匀。
        - 在烘焙纸上把肉馅摊成厚薄均匀的片，放上横放的水煮蛋包裹；整体整理成椭圆，上下翻转一次让两端口合拢，外面再裹一层铝箔，整形。
        - 取出后重新封上，晾到不烫手——成品很软，容易散，切的时候要等它彻底定形。
        - 防破裂要点：包蛋时不要留空气；包好后把合口朝下压实，再用烘焙纸和铝箔包住，就不容易爆开。
    dose:
