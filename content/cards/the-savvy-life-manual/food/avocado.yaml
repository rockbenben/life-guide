  - id: milk-boil-ripening
    status: reviewed
    name: "牛奶煮牛油果催熟"
    source:
      anchor: '牛油果怎么催熟？牛奶中火煮 10 分钟就变软'
    slot: anytime
    remind:
      text: '牛油果果肉切块放入沸腾的牛奶中，中火煮 10 分钟'
      quote:
        - 牛油果果肉切块放入沸腾的牛奶中，中火煮 10 分钟
        - 这篇给煮牛奶催熟这一招，外加它延伸出来的三道热菜、两道混进肉馅的主菜、「稍微加一点」的配角用法，和发褐后打成果昔的救场法。具体做法是：牛油果果肉切块放入沸腾的牛奶中，中火煮 10 分钟——此过程中细胞间的果胶会被破坏，使果实进入说明书所说的「反式消除」状态，甚至坚硬的牛油果也会迅速变软，口感更加奶油滑腻；若仅需使用果肉，捞出后可放入冰箱冷藏 20 分钟再用。
    effect:
      text: '甚至坚硬的牛油果也会迅速变软，口感更加奶油滑腻'
      quote: '甚至坚硬的牛油果也会迅速变软，口感更加奶油滑腻'
    dose:
      - value: 10
        unit: '分钟'
        what: '牛奶加热时长'
        quote: '中火煮 10 分钟'
      - value: 20
        unit: '分钟'
        what: '果肉冷藏时长'
        quote: '若仅需使用果肉，捞出后可放入冰箱冷藏 20 分钟再用'
    duration:
      basis: quote
      sec: 600
      quote: '中火煮 10 分钟'
    steps:
      - id: add-avocado-to-milk
        text: '牛油果果肉切块放入沸腾的牛奶中'
        quote: '牛油果果肉切块放入沸腾的牛奶中'
      - id: simmer-in-milk
        text: '中火煮 10 分钟'
        quote: '中火煮 10 分钟'
      - id: soften-avocado
        text: '细胞间的果胶会被破坏甚至坚硬的牛油果也会迅速变软，口感更加奶油滑腻'
        quote:
          - '细胞间的果胶会被破坏'
          - '甚至坚硬的牛油果也会迅速变软，口感更加奶油滑腻'
      - id: chill-flesh
        text: '若仅需使用果肉，捞出后可放入冰箱冷藏 20 分钟再用'
        quote: '若仅需使用果肉，捞出后可放入冰箱冷藏 20 分钟再用'
    review:
      by: benson
      date: 2026-10-21
      hash: 9d78a0c9ebe21a56

