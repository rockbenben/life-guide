        unit: 个
        what: 猕猴桃用量
        quote: '猕猴桃 2 个'
      - value: 1
        unit: 小勺
        what: 想更甜时的蜂蜜用量
        quote: '蜂蜜 1 小勺'
      - value: 1
        unit: 小勺
        what: 想更清爽时的柠檬汁用量
        quote: '柠檬汁 1 小勺'
    duration:
      basis: derived
      sec: 3600
      quote: '冷冻约 1 小时'
      formula: '约 1 小时 × 60 分钟/小时 × 60 秒/分钟 = 约 3600 秒'
    steps:
