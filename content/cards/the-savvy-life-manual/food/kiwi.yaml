cards:
  - id: daily-two-green-kiwis
    status: reviewed
    name: "每天 2 个猕猴桃"
    source:
      anchor: '健康数据：498 人、2 周、68%'
    slot: anytime
    remind:
      text: '每天 2 个绿色猕猴桃持续 2 周'
      quote:
        - 每天 2 个绿色猕猴桃
        - 持续 2 周
        - 这一集分两条线：一条是健康功效有研究背书，另一条是超市里怎么买到好吃的那一颗。功效方面，猕猴桃被写进了日本消化科医生诊疗时使用的《便通异常症诊疗指南 2023》，作为对便秘有效的食物记载。说明书这一集的标题写作「1,000 万人を救う！？」，但这一千万的数字在说明书里没有给出出处，只作为栏目标题出现。^[「キウイ」のトリセツ]
    effect:
      text: '「每天都能排便」的人的比例，实验前 0% → 2 周后 68%'
      quote:
        - '「每天都能排便」的人的比例，'
        - '实验前 0% → 2 周后 68%'
    dose:
      - value: 2
        unit: 个
        what: 每天绿色猕猴桃的用量
        quote: '每天 2 个绿色猕猴桃'
    duration:
      basis: derived
      sec: 1209600
      quote: '持续 2 周'
      formula: '2 周 × 7 天/周 × 24 小时/天 × 60 分钟/小时 × 60 秒/分钟 = 1209600 秒'
    steps:
      - id: eat-two-green-kiwis
        text: '每天 2 个绿色猕猴桃持续 2 周'
        quote:
          - '每天 2 个绿色猕猴桃'
          - '持续 2 周'
    cautions:
      - level: info
        text: '「数日才排便一次」的498 人'
        quote:
          - '「数日才排便一次」的'
          - '498 人'
    review:
      by: benson
      date: 2026-10-21
      hash: 6d0cb9522ec991b0

