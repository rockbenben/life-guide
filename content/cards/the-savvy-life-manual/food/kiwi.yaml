  - id: kiwi-shaved-ice
    status: reviewed
    source:
      anchor: '软猕猴桃才做得出来的吃法'
    slot: anytime
    remind:
      text: '把猕猴桃捏碎冷冻，保留一点柔软度时剪开袋角挤入容器'
      quote:
        - '用手捏碎'
        - '连袋子一起'
        - '放进冰箱，'
        - '冷冻约 1 小时'
        - '还留一点柔软度'
        - '剪开袋角挤到容器里'
