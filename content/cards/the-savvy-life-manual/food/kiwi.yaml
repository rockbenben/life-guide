  - id: eat-slightly-under-soft-kiwi
    status: reviewed
    name: "吃欠一点软的猕猴桃"
    source:
      anchor: '挑果法②：吃的时候要「稍微欠软」'
    slot: anytime
    remind:
      text: '吃的时候选「稍微欠一点软」的猕猴桃'
      quote: '专业买手挑的适食期是「稍微欠一点软」'
    effect:
      text: '稍微欠软的猕猴桃，味道才显得更浓酸味：↑27%清爽的香气：↑25%甜味：↑2%多汁度：↑10%'
      quote:
        - '稍微欠软的猕猴桃，味道才显得更浓'
        - '酸味：↑27%'
        - '清爽的香气：↑25%'
        - '甜味：↑2%'
        - '多汁度：↑10%'
    steps:
      - id: pick-slightly-under-soft
        text: '「稍微欠一点软」'
        quote: '「稍微欠一点软」'
      - id: compare-with-soft-kiwi
        text: '把它和软猕猴桃对比着吃，确认差别'
        quote: '把它和软猕猴桃对比着吃，确认差别'
      - id: judge-hardness-by-reference
        text: '长葱尖端的白色部分手腕弯到 90 度时根部那一块（能摸到脉搏的部分）太阳穴'
        quote:
          - 长葱尖端的白色部分
          - 手腕弯到 90 度时根部那一块（能摸到脉搏的部分）
          - 太阳穴
          - 猕猴桃放着继续后熟，就能软到刚刚好。说明书推荐的存放位置是冰箱的蔬菜室，并且指出：在 10℃ 左右的温度下保存，会慢慢变软——低温让软化过程变慢，反而更容易判断硬度。
      - id: ripen-in-vegetable-drawer
        text: '放着继续后熟冰箱的蔬菜室在 10℃ 左右的温度下保存，会慢慢变软'
        quote:
          - 放着继续后熟
          - 冰箱的蔬菜室
          - 在 10℃ 左右的温度下保存，会慢慢变软
          - 猕猴桃放着继续后熟，就能软到刚刚好。说明书推荐的存放位置是冰箱的蔬菜室，并且指出：在 10℃ 左右的温度下保存，会慢慢变软——低温让软化过程变慢，反而更容易判断硬度。
    cautions:
      - level: stop
        text: '在卖场里，请不要用力去捏猕猴桃'
        quote:
          - '在卖场里，'
          - '请不要用力去捏猕猴桃'
      - level: info
        text: '这些百分比是感官比，不是绝对含量'
        quote: '这些百分比是感官比，不是绝对含量'
