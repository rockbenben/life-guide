  - id: garlic-slice-hot-water
    status: reviewed
    name: "大蒜切片泡热水"
    source:
      anchor: '大蒜别磨蒜泥？切片泡 90℃ 热水 10 分钟'
    slot: anytime
    remind:
      text: '将大蒜切片后用 90℃ 以上的热水浸泡。'
      quote:
        - '蒜切碎了炒只有冲鼻的辣味，一点蒜香都没有？问题出在别把蒜磨成蒜泥。'
        - '切片后用 90℃ 以上的热水泡 10 分钟，实测阿利因提取率约 47%（蒜泥约 7%、整瓣不处理约 4%）。'
    effect:
      text: '切片后用 90℃ 以上的热水泡 10 分钟，实测阿利因提取率约 47%（蒜泥约 7%、整瓣不处理约 4%）。热让酵素停止活动（阿利因就不会被转成阿利辛），而阿利因本身易溶于水，于是从细胞内被「搬」进汤里。'
      quote:
        - '切片后用 90℃ 以上的热水泡 10 分钟，实测阿利因提取率约 47%（蒜泥约 7%、整瓣不处理约 4%）。'
