  - id: garlic-tenjin-rice
    status: reviewed
    source:
      anchor: '四道蒜水食谱'
    slot: anytime
    remind:
      text: '制作蒜部天津饭，分别处理米饭、浇汁和蛋卷。'
      quote:
        - '三个部分分别处理，蒜出现在每一处：'
        - '组合：盘中盛米饭 → 放上蛋卷 → 浇汁 → 撒小葱。'
    steps:
      - id: cook-tenjin-rice
        text: '【米饭】——蒜 2 瓣（不切，整瓣放入）、米 约 300g（生米 2 杯）、小葱 适量、盐 少许：米和正常水量一起下电饭煲，连蒜整瓣一起煮。'
        quote: '【米饭】——蒜 2 瓣（不切，整瓣放入）、米 约 300g（生米 2 杯）、小葱 适量、盐 少许：米和正常水量一起下电饭煲，连蒜整瓣一起煮。'
      - id: make-tenjin-sauce
        text: '【浇汁】——蒜片 2 瓣、水 400mL、酱油 2½ 小勺、砂糖 2½ 小勺、醋 ½ 小勺、盐 1 小勺、葛粉 2 小勺 + 水 2 小勺：水烧开下蒜片和调料，中火煮 3～4 分钟，再用调好的葛粉水勾芡。'
        quote: '【浇汁】——蒜片 2 瓣、水 400mL、酱油 2½ 小勺、砂糖 2½ 小勺、醋 ½ 小勺、盐 1 小勺、葛粉 2 小勺 + 水 2 小勺：水烧开下蒜片和调料，中火煮 3～4 分钟，再用调好的葛粉水勾芡。'
