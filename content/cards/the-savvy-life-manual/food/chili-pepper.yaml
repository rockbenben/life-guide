        - '冷藏一晚，完成。'
    effect:
      text: '颜色变深，就是甜香出来的信号，别炒过头。'
      quote: '颜色变深，就是甜香出来的信号，别炒过头。'
    dose:
      - value: 15
        unit: g
        what: '一味辣椒用量'
        quote: '一味辣椒 15g'
      - value: 150
        unit: g
        what: '食用油用量'
        quote: '油 150g'
    duration:
      basis: quote
      sec: 60
