  - id: chili-oil-hot-oil
    status: reviewed
    name: "泼热油做辣椒油"
    source:
      anchor: '做法二：泼油型，甜香更明显'
    slot: anytime
    remind:
      text: '将15g一味辣椒与1小勺水拌匀，浇上150g的160℃热油，晾到常温后冷藏一晚。'
      quote:
        - 一味辣椒 15g
        - 油 150g
        - 加 1 小勺水拌匀
        - 另起锅把油加热到 160℃。
        - 晾到常温，再冷藏一晚，完成。
        - 一味辣椒的甜香必须加热才出得来：15g 下锅强火干炒 1 分钟（颜色变深就是甜香出来的信号），倒入 150g 常温油浸泡、冷藏一晚；想更甜就先加 1 小勺水拌匀，再浇上 160℃ 的热油。菜做好后只淋 1～2 大勺即可。下面是两个做法和四个「只淋油」的吃法。^[「一味とうがらし」のトリセツ]
    effect:
      text: '同样的辣椒和油，只多一步水，香气被拉得更满加热之后甜香成分增加'
      quote:
        - '同样的辣椒和油，只多一步水，香气被拉得更满'
        - '加热之后甜香成分增加'
    dose:
      - value: 15
        unit: g
        what: '一味辣椒用量'
        quote: '一味辣椒 15g'
      - value: 150
        unit: g
        what: '食用油用量'
        quote: '油 150g'
      - value: 1
        unit: 小勺
        what: '加入的水量'
        quote: '水 1 小勺'
    steps:
      - id: mix-chili-and-water
        text: '一味辣椒放进耐热碗，加 1 小勺水拌匀。'
        quote: '一味辣椒放进耐热碗，加 1 小勺水拌匀。'
      - id: check-small-bubbles
        text: '插一根筷子进去，冒出细小气泡就可以了。'
        quote: '插一根筷子进去，冒出细小气泡就可以了。'
      - id: heat-oil
        text: '另起锅把油加热到 160℃。'
        quote: '另起锅把油加热到 160℃。'
      - id: pour-hot-oil
        text: '热油直接浇进盛辣椒的碗里。'
        quote: '热油直接浇进盛辣椒的碗里。'
      - id: cool-and-chill
        text: '晾到常温，再冷藏一晚，完成。'
        quote: '晾到常温，再冷藏一晚，完成。'
    cautions:
      - level: stop
        text: '浇热油这一步会溅油、冒烟，务必在周围没有任何东西、通风良好的地方操作。'
        quote: '浇热油这一步会溅油、冒烟，务必在周围没有任何东西、通风良好的地方操作。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 8d49bb8bf8255e3a

  - id: chili-oil-four-uses
    status: reviewed
    name: "菜做好后淋辣椒油"
    source:
      anchor: '怎么用：四个「只淋油」的做法'
    slot: anytime
    remind:
      text: '菜做好后每道菜淋1～2大勺辣椒油。'
      quote:
        - '菜本身怎么烧都行，最后淋一勺油就成立'
        - '每道菜 1～2 大勺为宜'
    dose:
      - value: 1
        valueMax: 2
        unit: 大勺
        what: '每道菜用量'
        quote: '每道菜 1～2 大勺为宜'
    steps:
      - id: serve-with-shrimp
        text: '香辣虾（エビチリ）：现成的熟虾浇淋上辣椒油，醇厚感和香气一起上去，味道立刻变成正经中餐馆的水平；'
        quote: '香辣虾（エビチリ）：现成的熟虾浇淋上辣椒油，醇厚感和香气一起上去，味道立刻变成正经中餐馆的水平；'
      - id: serve-with-chicken
        text: '口水鸡（よだれ鶏）：蒸熟的鸡腿肉加盐，淋油即可，把甜香吃得最完整的一个吃法；'
        quote: '口水鸡（よだれ鶏）：蒸熟的鸡腿肉加盐，淋油即可，把甜香吃得最完整的一个吃法；'
      - id: serve-with-sashimi
        text: '薄切拼盘（カルパッチョ）：超市买的刺身加盐后淋油，白身鱼、章鱼都合适；'
        quote: '薄切拼盘（カルパッチョ）：超市买的刺身加盐后淋油，白身鱼、章鱼都合适；'
      - id: serve-with-ice-cream
        text: '香草冰淇淋：淋在冰淇淋上，甜香相遇，香草本来的甜更突出，还有一点回味上来的辣，是新奇体验。'
        quote: '香草冰淇淋：淋在冰淇淋上，甜香相遇，香草本来的甜更突出，还有一点回味上来的辣，是新奇体验。'
    cautions:
      - level: info
        text: '用量提醒：因为是真的辣，每道菜 1～2 大勺为宜，别手抖。'
        quote: '用量提醒：因为是真的辣，每道菜 1～2 大勺为宜，别手抖。'
    review:
      by: benson
      date: 2026-10-22
      hash: 6e6060305f8fd5bc

