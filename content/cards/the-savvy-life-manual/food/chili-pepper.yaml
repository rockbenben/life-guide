        text: '一味辣椒下锅，强火干炒 1 分钟。'
        quote: '一味辣椒下锅，强火干炒 1 分钟。'
        duration:
          basis: quote
          sec: 60
          quote: 一味辣椒下锅，强火干炒 1 分钟。
      - id: stop-when-color-darkens
        text: '颜色变深，就是甜香出来的信号，别炒过头。'
        quote: '颜色变深，就是甜香出来的信号，别炒过头。'
