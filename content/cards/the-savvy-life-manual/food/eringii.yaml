  - id: separate-cap-and-stem-cuts
    status: reviewed
    source:
      anchor: '四种刀法，对应四种口感'
    slot: anytime
    remind:
      text: '先分开伞和柄，再分别做放射状厚切、纵向薄片与柄下部横切圆片。'
      quote:
        - 口蘑（マッシュルーム）切法：放射状厚切
        - 鲍鱼（アワビ）切法：纵向切成 5mm 厚的薄片
        - 芽菜（メンマ）切法：顺着纤维方向，纵向切成 5mm 厚的薄片
        - 扇贝（ホタテ）切法：在柄的最下方约三分之一处，5mm 厚横切成圆片
        - 前提是：伞（盖）和柄（茎）要分开处理。原因是纤维走向不同——柄（轴）的上部纤维规则地沿纵向排列，而柄的下部纤维交织缠绕、方向随机。
    dose:
