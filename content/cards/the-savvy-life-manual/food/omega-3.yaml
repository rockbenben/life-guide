  - id: daily-omega-3-oil
    status: reviewed
    name: "每天一茶匙亚麻籽油"
    source:
      anchor: Omega-3 怎么补？每天一茶匙亚麻籽油
    slot: anytime
    remind:
      text: 每天 1 茶匙紫苏油（えごま油）或亚麻仁油（アマニ油）
      quote: 说明书推荐的是紫苏油（えごま油）或亚麻仁油（アマニ油），每天 1 茶匙就够。
    dose:
      - value: 1
        unit: 茶匙
        what: 每日推荐量
        quote: 说明书推荐的是紫苏油（えごま油）或亚麻仁油（アマニ油），每天 1 茶匙就够。
    steps:
      - id: c1-drink-or-mix
        text: 可以直接饮用、调成沙拉酱，或加进咖啡、酸奶，撒在谷物麦片上；说明书推荐的是紫苏油（えごま油）或亚麻仁油（アマニ油），每天 1 茶匙就够。
        quote: 可以直接饮用、调成沙拉酱，或加进咖啡、酸奶，撒在谷物麦片上；说明书推荐的是紫苏油（えごま油）或亚麻仁油（アマニ油），每天 1 茶匙就够。
      - id: c1-enhance-flavor
        text: 加在苦味蔬菜冰沙和果汁里能抑制苦味，加在浇了牛奶的麦片、味噌汤、生蛋盖饭、冷豆腐里能引出鲜味。
        quote: 加在苦味蔬菜冰沙和果汁里能抑制苦味，加在浇了牛奶的麦片、味噌汤、生蛋盖饭、冷豆腐里能引出鲜味。
    cautions:
      - level: stop
        text: Omega-3 在高温下容易氧化，因此不适合用于炒或油炸食品。
        quote: Omega-3 在高温下容易氧化，因此不适合用于炒或油炸食品。
      - level: info
        text: 建议将其存放在冰箱中，以防止因光照导致的氧化。开封后请在一个月内用完。
        quote: 建议将其存放在冰箱中，以防止因光照导致的氧化。开封后请在一个月内用完。
      - level: stop
        text: 严禁将其放入因倒入热水而变热的聚苯乙烯容器中，以免容器熔化或变质。
        quote: 严禁将其放入因倒入热水而变热的聚苯乙烯容器中，以免容器熔化或变质。
    review:
      by: benson
      date: 2026-10-22
      hash: 38b55d95304d0fca

