  - id: balanced-oil-intake
    status: reviewed
    name: "换着吃不同的油"
    source:
      anchor: 12 万人调查：油的「种类」决定死亡风险
    slot: anytime
    remind:
      text: 把 Omega-6 与 Omega-3 的摄入比例保持为 2:1，并主动补充 Omega-3
      quote: 因此「适量平衡」被放在第一位：Omega-6 与 Omega-3 保持 2:1，比一味少吃油更接近正确答案。日本人的实际饮食 Omega-6 偏多、比例接近 6:1，所以有意识地补 Omega-3 才是重点。
    steps:
      - id: c5-limit-saturated-fat
        text: 肉类、黄油（饱和脂肪酸）：摄取量越高，全因死亡风险上升。
        quote: 肉类、黄油（饱和脂肪酸）：摄取量越高，全因死亡风险上升。
      - id: c5-choose-olive-oil
        text: 橄榄油（以 Omega-9 为主）：摄取量越高，死亡风险下降。
        quote: 橄榄油（以 Omega-9 为主）：摄取量越高，死亡风险下降。
      - id: c5-combine-omega-oils
        text: Omega-3 与 Omega-6 搭配（鱼・亚麻籽复合油 3 份、色拉油 6 份）：下降幅度最大。
        quote: Omega-3 与 Omega-6 搭配（鱼・亚麻籽复合油 3 份、色拉油 6 份）：下降幅度最大。
    cautions:
      - level: with-doctor
        text: 还有一条容易被忽略的反向提醒：针对 40～69 岁 人群的调查显示，饱和脂肪酸摄取过少同样会让脑出血、脑梗塞的风险升高——不是越少越好。
        quote: 还有一条容易被忽略的反向提醒：针对 40～69 岁 人群的调查显示，饱和脂肪酸摄取过少同样会让脑出血、脑梗塞的风险升高——不是越少越好。
    review:
      by: benson
      date: 2026-10-22
      hash: 6b188847b92d32fa

  - id: oil-for-flavor
    status: reviewed
    source:
      anchor: 油到底是怎么让菜变好吃的
    slot: anytime
    remind:
      text: 在拉面等菜肴中加入油，提高鲜味强度
      quote: 一项对照实验中，10 人里有 8 人觉得加油的拉面味道更浓郁；味觉传感器分析也确认了油脂能提高鲜味强度。
    steps:
      - id: c6-confirm-ramen-flavor
        text: 一项对照实验中，10 人里有 8 人觉得加油的拉面味道更浓郁；味觉传感器分析也确认了油脂能提高鲜味强度。
        quote: 一项对照实验中，10 人里有 8 人觉得加油的拉面味道更浓郁；味觉传感器分析也确认了油脂能提高鲜味强度。
      - id: c6-balance-taste
        text: 油脂会吸附并包裹住苦味、辣味，同时增强甜味、鲜味和咸味，所以「放一点油」不只是增加润滑感。
        quote: 油脂会吸附并包裹住苦味、辣味，同时增强甜味、鲜味和咸味，所以「放一点油」不只是增加润滑感。
    cautions:
      - level: info
        text: 同时说明书提醒，油吃过量同样会增加肥胖和生活习惯病的风险。
        quote: 同时说明书提醒，油吃过量同样会增加肥胖和生活习惯病的风险。
