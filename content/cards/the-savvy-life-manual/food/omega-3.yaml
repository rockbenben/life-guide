      quote:
        - 油具有吸收和包裹苦味、辣味等物质的能力，能够软化强烈的味道，同时增强甜味、鲜味和咸味的体验。
        - 金枪鱼：将紫苏油和橄榄油按 6:1 的比例混合，浸泡金枪鱼，放入冰箱冷藏 1 小时。
