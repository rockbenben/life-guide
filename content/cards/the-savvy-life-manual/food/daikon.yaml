  - id: microwave-sweet-root-ham-egg
    status: reviewed
    source:
      anchor: '六道萝卜食谱'
    slot: anytime
    remind:
      text: '用微波炉加热甘根，做成火腿蛋。'
      quote:
        - 甘根用保鲜膜包好，放进耐热盘，微波炉 600W 加热 6～7 分钟
        - 火腿（小）适量
    steps:
      - id: prepare-ingredients
        text: '大根 2 块（切成 4cm 宽的圆片）鸡蛋 2 个蛋黄酱 2 大勺、牛奶 1 又 1/2 大勺'
        quote:
          - '大根 2 块（切成 4cm 宽的圆片）'
          - '鸡蛋 2 个'
          - '蛋黄酱 2 大勺、牛奶 1 又 1/2 大勺'
      - id: trim-sweet-root
        text: '把大根的皮连形成层一起厚厚削掉，分成甘根和辛根'
        quote: '把大根的皮连形成层一起厚厚削掉，分成甘根和辛根'
      - id: microwave-sweet-root
        text: '甘根用保鲜膜包好，放进耐热盘，微波炉 600W 加热 6～7 分钟'
        quote: '甘根用保鲜膜包好，放进耐热盘，微波炉 600W 加热 6～7 分钟'
      - id: rest-after-heating
        text: '加热后先静置去掉余热'
        quote: '加热后先静置去掉余热'
      - id: add-ham-and-egg
        text: '甘根淋上盐和橄榄油，放上火腿和半熟蛋，淋酱汁'
        quote: '甘根淋上盐和橄榄油，放上火腿和半熟蛋，淋酱汁'
      - id: heat-soft-boiled-egg
        text: '半熟蛋：用沸腾的热水加热 6 分钟'
        quote: '半熟蛋：用沸腾的热水加热 6 分钟'
      - id: use-cheese-instead
        text: '盖上一片可融化的芝士，微波炉 600W 加热 30 秒，再放火腿、淋酱汁'
        quote:
          - 盖上一片可融化的芝士，微波炉 600W 加热 30 秒，再放火腿、淋酱汁
          - 换烤箱也可以：110℃ 加热 45 分钟～1 小时。
    review:
      by: benson
      date: 2026-10-21
      hash: eb5de4df295096fc

  - id: fried-spicy-root-chips
    status: reviewed
    source:
      anchor: '六道萝卜食谱'
    slot: anytime
    remind:
      text: '切好的皮裹上面衣'
      quote: '切好的皮裹上面衣'
    steps:
      - id: prepare-spicy-skin
        text: '大根的皮（辛根）2 块（把大根切成 4cm 宽圆片后取下的皮）'
        quote: '大根的皮（辛根）2 块（把大根切成 4cm 宽圆片后取下的皮）'
      - id: cut-skin
        text: '厚厚削下来的大根皮切成 2cm 宽'
        quote: '厚厚削下来的大根皮切成 2cm 宽'
      - id: mix-batter
        text: '葛粉 1 大勺、低筋粉 1 大勺、水 2 大勺面衣材料用筷子之类随意拌匀'
        quote:
          - '葛粉 1 大勺、低筋粉 1 大勺、水 2 大勺'
          - '面衣材料用筷子之类随意拌匀'
      - id: fry-chips
        text: '用 160℃ 的油炸 3～4 分钟'
        quote:
          - 用 160℃ 的油炸 3～4 分钟
          - 把大根的皮连形成层一起厚厚削掉，分成甘根和辛根。
      - id: pan-roast-chips
        text: '切好的大根皮直接放在烧热的平底锅里烤，再按喜好调味'
        quote:
          - 切好的大根皮直接放在烧热的平底锅里烤，再按喜好调味
          - 更简单的版本：切好的大根皮直接放在烧热的平底锅里烤，再按喜好调味，同样能吃到萝卜皮的美味。
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 0616f842bd90b94a
    name: 做辣根脆片

