    name: 下锅前把温度冲最高
  - id: steam-whole-vegetables
    status: reviewed
    name: "蔬菜整只蒸"
    source:
      anchor: '技法一：整只蒸（まるごと蒸し）'
    slot: anytime
    remind:
      text: '蔬菜不切直接放进平底锅，加水并盖上盖子，通过蒸汽完成高温加热。'
      quote: '蔬菜不切直接放进平底锅，加少量水、盖上盖子，水蒸气会把整棵菜裹住，一次性完成高温加热。'
    effect:
      text: '这样异硫氰酸酯来不及生成，蔬菜本身的甜味和鲜味反而更容易被尝出来。'
      quote: '这样异硫氰酸酯来不及生成，蔬菜本身的甜味和鲜味反而更容易被尝出来。'
    dose:
      - value: 1
        unit: 大勺
        what: 蒸蔬菜的基本加水量
        quote: '蔬菜放进平底锅后，加水 1 大勺。'
    duration:
      basis: quote
      sec: 60
      quote: '炒菜等蒸完还要再加热：强火约 1 分钟；'
    steps:
      - id: leave-whole
        text: '蔬菜不切直接放进平底锅，加少量水、盖上盖子，水蒸气会把整棵菜裹住，一次性完成高温加热。'
        quote: '蔬菜不切直接放进平底锅，加少量水、盖上盖子，水蒸气会把整棵菜裹住，一次性完成高温加热。'
      - id: trap-steam
        text: '平底锅盖紧紧盖上，把水蒸气封在锅里，让整棵蔬菜同时被加热。'
        quote: '平底锅盖紧紧盖上，把水蒸气封在锅里，让整棵蔬菜同时被加热。'
      - id: adjust-heat
        text: '炒菜等蒸完还要再加热：强火约 1 分钟；凉拌、焯水拌等蒸完就不再加热：强火约 2 分钟。'
        quote:
          - '炒菜等蒸完还要再加热：强火约 1 分钟；'
          - '凉拌、焯水拌等蒸完就不再加热：强火约 2 分钟。'
      - id: special-cases
        text: '西兰花：水 1 大勺半 ＋ 强火约 2 分钟；大白菜：水 2 大勺 ＋ 强火约 2 分 30 秒。'
        quote:
          - '西兰花：水 1 大勺半 ＋ 强火约 2 分钟；'
          - '大白菜：水 2 大勺 ＋ 强火约 2 分 30 秒。'
    cautions:
      - level: info
        text: '这个技巧只对「会生成异硫氰酸酯的羽衣甘蓝同类」有效。'
        quote: '这个技巧只对「会生成异硫氰酸酯的羽衣甘蓝同类」有效。'
    review:
      by: benson
      date: 2026-10-22
      hash: c088e0599f667902
  - id: keep-bitterness-slow-heat
    status: reviewed
    source:
      anchor: '反向用法：这次故意留苦'
    slot: anytime
    remind:
      text: '想留住苦味时，故意弄伤蔬菜组织，再从较低温度慢慢加温。'
      quote:
        - '说明书在这里提了一个「逆转思路」：故意把组织弄伤，主动让异硫氰酸酯生成，把它的个性用在菜里。'
        - '从较低温度慢慢加温，让生成异硫氰酸酯的黑芥子酶不容易被抑制（失活），苦味就能留住。'
    effect:
      text: '从较低温度慢慢加温，让生成异硫氰酸酯的黑芥子酶不容易被抑制（失活），苦味就能留住。'
      quote: '从较低温度慢慢加温，让生成异硫氰酸酯的黑芥子酶不容易被抑制（失活），苦味就能留住。'
    steps:
      - id: damage-tissue
        text: '故意把组织弄伤，主动让异硫氰酸酯生成，把它的个性用在菜里。'
        quote: '故意把组织弄伤，主动让异硫氰酸酯生成，把它的个性用在菜里。'
      - id: heat-slowly
        text: '从较低温度慢慢加温，让生成异硫氰酸酯的黑芥子酶不容易被抑制（失活），苦味就能留住。'
        quote: '从较低温度慢慢加温，让生成异硫氰酸酯的黑芥子酶不容易被抑制（失活），苦味就能留住。'
    review:
      by: benson
      date: 2026-10-21
      hash: 414cc538918bc1a9
  - id: diagonal-cut-vegetables
    status: reviewed
    name: "蔬菜斜切留大断面"
    source:
      anchor: '技法二：斜切（そぎ切り）'
    slot: anytime
    remind:
      text: '把刀斜着放进去切，保留比直切更大的断面。'
      quote: '推荐的是把刀斜着放进去切的「斜切」。斜切之后，断面比直切大，调味料更容易渗进去。'
    effect:
      text: '结果显示，斜切的蔬菜连内部都更容易吸收色素水——原因就是断面变大了，调味料进到蔬菜内部变得更容易。'
      quote: '结果显示，斜切的蔬菜连内部都更容易吸收色素水——原因就是断面变大了，调味料进到蔬菜内部变得更容易。'
    steps:
      - id: angle-cut
        text: '这个做法对萝卜、胡萝卜等不容易进火候、不容易入味的蔬菜尤其推荐。'
        quote: '这个做法对萝卜、胡萝卜等不容易进火候、不容易入味的蔬菜尤其推荐。'
      - id: enlarge-surface
        text: '就算不做斜切，也尽量切出更大的断面，这是味道的关键。'
        quote: '就算不做斜切，也尽量切出更大的断面，这是味道的关键。'
    review:
      by: benson
      date: 2026-10-22
      hash: d448ecc3a9f531f3
  - id: season-before-cooking
    status: reviewed
    source:
      anchor: '技法三：调味要在下锅之前'
    slot: anytime
    remind:
      text: '开火前把切好的蔬菜和调味料放进保存袋，摇匀让它入味。'
      quote:
        - 做法很简单：切好的蔬菜和调味料放进保存袋，摇匀让它入味就行。
        - 第二个要点是调味时机：不是炒的时候才加调料，而是在开火之前就把味道调好。
    effect:
      text: '这里的关键在于盐和酱油里的盐分：盐分一旦接触蔬菜，渗透压会让水分从蔬菜里跑出来；与此同时，盐等调味成分会从浓度高的外侧进入蔬菜内部，味道因此更容易渗透均匀。'
      quote: '这里的关键在于盐和酱油里的盐分：盐分一旦接触蔬菜，渗透压会让水分从蔬菜里跑出来；与此同时，盐等调味成分会从浓度高的外侧进入蔬菜内部，味道因此更容易渗透均匀。'
    steps:
      - id: season-in-bag
        text: '做法很简单：切好的蔬菜和调味料放进保存袋，摇匀让它入味就行。'
        quote: '做法很简单：切好的蔬菜和调味料放进保存袋，摇匀让它入味就行。'
      - id: use-high-moisture-vegetables
        text: '说明书特别推荐黄瓜、洋葱这类含水量高的蔬菜。在开始做菜之前先调味，平常的蔬菜就能一下子变得入味。'
        quote: '说明书特别推荐黄瓜、洋葱这类含水量高的蔬菜。在开始做菜之前先调味，平常的蔬菜就能一下子变得入味。'
      - id: let-seasoning-enter
        text: '盐分一旦接触蔬菜，渗透压会让水分从蔬菜里跑出来；与此同时，盐等调味成分会从浓度高的外侧进入蔬菜内部，味道因此更容易渗透均匀。'
        quote: '盐分一旦接触蔬菜，渗透压会让水分从蔬菜里跑出来；与此同时，盐等调味成分会从浓度高的外侧进入蔬菜内部，味道因此更容易渗透均匀。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
