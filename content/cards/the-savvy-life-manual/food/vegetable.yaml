  - id: heat-to-peak-before-cooking
    status: reviewed
    source:
      anchor: '蔬菜：整只蒸去苦，斜切加盐才入味'
    slot: anytime
    remind:
      text: '下锅前一瞬间把温度冲到最高，并配合斜切和提前调味。'
      quote: '所以这份说明书给的核心思路只有一句：下锅前一瞬间就把温度冲到最高。在此之上，再补两刀——斜切和提前调味。'
    effect:
      text: '问题就出在这儿：温度一旦升到 80℃ 以上，这种酶就难以工作，异硫氰酸酯的生成自然被压住。'
      quote: '问题就出在这儿：温度一旦升到 80℃ 以上，这种酶就难以工作，异硫氰酸酯的生成自然被压住。'
    steps:
