        text: '所以这份说明书给的核心思路只有一句：下锅前一瞬间就把温度冲到最高。'
        quote: '所以这份说明书给的核心思路只有一句：下锅前一瞬间就把温度冲到最高。'
      - id: combine-methods
        text: '在此之上，再补两刀——斜切和提前调味。'
        quote: '在此之上，再补两刀——斜切和提前调味。'
