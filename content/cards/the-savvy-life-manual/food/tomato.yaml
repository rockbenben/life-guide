  - id: make-okuda-tomato-sauce
    status: reviewed
    source:
      anchor: "奥田式番茄酱：油与番茄的平衡"
    slot: anytime
    remind:
      text: "做番茄酱时，把油和番茄的量配平。"
      quote: "油和番茄的量要配平，比例不能搞错。"
    dose:
      - value: 400
        unit: g
        what: "番茄用量"
        quote: "番茄 400g（中果 2～3 个）"
      - value: 90
        unit: ml
        what: "橄榄油用量"
        quote: "橄榄油 90ml（约 6 大勺）"
      - value: 1
        unit: 瓣
        what: "蒜用量"
        quote: "蒜 1 瓣"
      - value: 200
        unit: g
        what: "意大利面用量"
        quote: "意大利面 200g（2 把）"
      - value: 2
        unit: L
        what: "煮面用水量"
        quote: "水 2L"
      - value: 40
        unit: g
        what: "煮面用盐量"
        quote: "盐 40g"
      - value: 5
        unit: g
        what: "单独作酱汁时补加的盐量"
        quote: "若不配面食单独当酱汁，加热中补 5g（1 小勺）盐"
    steps:
      - id: heat-garlic-deep-pot
        text: "橄榄油中火加热，放入厚片蒜翻炒。炒的时候要使用尽量深的锅，防油飞溅。"
        quote: "橄榄油中火加热，放入厚片蒜翻炒。炒的时候要使用尽量深的锅，防油飞溅。"
      - id: add-covered-tomato
        text: "1 分钟左右蒜开始变色时，保持中火，下一口大小的番茄块。油会飞溅，下锅时盖上锅盖更安全。"
        quote:
          - "1 分钟左右蒜开始变色时，保持中火，下一口大小的番茄块。"
          - "油会飞溅，下锅时盖上锅盖更安全。"
      - id: toss-tomato
        text: "转强火交替操作：切、颠勺、转回火上，让油均匀走遍每一颗番茄。下锅的瞬间能听到「啾哇」的声音，这是关键；听不到就加大火。"
        quote:
          - "转强火交替操作：切、颠勺、转回火上，让油均匀走遍每一颗番茄。"
          - "下锅的瞬间能听到「啾哇」的声音，这是关键；听不到就加大火。"
      - id: reduce-sauce
        text: "炒 3 分钟左右，达到「咕嘟咕嘟」的浓稠状态。不够浓稠：延长加热时间，或关火后前后各颠 20 秒。"
        quote:
          - "炒 3 分钟左右，达到「咕嘟咕嘟」的浓稠状态。"
          - "不够浓稠：延长加热时间，或关火后前后各颠 20 秒。"
      - id: season-sauce-alone
        text: "若不配面食单独当酱汁，加热中补 5g（1 小勺）盐"
        quote: "若不配面食单独当酱汁，加热中补 5g（1 小勺）盐"
      - id: boil-pasta
        text: "另起一锅，2L 水加 40g 盐（盐量按水量的 2%）煮开，下意大利面煮到断生。"
        quote: "另起一锅，2L 水加 40g 盐（盐量按水量的 2%）煮开，下意大利面煮到断生。"
      - id: mix-pasta
        text: "留一点面汤不要倒干，把面放进酱汁里充分混合即可。"
        quote: "留一点面汤不要倒干，把面放进酱汁里充分混合即可。"
    cautions:
      - level: info
        text: "橄榄油 90ml 已超出「一天推荐摄入量约 50g」的基准，注意别吃过头。"
        quote: "橄榄油 90ml 已超出「一天推荐摄入量约 50g」的基准，注意别吃过头。"
      - level: info
        text: "面不要另外加盐"
        quote: "面不要另外加盐"
