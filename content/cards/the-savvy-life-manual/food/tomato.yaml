  - id: sear-tomato-in-olive-oil
    status: reviewed
    name: "橄榄油煎番茄"
    source:
      anchor: "番茄煮出来没味道？用橄榄油煎透 3 分钟"
    slot: anytime
    remind:
      text: "把日本番茄切成一口大小，用橄榄油煎透，不加水煮。"
      quote: "日本番茄别加水煮，改用橄榄油一次煎透：橄榄油中火加热，放厚片蒜翻炒，1 分钟左右蒜开始变色时保持中火，下一口大小的番茄块，转强火交替切、颠勺、回火，炒 3 分钟左右到「咕嘟咕嘟」的浓稠状态。"
    dose:
      - value: 1
        unit: 分钟
        what: "蒜片开始变色的等待时间"
        quote: "1 分钟左右蒜开始变色时保持中火"
        approximate: true
      - value: 3
        unit: 分钟
        what: "番茄翻炒时长"
        quote: "炒 3 分钟左右"
        approximate: true
    duration:
      basis: quote
      sec: 180
      quote: "炒 3 分钟左右"
    steps:
      - id: heat-olive-oil-garlic
        text: "橄榄油中火加热，放厚片蒜翻炒"
        quote: "橄榄油中火加热，放厚片蒜翻炒"
      - id: add-tomato-to-pan
        text: "1 分钟左右蒜开始变色时保持中火，下一口大小的番茄块"
        quote: "1 分钟左右蒜开始变色时保持中火，下一口大小的番茄块"
      - id: sear-tomato
        text: "转强火交替切、颠勺、回火，炒 3 分钟左右到「咕嘟咕嘟」的浓稠状态。"
        quote: "转强火交替切、颠勺、回火，炒 3 分钟左右到「咕嘟咕嘟」的浓稠状态。"
