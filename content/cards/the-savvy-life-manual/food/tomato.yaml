  - id: use-oil-to-sear-high-moisture-tomato
    status: reviewed
    source:
      anchor: "日本番茄为什么不能加水煮"
    slot: anytime
    remind:
      text: "日本番茄皮薄、甜、水分多，不加水煮，用橄榄油一次煎透。"
      quote:
        - "日本番茄：为了「生吃好吃」而独立进化出三个特点——皮薄、甜、含大量水分。"
        - "而这三个特点，恰恰就是「下锅加水一煮就不好吃」的原因。"
        - "奥田给出的解法是：用橄榄油一次煎透。"
    effect:
      text: "番茄里含有的、能抑制体内活性氧的「番茄红素」，和油一起摄取，吸收率会变成 4 倍。"
      quote: "番茄里含有的、能抑制体内活性氧的「番茄红素」，和油一起摄取，吸收率会变成 4 倍。"
    steps:
      - id: identify-japanese-tomato-traits
