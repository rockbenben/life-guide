  - id: morning-omega-3-approach
    status: reviewed
    name: "早上补亚麻仁油"
    source:
      anchor: '为什么推荐 The Japan Diet'
    remind:
      text: '留意早上摄取亚麻仁油，以及早餐摄取 Omega-3'
      quote:
        - '超坏胆固醇：说明书引述的研究是亚麻仁油连续吃 12 周，超坏胆固醇下降 28.9%；同一位营养师自己也是每天早上往奶茶里加 1 小勺（约 5 克）亚麻仁油。'
        - '中性脂肪：同一份说明书的结论正相反——晚餐连续 8 周摄取 Omega-3，中性脂肪没有明显变化；改成早餐摄取，中性脂肪才下降约 20%——说明书把「早上吃比晚上吃更有效」写成了整节的重点。'
    effect:
