  - id: blood-lipid-reference-values
    status: reviewed
    source:
      anchor: '血脂的三个关键数字'
    remind:
      text: '查看 LDL 139 mg/dL 以下、HDL 40 mg/dL 以上及空腹时中性脂肪 149 mg/dL 以下'
      quote:
        - 'LDL（坏胆固醇）是运送胆固醇的「搬运工」，它的任务是搬运。参考值 139 mg/dL 以下。它过多或 HDL 太少，胆固醇就会堆在血管壁上。'
        - 'HDL（好胆固醇）是回收胆固醇的「清洁工」，负责把胆固醇运回肝脏。参考值 40 mg/dL 以上。'
        - '中性脂肪（甘油三酯）参考值 149 mg/dL 以下（空腹时）。'
    steps:
      - id: check-ldl
        text: 'LDL（坏胆固醇）是运送胆固醇的「搬运工」，它的任务是搬运。参考值 139 mg/dL 以下。它过多或 HDL 太少，胆固醇就会堆在血管壁上。'
        quote: 'LDL（坏胆固醇）是运送胆固醇的「搬运工」，它的任务是搬运。参考值 139 mg/dL 以下。它过多或 HDL 太少，胆固醇就会堆在血管壁上。'
      - id: check-hdl
        text: 'HDL（好胆固醇）是回收胆固醇的「清洁工」，负责把胆固醇运回肝脏。参考值 40 mg/dL 以上。'
        quote: 'HDL（好胆固醇）是回收胆固醇的「清洁工」，负责把胆固醇运回肝脏。参考值 40 mg/dL 以上。'
      - id: check-triglycerides
        text: '中性脂肪（甘油三酯）参考值 149 mg/dL 以下（空腹时）。它不直接沉积血管壁，却会让坏胆固醇颗粒变得又小又密，掉进血管壁的缝隙里——这就是所谓「超坏胆固醇」的形成原因。'
        quote: '中性脂肪（甘油三酯）参考值 149 mg/dL 以下（空腹时）。它不直接沉积血管壁，却会让坏胆固醇颗粒变得又小又密，掉进血管壁的缝隙里——这就是所谓「超坏胆固醇」的形成原因。'
    notices:
      - level: info
        text: '超坏胆固醇的数值本身不算高，但患病风险是正常坏胆固醇的 3 倍，而且常规健康诊断并不测它。'
        quote: '超坏胆固醇的数值本身不算高，但患病风险是正常坏胆固醇的 3 倍，而且常规健康诊断并不测它。'
    review:
      by: benson
      date: 2026-10-21
      hash: d7d07b37b25bbbbc
  - id: japan-diet-food-pattern
    status: reviewed
    name: "日本式饮食搭配"
    source:
      anchor: '为什么推荐 The Japan Diet'
    remind:
      text: '以未精制谷物、鱼、豆制品、蔬菜和海藻蘑菇蒟蒻为主，避开肥肉、加工肉、内脏和蛋黄'
      quote: '日本动脉硬化学会强调，这是以未精制谷物、鱼、大豆、豆制品、绿色黄色蔬菜、海藻蘑菇蒟蒻、绿茶为主、避开肥肉、肉类加工品、内脏和蛋黄、奶油和奶酪、糕点、甜饮和酒的吃法；它调整的是饮食结构，不能代替用药和就医。'
    effect:
      text: '鱼里丰富的 Omega-3 脂肪酸能抑制肝脏合成 LDL，而鱼的摄取量多的人，缺血性心脏病风险约降低 40%——说明书引述的一项大规模队列研究显示，每天吃鱼约 180 克的组比每天不到 20 克的组，风险低约四成。'
      quote: '鱼里丰富的 Omega-3 脂肪酸能抑制肝脏合成 LDL，而鱼的摄取量多的人，缺血性心脏病风险约降低 40%——说明书引述的一项大规模队列研究显示，每天吃鱼约 180 克的组比每天不到 20 克的组，风险低约四成。'
    steps:
      - id: limit-animal-fat-and-sugar
        text: '不吃太多：限制肉的脂肪部分、动物脂肪、鸡蛋；减少含糖和果糖的加工饮料零食和酒精。'
        quote: '不吃太多：限制肉的脂肪部分、动物脂肪、鸡蛋；减少含糖和果糖的加工饮料零食和酒精。'
      - id: eat-more-plant-and-fish-foods
        text: '多吃什么：鱼、大豆和豆制品、绿色黄色蔬菜等蔬菜、海藻蘑菇蒟蒻；减少精制谷物，增加未精制谷物杂粮和麦类；适量摄取甜度低的水果和乳制品；减盐清淡。'
        quote: '多吃什么：鱼、大豆和豆制品、绿色黄色蔬菜等蔬菜、海藻蘑菇蒟蒻；减少精制谷物，增加未精制谷物杂粮和麦类；适量摄取甜度低的水果和乳制品；减盐清淡。'
      - id: choose-core-foods-and-avoid-list
        text: '日本动脉硬化学会强调，这是以未精制谷物、鱼、大豆、豆制品、绿色黄色蔬菜、海藻蘑菇蒟蒻、绿茶为主、避开肥肉、肉类加工品、内脏和蛋黄、奶油和奶酪、糕点、甜饮和酒的吃法；它调整的是饮食结构，不能代替用药和就医。'
        quote: '日本动脉硬化学会强调，这是以未精制谷物、鱼、大豆、豆制品、绿色黄色蔬菜、海藻蘑菇蒟蒻、绿茶为主、避开肥肉、肉类加工品、内脏和蛋黄、奶油和奶酪、糕点、甜饮和酒的吃法；它调整的是饮食结构，不能代替用药和就医。'
      - id: use-fish-omega-3-mechanism
        text: '鱼里丰富的 Omega-3 脂肪酸能抑制肝脏合成 LDL，而鱼的摄取量多的人，缺血性心脏病风险约降低 40%——说明书引述的一项大规模队列研究显示，每天吃鱼约 180 克的组比每天不到 20 克的组，风险低约四成。'
        quote: '鱼里丰富的 Omega-3 脂肪酸能抑制肝脏合成 LDL，而鱼的摄取量多的人，缺血性心脏病风险约降低 40%——说明书引述的一项大规模队列研究显示，每天吃鱼约 180 克的组比每天不到 20 克的组，风险低约四成。'
    notices:
      - level: info
        text: '另一方面，绿茶的儿茶素、大豆和坚果的植物固醇、海藻蔬菜的水溶性食物纤维，能抑制肠道对胆固醇的吸收，帮助排出体外。'
        quote: '另一方面，绿茶的儿茶素、大豆和坚果的植物固醇、海藻蔬菜的水溶性食物纤维，能抑制肠道对胆固醇的吸收，帮助排出体外。'
