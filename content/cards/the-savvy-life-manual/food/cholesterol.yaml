      - id: note-absorption-difference
        text: '原因是每个人对膳食胆固醇的吸收率相差极大，从 20% 到 80% 不等，同吃几个鸡蛋，有人数值升高，有人纹丝不动。'
        quote: '原因是每个人对膳食胆固醇的吸收率相差极大，从 20% 到 80% 不等，同吃几个鸡蛋，有人数值升高，有人纹丝不动。'
