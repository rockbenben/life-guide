    source:
      anchor: '胆固醇怎么吃：两册说明书讲清界线'
    remind:
      text: '记住 2015 年起膳食胆固醇摄入上限已被撤回'
      quote: '很多人以为胆固醇高是因为吃错了东西，但更反直觉的事实是：2015 年起，日本官方直接撤回了膳食胆固醇的摄入上限。'
    steps:
      - id: note-upper-limit-withdrawal
        text: '很多人以为胆固醇高是因为吃错了东西，但更反直觉的事实是：2015 年起，日本官方直接撤回了膳食胆固醇的摄入上限。'
