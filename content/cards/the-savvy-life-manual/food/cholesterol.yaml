        text: '这份说明书以日本动脉硬化学会的「The Japan Diet」为主轴，讲清哪些食物真正起作用。'
        quote: '这份说明书以日本动脉硬化学会的「The Japan Diet」为主轴，讲清哪些食物真正起作用。'
