cards:
  - id: steak-golden-juice
    status: reviewed
    name: "弱火煎牛排锁肉汁"
    source:
      anchor: '在家煎出金龙汁：厚 3cm 牛排的 15 分钟静置法'
    slot: anytime
    remind:
      text: '弱火煎牛排，出锅后用铝箔包住静置，随后强火逼香'
      quote:
        - '转弱火下肉，每 2 分钟翻一次面、总共烤 15 分钟。'
        - '取出肉，用铝箔包住静置 15 分钟（1cm 厚静置 4 分钟，2cm 厚静置 8 分钟）。'
        - '加 1 大勺油，最后强火把两面各烤 30 秒～1 分钟，烤出你想要的香气，完成。'
    dose:
      - value: 3
        unit: 'cm'
        what: '牛排厚度'
        quote: '牛排肉（厚 3cm）1 枚'
      - value: 2
        unit: '分钟'
        what: '翻面间隔'
        quote: '每 2 分钟翻一次面'
      - value: 15
        unit: '分钟'
        what: '总煎烤时间'
        quote: '总共烤 15 分钟'
      - value: 15
        unit: '分钟'
        what: '静置时间'
        quote: '用铝箔包住静置 15 分钟'
      - value: 1
        unit: '大勺'
        what: '最后煎制加油量'
        quote: '加 1 大勺油'
    duration:
      basis: derived
      sec: 1800
      formula: '15 分钟煎烤 + 15 分钟静置 = 30 分钟 = 1800 秒（仅计煎烤与静置）'
    steps:
      - id: steak-preheat
        text: '锅里放 2 大勺油，中火预热 1 分钟。肉要在烹饪前 20～30 分钟从冷藏取出回温。'
        quote: '锅里放 2 大勺油，中火预热 1 分钟。肉要在烹饪前 20～30 分钟从冷藏取出回温。'
      - id: steak-adjust-heat
        text: '转弱火下肉，每 2 分钟翻一次面、总共烤 15 分钟。厚度不同时间不同：1cm 厚 → 每 1 分钟翻面，烤 4 分钟；2cm 厚 → 每半分钟翻面，烤 8 分钟。'
        quote: '转弱火下肉，每 2 分钟翻一次面、总共烤 15 分钟。厚度不同时间不同：1cm 厚 → 每 1 分钟翻面，烤 4 分钟；2cm 厚 → 每半分钟翻面，烤 8 分钟。'
      - id: steak-rest
        text: '取出肉，用铝箔包住静置 15 分钟（1cm 厚静置 4 分钟，2cm 厚静置 8 分钟）。'
        quote: '取出肉，用铝箔包住静置 15 分钟（1cm 厚静置 4 分钟，2cm 厚静置 8 分钟）。'
      - id: steak-sear
        text: '加 1 大勺油，最后强火把两面各烤 30 秒～1 分钟，烤出你想要的香气，完成。'
        quote: '加 1 大勺油，最后强火把两面各烤 30 秒～1 分钟，烤出你想要的香气，完成。'
      - id: steak-dip
        text: '蘸酱油时用碟子接着吃，可以防止油花四溅。'
        quote: '蘸酱油时用碟子接着吃，可以防止油花四溅。'
    cautions:
      - level: info
        text: '问题出在加热过度。说明书直言：日本料理里常用薄切肉，是为了快；但一加热就短时间内冲破 70℃，细胞全体被破坏，汁液全部漏出来蒸发掉——金龙汁就这样白白流失。'
        quote: '问题出在加热过度。说明书直言：日本料理里常用薄切肉，是为了快；但一加热就短时间内冲破 70℃，细胞全体被破坏，汁液全部漏出来蒸发掉——金龙汁就这样白白流失。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: e8e382ac5f2a563e

  - id: minced-meat-stock
    status: reviewed
    source:
      anchor: '绞肉高汤：10 分钟出一锅鲜味'
    slot: anytime
    remind:
      text: '利用绞肉易出汁的特点，快速做出高汤和万能肉末'
      quote:
        - '既然绞肉细胞早就被破坏、特别容易出金龙汁，那就反过来利用它。'
        - '高汤先生成：肉先在约 50℃ 的温水里泡到变白、捞出沥干，再下进沸腾的汤汁，随即转小火、不让它沸腾约 5 分钟——不沸腾，就不会把肉煮散，也不会让汤起浑浊。'
        - '捞出的绞肉趁还是温热的时候，和 1 大勺蚝油拌匀，就是可以直接下饭的「超万能肉末（そぼろ）」。剩下的汤就是一份现成高汤。'
    dose:
      - value: 100
        unit: 'g'
        what: '鸡腿绞肉用量'
        quote: '鸡腿绞肉 100g'
      - value: 100
        unit: 'g'
        what: '猪绞肉用量'
        quote: '猪绞肉 100g'
      - value: 1.2
        unit: 'L'
        what: '汤汁用水量'
        quote: '水 1.2L'
      - value: 50
        unit: '℃'
        what: '浸肉温水温度'
        quote: '肉先在约 50℃ 的温水里泡到变白、捞出沥干'
        approximate: true
      - value: 5
        unit: '分钟'
        what: '转小火后的烹煮时间'
        quote: '再次沸腾前转小火，约 5 分钟'
        approximate: true
      - value: 5
        unit: '分钟'
        what: '捞出后的续煮时间'
        quote: '到时间后捞出绞肉，再煮约 5 分钟完成。'
        approximate: true
      - value: 1
        unit: '大勺'
        what: '万能肉末拌蚝油用量'
        quote: '和 1 大勺蚝油拌匀'
    duration:
      basis: quote
      sec: 600
      quote: '10 分钟煮出一锅绞肉高汤'
    steps:
      - id: broth-soak
        text: '把两种绞肉一起放进约 50℃ 的热水（用量不计）泡过，泡到变白，捞出沥干。'
        quote: '把两种绞肉一起放进约 50℃ 的热水（用量不计）泡过，泡到变白，捞出沥干。'
      - id: broth-add
        text: '倒入沸腾的 1.2L 汤汁中，用笊篱捞一遍（防止肉末飞散）。'
        quote: '倒入沸腾的 1.2L 汤汁中，用笊篱捞一遍（防止肉末飞散）。'
      - id: broth-simmer
        text: '再次沸腾前转小火，约 5 分钟；到时间后捞出绞肉，再煮约 5 分钟完成。'
        quote: '再次沸腾前转小火，约 5 分钟；到时间后捞出绞肉，再煮约 5 分钟完成。'
      - id: broth-mix
        text: '捞出的绞肉趁还是温热的时候，和 1 大勺蚝油拌匀，就是可以直接下饭的「超万能肉末（そぼろ）」。剩下的汤就是一份现成高汤。'
        quote: '捞出的绞肉趁还是温热的时候，和 1 大勺蚝油拌匀，就是可以直接下饭的「超万能肉末（そぼろ）」。剩下的汤就是一份现成高汤。'
    cautions:
      - level: info
        text: '不沸腾，就不会把肉煮散，也不会让汤起浑浊。'
        quote: '不沸腾，就不会把肉煮散，也不会让汤起浑浊。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-28
      hash: b350e052be0bfada

