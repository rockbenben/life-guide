        text: '一天黑咖啡 3 杯左右。'
        quote: '一天黑咖啡 3 杯左右。'
      - id: account-for-caffeine-half-life
        text: '喝下之后，体内咖啡因减到一半需要大约 4 小时。'
        quote: '喝下之后，体内咖啡因减到一半需要大约 4 小时。'
