  - id: champion-home-brew
    status: reviewed
    source:
      anchor: '世界冠军的家用冲煮法'
    slot: anytime
    remind:
      text: '按冠军家用冲法冲咖啡：豆与水 1:15，水温 90℃，分 4 次注水'
      quote:
        - 豆与水 1:15、水温 90℃，分 4 次注水，比例 2:4:2:2，第 1 次注完蒸 30 秒。
        - 家用手冲总是一杯苦，问题出在没把豆子泡开。世界咖啡师大赛第 3 名石谷贵之的家用冲法是：豆与水 1:15、水温 90℃，分 4 次注水，比例 2:4:2:2，第 1 次注完蒸 30 秒。每天的量是黑咖啡 3 杯左右。下面是每日量、冠军冲法，以及咖啡油和生咖啡奶油的做法。^[「コーヒー」のトリセツ]
    dose:
      - value: 90
        unit: '℃'
        what: '冲煮水温'
        quote: '水温 90℃。'
      - value: 4
        unit: '次'
        what: '注水次数'
        quote: '分 4 次注入，各次水量比例 2 : 4 : 2 : 2：'
      - value: 30
        unit: '秒'
        what: '首次注水后的蒸制时长'
        quote: '第 1 次：注入热水后蒸 30 秒。'
      - value: 10
        unit: '秒'
        what: '第 2 次注完后的等待时间'
        quote: '第 3 次：在第 2 次注完约 10 秒后开始注。'
      - value: 5
        unit: '秒'
        what: '第 3 次注完后的等待时间'
        quote: '第 4 次：在第 3 次注完约 5 秒后开始注。'
    steps:
      - id: prepare-bean-water-ratio
        text: '咖啡豆 : 热水 = 1 : 15（按重量）；水温 90℃。'
        quote:
          - '咖啡豆 : 热水 = 1 : 15（按重量）；'
          - '水温 90℃。'
      - id: split-water-for-four-pours
        text: '分 4 次注入，各次水量比例 2 : 4 : 2 : 2：'
        quote: '分 4 次注入，各次水量比例 2 : 4 : 2 : 2：'
      - id: bloom-after-first-pour
        text: '第 1 次：注入热水后蒸 30 秒。'
        quote: '第 1 次：注入热水后蒸 30 秒。'
      - id: make-second-pour
        text: '第 2 次：多注一些，把咖啡成分充分萃取出来。'
        quote: '第 2 次：多注一些，把咖啡成分充分萃取出来。'
      - id: make-third-pour
        text: '第 3 次：在第 2 次注完约 10 秒后开始注。'
        quote: '第 3 次：在第 2 次注完约 10 秒后开始注。'
      - id: make-fourth-pour
        text: '第 4 次：在第 3 次注完约 5 秒后开始注。'
        quote: '第 4 次：在第 3 次注完约 5 秒后开始注。'
      - id: use-pouring-pattern
        text: '第 1～3 次画圈注入，第 4 次直接朝正中间冲下去。'
        quote: '第 1～3 次画圈注入，第 4 次直接朝正中间冲下去。'
      - id: adjust-bitterness
        text: '喜欢更苦的人，延长最初的蒸制时间，苦味会更容易被抽出来。'
        quote: '喜欢更苦的人，延长最初的蒸制时间，苦味会更容易被抽出来。'
