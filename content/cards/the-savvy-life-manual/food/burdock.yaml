  - id: burdock-crepe
    status: reviewed
    name: "用牛蒡泥煎可丽饼"
    source:
      anchor: '四道食谱（可丽饼用上面的烤牛蒡泥）'
    slot: anytime
    remind:
      text: '把（A）、松饼粉和烤牛蒡泥调成面糊，煎成可丽饼。'
      quote: [ '（A）', '打蛋器充分搅拌', '松饼粉和烤牛蒡泥', '继续搅拌均匀', '面糊边缘出现焦色', '另一面再煎约 1 分钟' ]
    steps:
      - id: crepe-mix
        text: '（A）打蛋器充分搅拌松饼粉和烤牛蒡泥继续搅拌均匀'
        quote: [ '（A）', '打蛋器充分搅拌', '松饼粉和烤牛蒡泥', '继续搅拌均匀' ]
      - id: crepe-heat-spread
        text: '大火加热约 1 分钟约一杯面糊倾斜锅子，让面糊快速摊薄摊圆'
        quote: [ '大火加热约 1 分钟', '约一杯面糊', '倾斜锅子，让面糊快速摊薄摊圆' ]
        duration:
          basis: quote
          sec: 60
          quote: 大火加热约 1 分钟
          approximate: true
      - id: crepe-first-side
        text: '转中大火，煎约 1 分半'
        quote: '转中大火，煎约 1 分半'
      - id: crepe-flip
        text: '面糊边缘出现焦色橡皮刮刀等从边缘慢慢伸入另一面再煎约 1 分钟'
        quote: [ '面糊边缘出现焦色', '橡皮刮刀等从边缘慢慢伸入', '另一面再煎约 1 分钟' ]
        duration:
          basis: quote
          sec: 60
          quote: 另一面再煎约 1 分钟
          approximate: true
      - id: crepe-second-side
        text: '只要稍微上色即可'
        quote: [ '只要稍微上色', '即可' ]
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: c22b91384935b24a

