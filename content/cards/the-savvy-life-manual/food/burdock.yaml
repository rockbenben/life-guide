      - id: pasta-wash-grind
        text: '牛蒡快速冲净泥土磨成泥'
        quote: [ '牛蒡', '快速冲净泥土', '磨成泥' ]
      - id: pasta-brown-beef
        text: '放入牛绞肉用大火翻炒 3～4 分钟炒到肉出油、表面微微焦黄为止'
