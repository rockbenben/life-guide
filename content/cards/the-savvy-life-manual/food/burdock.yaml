  - id: roast-grated-burdock
    status: reviewed
    source:
      anchor: '香味的关键：现磨 + 现烤'
    slot: anytime
    remind:
      text: '把牛蒡磨成泥后用火烤。'
      quote: [ '磨成泥', '把磨好的泥用火烤过' ]
    effect:
      text: '「磨泥」比「切丝」香气更浓把磨好的泥用火烤过牛蒡特有的苦味被抑制，甘味增加'
      quote: [ '「磨泥」比「切丝」香气更浓', '把磨好的泥用火烤过', '牛蒡特有的苦味被抑制，甘味增加' ]
    steps:
      - id: wash-and-grind
        text: '用手指或棕刷快速冲净泥土用磨泥器磨成泥'
        quote: [ '用手指或棕刷快速冲净泥土', '用磨泥器磨成泥' ]
      - id: heat-pan
        text: '平底锅下油大火加热后放入牛蒡泥'
        quote: [ '平底锅下油', '大火加热后放入牛蒡泥' ]
      - id: roast-puree
        text: '原样不动地煎约 1 分半'
        quote: '原样不动地煎约 1 分半'
      - id: check-aroma-color
        text: '香气升起、牛蒡颜色改变即告完成颜色会变成明亮的黄土色'
        quote: [ '香气升起、牛蒡颜色改变', '即告完成', '颜色会变成明亮的黄土色' ]
    duration:
      basis: quote
      sec: 90
      quote: '原样不动地煎约 1 分半'
