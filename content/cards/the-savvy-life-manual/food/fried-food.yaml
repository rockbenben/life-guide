  - id: crispy-potatoes
    status: reviewed
    source:
      anchor: '附：酥脆土豆'
    slot: anytime
    remind:
      text: '土豆切块后先微波加热，再冷冻并分阶段炸制'
      quote:
        - 这道「酥脆土豆」用的是冷冻油炸法，冷冻过的土豆内部水分结冰后炸出来格外酥松。
        - 长崎县对马市一家海鲜食堂的炸鱿鱼很特别——味道浓而且非常甜，而且整个炸制过程完全不溅油。秘密是对马的传统做法——把鱿鱼过夜晾干：当地用一种专用的旋转脱水装置把鱿鱼晾上一夜。
    dose:
      - value: 2
        unit: '个'
        what: '带皮土豆用量'
        quote: '带皮土豆 2 个（约 260g）'
      - value: 260
        unit: '克'
        what: '带皮土豆约重量'
        quote: '约 260g'
    steps:
      - id: potato-cut
        text: '土豆切得厚一些——6～8 等分的条状，或 1.5cm 见方的滚刀块。'
        quote: '土豆切得厚一些——6～8 等分的条状，或 1.5cm 见方的滚刀块。'
      - id: potato-microwave
        text: '铺在耐热盘上，轻轻盖上保鲜膜，用微波炉 600W 加热 4 分 30 秒。'
        quote: '铺在耐热盘上，轻轻盖上保鲜膜，用微波炉 600W 加热 4 分 30 秒。'
        duration:
          basis: quote
          sec: 30
          quote: 铺在耐热盘上，轻轻盖上保鲜膜，用微波炉 600W 加热 4 分 30 秒。
      - id: potato-cool
        text: '加热后取下保鲜膜，放至不烫手。'
        quote: '加热后取下保鲜膜，放至不烫手。'
      - id: potato-freeze
        text: '放凉后整体用保鲜膜包好，冷冻保存。'
        quote: '放凉后整体用保鲜膜包好，冷冻保存。'
      - id: potato-first-fry
        text: '油温调到常温，把冻结状态的土豆下锅，大火炸约 3 分钟。'
        quote: '油温调到常温，把冻结状态的土豆下锅，大火炸约 3 分钟。'
        duration:
          basis: quote
          sec: 180
          quote: 油温调到常温，把冻结状态的土豆下锅，大火炸约 3 分钟。
          approximate: true
      - id: potato-second-fry
        text: '油面翻滚沸腾后，调到弱火与中火之间的火力，再炸 12 分钟。'
        quote: '油面翻滚沸腾后，调到弱火与中火之间的火力，再炸 12 分钟。'
      - id: potato-final-fry
        text: '捞出静置约 3 分钟，再回锅用大火炸约 1 分钟，完成。'
        quote: '捞出静置约 3 分钟，再回锅用大火炸约 1 分钟，完成。'
        duration:
          basis: quote
          sec: 180
          quote: 捞出静置约 3 分钟，再回锅用大火炸约 1 分钟，完成。
          approximate: true
    cautions:
