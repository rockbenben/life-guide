  - id: overnight-dry-ingredients
    status: reviewed
    source:
      anchor: '抑制油花飞溅：食材要"过夜风干"'
    slot: evening
    remind:
      text: '切好食材后不裹保鲜膜，平铺冷藏过夜'
      quote:
        - '把新鲜食材切好。'
        - '平铺在托盘里，互相不要重叠。'
        - '不裹保鲜膜，直接放进冰箱冷藏。'
        - '放置一晚，即约 16 小时以上。'
    effect:
      text: '过夜晾干让水分适度流失、味道浓缩，意外地连油溅一起解决了。'
      quote: '过夜晾干让水分适度流失、味道浓缩，意外地连油溅一起解决了。'
    duration:
      basis: quote
      sec: 57600
      quote: '放置一晚，即约 16 小时以上。'
    steps:
      - id: choose-suitable-ingredients
        text: '鱿鱼、章鱼、虾等海产类——鲜味成分会得到浓缩芋头、莲藕等根茎类——糖分浓缩，风味更足'
        quote:
          - 鱿鱼、章鱼、虾等海产类——鲜味成分会得到浓缩
          - 芋头、莲藕等根茎类——糖分浓缩，风味更足
          - 适合处理的食材：
      - id: cut-ingredients
        text: '把新鲜食材切好。'
        quote: '把新鲜食材切好。'
      - id: spread-ingredients
        text: '平铺在托盘里，互相不要重叠。'
        quote: '平铺在托盘里，互相不要重叠。'
      - id: chill-without-wrap
        text: '不裹保鲜膜，直接放进冰箱冷藏。'
        quote: '不裹保鲜膜，直接放进冰箱冷藏。'
      - id: chill-ingredients-overnight
        text: '放置一晚，即约 16 小时以上。'
        quote:
          - 放置一晚，即约 16 小时以上。
          - 防软塌是在调面衣时先把油拌进面粉（先油法）——实测放置 10 分钟后面衣含水量 12.5%，已经逼近料亭的 10%；防油溅是把食材切好、平铺互不重叠、不裹保鲜膜冷藏一晚（约 16 小时以上），利用冰箱除湿让食材适度脱水。下面先给这两招、三份食谱和酥脆土豆，成因放在最后。^[「揚げ物」のトリセツ]
    cautions:
      - level: stop
        text: '存放过久会产生气味、成为杂菌繁殖的原因，务必一晚后就烹调'
        quote: '存放过久会产生气味、成为杂菌繁殖的原因，务必一晚后就烹调'
      - level: info
        text: '另外带加湿功能的冰箱可能没有效果，使用前请确认冰箱说明书。'
        quote: '另外带加湿功能的冰箱可能没有效果，使用前请确认冰箱说明书。'
    review:
      by: benson
      date: 2026-10-21
      hash: 78536f1f3b553682

