  - id: umami-by-freezing
    status: reviewed
    source:
      anchor: '冷冻为什么能提升鲜味'
    slot: anytime
    remind:
      text: '产地收来的鱿鱼可先冷冻再料理，菌菇和蛤蜊也能通过冷冻提升鲜味。'
      quote:
        - '产地收来的不新鲜鱿鱼，先冷冻再料理'
        - '冷冻同样能让它们的鲜味上升。'
    effect:
      text: '硬度只剩原来的 2/3鲜味大幅提升原因在于细胞里的肌原纤维被冻坏，酶趁机从细胞内部跑到外面来，分解蛋白质，生成鲜味成分。'
      quote:
        - '硬度只剩原来的 2/3'
        - '鲜味大幅提升'
        - '原因在于细胞里的肌原纤维被冻坏，酶趁机从细胞内部跑到外面来，分解蛋白质，生成鲜味成分。'
    steps:
      - id: freeze-squid
        text: '产地收来的不新鲜鱿鱼，先冷冻再料理'
        quote: '产地收来的不新鲜鱿鱼，先冷冻再料理'
      - id: freeze-umami-ingredients
        text: '所以提升鲜味的并不只是鱿鱼——菌菇蛤蜊（しじみ）冷冻同样能让它们的鲜味上升。'
        quote:
          - '所以提升鲜味的并不只是鱿鱼——'
          - '菌菇'
          - '蛤蜊（しじみ）'
          - '冷冻同样能让它们的鲜味上升。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 219806eff869507f
    name: 冷冻海鲜菌菇提鲜

  - id: aroma-by-freezing
    status: reviewed
    source:
      anchor: '冷冻为什么能让香气爆发'
    slot: anytime
    remind:
      text: '把冻得很硬的松露擦成细屑冻蔬菜、冻水果同样适用。'
      quote:
        - '把冻得很硬的松露擦成细屑'
        - '冻蔬菜、冻水果同样适用。'
    effect:
      text: '香气成分在低温下变得不容易挥发，但细胞被冻坏了，香气成分反而更容易跑到外面来。这时候再放进温热的嘴里，香气成分一口气涌出来。入口那一刻的爆炸感，比直接切片强烈得多。'
      quote:
        - '香气成分在低温下变得不容易挥发，但细胞被冻坏了，香气成分反而更容易跑到外面来。'
        - '这时候再放进温热的嘴里，香气成分一口气涌出来。'
        - '入口那一刻的爆炸感，比直接切片强烈得多。'
    steps:
      - id: grate-frozen-truffle
        text: '把冻得很硬的松露擦成细屑'
        quote: '把冻得很硬的松露擦成细屑'
      - id: grate-frozen-produce
        text: '冻蔬菜、冻水果同样适用。'
        quote: '冻蔬菜、冻水果同样适用。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: a9607472858f3848
    name: 冻硬后擦成细屑
