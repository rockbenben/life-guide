        quote: '把意面煮到恰好没煮透，拌入一半的橄榄油和调味汁摊开——关键是不要泡在酱汁里泡软。'
      - id: season-pasta
        text: '拌匀后即可，盐留到最后再调。'
        quote: '拌匀后即可，盐留到最后再调。'
