  - id: three-step-freezing-prep
    status: reviewed
    source:
      anchor: '冷冻前的三步处理'
    slot: anytime
    remind:
      text: '冷冻前完成清洗、去皮和密封处理。'
      quote:
        - '冷冻之前，用清水彻底洗净。'
        - '皮不能吃、也不好去皮的蔬菜和水果（洋葱、橙子、菠萝等），先剥掉皮再冷冻。'
        - '为防止干燥，用保鲜膜裹紧或装进密封袋，再放进冷冻室。'
    effect:
      text: '大型蔬菜和水果可以切分开来，这样一晚就能冻好。'
      quote: '大型蔬菜和水果可以切分开来，这样一晚就能冻好。'
    steps:
      - id: wash-before-freezing
        text: '冷冻之前，用清水彻底洗净。'
        quote: '冷冻之前，用清水彻底洗净。'
      - id: peel-before-freezing
        text: '皮不能吃、也不好去皮的蔬菜和水果（洋葱、橙子、菠萝等），先剥掉皮再冷冻。'
        quote: '皮不能吃、也不好去皮的蔬菜和水果（洋葱、橙子、菠萝等），先剥掉皮再冷冻。'
      - id: seal-before-freezing
        text: '为防止干燥，用保鲜膜裹紧或装进密封袋，再放进冷冻室。'
        quote: '为防止干燥，用保鲜膜裹紧或装进密封袋，再放进冷冻室。'
      - id: cut-large-produce
        text: '大型蔬菜和水果可以切分开来，这样一晚就能冻好。'
        quote: '大型蔬菜和水果可以切分开来，这样一晚就能冻好。'
      - id: choose-freezable-foods
        text: '粉色系（推荐）：生姜、茗荷、紫苏叶。绿色系：小葱（青葱）、黄瓜、番茄、牛油果。水果：橙子、菠萝、草莓。'
        quote:
          - '粉色系（推荐）：生姜、茗荷、紫苏叶。'
          - '绿色系：小葱（青葱）、黄瓜、番茄、牛油果。'
          - '水果：橙子、菠萝、草莓。'
    review:
      by: benson
      date: 2026-10-21
      hash: 04fc7e41c5990cb5

  - id: freeze-mushrooms
    status: reviewed
    name: "冷冻菌菇备餐"
    source:
      anchor: '冻蘑菇（喜欢的菌菇都可以）：一晚就能备好晚餐'
    slot: anytime
    remind:
      text: '喜欢菌菇时先冷冻备餐，之后可直接用于炒菜、煮汤或煮意面。'
      quote:
        - '如果你喜欢菌菇，冷冻这件事几乎是为它设计的：'
        - '之后炒菜、煮汤、煮意面都可以直接用冻的，不用解冻。'
    effect:
      text: '过一晚，鲜味就准备好了——之后炒菜、煮汤、煮意面都可以直接用冻的，不用解冻。'
      quote: '过一晚，鲜味就准备好了——之后炒菜、煮汤、煮意面都可以直接用冻的，不用解冻。'
    steps:
      - id: cut-mushrooms
        text: '切成便于使用的大小。'
        quote: '切成便于使用的大小。'
      - id: bag-mushrooms
        text: '放进密封袋，尽量不接触空气。'
        quote: '放进密封袋，尽量不接触空气。'
      - id: freeze-mushrooms-step
        text: '放进冷冻室。'
        quote: '放进冷冻室。'
    review:
      by: benson
      date: 2026-10-21
      hash: 9c335ab2434524d4

  - id: clam-chowder
    status: reviewed
    name: "蛤蜊浓汤"
    source:
      anchor: '食谱一：蛤蜊浓汤（クラムチャウダー）'
    slot: anytime
    remind:
      text: '凉爽的初秋可以做蛤蜊浓汤，先把蛤蜊吐沙并冷冻，再按步骤烹调。'
      quote:
        - '凉爽的初秋最合适的一锅。'
        - '把蛤蜊吐沙后装进密封袋，在冷冻室冻一晚以上。'
    dose:
      - value: 150
        unit: 'g'
        what: '冷冻蛤蜊用量'
        quote: '冷冻蛤蜊（しじみ）150g'
      - value: 0.5
        unit: '小勺'
        what: '大蒜用量'
        derived:
          formula: 1/2 小勺 = 0.5 小勺
        quote: '大蒜 1/2 小勺（切碎）'
      - value: 10
        unit: 'g'
        what: '黄油用量'
        quote: '黄油 10g'
      - value: 400
        unit: 'mL'
        what: '牛奶用量'
        quote: '牛奶 400mL'
      - value: 100
        unit: 'mL'
        what: '水用量'
        quote: '水 100mL'
      - value: 1
        unit: '大勺'
        what: '玉米淀粉用量'
        quote: '玉米淀粉 1 大勺（用 1 大勺牛奶溶解）'
      - value: 3
        unit: 'g'
        what: '盐用量'
        quote: '盐 3g'
      - value: 1
        unit: '分钟'
        what: '强火快炒时长'
        quote: '强火快炒约 1 分钟（略不足 1 分钟）'
        approximate: true
    steps:
      - id: purge-and-freeze-clams
        text: '把蛤蜊吐沙后装进密封袋，在冷冻室冻一晚以上。'
        quote: '把蛤蜊吐沙后装进密封袋，在冷冻室冻一晚以上。'
      - id: saute-aromatics
        text: '锅中放入蒜末和黄油，小火炒出香气。'
        quote: '锅中放入蒜末和黄油，小火炒出香气。'
      - id: stir-fry-clams
        text: '加入冻蛤蜊，强火快炒约 1 分钟（略不足 1 分钟）。注意：口还没合上的蛤蜊不能吃。'
        quote: '加入冻蛤蜊，强火快炒约 1 分钟（略不足 1 分钟）。注意：口还没合上的蛤蜊不能吃。'
        duration:
          basis: quote
          sec: 60
          quote: 加入冻蛤蜊，强火快炒约 1 分钟（略不足 1 分钟）。注意：口还没合上的蛤蜊不能吃。
          approximate: true
      - id: simmer-milk-and-water
        text: '加入水和牛奶，中火煮 3～4 分钟。'
        quote: '加入水和牛奶，中火煮 3～4 分钟。'
        duration:
          basis: quote
          sec: 240
          quote: 加入水和牛奶，中火煮 3～4 分钟。
      - id: thicken-chowder
        text: '用牛奶溶开的玉米淀粉勾芡，再加盐调味。'
        quote: '用牛奶溶开的玉米淀粉勾芡，再加盐调味。'
      - id: garnish-chowder
        text: '上桌前撒莳萝粉或红椒粉，色彩立刻丰富起来。'
        quote: '上桌前撒莳萝粉或红椒粉，色彩立刻丰富起来。'
    cautions:
      - level: stop
        text: '口还没合上的蛤蜊不能吃。'
        quote: '口还没合上的蛤蜊不能吃。'
