        quote: '橄榄油 1.5 大勺'
      - value: 1.5
        unit: '大勺'
        what: '日式汤面调味汁用量'
        derived:
          formula: 1 又 1/2 大勺 = 1.5 大勺
        quote: '日式汤面调味汁 1 又 1/2 大勺'
      - value: 2
        unit: '撮'
        what: '盐用量'
        quote: '盐 2 撮'
