          - "塑料袋"
          - "排出袋内的空气"
      - id: secure-bag
        text: "松松地扎住袋口。大约绕 2～4 圈"
        quote:
          - "松松地扎住袋口。"
          - "大约绕 2～4 圈"
      - id: refrigerate-apple
        text: "放进冰箱保存。低温冷藏室最适合苹果。"
        quote:
