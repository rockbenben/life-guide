  - id: store-whole-apple
    status: reviewed
    source:
      anchor: "保存：给苹果「松口气」"
    slot: anytime
    remind:
      text: "用微湿的报纸或厨房纸包苹果，装袋排气后冷藏"
      quote:
        - 微微沾湿的报纸或厨房纸
        - 把苹果包起来——保湿是第一步。
        - 排出袋内的空气
        - 这篇从一罐基础调味料开始：1 个苹果（约 300g）连皮擦成泥，加 1 小勺盐，中火加热 4～5 分钟，放凉后冷藏可存 1～2 周。后面两道菜——肉酱意面和嫩煎鸡胸——都用它。整颗苹果吃不完，还有一招能让它多放 2～3 周。
    effect:
      text: "一整颗苹果吃不完，可以让它多放两三周。"
      quote: "一整颗苹果吃不完，可以让它多放两三周。"
    dose:
      - value: 2
        valueMax: 4
        unit: "圈"
        what: "橡皮筋圈数"
        quote: "大约绕 2～4 圈"
        approximate: true
    steps:
      - id: wrap-apple
        text: "微微沾湿的报纸或厨房纸把苹果包起来——保湿是第一步。"
        quote:
          - "微微沾湿的报纸或厨房纸"
          - "把苹果包起来——保湿是第一步。"
      - id: bag-and-deflate
