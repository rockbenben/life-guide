cards:
  - id: make-salted-apple
    status: reviewed
    name: "熬盐苹果当调味料"
    source:
      anchor: "先熬一罐「盐苹果」"
    slot: anytime
    remind:
      text: "制作盐苹果，作为肉酱和鸡胸的基础调味料"
      quote:
        - 这是整份说明书的基础调味料，做一次能用两周。
        - 碗里放绞肉和盐苹果，用勺子轻轻拌匀。
    dose:
      - value: 1
        unit: "个"
        what: "苹果用量"
        quote: "1 个（300g）"
      - value: 300
        unit: "g"
        what: "苹果重量"
        quote: "300g"
      - value: 1
        unit: "小勺"
        what: "盐用量"
        quote: "1 小勺"
    steps:
      - id: grate-apple-with-skin
        text: "擦丝器把苹果连皮一起擦成泥皮上有营养，别削。"
        quote:
          - "擦丝器把苹果连皮一起擦成泥"
          - "皮上有营养，别削。"
      - id: season-and-heat
        text: "1 小勺中火加热"
        quote:
          - "1 小勺"
          - "中火加热"
      - id: stir-while-heating
        text: "适时用锅铲搅拌避免糊底。"
        quote:
          - "适时用锅铲搅拌"
          - "避免糊底。"
      - id: reduce-to-thick
        text: "4～5 分钟熬到水分差不多挥发完、质地浓稠即可。"
        quote:
          - "4～5 分钟"
          - "熬到水分差不多挥发完、质地浓稠即可。"
        duration:
          basis: quote
          sec: 300
          quote: 4～5 分钟
      - id: cool-and-refrigerate
        text: "稍微放凉后进冰箱可保存 1～2 周"
        quote:
          - "稍微放凉后进冰箱"
          - "可保存 1～2 周"
    cautions:
      - level: info
        text: "避免糊底。一旦焦了，焦香会盖掉苹果本来的味道。"
        quote:
          - "避免糊底。"
          - "一旦焦了，焦香会盖掉苹果本来的味道。"
      - level: info
        text: "加热时间会因品种和季节不同而略有差别。"
        quote: "加热时间会因品种和季节不同而略有差别。"
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: fe79d46b46488557

