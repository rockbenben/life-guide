  - id: roast-broccoli-stem
    status: reviewed
    name: "烤西兰花梗"
    source:
      anchor: '魅力二：扔掉梗太可惜，甜度差 2.5 倍'
    slot: anytime
    remind:
      text: '把西兰花梗切成圆片，拌匀后烤制。'
      quote:
        - '把梗切成约 7mm 厚的圆片（皮不削、连皮一起也可以）。'
        - '加橄榄油和盐，充分拌匀。'
        - '烤箱调250℃，放在耐热盘上烤约 10 分钟。'
    effect:
      text: '茎的含糖量约为花球的 2.5 倍'
      quote: '茎的含糖量约为花球的 2.5 倍'
    dose:
      - value: 1
        unit: 根
        what: 西兰花梗用量
        quote: '西兰花梗 1 根（70～80g）'
      - value: 1
        unit: 大勺
        what: 橄榄油用量
        quote: '橄榄油 1 大勺'
      - value: 1
        unit: 小撮
        what: 盐用量
        quote: '盐 1 小撮'
      - value: 7
        unit: mm
        what: 梗片厚度
        quote: '约 7mm 厚的圆片'
        approximate: true
      - value: 250
        unit: ℃
        what: 烤箱温度
        quote: '烤箱调250℃，放在耐热盘上烤约 10 分钟。'
      - value: 10
        unit: 分钟
        what: 烤制时间
        quote: '烤箱调250℃，放在耐热盘上烤约 10 分钟。'
        approximate: true
      - value: 7
        unit: 分钟
        what: 鱼烤盘强火烤制时间
        quote: '强火烤约 7 分钟'
        approximate: true
    steps:
      - id: cut-stem
        text: '把梗切成约 7mm 厚的圆片（皮不削、连皮一起也可以）。'
        quote: '把梗切成约 7mm 厚的圆片（皮不削、连皮一起也可以）。'
      - id: season-stem
        text: '加橄榄油和盐，充分拌匀。'
        quote: '加橄榄油和盐，充分拌匀。'
      - id: roast-stem
        text: '烤箱调250℃，放在耐热盘上烤约 10 分钟。'
        quote: '烤箱调250℃，放在耐热盘上烤约 10 分钟。'
      - id: serve-stem
        text: '烤好之后摆上自己喜欢的配料，就是一份西班牙小吃。'
        quote: '烤好之后摆上自己喜欢的配料，就是一份西班牙小吃。'
      - id: grill-stem
        text: '前两步不变，鱼烤盘铺锡纸、把梗圆片并排摆好，强火烤约 7 分钟。'
        quote:
          - 前两步不变，鱼烤盘铺锡纸、把梗圆片并排摆好，强火烤约 7 分钟。
          - 没有烤箱（鱼烤盘）版：前两步不变，然后用鱼烤盘烤盘铺上锡纸，奶酪断面向下放中间、西兰花围一圈，强火烤约 7 分钟。
