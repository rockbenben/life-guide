  - id: roast-broccoli-florets
    status: reviewed
    name: "烤西兰花花球"
    source:
      anchor: '魅力一：烤过之后，房间里会飘起肉香'
    slot: anytime
    remind:
      text: '把西兰花花球切成小朵，和奶酪一起烤到表面焦黄。'
      quote:
        - '把西兰花切成小朵（大的对半切）。'
        - '切掉奶酪顶部，放在耐热盘中央，断面向下，西兰花围着它摆一圈。'
        - '烤箱调250℃，烤约 15 分钟，直到表面焦黄。'
    effect:
      text: '用高温烤到表面焦黄，房间里就会散发出类似烤肉的香气。'
      quote: '用高温烤到表面焦黄，房间里就会散发出类似烤肉的香气。'
    dose:
      - value: 100
        unit: g
        what: 西兰花用量
        quote: '西兰花 100g'
      - value: 1
        unit: 个
        what: 卡芒贝尔奶酪用量
        quote: '卡芒贝尔奶酪 1 个'
      - value: 1.5
        unit: 大勺
        what: 橄榄油用量
        quote: '橄榄油 1.5 大勺'
      - value: 2
        unit: 撮
        what: 盐用量
        quote: '盐 2 撮'
      - value: 250
        unit: ℃
        what: 烤箱温度
        quote: '烤箱调250℃，烤约 15 分钟，直到表面焦黄。'
      - value: 15
        unit: 分钟
        what: 烤制时间
        quote: '烤箱调250℃，烤约 15 分钟，直到表面焦黄。'
        approximate: true
      - value: 7
        unit: 分钟
        what: 鱼烤盘强火烤制时间
        quote: '强火烤约 7 分钟'
        approximate: true
    steps:
      - id: cut-florets
        text: '把西兰花切成小朵（大的对半切）。'
        quote: '把西兰花切成小朵（大的对半切）。'
      - id: coat-florets
        text: '加橄榄油和盐，从花的表面充分拌匀，让每朵都裹上油。'
        quote: '加橄榄油和盐，从花的表面充分拌匀，让每朵都裹上油。'
      - id: arrange-cheese
        text: '切掉奶酪顶部，放在耐热盘中央，断面向下，西兰花围着它摆一圈。'
        quote: '切掉奶酪顶部，放在耐热盘中央，断面向下，西兰花围着它摆一圈。'
      - id: roast-florets
        text: '烤箱调250℃，烤约 15 分钟，直到表面焦黄。'
        quote: '烤箱调250℃，烤约 15 分钟，直到表面焦黄。'
      - id: grill-florets
        text: '用鱼烤盘烤盘铺上锡纸，奶酪断面向下放中间、西兰花围一圈，强火烤约 7 分钟。'
        quote:
          - 用鱼烤盘烤盘铺上锡纸，奶酪断面向下放中间、西兰花围一圈，强火烤约 7 分钟。
          - 没有烤箱（鱼烤盘）版：前两步不变，然后用鱼烤盘烤盘铺上锡纸，奶酪断面向下放中间、西兰花围一圈，强火烤约 7 分钟。
