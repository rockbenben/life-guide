  - id: blanch-broccoli-florets
    status: reviewed
    name: "烫焯法回鲜"
    source:
      anchor: '魅力三：「烫焯法」把不新鲜的花球救回来'
    slot: anytime
    remind:
      text: '用「烫焯法」给不新鲜的花球回鲜。'
      quote:
        - '已经不太新鲜的花球也有救——烫焯法：'
        - '方法叫「烫焯法」。'
    effect:
      text: '口感变回爽脆、水润度也提升'
      quote: '口感变回爽脆、水润度也提升'
    dose:
      - value: 2
        unit: mm
        what: 茎末端切除长度
        quote: '把茎的末端切掉约 2mm。'
        approximate: true
      - value: 20
        unit: 秒
        what: 热水浸泡时间
        quote: '把切面朝下放进沸腾的热水里泡约 20 秒。'
        approximate: true
    steps:
      - id: trim-stem-end
        text: '把茎的末端切掉约 2mm。'
        quote: '把茎的末端切掉约 2mm。'
      - id: hot-soak
        text: '把切面朝下放进沸腾的热水里泡约 20 秒。'
        quote: '把切面朝下放进沸腾的热水里泡约 20 秒。'
      - id: cool-soak
        text: '一从水里取出，立刻浸入冷水——让茎充分吸水是这一招的核心。'
        quote: '一从水里取出，立刻浸入冷水——让茎充分吸水是这一招的核心。'
      - id: bag-and-chill
        text: '为防止干燥，套上袋子放进冰箱冷藏。'
        quote: '为防止干燥，套上袋子放进冰箱冷藏。'
      - id: chill-half-day
        text: '放置约半天，再从水里取出。'
        quote: '放置约半天，再从水里取出。'
      - id: salad-serve
        text: '说明书推荐快速焯一下做沙拉，最能吃出那份爽脆。'
        quote: '说明书推荐快速焯一下做沙拉，最能吃出那份爽脆。'
    cautions:
      - level: stop
        text: '为免烫伤，请用夹子等工具夹住操作。'
        quote: '为免烫伤，请用夹子等工具夹住操作。'
      - level: stop
        text: '室温放置会有细菌繁殖的风险。'
        quote: '室温放置会有细菌繁殖的风险。'
      - level: stop
        text: '即使在冰箱里，一直泡在水里时间过长同样会繁殖细菌，所以以半天为限取出。'
        quote: '即使在冰箱里，一直泡在水里时间过长同样会繁殖细菌，所以以半天为限取出。'
      - level: info
        text: '下锅前请充分冲洗，并加热后再食用。'
        quote: '下锅前请充分冲洗，并加热后再食用。'
      - level: info
        text: '但要记住：「烤花球」和「烤梗」两道做法含水量高、不适合水煮，两者要分开用。'
        quote: '但要记住：「烤花球」和「烤梗」两道做法含水量高、不适合水煮，两者要分开用。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-28
      hash: 7121c514dd3ea62f
