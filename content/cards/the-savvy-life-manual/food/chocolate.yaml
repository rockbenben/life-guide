  - id: chocolate-seed-tempering
    status: reviewed
    name: "混入种子调温"
    source:
      anchor: '家传巧克力「魔法的种子」（约 3 块）'
    slot: anytime
    remind:
      text: '用市售巧克力作「魔法的种子」，混入融化后的巧克力并反复搅拌。'
      quote:
        - '「魔法的种子」是市售巧克力敲碎的碎块。'
        - '把它混进融化后的巧克力里——因为市售巧克力本身就含有 V 型结晶，混进去后它就成为结晶的核，让整块巧克力都长出 V 型结晶。'
        - '反复操作这个步骤，搅拌 2 分钟以上；若仍剩下一半以上的「魔法的种子」就停下来。'
    dose:
      - value: 150
        unit: g
        what: '板巧克力总用量'
        quote: '板巧克力 3 块（150g）'
      - value: 100
        unit: g
        what: '切块巧克力量'
        quote: '取 2 块（100g）巧克力切成约 1cm 见方，放入碗中。'
    steps:
      - id: home-cut-chocolate
        text: '取 2 块（100g）巧克力切成约 1cm 见方，放入碗中。'
        quote:
          - '取 2 块（100g）巧克力切成约 1cm 见方，放入碗中。'
      - id: home-crack-seeds
        text: '剩下的 1 块作为「魔法的种子」，每块约 2cm 地敲碎备用。'
        quote:
          - '剩下的 1 块作为「魔法的种子」，每块约 2cm 地敲碎备用。'
      - id: home-melt
        text: '把 用微波炉 500W 加热 1 分钟，轻轻搅拌。再用微波炉 500W 加热 30 秒，搅拌至顺滑。加热不足时追加 10 秒。'
        quote:
          - '把 ① 用微波炉 500W 加热 1 分钟，轻轻搅拌。'
          - '再用微波炉 500W 加热 30 秒，搅拌至顺滑。'
          - '加热不足时追加 10 秒。'
      - id: home-add-seeds
        text: '向 中每次加入一小块「魔法的种子」，搅拌至完全融化。'
        quote:
          - '向 ① 中每次加入一小块「魔法的种子」，搅拌至完全融化。'
      - id: home-stir
        text: '反复操作这个步骤，搅拌 2 分钟以上；若仍剩下一半以上的「魔法的种子」就停下来。'
        quote:
          - '反复操作这个步骤，搅拌 2 分钟以上；若仍剩下一半以上的「魔法的种子」就停下来。'
      - id: home-mold-set
        text: '用勺子或裱花袋装入模具后，把模具上下轻敲几下排出空气，让表面平整。常温放置 3～5 分钟，表面凝固就基本成功。'
        quote:
          - '用勺子或裱花袋装入模具后，把模具上下轻敲几下排出空气，让表面平整。'
          - '常温放置 3～5 分钟，表面凝固就基本成功。'
      - id: home-chill
        text: '放入蔬果保鲜室放 30 分钟以上固定成型。'
        quote:
          - '放入蔬果保鲜室放 30 分钟以上固定成型。'
    cautions:
      - level: info
        text: '也可能因室温而不易凝固，18～22℃ 是合适温度。'
        quote: '也可能因室温而不易凝固，18～22℃ 是合适温度。'
    review:
      by: benson
      date: 2026-10-21
      hash: 5aedb8f1ddce5602
  - id: chocolate-beef-stew
