    slot: anytime
    remind:
      text: '今天做巧克力牛肉炖菜：牛肉煎炒后加巧克力炖软土豆，最后勾芡收浓。'
      quote:
        - 加入土豆、高可可巧克力和 A 组，继续煮到土豆变软。
        - 把 B 组的水溶高粉勾芡，收浓即可。
        - 牛肉（炖煮用，一口大）400g
    steps:
      - id: beef-prepare
        text: '牛肉（炖煮用，一口大）400g洋葱 1 个（150g）胡萝卜（乱切）1 根（120g）土豆（一口大）2 个盐 少许 / 胡椒 少许酒 50ml / 水 800ml高可可巧克力（70%）12g番茄膏 4 大勺中浓酱汁 5 大勺酱油 3 大勺橄榄油 1 又 1/2 大勺高粉 2 小勺水 2 小勺'
        quote:
