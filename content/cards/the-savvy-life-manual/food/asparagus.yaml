  - id: asparagus-cooking-overview
    status: reviewed
    name: "保持芦笋脆甜的两种做法"
    source:
      anchor: "芦笋怎么做才脆？焯水 24 秒 + 整根裹油煎"
    slot: anytime
    remind:
      text: "保持脆度用短时间焯水留住甜味用整根裹油煎"
      quote:
        - "保持脆度用短时间焯水"
        - "留住甜味用整根裹油煎"
    effect:
      text: "留住甜味用整根裹油煎保持脆度用短时间焯水"
      quote:
        - "留住甜味用整根裹油煎"
        - "保持脆度用短时间焯水"
    steps:
      - id: trim-hard-stem
        text: "先从根部折断或削掉根部约 5cm 的硬筋"
        quote: "先从根部折断或削掉根部约 5cm 的硬筋"
      - id: blanch-by-diameter
        text: "沸水下锅——直径 1～1.5cm 焯 20～30 秒、直径 1.5～2cm 焯 30～40 秒"
        quote:
          - 沸水下锅——直径 1～1.5cm 焯 20～30 秒、直径 1.5～2cm 焯 30～40 秒
          - 处理芦笋是两个关键动作。留住甜味用整根裹油煎：油盐裹满全身，冷锅下，大火约 3 分钟全程不上色不翻动，出锅前翻面再加热约 30 秒。保持脆度用短时间焯水：先从根部折断或削掉根部约 5cm 的硬筋，沸水下锅——直径 1～1.5cm 焯 20～30 秒、直径 1.5～2cm 焯 30～40 秒，实测只需 24 秒。下面先给做法，甜味为什么埋在地下放在最后。
      - id: sear-whole
        text: "油盐裹满全身，冷锅下，大火约 3 分钟全程不上色不翻动，出锅前翻面再加热约 30 秒"
        quote:
          - 油盐裹满全身，冷锅下，大火约 3 分钟全程不上色不翻动，出锅前翻面再加热约 30 秒
          - 处理芦笋是两个关键动作。留住甜味用整根裹油煎：油盐裹满全身，冷锅下，大火约 3 分钟全程不上色不翻动，出锅前翻面再加热约 30 秒。保持脆度用短时间焯水：先从根部折断或削掉根部约 5cm 的硬筋，沸水下锅——直径 1～1.5cm 焯 20～30 秒、直径 1.5～2cm 焯 30～40 秒，实测只需 24 秒。下面先给做法，甜味为什么埋在地下放在最后。
