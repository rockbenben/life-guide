  - id: asparagus-crisp-blanch
    status: reviewed
    name: "焯水去硬筋"
    source:
      anchor: "脆嫩的关键：短时间焯水 + 去掉硬筋"
    slot: anytime
    remind:
      text: "关键动作是把硬筋彻底去掉"
      quote:
        - 关键动作是把硬筋彻底去掉
        - 处理芦笋是两个关键动作。留住甜味用整根裹油煎：油盐裹满全身，冷锅下，大火约 3 分钟全程不上色不翻动，出锅前翻面再加热约 30 秒。保持脆度用短时间焯水：先从根部折断或削掉根部约 5cm 的硬筋，沸水下锅——直径 1～1.5cm 焯 20～30 秒、直径 1.5～2cm 焯 30～40 秒，实测只需 24 秒。下面先给做法，甜味为什么埋在地下放在最后。
    effect:
      text: "趁短暂的时间焯水，品尝本该有的爽脆口感"
      quote: "趁短暂的时间焯水，品尝本该有的爽脆口感"
    dose:
      - value: 20
        valueMax: 30
        unit: 秒
        what: "直径 1～1.5cm 芦笋焯水时长"
        quote: "直径 1～1.5cm → 20～30 秒"
      - value: 30
        valueMax: 40
        unit: 秒
        what: "直径 1.5～2cm 芦笋焯水时长"
        quote: "直径 1.5～2cm → 30～40 秒"
    duration:
      basis: quote
      sec: 24
      quote: "实测只需 24 秒"
    steps:
      - id: remove-hard-stem
        text: "准备：从根部折断，或用削皮器从根部削去约 5cm 的皮，去除硬筋"
        quote: "准备：从根部折断，或用削皮器从根部削去约 5cm 的皮，去除硬筋"
      - id: snap-hard-stem
        text: "握住芦笋的中部与根部，朝根部的反方向用力，硬筋就会在靠近端口的部位自然折断"
        quote: "握住芦笋的中部与根部，朝根部的反方向用力，硬筋就会在靠近端口的部位自然折断"
      - id: blanch-in-boiling-water
        text: "放入沸腾的水中焯烫"
        quote: "放入沸腾的水中焯烫"
      - id: choose-time-by-diameter
        text: "直径 1～1.5cm → 20～30 秒；直径 1.5～2cm → 30～40 秒"
        quote: "直径 1～1.5cm → 20～30 秒；直径 1.5～2cm → 30～40 秒"
    cautions:
      - level: info
        text: "这段硬化的部分，无论煮多久都不会变软"
        quote: "这段硬化的部分，无论煮多久都不会变软"
    review:
      by: benson
      date: 2026-10-21
      hash: cc200751fa36ac24

