        - '折返的时机，以「倾斜锅子蛋液也不流」为准。'
        - '追加的蛋液，分几次都行。'
    steps:
      - id: mix-starch
        text: '每次倒入蛋液，都要从碗底往上翻搅，确认整体都混进了玉米淀粉。'
        quote: '每次倒入蛋液，都要从碗底往上翻搅，确认整体都混进了玉米淀粉。'
