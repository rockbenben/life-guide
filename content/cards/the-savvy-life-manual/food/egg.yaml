  - id: fluffy-tamagoyaki-method
    status: reviewed
    source:
      anchor: '蓬松玉子烧：四个不翻车的要点'
    slot: anytime
    remind:
      text: '按材料混合蛋液，再分段折返并追加蛋液制作蓬松玉子烧'
      quote:
        - 碗里放入除油以外的全部材料，用打蛋器充分搅拌到完全没有干粉感，搅到面糊本身失去筋性。
        - 出现气泡后用竹签戳破；半凝固时从远端往近端折回。
        - 玉子烧总是又小又硬，滑嫩炒蛋一炒就发柴？差别就在玉米淀粉和火候。
    dose:
      - value: 3
        unit: '个'
        what: '蛋量'
        quote: '蛋 3 个、高汤 200mL、玉米淀粉 2 小勺、油 适量、盐 2 小撮'
      - value: 200
        unit: 'mL'
        what: '高汤量'
        quote: '蛋 3 个、高汤 200mL、玉米淀粉 2 小勺、油 适量、盐 2 小撮'
      - value: 2
        unit: '小勺'
        what: '玉米淀粉用量'
        quote: '蛋 3 个、高汤 200mL、玉米淀粉 2 小勺、油 适量、盐 2 小撮'
      - value: 1
        unit: '大勺'
        what: '首次入锅的油量'
        quote: '玉子烧锅放 1 大勺油、中火加热，油温上来后保持中火，倒入 1/3 量的蛋液铺满锅底。'
      - value: 2
        unit: '小撮'
        what: '盐量'
        quote: '蛋 3 个、高汤 200mL、玉米淀粉 2 小勺、油 适量、盐 2 小撮'
    steps:
      - id: mix-batter
        text: '碗里放入除油以外的全部材料，用打蛋器充分搅拌到完全没有干粉感，搅到面糊本身失去筋性。'
        quote: '碗里放入除油以外的全部材料，用打蛋器充分搅拌到完全没有干粉感，搅到面糊本身失去筋性。'
      - id: heat-pan
        text: '玉子烧锅放 1 大勺油、中火加热，油温上来后保持中火，倒入 1/3 量的蛋液铺满锅底。'
        quote: '玉子烧锅放 1 大勺油、中火加热，油温上来后保持中火，倒入 1/3 量的蛋液铺满锅底。'
      - id: fold-egg
        text: '出现气泡后用竹签戳破；半凝固时从远端往近端折回。关键是要把锅倾斜成蛋液不会流走的角度。'
        quote:
          - '出现气泡后用竹签戳破；半凝固时从远端往近端折回。'
          - '关键是要把锅倾斜成蛋液不会流走的角度。'
      - id: oil-and-push
        text: '卷完后在锅的空白处薄薄刷一层油，把蛋饼往里推，靠近手的一侧也刷一层薄油。'
        quote: '卷完后在锅的空白处薄薄刷一层油，把蛋饼往里推，靠近手的一侧也刷一层薄油。'
      - id: add-egg
        text: '再次把蛋液倒进锅里，也要流进已卷起那部分的下方。每次倒之前都要充分搅匀底部的沉淀，否则玉米淀粉会沉底结块。'
        quote:
          - '再次把蛋液倒进锅里，也要流进已卷起那部分的下方。'
          - '每次倒之前都要充分搅匀底部的沉淀，否则玉米淀粉会沉底结块。'
      - id: repeat-folds
        text: '用做玉子烧的方式，把第 3～5 步重复 2～3 次。'
        quote:
          - 用做玉子烧的方式，把第 3～5 步重复 2～3 次。
          - 想把玉子烧做到极度蓬松，配方是蛋 3 个＋高汤 200mL＋玉米淀粉 2 小勺；四个不翻车要点是把玉米淀粉彻底混匀、折返而不是卷、以「倾斜锅子蛋液也不流」为准、追加的蛋液分几次都行。想要极致滑嫩，就弱火加全程不停搅拌 7～10 分钟，搅到卡仕达奶油般的浓稠状态。下面先给做法和各道食谱，最后再讲玉米淀粉为什么是鸡蛋的「最高伙伴」。^[「たまご」のトリセツ]
        duration:
