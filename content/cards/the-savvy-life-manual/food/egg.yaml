  - id: egg-cornstarch-heat-basics
    status: reviewed
    name: "蛋液里加玉米淀粉"
    source:
      anchor: '鸡蛋：玉子烧又小又硬？3 个蛋 + 玉米淀粉 2 小勺'
    slot: anytime
    remind:
      text: '制作蓬松玉子烧时混匀玉米淀粉，制作滑嫩炒蛋时用弱火持续搅拌'
      quote:
        - 玉子烧总是又小又硬，滑嫩炒蛋一炒就发柴？差别就在玉米淀粉和火候。
        - 配方是蛋 3 个＋高汤 200mL＋玉米淀粉 2 小勺
        - 弱火加全程不停搅拌 7～10 分钟
        - ① 玉米淀粉要彻底混匀。 只要没和蛋液混匀，就一定有怎么都搅不散的硬块出现。每次倒入蛋液，都要从碗底往上翻搅，确认整体都混进了玉米淀粉。没有打蛋器的话，改成先用高汤把玉米淀粉调成水浆，再和蛋液混合，会好混得多。
    dose:
      - value: 3
        unit: '个'
        what: '蛋量'
        quote: '配方是蛋 3 个＋高汤 200mL＋玉米淀粉 2 小勺'
      - value: 200
        unit: 'mL'
        what: '高汤量'
        quote: '配方是蛋 3 个＋高汤 200mL＋玉米淀粉 2 小勺'
      - value: 2
        unit: '小勺'
        what: '玉米淀粉用量'
        quote: '配方是蛋 3 个＋高汤 200mL＋玉米淀粉 2 小勺'
    steps:
      - id: mix-cornstarch
        text: '把玉米淀粉彻底混匀'
        quote: '把玉米淀粉彻底混匀'
      - id: stir-low-heat
        text: '弱火加全程不停搅拌 7～10 分钟，搅到卡仕达奶油般的浓稠状态。'
        quote: '弱火加全程不停搅拌 7～10 分钟，搅到卡仕达奶油般的浓稠状态。'
        duration:
          basis: quote
          sec: 600
          quote: 弱火加全程不停搅拌 7～10 分钟，搅到卡仕达奶油般的浓稠状态。
