          quote: 想把玉子烧做到极度蓬松，配方是蛋 3 个＋高汤 200mL＋玉米淀粉 2 小勺；四个不翻车要点是把玉米淀粉彻底混匀、折返而不是卷、以「倾斜锅子蛋液也不流」为准、追加的蛋液分几次都行。想要极致滑嫩，就弱火加全程不停搅拌 7～10 分钟，搅到卡仕达奶油般的浓稠状态。下面先给做法和各道食谱，最后再讲玉米淀粉为什么是鸡蛋的「最高伙伴」。^[「たまご」のトリセツ]
    cautions:
      - level: info
        text: '只要没和蛋液混匀，就一定有怎么都搅不散的硬块出现。'
        quote: '只要没和蛋液混匀，就一定有怎么都搅不散的硬块出现。'
