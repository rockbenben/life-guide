  - id: vinegar-drops-by-dish
    status: reviewed
    name: 醋按菜量滴：0.5%～1%
    source:
      anchor: 醋：几滴就够的用量表
    slot: anytime
    remind:
      text: 醋按菜品总量的 0.5%～1% 用，从 3～4 滴起步再加；加完要充分搅拌。
      quote:
        - 用量目标是菜品总量的 0.5%～1%。放多了会发酸，所以请从 3～4 滴开始加，再逐步调整。
        - 用量只是大致标准，食材不同需要微调。加醋后要充分搅拌，让醋均匀分布到整道菜里；混不匀的话，效果几乎感知不到。
    effect:
      text: 醋的隐藏功能是味道觉醒力——几滴就能把整道菜的味道托起来：味道变清爽、素材的味道被引出、用水果做的饮品的清爽感提升。
      quote: 醋的隐藏功能是味道觉醒力——几滴就能把整道菜的味道托起来：味道变清爽、素材的味道被引出、用水果做的饮品的清爽感提升。
    dose:
      - value: 0.5
        valueMax: 1
        unit: "%"
        what: 醋占菜品总量的比例
        quote: 用量目标是菜品总量的 0.5%～1%。放多了会发酸，所以请从 3～4 滴开始加，再逐步调整。
      - value: 3
        valueMax: 4
        unit: 滴
        what: 起步用量
        quote: 放多了会发酸，所以请从 3～4 滴开始加，再逐步调整。
      - value: 1
        unit: 周
        what: 冷藏后用完的期限
        quote: 冷藏保存，1 周左右用完；一旦变质就停用。
    steps:
      - id: start-with-three-drops
        text: 从 3～4 滴开始加，再逐步调整（放多了会发酸）。
        quote: 用量目标是菜品总量的 0.5%～1%。放多了会发酸，所以请从 3～4 滴开始加，再逐步调整。
      - id: stir-well
        text: 加醋后要充分搅拌，让醋均匀分布到整道菜里；混不匀的话，效果几乎感知不到。
        quote: 用量只是大致标准，食材不同需要微调。加醋后要充分搅拌，让醋均匀分布到整道菜里；混不匀的话，效果几乎感知不到。
      - id: store-properly
        text: 容器避免金属和木器，选玻璃、塑料或陶器；冷藏保存，1 周左右用完；一旦变质就停用。
        quote: 秘醋的存放：容器避免金属和木器，选玻璃、塑料或陶器；冷藏保存，1 周左右用完；一旦变质就停用。
