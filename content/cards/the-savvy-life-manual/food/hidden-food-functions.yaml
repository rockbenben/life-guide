  - id: mashed-potato-dough-knots
    status: reviewed
    name: 土豆泥团子：微波 4+3 分钟
    source:
      anchor: 食谱
    slot: anytime
    remind:
      text: 土豆去皮去芽擦泥拌油，微波 4 分钟后拌匀再加热 3 分钟，搓成棒晾凉切块炸 3～4 分钟。
      quote:
        - 耐热碗中放入去皮去芽后擦泥的土豆和油，轻轻拌匀，不盖保鲜膜用 500W 微波加热 4 分钟。
        - 取出用刮刀随意拌匀，再加热 3 分钟，然后聚拢揉成团。
        - 炸土豆团子：把团子用保鲜膜搓成棒后切成 15 等份，180℃ 炸 3～4 分钟；趁热撒青椒粉和盐食用。
    dose:
      - value: 250
        unit: g
        what: 擦成泥的土豆用量
        quote: |-
          擦成泥的土豆（3 个小土豆左右的量）
          250g
      - value: 1
        unit: 大勺
        what: 油用量
        quote: |-
          油
          大勺 1
      - value: 15
        unit: 等份
        what: 团子切分的份数
        quote: 把团子用保鲜膜搓成棒后切成 15 等份
      - value: 180
        unit: ℃
        what: 炸制油温
        quote: 180℃ 炸 3～4 分钟
    steps:
      - id: grate-and-mix
        text: 土豆要去皮、去芽后再擦泥；和油一起放进耐热碗轻轻拌匀，不盖保鲜膜。
        quote: 耐热碗中放入去皮去芽后擦泥的土豆和油，轻轻拌匀，不盖保鲜膜用 500W 微波加热 4 分钟。
      - id: microwave-first
        text: 500W 微波加热 4 分钟。
        quote: 耐热碗中放入去皮去芽后擦泥的土豆和油，轻轻拌匀，不盖保鲜膜用 500W 微波加热 4 分钟。
        duration:
