  - id: gyoza-steam-then-fry
    status: reviewed
    source:
      anchor: '煎法：先蒸后煎，收汁出焦壳'
    slot: anytime
    remind:
      text: '按先蒸后煎的顺序操作，蒸制后揭盖煎出紧实的焦褐色底。'
      quote: '把水从 250ml 减到 40ml 就行：热水 40ml＋油 1 小勺从锅边倒入，盖上铝箔开大火加热 3 分钟，关火但锅盖不动原地再蒸 3 分钟，最后揭掉锅盖和铝箔、用大火煎到底部变成紧实的焦褐色。'
    dose:
      - value: 40
        unit: ml
        what: '热水加水量'
        quote: '把热水 40ml 和油 1 小勺混合，从锅边倒入锅底。'
      - value: 1
        unit: '小勺'
        what: '加油量'
        quote: '把热水 40ml 和油 1 小勺混合，从锅边倒入锅底。'
      - value: 3
        unit: '分钟'
        what: '大火加热时长'
        quote: '盖上铝箔，开大火加热 3 分钟。'
      - value: 3
        unit: '分钟'
        what: '关火后原地蒸制时长'
        quote: '原地再蒸 3 分钟'
    duration:
      basis: derived
      sec: 360
      formula: '3 分钟 + 3 分钟 = 6 分钟 = 360 秒（仅定时加热与蒸制阶段；最后煎至焦褐色阶段原文未给定时）'
    steps:
      - id: space-dumplings
        text: '饺子彼此不接触地间隔开，平铺在平底锅里。'
        quote: '饺子彼此不接触地间隔开，平铺在平底锅里。'
      - id: add-water-and-oil
        text: '把热水 40ml 和油 1 小勺混合，从锅边倒入锅底。'
        quote: '把热水 40ml 和油 1 小勺混合，从锅边倒入锅底。'
      - id: steam-covered
        text: '盖上铝箔，开大火加热 3 分钟。'
        quote: '盖上铝箔，开大火加热 3 分钟。'
        duration:
          basis: quote
          sec: 180
          quote: 盖上铝箔，开大火加热 3 分钟。
      - id: steam-with-lid-closed
        text: '关火，但锅盖不要动，原地再蒸 3 分钟。'
        quote: '关火，但锅盖不要动，原地再蒸 3 分钟。'
        duration:
          basis: quote
          sec: 180
          quote: 关火，但锅盖不要动，原地再蒸 3 分钟。
      - id: pan-fry-until-browned
        text: '揭掉锅盖和铝箔，用大火加热，煎到底面变成紧实的焦褐色。'
        quote: '揭掉锅盖和铝箔，用大火加热，煎到底面变成紧实的焦褐色。'
    cautions:
      - level: info
        text: '盖铝箔是为了高效利用蒸汽，别省。'
        quote: '盖铝箔是为了高效利用蒸汽，别省。'
