  - id: gyoza-few-pleats
    status: reviewed
    source:
      anchor: '少褶包法：不会包也能包'
    slot: anytime
    remind:
      text: '用少褶并压紧口角的方法包饺子，锁住肉汁并保持皮子偏软。'
      quote: '说明书给的「少褶 & 口角压紧」包法正好解决这三点：超简单、皮的端头向上收起把肉汁牢牢锁住、因为褶数少所以皮偏软、吃起来糯糯的。'
    steps:
      - id: why-few-pleats
        text: '普通的包法有三个弱点：难包、肉汁容易漏出来、皮容易变硬。说明书给的「少褶 & 口角压紧」包法正好解决这三点'
        quote:
          - '普通的包法有三个弱点：难包、肉汁容易漏出来、皮容易变硬。'
          - '说明书给的「少褶 & 口角压紧」包法正好解决这三点'
      - id: place-filling
        text: '把饺子馅放在皮子中央。'
        quote: '把饺子馅放在皮子中央。'
      - id: pinch-top
        text: '把皮的顶点对捏合上。'
        quote: '把皮的顶点对捏合上。'
      - id: hold-side-ends
        text: '捏住左右两个端头的前侧。'
        quote: '捏住左右两个端头的前侧。'
      - id: pinch-corners
        text: '把翘出来的「角」捏合。'
        quote: '把翘出来的「角」捏合。'
      - id: finish-wrapping
        text: '完成。'
        quote: '完成。'
      - id: fry-wrapped-dumplings
        text: '包好的饺子用上面「煎法」一节的煎法去煎，会得到更饱满、更糯糯的饺子。'
        quote: '包好的饺子用上面「煎法」一节的煎法去煎，会得到更饱满、更糯糯的饺子。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: b27c5d6dfe7cc927
    name: 少褶包法锁住肉汁
