  - id: gyoza-steam-water-purpose
    status: reviewed
    source:
      anchor: '水从 250ml 减到 40ml'
    slot: anytime
    remind:
      text: '把锅里的水大幅减少，并认真蒸透饺子。'
      quote: '把锅里的水大幅减少、认真蒸透，就能在家里做出糯糯皮的店味饺子。'
    steps:
      - id: limit-water-for-steaming
        text: '那水是为了高效地把饺子加热——用来制造水蒸气的结论：水量要「超少」，然后好好蒸。'
        quote:
          - '那水是为了高效地把饺子加热——用来制造水蒸气的'
          - '结论：水量要「超少」，然后好好蒸。'
      - id: avoid-third-water
        text: '市售饺子皮包装背面推荐的做法是「放入约饺子三分之一的水量」，而那行小字的本意是出于安全考虑、为了确保饺子被彻底加热。照这个量做，正是自家饺子皮变得软烂的主因。'
        quote:
          - '市售饺子皮包装背面推荐的做法是「放入约饺子三分之一的水量」，而那行小字的本意是出于安全考虑、为了确保饺子被彻底加热。'
          - '照这个量做，正是自家饺子皮变得软烂的主因。'
      - id: use-wrapper-moisture
        text: '生饺子皮里本来就含有大约相当于「煮熟的乌冬面」那么多的水分。所以饺子需要的水分，它自己已经有了。'
        quote:
          - 生饺子皮里本来就含有大约相当于「煮熟的乌冬面」那么多的水分。
          - 所以饺子需要的水分，它自己已经有了。
          - 结论：水量要「超少」，然后好好蒸。 把锅里的水大幅减少、认真蒸透，就能在家里做出糯糯皮的店味饺子。
      - id: steam-through
        text: '把锅里的水大幅减少、认真蒸透，就能在家里做出糯糯皮的店味饺子。'
        quote: '把锅里的水大幅减少、认真蒸透，就能在家里做出糯糯皮的店味饺子。'
