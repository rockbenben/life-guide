  - id: golden-water-base
    status: reviewed
    name: "煮一锅玉米黄金水"
    source:
      anchor: '食谱'
    slot: anytime
    remind:
      text: 煮黄金水时，用玉米 4 根、水 2L、盐 20g，整根煮 35 分钟
      quote:
        - 玉米 4 根
        - 水 2L
        - 盐 20g
        - 放入整根玉米，盖上锅盖，用泡腾状态的小火慢火减火煮 35 分钟
        - 这锅汤就是所谓的「黄金水」
        - 整根下锅煮 35 分钟，芯会从纯白变成透明
        - 这锅「黄金水」能直接当汤喝
    effect:
      text: 煮玉米 35 分钟后，玉米芯会从纯白色变为透明，营养成分会溶解在水中
      quote: 煮玉米 35 分钟后，玉米芯会从纯白色变为透明，营养成分会溶解在水中
