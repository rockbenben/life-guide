        unit: 根
        what: '玉米用量'
        quote: '玉米 4 根'
      - value: 2
        unit: L
        what: '水量'
        quote: '水 2L'
      - value: 20
        unit: g
        what: '盐用量'
        quote: '盐 20g'
      - value: 1
