  - id: make-resistant-starch-potato
    status: reviewed
    source:
      anchor: '抗性淀粉：把土豆冷藏一晚'
    slot: anytime
    remind:
      text: '土豆煮熟后粗略降温，再冷藏过夜，让部分淀粉转变为抗性淀粉。'
      quote:
        - '用微波炉 600W 加热 5 分钟，取出后粗略降温。'
        - '放进约 4℃ 的冰箱冷藏一晚。'
        - '冷藏处理过的那部分淀粉，就是不易消化的抗性淀粉的来源。'
    effect:
      text: '冷藏处理过的那部分淀粉，就是不易消化的抗性淀粉的来源。所以抗性淀粉对肠道和便秘都有帮助。'
      quote:
        - '冷藏处理过的那部分淀粉，就是不易消化的抗性淀粉的来源。'
        - '所以抗性淀粉对肠道和便秘都有帮助。'
    dose:
      - value: 3
        unit: 个
        what: 土豆用量
        quote: '土豆 3 个（450g）'
      - value: 450
        unit: g
        what: 土豆重量
        quote: '土豆 3 个（450g）'
    steps:
      - id: peel-and-quarter
        text: '土豆去皮，切成四块。'
        quote: '土豆去皮，切成四块。'
      - id: microwave-and-cool
        text: '用微波炉 600W 加热 5 分钟，取出后粗略降温。'
        quote: '用微波炉 600W 加热 5 分钟，取出后粗略降温。'
      - id: chill-overnight
        text: '放进约 4℃ 的冰箱冷藏一晚。'
        quote: '放进约 4℃ 的冰箱冷藏一晚。'
