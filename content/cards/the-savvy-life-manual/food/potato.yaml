  - id: mash-potato-for-starch
    status: reviewed
    source:
      anchor: '磨泥：释放 8 倍黏性与双倍鲜味'
    slot: anytime
    remind:
      text: '把土豆磨成泥，破坏细胞壁并释放淀粉颗粒，让口感更黏。'
      quote:
        - '磨泥破坏细胞壁，淀粉颗粒被释放出来。'
        - '土豆淀粉的黏度是玉米淀粉的 8 倍以上，把土豆淀粉的黏度变化曲线和红薯、玉米放在一起比较，差距一目了然。'
    effect:
      text: '节目组用农业研究机构（农研机构）协作做的实验发现：土豆淀粉的黏度是玉米淀粉的 8 倍以上，把土豆淀粉的黏度变化曲线和红薯、玉米放在一起比较，差距一目了然。甲硫醛由土豆中的氨基酸甲硫氨酸与糖反应生成——磨过的泥因为受热更充分，检测到的甲硫醛是切成四块的 2 倍以上。'
      quote:
        - '节目组用农业研究机构（农研机构）协作做的实验发现：土豆淀粉的黏度是玉米淀粉的 8 倍以上，把土豆淀粉的黏度变化曲线和红薯、玉米放在一起比较，差距一目了然。'
        - '甲硫醛由土豆中的氨基酸甲硫氨酸与糖反应生成——磨过的泥因为受热更充分，检测到的甲硫醛是切成四块的 2 倍以上。'
    steps:
      - id: mash-potato
        text: '破局的关键就是磨泥：'
        quote: '破局的关键就是磨泥：'
      - id: heat-mashed-potato
        text: '磨过的泥受热更快、熟得更透。'
        quote: '磨过的泥受热更快、熟得更透。'
      - id: add-to-dishes
        text: '所以只要把土豆磨成泥，焗烤、猪肉味噌汤、汉堡肉饼、红豆汤（ぜんざい）这些你本来就会做的菜，都能轻松升级。'
        quote: '所以只要把土豆磨成泥，焗烤、猪肉味噌汤、汉堡肉饼、红豆汤（ぜんざい）这些你本来就会做的菜，都能轻松升级。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 2a63a5e38c4819c6
    name: 把土豆磨泥增黏提鲜
  - id: potato-calorie-satiety
    status: reviewed
    source:
      anchor: '热量真相：比面包低，比米饭低一半'
    slot: anytime
    remind:
      text: '在减量期把土豆纳入饮食，少用油，并保持营养均衡。'
      quote:
        - '土豆本身的热量其实非常克制'
        - '土豆炖肉、炸薯条、薯饼几乎每道都是高油高热量。'
        - '土豆的数值高得遥遥领先'
        - '所以别过量，营养均衡最重要。'
    effect:
      text: '面包 248 kcal白米 156 kcal土豆 76 kcal（约为面包的 1/3，白米的一半）澳大利亚的研究把土豆的饱腹指数和常见食物做了横向比较，结果是：土豆的数值高得遥遥领先（资料引自 European Journal of Clinical Nutrition 1995 年的常见食物饱腹指数研究）。'
      quote:
        - '面包 248 kcal'
        - '白米 156 kcal'
        - '土豆 76 kcal（约为面包的 1/3，白米的一半）'
        - '澳大利亚的研究把土豆的饱腹指数和常见食物做了横向比较，结果是：土豆的数值高得遥遥领先（资料引自 European Journal of Clinical Nutrition 1995 年的常见食物饱腹指数研究）。'
    steps:
      - id: choose-low-oil-potato
        text: '土豆本身的热量其实非常克制土豆炖肉、炸薯条、薯饼几乎每道都是高油高热量。'
        quote:
          - '土豆本身的热量其实非常克制'
          - '土豆炖肉、炸薯条、薯饼几乎每道都是高油高热量。'
      - id: balance-diet
        text: '所以别过量，营养均衡最重要。'
        quote: '所以别过量，营养均衡最重要。'
    cautions:
      - level: info
        text: '土豆含糖类，和其他薯类、米饭一样会升高血糖；另外只要用油，热量就会上升。'
        quote: '土豆含糖类，和其他薯类、米饭一样会升高血糖；另外只要用油，热量就会上升。'
      - level: info
        text: '所以别过量，营养均衡最重要。'
        quote: '所以别过量，营养均衡最重要。'
