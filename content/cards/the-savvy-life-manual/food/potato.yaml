    slot: anytime
    remind:
      text: '把磨泥土豆和油拌匀，加热翻拌成团，晾至温热不烫手后尽早分块。'
      quote:
        - '磨泥土豆和油放进耐热碗，轻轻拌匀，不要盖保鲜膜，用 500W 加热 4 分钟。'
        - '取出，用橡皮刮刀随意翻拌，再加热 3 分钟，搅到能聚拢成形。'
        - '套上保鲜膜，捏成长条，放到一旁晾至温热不烫手。'
        - '晾至温热不烫手后尽早掰成小块，等久了会粘手。'
    dose:
      - value: 250
        unit: g
        what: 磨泥土豆用量
