  - id: make-tomato-gnocchi
    status: reviewed
    source:
      anchor: '七道磨泥土豆食谱'
    # 食谱 —— 原文没给时段。
    slot: anytime
    remind:
      text: '把土豆团做成小圆子，煎至两面金黄，再加入番茄汁煮熟并调味。'
      quote:
        - '磨泥土豆团晾至温热不烫手后尽早分成一口大小、揉成小圆子。'
        - '平底锅倒入一半橄榄油，把小圆子两面煎到金黄。'
        - '倒入番茄汁，中火煮约 2 分钟。'
        - '加盐和糖，把小圆子倒回锅中。'
        - '再煮约 1 分钟盛盘，按喜好撒奶酪粉和欧芹。'
    dose:
      - value: 1
        unit: 团
        what: 磨泥土豆团用量
        quote: '磨泥土豆团 1 团'
      - value: 400
        unit: mL
        what: 无盐番茄汁用量
        quote: '无盐番茄汁 400mL'
    steps:
      - id: prepare-gnocchi
        text: '大蒜去皮拍碎；培根切 1cm 宽。磨泥土豆团晾至温热不烫手后尽早分成一口大小、揉成小圆子。'
        quote: '大蒜去皮拍碎；培根切 1cm 宽。磨泥土豆团晾至温热不烫手后尽早分成一口大小、揉成小圆子。'
      - id: pan-sear-gnocchi
        text: '平底锅倒入一半橄榄油，把小圆子两面煎到金黄。'
        quote:
          - 平底锅倒入一半橄榄油，把小圆子两面煎到金黄。
          - 把小圆子盛出，锅内补剩余橄榄油，下蒜片炒出香味，加培根和洋葱炒到洋葱变软。
      - id: make-tomato-sauce
        text: '把小圆子盛出，锅内补剩余橄榄油，下蒜片炒出香味，加培根和洋葱炒到洋葱变软。倒入番茄汁，中火煮约 2 分钟。'
        quote:
          - '把小圆子盛出，锅内补剩余橄榄油，下蒜片炒出香味，加培根和洋葱炒到洋葱变软。'
          - '倒入番茄汁，中火煮约 2 分钟。'
      - id: season-and-finish
        text: '加盐和糖，把小圆子倒回锅中。再煮约 1 分钟盛盘，按喜好撒奶酪粉和欧芹。'
        quote:
          - '加盐和糖，把小圆子倒回锅中。'
          - '再煮约 1 分钟盛盘，按喜好撒奶酪粉和欧芹。'
