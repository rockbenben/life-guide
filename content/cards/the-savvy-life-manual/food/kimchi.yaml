cards:
  - id: kimchi-umami-pairing
    status: reviewed
    name: "小虾酱配鲣鱼片"
    source:
      anchor: '鲜味最多增到接近 8 倍的黄金法则'
    slot: anytime
    remind:
      text: '组合小虾酱与富含肌苷酸的鲣鱼片，把两种鲜味物质的配比调到接近 50:50。'
      quote:
        - '小虾酱经过发酵会产生谷氨酸，这是泡菜鲜味的底子。'
        - '要让它爆炸，只需要再加一样东西——而富含这种物质、日本人餐桌上最常见的就是鲣鱼片。'
        - '那种物质叫肌苷酸。'
        - '两者的配比接近 50:50 时，鲜味达到峰值；单纯加谷氨酸或单纯加肌苷酸，都到不了这个高度。'
    effect:
      text: '二者组合后鲜味最多能增加到接近 8 倍。'
      quote: '二者组合后鲜味最多能增加到接近 8 倍。'
    steps:
      - id: provide-glutamate
        text: '小虾酱经过发酵会产生谷氨酸，这是泡菜鲜味的底子。'
        quote: '小虾酱经过发酵会产生谷氨酸，这是泡菜鲜味的底子。'
      - id: add-inosinate
        text: '要让它爆炸，只需要再加一样东西——而富含这种物质、日本人餐桌上最常见的就是鲣鱼片。那种物质叫肌苷酸。'
        quote:
          - '要让它爆炸，只需要再加一样东西——而富含这种物质、日本人餐桌上最常见的就是鲣鱼片。'
          - '那种物质叫肌苷酸。'
      - id: balance-umami
        text: '两者的配比接近 50:50 时，鲜味达到峰值；单纯加谷氨酸或单纯加肌苷酸，都到不了这个高度。'
        quote: '两者的配比接近 50:50 时，鲜味达到峰值；单纯加谷氨酸或单纯加肌苷酸，都到不了这个高度。'
