      by: benson
      date: 2026-10-21
      hash: c078256bd021439a
  - id: kimchi-container-acidity-check
    status: reviewed
    source:
      anchor: '看容器预判酸度'
    slot: anytime
    remind:
      text: '看容器判断泡菜是否越放越酸。'
      quote:
        - '越放越酸（传统型）：韩式做法，靠乳酸发酵改变味道'
        - '越放越慢（调整型）：出厂前调整过含盐量等，人为推迟发酵'
        - '会变酸的容器：硬质容器配螺旋盖；有大排气孔；按量零售的泡菜（韩国的一般做法）'
        - '不容易变酸的：软质容器'
    effect:
      text: '泡菜的酸味来自乳酸——乳酸菌以白菜的葡萄糖之类为食增殖时产生乳酸，时间越久，乳酸积累越多，酸味就越强。'
      quote: '泡菜的酸味来自乳酸——乳酸菌以白菜的葡萄糖之类为食增殖时产生乳酸，时间越久，乳酸积累越多，酸味就越强。'
    steps:
      - id: inspect-hard-container
        text: '会变酸的容器：硬质容器配螺旋盖；有大排气孔；按量零售的泡菜（韩国的一般做法）'
        quote: '会变酸的容器：硬质容器配螺旋盖；有大排气孔；按量零售的泡菜（韩国的一般做法）'
      - id: inspect-soft-container
        text: '越放越慢（调整型）：出厂前调整过含盐量等，人为推迟发酵不容易变酸的：软质容器'
        quote:
          - '越放越慢（调整型）：出厂前调整过含盐量等，人为推迟发酵'
          - '不容易变酸的：软质容器'
      - id: understand-pressure
        text: '图片说明写得很直白——硬容器强度足以承受内部气压，大排气孔让气体跑掉，而软容器本来就不怎么产气。'
        quote: '图片说明写得很直白——硬容器强度足以承受内部气压，大排气孔让气体跑掉，而软容器本来就不怎么产气。'
    cautions:
      - level: info
        text: '试验由乳酸菌专业厂商协助完成。'
        quote: '试验由乳酸菌专业厂商协助完成。'
    review:
      by: benson
      date: 2026-10-21
      hash: 64bec228a6aa4d0d
