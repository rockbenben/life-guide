cards:
  - id: 'maple-universal-seasoning'
    status: reviewed
    name: "枫糖浆调万能调味液"
    source:
      anchor: '万能调味液（なこり液）'
    slot: anytime
    remind:
      text: '调配 125mL 万能调味液，摇匀后冷藏，并在 2～3 天内用完。'
      quote:
        - '原液 125mL 的配比'
        - '摇匀即可'
        - '冷藏保存、最好在 2～3 天内用完'
    dose:
      - value: 125
        unit: 'mL'
        what: '原液总量'
        quote: '原液 125mL 的配比'
      - value: 6
        unit: '大勺'
        what: '酱油用量'
        quote: '6 大勺'
      - value: 2
        unit: '大勺'
        what: '枫糖浆用量'
        quote: '2 大勺'
      - value: 1
        unit: '小勺'
        what: '醋用量'
        quote: '1 小勺'
    steps:
      - id: 'mix-seasoning'
        text: '把三样放进容器里，充分摇匀即可'
        quote: '把三样放进容器里，充分摇匀即可'
      - id: 'adjust-strength'
        text: '想浓就原液直接用，想淡就加水稀释'
        quote: '想浓就原液直接用，想淡就加水稀释'
      - id: 'store-seasoning'
        text: '冷藏保存、最好在 2～3 天内用完'
        quote: '冷藏保存、最好在 2～3 天内用完'
    cautions:
      - level: info
        text: '用法是当提鲜的调料，不是当糖'
        quote: '用法是当提鲜的调料，不是当糖'
      - level: info
        text: '这是纯手摇、无防腐剂的液体'
        quote: '这是纯手摇、无防腐剂的液体'
      - level: info
        text: '冷藏保存、最好在 2～3 天内用完'
        quote: '冷藏保存、最好在 2～3 天内用完'
    review:
      by: benson
      date: 2026-10-22
      hash: 7426bd79db2f6cab
  - id: 'maple-seasoning-chawanmushi'
    status: reviewed
    source:
      anchor: '三款枫糖浆风味食谱'
    slot: anytime
    remind:
      text: '蒸锅上汽后放入大火 2 分钟，再转小火约 10 分钟'
      quote:
        - '蒸锅上汽后放入'
        - '大火 2 分钟，再转小火约 10 分钟'
    dose:
      - value: 3
        unit: '大勺'
        what: '万能调味液用量'
        quote: '3 大勺 + 1/2 大勺'
      - value: 0.5
        unit: '大勺'
        what: '追加万能调味液用量'
        derived:
          formula: 1/2 大勺 = 0.5 大勺
        quote: '3 大勺 + 1/2 大勺'
      - value: 300
        unit: 'mL'
        what: '水量'
        quote: '300mL'
      - value: 2
        unit: '个'
        what: '鸡蛋用量'
        quote: '2 个'
      - value: 50
        unit: 'g'
        what: '鸡肉用量'
        quote: '50g'
    duration:
      basis: derived
      sec: 720
      formula: '2 分钟 × 60 秒 + 约 10 分钟 × 60 秒 = 约 720 秒'
    steps:
      - id: 'mix-egg'
        text: '碗里把鸡蛋打散，加入 A 组液体混合，过筛'
        quote: '碗里把鸡蛋打散，加入 A 组液体混合，过筛'
      - id: 'arrange-chawanmushi'
        text: '耐热容器里放入鸡肉、香菇和金针菇静静注入第 1 步的蛋液，一格一格地加'
        quote:
          - '耐热容器里放入鸡肉、香菇和金针菇'
          - '静静注入第 1 步的蛋液，一格一格地加'
      - id: 'steam-chawanmushi'
        text: '蒸锅上汽后放入大火 2 分钟，再转小火约 10 分钟出锅撒上三之叶'
        quote:
          - '蒸锅上汽后放入'
          - '大火 2 分钟，再转小火约 10 分钟'
          - '出锅撒上三之叶'
    cautions:
      - level: info
        text: '蛋液没能凝固的话延长小火的加热时间'
        quote:
          - '蛋液没能凝固的话'
          - '延长小火的加热时间'
