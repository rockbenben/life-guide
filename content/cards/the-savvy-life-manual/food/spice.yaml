        text: 平底锅倒油烧热，放入猪肉，中火两面煎。
        quote: '平底锅倒油烧热，放入猪肉，中火两面煎。'
      - id: simmer-pork
        text: 用厨房纸吸掉油分，加入 ，大火翻炒到肉裹上浓汁。
