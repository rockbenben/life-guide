        text: '所以要给头降温。市售的冰枕、水枕，或者拧湿后冻硬的毛巾都可以用。'
        quote: '所以要给头降温。市售的冰枕、水枕，或者拧湿后冻硬的毛巾都可以用。'
      - id: choose-breathable-material
