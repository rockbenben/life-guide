  - id: avoid-pillow-too-high-or-low
    status: reviewed
    name: "枕头别太高也别太低"
    source:
      anchor: '枕头的陷阱：「合适」不等于「高」'
    slot: anytime
    remind:
      text: '太高不行，太低也不行。'
      quote: '太高不行，太低也不行。'
    steps:
      - id: reject-extreme-pillow-heights
        text: '太高不行，太低也不行。'
        quote: '太高不行，太低也不行。'
    cautions:
      - level: stop
        text: '枕太高：实际查看那些一直用「过高的枕头」的人的 MRI，可以看到椎间盘突出并压迫神经。节目把这种状态命名为「枕ヘルニア」（枕疝；说明书后文也写作「首のヘルニア」）。'
        quote: '枕太高：实际查看那些一直用「过高的枕头」的人的 MRI，可以看到椎间盘突出并压迫神经。节目把这种状态命名为「枕ヘルニア」（枕疝；说明书后文也写作「首のヘルニア」）。'
      - level: stop
        text: '枕太低：韧带松弛，同样有可能压迫神经。'
        quote: '枕太低：韧带松弛，同样有可能压迫神经。'
      - level: info
        text: '颈部椎间盘突出的原因，也包括老化等枕头以外的因素。'
        quote: '颈部椎间盘突出的原因，也包括老化等枕头以外的因素。'
