article: the-savvy-life-manual/life-hacks/pillow.md
kind: practice
coverage: complete
ignore:
  sections:
    - anchor: '枕头买多高？男性 7.5cm、女性 6.0cm'
      reason: '该小节是“在家量出属于自己的高度”的提要；基准高度、容许区间、量具和三种姿势已由测量卡覆盖，单独建卡会重复。'
  images: []
cards:
  - id: measure-personal-pillow-height
    status: reviewed
    source:
      anchor: '在家量出属于自己的高度'
    slot: anytime
    remind:
      text: '按性别取基准高度：男性 7.5cm、女性 6.0cm，在平时睡觉的地方按仰卧、侧卧、翻身三种姿势逐一确认'
      quote: '这篇给一个不用买东西的量法：先按性别取基准高度，男性 7.5cm、女性 6.0cm（用手压下去时的状态），说明书给的容许区间是男性 7.0～8.5cm、女性 5.5～7.0cm；一张厚度约 1cm 的玄关垫加一条毛巾毯就能当量具，就在你平时睡觉的地方量出来，再按仰卧、侧卧、翻身三种姿势逐一确认。'
    dose:
      - value: 7.5
        unit: cm
        what: '男性基准高度'
        quote: '男性 7.5cm'
      - value: 6.0
        unit: cm
        what: '女性基准高度'
        quote: '女性 6.0cm'
      - value: 7.0
        valueMax: 8.5
        unit: cm
        what: '男性容许区间'
        quote: '男性 7.0～8.5cm'
      - value: 5.5
        valueMax: 7
        unit: cm
        what: '女性容许区间'
        quote: '女性 5.5～7.0cm'
    steps:
      - id: prepare-adjustable-tool
        text: '不用买任何东西，一张玄关垫加一条毛巾毯就能当量具。玄关垫 1 张：厚度约 1cm、绒毛短而硬的款式，尺寸约 60cm × 90cm。选它的理由是高度可调、且硬度足以维持高度。'
        quote:
          - '不用买任何东西，一张玄关垫加一条毛巾毯就能当量具。'
          - '玄关垫 1 张：厚度约 1cm、绒毛短而硬的款式，尺寸约 60cm × 90cm。选它的理由是高度可调、且硬度足以维持高度。'
      - id: measure-on-own-bed
        text: '就在你平时睡觉的地方。床垫的硬度不同，身体下陷的深度也不同——在自己的床上量，才有参考价值。'
        quote:
          - '就在你平时睡觉的地方。'
          - '床垫的硬度不同，身体下陷的深度也不同——在自己的床上量，才有参考价值。'
      - id: fold-adjustable-layers
        text: '把玄关垫折成三折。把折痕压实，高度才不会走形。叠上折好的毛巾毯。毛巾毯要做成蛇腹折（风琴折），这样最上面一层能一张一张翻下来，高度特别好调。'
        quote:
          - '把玄关垫折成三折。把折痕压实，高度才不会走形。'
          - '叠上折好的毛巾毯。毛巾毯要做成蛇腹折（风琴折），这样最上面一层能一张一张翻下来，高度特别好调。'
      - id: set-base-height
        text: '用手压下去时的高度，做成——男性 7.5cm、女性 6.0cm。这就是基准高度，之后再按自己的体型微调。'
        quote:
          - '用手压下去时的高度，做成——男性 7.5cm、女性 6.0cm。'
          - '这就是基准高度，之后再按自己的体型微调。'
      - id: check-supine-position
        text: '枕头填到肩膀被顶到的程度，把头稳稳托在枕上。呼吸不能费力枕的角不能硌到后脑勺不能发硬'
        quote:
          - '枕头填到肩膀被顶到的程度，把头稳稳托在枕上。'
          - '呼吸不能费力'
          - '枕的角不能硌到'
          - '后脑勺不能发硬'
      - id: check-side-position
        text: '双手在胸前交叉，身体转向侧面。此时让下侧肩膀略微向前，不要把肩膀死死压在身下。肩部没有压迫感下巴、鼻子、额头连成的线，与床面平行'
        quote:
          - '双手在胸前交叉，身体转向侧面。此时让下侧肩膀略微向前，不要把肩膀死死压在身下。'
          - '肩部没有压迫感'
          - '下巴、鼻子、额头连成的线，与床面平行'
      - id: check-turning-position
        text: '屈膝，左右各转一次确认。翻身是否顺畅肩和腰能否同时翻转'
        quote:
          - '屈膝，左右各转一次确认。'
          - '翻身是否顺畅'
          - '肩和腰能否同时翻转'
    cautions:
      - level: info
        text: '这是印刷品，受打印环境影响会有误差，请用自己手边的尺子复核。'
        quote: '这是印刷品，受打印环境影响会有误差，请用自己手边的尺子复核。'
      - level: info
        text: '如果换了之后高度和硬度都变了，觉得不习惯，请先坚持两周。'
        quote: '如果换了之后高度和硬度都变了，觉得不习惯，请先坚持两周。'
      - level: with-doctor
        text: '身体疼痛的原因并不全在枕头。疼痛强烈等情况，请就近就诊整形外科。'
        quote: '身体疼痛的原因并不全在枕头。疼痛强烈等情况，请就近就诊整形外科。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: dee743b90bd90a8d
    name: 在家量出适合自己的枕头高度
  - id: use-cool-pillow
    status: reviewed
    source:
      anchor: '专家推荐的补救办法'
    slot: evening
    remind:
      text: '给头降温，或选用透气性好的材料'
      quote: '所以要给头降温。市售的冰枕、水枕，或者拧湿后冻硬的毛巾都可以用。选用透气性好的材料同样有效：荞麦壳、纤维这类透气材料，能防止热量积聚在枕内。'
    steps:
