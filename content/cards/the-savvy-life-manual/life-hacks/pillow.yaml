  - id: look-beyond-pillow
    status: reviewed
    name: "别只盯着枕头"
    source:
      anchor: '睡不好，可能是枕头的问题，也可能是「太在意枕头」的问题'
    slot: evening
    remind:
      text: '不要只盯着枕头，也请关注其他原因'
      quote: '不要只盯着枕头，也请关注其他原因。'
    steps:
      - id: check-other-sleep-factors
        text: '睡眠质量牵涉的因素非常多：生活习惯、体温、声音、光、白天的压力、鼻塞、床垫、运动、气味——判断「哪种枕睡得好」本身就是件难事。'
        quote: '睡眠质量牵涉的因素非常多：生活习惯、体温、声音、光、白天的压力、鼻塞、床垫、运动、气味——判断「哪种枕睡得好」本身就是件难事。'
      - id: avoid-pillow-only-solution
        text: '这种情况下，因为原因不在枕头，换枕头也不会改善睡眠质量。'
        quote: '这种情况下，因为原因不在枕头，换枕头也不会改善睡眠质量。'
    cautions:
      - level: info
        text: '失眠（枕头以外的原因）→ 觉得连枕头都不合适 → 因为在意枕头而大脑兴奋 → 更睡不着 → ……'
        quote: '失眠（枕头以外的原因）→ 觉得连枕头都不合适 → 因为在意枕头而大脑兴奋 → 更睡不着 → ……'
