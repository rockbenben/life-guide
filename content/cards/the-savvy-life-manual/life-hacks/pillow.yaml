    cautions:
      - level: info
        text: '医院可诊断的睡眠障碍有 60 种以上。想改善睡眠质量，请把枕头以外的因素也一并考虑。'
        quote: '医院可诊断的睡眠障碍有 60 种以上。想改善睡眠质量，请把枕头以外的因素也一并考虑。'
