  - id: bathroom-ceiling-mold-cleaning
    status: reviewed
    source:
      anchor: '浴室：先看天花板'
    slot: anytime
    remind:
      text: '重点清洁天花板上的霉菌'
      quote: '所以对付浴室霉菌，妥善清洁天花板才是关键。'
    dose:
      - value: 2
        unit: '个月'
        what: '天花板除霉频率'
        quote: '每 2 个月做 1 次左右最有效。'
    steps:
      - id: prepare-chlorine-mold-remover
        text: '准备含氯（氯系）的除霉剂。'
        quote: '准备含氯（氯系）的除霉剂。'
      - id: apply-remover-to-mop
        text: '在长柄拖把上缠一条毛巾，把除霉剂适量喷在上面。'
        quote: '在长柄拖把上缠一条毛巾，把除霉剂适量喷在上面。'
      - id: wipe-ceiling-corners
        text: '擦到天花板的每一个角落，不留遗漏。'
        quote: '擦到天花板的每一个角落，不留遗漏。'
      - id: wipe-and-dry
        text: '擦完后最后再用水擦一遍、然后擦干，收工。'
        quote: '擦完后最后再用水擦一遍、然后擦干，收工。'
    cautions:
      - level: stop
        text: '绝对不要把含氯洗涤剂直接朝高于眼睛的位置喷。'
        quote: '绝对不要把含氯洗涤剂直接朝高于眼睛的位置喷。'
      - level: stop
        text: '注意别让药剂滴落或飞溅'
        quote: '注意别让药剂滴落或飞溅'
      - level: info
        text: '为了保护眼睛和口鼻，请戴眼镜和口罩，并在保持通风的条件下操作。'
        quote: '为了保护眼睛和口鼻，请戴眼镜和口罩，并在保持通风的条件下操作。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 3550e19c84bee3f6
    name: 清洁浴室天花板霉菌

