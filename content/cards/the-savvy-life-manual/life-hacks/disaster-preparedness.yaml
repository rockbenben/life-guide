  - id: post-earthquake-no-flushing
    status: reviewed
    name: "地震后改用便携厕所"
    source:
      anchor: "地震后别冲水：马桶会「逆流」"
    slot: anytime
    remind:
      text: "地震后不要冲马桶试水，改用便携厕所。"
      quote:
        - "地震之后，不要再抱任何「冲一下试试」的念头"
        - "震后直接改用便携厕所"
    steps:
      - id: avoid-flushing
        text: "地震之后，不要再抱任何「冲一下试试」的念头"
        quote: "地震之后，不要再抱任何「冲一下试试」的念头"
      - id: switch-to-portable-toilet
        text: "震后直接改用便携厕所"
        quote: "震后直接改用便携厕所"
    cautions:
      - level: stop
        text: "第 4 次冲水时，水从 1 楼的马桶里喷了出来"
        quote: "第 4 次冲水时，水从 1 楼的马桶里喷了出来"
      - level: info
        text: "这个现象在 1 楼以上都可能发生，不是只有高层才会中招"
        quote: "这个现象在 1 楼以上都可能发生，不是只有高层才会中招"
      - level: info
        text: "排污管同样走地下污水还有可能从破损处渗漏"
        quote:
          - "排污管同样走地下"
          - "污水还有可能从破损处渗漏"
    review:
      by: benson
      date: 2026-10-22
      hash: fc615440f3f2cd10

