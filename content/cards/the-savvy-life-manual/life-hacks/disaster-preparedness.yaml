cards:
  - id: portable-toilet-preparation
    status: reviewed
    name: "备好便携厕所"
    source:
      anchor: "便携厕所：买多少、怎么用"
    slot: anytime
    remind:
      text: "震后第一时间启用便携厕所用量按说明书估算"
      quote:
        - "震后第一时间启用便携厕所"
        - "用量按说明书估算"
    dose:
      - value: 5
        unit: "次"
        what: "一般人每天排泄次数"
        quote: "一般人每天排泄 5 次"
      - value: 15
        unit: "次"
        what: "每人至少备用的便携厕所次数"
        quote: "每人至少备 15 次（3 天份）"
      - value: 3
        unit: "天"
        what: "建议备用量覆盖的天数"
        quote: "每人至少备 15 次（3 天份）"
    steps:
      - id: choose-portable-toilet-type
        text: "吸收片型：让排泄物吸附在薄片上凝固剂型：用特殊粉末把排泄物凝固成形"
        quote:
          - "吸收片型：让排泄物吸附在薄片上"
          - "凝固剂型：用特殊粉末把排泄物凝固成形"
      - id: adjust-stock-to-own-frequency
        text: "排泄次数因人而异，请按自己的情况增减"
        quote: "排泄次数因人而异，请按自己的情况增减"
    review:
      by: benson
      date: 2026-10-21
      hash: 246cf5bff38bee57

  - id: coagulant-portable-toilet
    status: reviewed
    source:
      anchor: "便携厕所：买多少、怎么用"
    slot: anytime
    remind:
      text: "凝固剂型便携厕所按三步使用：给便器和座圈各套一层袋、倒整整一包凝固剂再排泄、扎紧袋口再装进除臭袋存放与丢弃。"
      quote: "凝固剂型的三步是给便器和座圈各套一层袋、倒整整一包凝固剂再排泄、扎紧袋口再装进除臭袋存放与丢弃"
    dose:
      - value: 1
        unit: "包"
        what: "每次排泄使用的凝固剂量"
        quote: "倒整整一包凝固剂"
    steps:
      - id: bag-both
        text: "给便器和座圈各套一层袋防污水袋：把座圈抬起，套在便器上接便袋：把座圈放下，套在座圈上"
        quote:
          - "给便器和座圈各套一层袋"
          - "防污水袋：把座圈抬起，套在便器上"
          - "接便袋：把座圈放下，套在座圈上"
      - id: add-coagulant
        text: "倒整整一包凝固剂，然后排泄大便也要用凝固剂"
        quote:
          - "倒整整一包凝固剂，然后排泄"
          - "大便也要用凝固剂"
      - id: seal-bag
        text: "先把袋子扎紧，再装进除臭袋扎好存放"
        quote: "先把袋子扎紧，再装进除臭袋扎好存放"
      - id: store-without-deodorizer
        text: "没有除臭袋，就放进带盖的箱子里，别让气味漏出来"
        quote: "没有除臭袋，就放进带盖的箱子里，别让气味漏出来"
    cautions:
      - level: info
        text: "加凝固剂的时机因产品而异，请照自家说明书"
        quote: "加凝固剂的时机因产品而异，请照自家说明书"
      - level: info
        text: "废弃一般属于可燃垃圾，但各自治体规定不同，务必确认"
        quote: "废弃一般属于可燃垃圾，但各自治体规定不同，务必确认"
      - level: stop
        text: "用过的便携厕所不要囤积——堆积会成为传染病的源头，尽量频繁处理"
        quote: "用过的便携厕所不要囤积——堆积会成为传染病的源头，尽量频繁处理"
    review:
      by: AI（作者授权代签）
      date: 2026-10-31
      hash: 1249c662aa372585
    name: 便携厕所三步用

  - id: disaster-message-record
    status: reviewed
    name: "灾害留言拨 171"
    source:
      anchor: "灾害留言电话 171"
    slot: anytime
    remind:
      text: "要留言就拨 171按 1 录音不用等真出事"
      quote:
        - "要留言就拨 171"
        - "按 1 录音"
        - "不用等真出事"
    steps:
      - id: dial-service
        text: "拨打 171"
        quote: "拨打 171"
      - id: choose-record-mode
        text: "选择「录音」——语音提示为：按 1 录音、按 2 收听、按 3 用密码录音、按 4 用密码收听（在意隐私才需要设密码）"
        quote: "选择「录音」——语音提示为：按 1 录音、按 2 收听、按 3 用密码录音、按 4 用密码收听（在意隐私才需要设密码）"
      - id: enter-recipient-number
        text: "输入对方电话号码（手机、座机都可以）"
        quote: "输入对方电话号码（手机、座机都可以）"
      - id: choose-area-code
        text: "在受灾地区的人，请输入自己家的号码想联系其他受灾地区的人，请从区号开始输入"
        quote:
          - "在受灾地区的人，请输入自己家的号码"
          - "想联系其他受灾地区的人，请从区号开始输入"
      - id: choose-push-or-dial
        text: "选择推送式／拨号式——推送式电话再按数字 1，拨号式则直接等待；不知道也什么都不用按"
        quote: "选择推送式／拨号式——推送式电话再按数字 1，拨号式则直接等待；不知道也什么都不用按"
      - id: leave-message
        text: "录音，按语音提示进行，记得报上姓名"
        quote: "录音，按语音提示进行，记得报上姓名"
      - id: agree-family-message-plan
        text: "事先和家人商量好「谁的号码留哪一条留言」"
        quote: "事先和家人商量好「谁的号码留哪一条留言」"
      - id: try-service-regularly
        text: "不用等真出事每月 1 日和 15 日都可以正常体验，网页版 web171 同样可用"
        quote:
          - "不用等真出事"
          - "每月 1 日和 15 日都可以正常体验，网页版 web171 同样可用"
    review:
      by: benson
      date: 2026-10-22
      hash: 7c359806116c3800

