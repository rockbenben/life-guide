  - id: altruistic-disaster-preparedness
    status: reviewed
    source:
      anchor: "利他心平时用，才救得了命"
    slot: anytime
    remind:
      text: "开一次家庭会议把应急食品当礼物送出去固定家具"
      quote:
        - 开一次家庭会议
        - 把应急食品当礼物送出去
        - 固定家具
        - 大地震后电话和互联网都不稳定，灾害留言电话 171（NTT 提供）是那种时候最容易接通的方式：像电话答录机一样，用一个特定号码互传录音留言，并且在大灾害发生后立即开通。
    steps:
      - id: hold-family-meeting
        text: "开一次家庭会议：确认避难时的集合地点和联络方式"
        quote: "开一次家庭会议：确认避难时的集合地点和联络方式"
      - id: give-emergency-food
        text: "把应急食品当礼物送出去：对方得到的是一份准备，收到的人防灾意识也会提高"
        quote: "把应急食品当礼物送出去：对方得到的是一份准备，收到的人防灾意识也会提高"
      - id: secure-furniture
        text: "固定家具重要的人可能被家具压住"
        quote:
          - "固定家具"
          - "重要的人可能被家具压住"
    review:
