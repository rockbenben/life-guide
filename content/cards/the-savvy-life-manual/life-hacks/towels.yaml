        - '水留在那里，绒圈就会被粘在一起、躺平，站不起来'
        - '真正该补的不是水，而是油'
        - '每月一次'
        - '用洗衣皂加醋把洗掉的油补回去'
    steps:
      - id: wash-with-soap
        text: '标准程序按平常的量放入洗衣用皂'
        quote:
