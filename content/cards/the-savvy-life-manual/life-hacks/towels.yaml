          - '按平常的量放入洗衣用皂'
      - id: add-vinegar-at-rinse
        text: '漂洗一开始暂停直接倒进洗衣槽约为放入洗衣皂量的那一半'
        quote:
          - '漂洗一开始'
          - '暂停'
          - '直接倒进洗衣槽'
          - '约为'
          - '放入洗衣皂量的那一半'
      - id: finish-rinse-spin-dry
        text: '照常完成漂洗、脱水、晾干'
        quote: '照常完成漂洗、脱水、晾干'
    cautions:
      - level: info
        text: '皂和醋不要洗太勤说明书明确说，洗过头会让吸水性下降一个月一次标准用量与频次'
        quote:
