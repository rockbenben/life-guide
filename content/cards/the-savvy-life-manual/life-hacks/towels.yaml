          - '醋放太多有可能损伤衣物和洗衣机本身'
          - '务必守住那个比例'
    name: 滚筒机用皂醋洗毛巾
  - id: towel-boiling-water-treatment
    status: draft
    name: "沸水泡毛巾"
    source:
      anchor: '发黑发臭：菌在绒圈根部做了一层「膜」'
    slot: anytime
    remind:
      text: '用沸水泡 10 分钟，处理菌膜带来的臭味和发黑'
      quote:
        - '在绒圈根部繁殖的细菌，会做出黏糊糊的一层屏障'
        - '扎根在绒圈根部的菌，大多「怕热」'
        - '用沸水泡 10 分钟处理菌膜带来的臭味和发黑'
    duration:
      basis: quote
      sec: 600
      quote: '就这么原样放置 10 分钟'
    steps:
      - id: pour-boiling-water
        text: '耐热容器刚烧开的水水量以完全浸没为准'
        quote:
          - '耐热容器'
          - '刚烧开的水'
          - '水量以完全浸没为准'
      - id: soak-ten-minutes
        text: '就这么原样放置 10 分钟'
        quote: '就这么原样放置 10 分钟'
      - id: drain-and-rewash
        text: '倒掉水，再照平常那样用洗衣机洗一遍'
        quote: '倒掉水，再照平常那样用洗衣机洗一遍'
    cautions:
      - level: stop
        text: '倒沸水会烫伤水温、水量都要按图示来'
        quote:
          - '倒沸水会烫伤'
          - '水温、水量都要按图示来'
      - level: info
        text: '并不是所有的菌都会被杀死这一步针对的是那层菌膜，不是消毒处理。'
        quote:
          - '并不是所有的菌都会被杀死'
          - '这一步针对的是那层菌膜，不是消毒处理。'
