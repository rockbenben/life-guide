  - id: ultra-slow-blink-four-steps
    status: reviewed
    source:
      anchor: '超慢眨眼的四步做法'
    slot: anytime
    remind:
      text: '今天按步骤慢慢眨眼，在猫放松时做，并且不要死盯猫眼。'
      quote:
        - '有意识地慢慢动眼皮'
        - '尽量在它放松的时候做'
        - '不要一边眨眼一边死盯着猫的眼睛看'
    effect:
      text: '这样反复下去，比较容易奏效。'
      quote: '这样反复下去，比较容易奏效。'
    dose:
      - value: 3
        unit: 秒
        what: '闭眼到重新睁开的往返时长'
        quote:
          - '速度：一次往返 3 秒。'
          - '从闭眼到重新睁开算一次、算 3 秒。'
      - value: 3
        unit: 回
        what: '慢慢眨眼的每轮次数'
        quote: '次数：连做 3 回。'
      - value: 1
        unit: 分钟
        what: '整个慢慢眨眼的控制时长'
        quote: '整个「慢慢眨眼」控制在 1 分钟左右就收。'
        approximate: true
    duration:
      basis: quote
      sec: 60
      quote: '整个「慢慢眨眼」控制在 1 分钟左右就收。'
    steps:
      - id: blink-speed
        text: '速度：一次往返 3 秒。从闭眼到重新睁开算一次、算 3 秒。'
        quote:
          - '速度：一次往返 3 秒。'
          - '从闭眼到重新睁开算一次、算 3 秒。'
        duration:
          basis: quote
          sec: 3
          quote: 速度：一次往返 3 秒。从闭眼到重新睁开算一次、算 3 秒。
      - id: draw-eyesight
        text: '先把视线引过来。让猫看着你，办法就是叫它的名字。'
        quote:
          - '先把视线引过来。'
          - '让猫看着你，办法就是叫它的名字。'
      - id: repeat-blink
        text: '次数：连做 3 回。这样反复下去，比较容易奏效。'
        quote:
          - '次数：连做 3 回。'
          - '这样反复下去，比较容易奏效。'
      - id: choose-timing
        text: '尽量在它放松的时候做反面例子是玩玩具的时候和快到饭点的时候看着要睡的猫不要做。'
        quote:
          - '尽量在它放松的时候做'
          - '反面例子是玩玩具的时候和快到饭点的时候'
          - '看着要睡的猫不要做。'
    cautions:
      - level: stop
        text: '一旦觉得猫的心情变差，马上停。'
        quote: '一旦觉得猫的心情变差，马上停。'
      - level: stop
        text: '不要一边眨眼一边死盯着猫的眼睛看，它可能把这理解成威吓。书里提到，确实有猫会因此哈气、抓人、甚至扑上来咬人。'
        quote:
          - '不要一边眨眼一边死盯着猫的眼睛看，它可能把这理解成威吓。'
          - '书里提到，确实有猫会因此哈气、抓人、甚至扑上来咬人。'
