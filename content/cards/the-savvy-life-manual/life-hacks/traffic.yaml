        - '同时看清是否要求兑换后乘坐同一航司。'
    steps:
      - id: register-points-account
        text: '在银行 App（如壹钱包）注册并关联自己的积分账户。'
        quote: '在银行 App（如壹钱包）注册并关联自己的积分账户。'
