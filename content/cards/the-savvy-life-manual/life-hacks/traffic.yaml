  - id: choose-airport-transfer-service
    status: reviewed
    source:
      anchor: '接送机'
    slot: anytime
    remind:
      text: '没有官方接送机权益时，比较接送机服务与打车价格，并先确认联系渠道。'
      quote:
        - '如果没有官方渠道的接送机权益，也可以在二手平台购买「接送机服务」'
        - '高峰和夜间时段通常比打车便宜'
        - '白天的打车费用也基本与接送机持平'
    steps:
      - id: compare-transfer-cost
        text: '高峰和夜间时段通常比打车便宜白天的打车费用也基本与接送机持平高峰或夜间时段打车往往更贵，而专车服务的体验也更稳定。'
        quote:
          - '高峰和夜间时段通常比打车便宜'
          - '白天的打车费用也基本与接送机持平'
          - '高峰或夜间时段打车往往更贵，而专车服务的体验也更稳定。'
      - id: confirm-driver-contact
        text: '务必确认司机通过你预留的手机号与你联系'
        quote: '务必确认司机通过你预留的手机号与你联系'
      - id: check-driver-details
        text: '优先选择能提供车牌号、司机信息的商家，下单前先确认接送时段与车型。'
        quote: '优先选择能提供车牌号、司机信息的商家，下单前先确认接送时段与车型。'
    cautions:
      - level: info
        text: '务必确认司机通过你预留的手机号与你联系深夜联系不上，容易接错人或彼此错过。'
        quote:
          - '务必确认司机通过你预留的手机号与你联系'
          - '深夜联系不上，容易接错人或彼此错过。'
