  - id: buy-train-tickets-with-official-waitlist
    status: reviewed
    source:
      anchor: '火车购票'
    slot: anytime
    remind:
      text: '优先使用铁路官方候补，提交后及时支付，并用官方 App 查询相邻车站。'
      quote:
        - '优先用 12306 官方候补'
        - '第一时间提交候补并第一时间支付'
        - '用官方 App 的多站查询'
        - '把相邻车站加进来一起看'
    steps:
      - id: submit-official-waitlist
        text: '起售即显示候补，通常说明这一区段确实没放票，但仍有后续机会——关键是第一时间提交候补并第一时间支付候补按支付时间排位。'
        quote:
          - '起售即显示候补，通常说明这一区段确实没放票，但仍有后续机会——关键是'
          - '第一时间提交候补并第一时间支付'
          - '候补按支付时间排位。'
      - id: refresh-while-waiting
        text: '候补和刷票不冲突，建议同时进行保持耐心直到截止时间。'
        quote:
          - '候补和刷票不冲突，建议同时进行'
          - '保持耐心直到截止时间。'
      - id: search-nearby-stations
        text: '用官方 App 的多站查询把相邻车站加进来一起看，常常能多出一段可用票源。'
        quote:
          - '用官方 App 的多站查询'
          - '把相邻车站加进来一起看，常常能多出一段可用票源。'
      - id: choose-blue-berth-train
        text: '车次列表中蓝色的车次才支持选上下铺。'
        quote: '车次列表中蓝色的车次才支持选上下铺。'
    cautions:
      - level: stop
        text: '不建议使用第三方抢票软件'
        quote: '不建议使用第三方抢票软件'
      - level: stop
        text: '需要把账号凭证交给第三方，存在信息泄露与账号异常风险，且不保证出票。'
        quote: '需要把账号凭证交给第三方，存在信息泄露与账号异常风险，且不保证出票。'
