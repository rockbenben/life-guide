  - id: daily-acupressure-when-pain-free
    status: reviewed
    name: "不痛时提拉穴位"
    source:
      anchor: '穴位：痛的时候按，其实已经晚了一步'
    slot: anytime
    remind:
      text: '不痛、没有症状时也每天按穴位'
      quote: '在完全不痛、也没有症状的时候也按，才能把穴位的效果拉到最大'
    effect:
      text: '对 20 名偏头痛患者做了 8 周刺激发现神经活动发生改变的区域，很多都跟疼痛有关大脑从「对痛过度敏感」的状态，变成了「疼痛被控制住」的状态'
      quote:
        - '对 20 名偏头痛患者做了 8 周刺激'
        - '发现神经活动发生改变的区域，很多都跟疼痛有关'
        - '大脑从「对痛过度敏感」的状态，变成了「疼痛被控制住」的状态'
    steps:
      - id: press-during-pain-free-time
        text: '在完全不痛、也没有症状的时候也按，才能把穴位的效果拉到最大'
        quote: '在完全不痛、也没有症状的时候也按，才能把穴位的效果拉到最大'
      - id: repeat-safe-stimulus
        text: '在不痛的时候反复给刺激，大脑会学会「就算有刺激也是安全的」，兴奋随之被镇住，神经的工作方式也就变了'
        quote: '在不痛的时候反复给刺激，大脑会学会「就算有刺激也是安全的」，兴奋随之被镇住，神经的工作方式也就变了'
      - id: use-pain-relief-differently
        text: '痛的时候按——刺激穴位让血流上升，血液把肌肉里堆积的老废物冲走，于是痛感缓解'
        quote: '痛的时候按——刺激穴位让血流上升，血液把肌肉里堆积的老废物冲走，于是痛感缓解'
    cautions:
      - level: info
        text: '力度只要「痛但舒服」的程度。'
        quote: '力度只要「痛但舒服」的程度。'
      - level: stop
        text: '按得太重可能适得其反，产生反效果'
        quote: '按得太重可能适得其反，产生反效果'
      - level: with-doctor
        text: '穴位不能治好所有病和所有症状。说明书要求和西医好好配合，把它当成保持健康的助力'
        quote:
