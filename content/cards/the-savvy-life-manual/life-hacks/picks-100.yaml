  - id: marinate-chicken-breast
    status: reviewed
    source:
      anchor: 鸡胸肉：袋揉的损耗，以及更好的办法
    slot: anytime
    remind:
      text: 把鸡胸肉与腌料放进密封袋，用摇代替袋揉；调味一次做完，别反复开袋。
      quote:
        - 沙沙摇（摇动）鸡胸肉
        - 先把牛奶和盐放进袋子里混匀
        - 鸡肉放进袋中，把空气尽量灌满，然后封好袋口
        - 沙沙摇 1 分钟
        - 摇完就照平常烤或炸即可，想更嫩就先彻底加热熟透。
        - 袋揉相当于在揉肉，会施加力量，把肉里的汁水挤出去
        - 「沙沙摇（摇动）鸡胸肉」
        - 做法就是往袋里灌满空气，然后晃。仅此而已。
        - 调味也能在袋子里一次做完
        - 固定四步
        - 先做沙沙摇
        - 往袋里加调味料摇匀
        - 再加 1 大勺玉米淀粉摇匀
        - 取出加热
    effect:
      text: 袋揉比手揉少 13%。每 100g 鸡胸肉吸收的牛奶量手揉9.1g袋揉7.9g相对手揉的吸收量沙沙摇94%
      quote:
        - 袋揉比手揉少 13%。
        - 每 100g 鸡胸肉吸收的牛奶量
        - 手揉
        - 9.1g
        - 袋揉
        - 7.9g
        - 相对手揉的吸收量
        - 沙沙摇
        - 94%
    dose:
      - value: 300
        unit: 克
        what: 鸡胸肉每盒约用量
        quote: 鸡胸肉 1 盒（约 300g）
      - value: 3
        unit: 大勺
        what: 牛奶用量
        quote: 牛奶 3 大勺
      - value: 1.5
        valueMax: 3
        unit: 克
        what: 盐用量
        quote: 盐 1.5～3g
      - value: 300
        unit: 克
        what: 每份鸡胸肉约用量
        quote: 鸡胸肉 1 盒（约 300g）
      - value: 1
        unit: 大勺
        what: 玉米淀粉用量
        quote: 再加 1 大勺玉米淀粉摇匀
    steps:
      - id: prepare-ingredients
        text: 鸡胸肉 1 盒（约 300g）牛奶 3 大勺盐 1.5～3g
        quote:
          - 鸡胸肉 1 盒（约 300g）
          - 牛奶 3 大勺
          - 盐 1.5～3g
      - id: mix-milk-and-salt
        text: 先把牛奶和盐放进袋子里混匀
        quote: 先把牛奶和盐放进袋子里混匀
      - id: add-chicken-and-air
        text: 鸡肉放进袋中，把空气尽量灌满，然后封好袋口
        quote: 鸡肉放进袋中，把空气尽量灌满，然后封好袋口
      - id: shake-one-minute
        text: 沙沙摇 1 分钟
        quote: 沙沙摇 1 分钟
      - id: cook-thoroughly
        text: 摇完就照平常烤或炸即可，想更嫩就先彻底加热熟透。
        quote: 摇完就照平常烤或炸即可，想更嫩就先彻底加热熟透。
      - id: avoid-bag-kneading
        text: 袋揉相当于在揉肉，会施加力量，把肉里的汁水挤出去
        quote: 袋揉相当于在揉肉，会施加力量，把肉里的汁水挤出去
