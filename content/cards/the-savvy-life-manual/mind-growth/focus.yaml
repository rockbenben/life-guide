  - id: scheduled-micro-break
    status: reviewed
    source:
      anchor: '3. 定期休息'
    slot: anytime
    remind:
      text: '在感到疲倦前休息，并按任务消耗调整休息间隔'
      quote:
        - '在你感到疲倦之前就进行休息，而不是等到精力耗尽才停下来。'
        - '所以按任务消耗调整，不必守着 5 分钟。'
    effect:
      text: '一项汇总 22 个独立样本、2335 人的荟萃分析发现，微休息对活力（d=0.36）和疲劳（d=0.35）的改善明确，但总体表现的影响并不显著（d=0.16）；而且休息时间越长、表现恢复越好，消耗大的任务可能需要 10 分钟以上的休息。'
      quote: '一项汇总 22 个独立样本、2335 人的荟萃分析发现，微休息对活力（d=0.36）和疲劳（d=0.35）的改善明确，但总体表现的影响并不显著（d=0.16）；而且休息时间越长、表现恢复越好，消耗大的任务可能需要 10 分钟以上的休息。'
    dose:
      - value: 30
        unit: 分钟
        what: 建议休息间隔
        quote: '设置计时器，每 30 分钟到 1 小时进行一次短暂休息。'
      - value: 1
        unit: 小时
        what: 建议休息间隔
        quote: '设置计时器，每 30 分钟到 1 小时进行一次短暂休息。'
    duration:
      basis: unknown
    steps:
      - id: set-break-timer
        text: '设置计时器，每 30 分钟到 1 小时进行一次短暂休息。'
        quote: '设置计时器，每 30 分钟到 1 小时进行一次短暂休息。'
      - id: change-during-break
        text: '休息期间，尝试做一些与之前工作完全不同的事情，比如伸展运动、与同事交谈或简单地浏览手机。'
        quote: '休息期间，尝试做一些与之前工作完全不同的事情，比如伸展运动、与同事交谈或简单地浏览手机。'
    cautions:
