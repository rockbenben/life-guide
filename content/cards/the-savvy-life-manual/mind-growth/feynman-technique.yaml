      quote: 最终简化到能让一个非专业人士听懂
    steps:
      - id: simplify-content
        text: 把内容提炼、简化，去掉非必要的和多余的信息
        quote: 把内容提炼、简化，去掉非必要的和多余的信息
      - id: use-own-words
        text: 用自己的语言通俗易懂地表达出来，而不是照本宣科。
        quote: 用自己的语言通俗易懂地表达出来，而不是照本宣科。
      - id: build-analogy
        text: 你必须找到类比、理清因果、剔除掉那些只有专家才懂的术语。
        quote: 你必须找到类比、理清因果、剔除掉那些只有专家才懂的术语。
    cautions:
