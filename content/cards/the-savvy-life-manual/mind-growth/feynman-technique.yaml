        text: 我试着讲一遍
        quote: 我试着讲一遍
      - id: use-fluency-signal
        text: 讲得顺是一个有用的自检信号
        quote: 讲得顺是一个有用的自检信号
      - id: check-fluency-limit
        text: 讲得流畅也可能只是叙述熟练。
        quote: 讲得流畅也可能只是叙述熟练。
      - id: pair-with-smart
        text: 费曼学习法和 SMART 计划是一对。
        quote: 费曼学习法和 SMART 计划是一对。
      - id: assign-smart-and-feynman-roles
        text: SMART 原则（具体、可测量、对你有意义、在一定期限内完成）解决的是「做不做得下去」，费曼学习法解决的是「是不是真懂了」。
        quote: SMART 原则（具体、可测量、对你有意义、在一定期限内完成）解决的是「做不做得下去」，费曼学习法解决的是「是不是真懂了」。
    cautions:
