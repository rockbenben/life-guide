  - id: feynman-research-gaps
    status: reviewed
    source:
      anchor: 3. 卡壳就回头查资料
    slot: anytime
    remind:
      text: 卡壳后查资料并回到讲解步骤反复验证
      quote:
        - 反复查资料、学习、强化记忆，再回到第 2 步验证，直到能够顺利地讲授相应的知识。
        - 书看了、笔记也做了，一开口给别人讲还是只能「呃……就是那种……」地卡壳？这种「我好像懂了」的感觉没法自证。
    steps:
      - id: research-materials
        text: 反复查资料、学习、强化记忆
        quote: 反复查资料、学习、强化记忆
      - id: return-to-explanation
        text: 再回到第 2 步验证，直到能够顺利地讲授相应的知识。
        quote: 再回到第 2 步验证，直到能够顺利地讲授相应的知识。
      - id: expose-hidden-gap
        text: 糊过去的代价是那个缺口从此留在脑子里，只是被叙述的流畅掩盖住了。
        quote:
          - 糊过去的代价是那个缺口从此留在脑子里，只是被叙述的流畅掩盖住了。
          - 反复查资料、学习、强化记忆，再回到第 2 步验证，直到能够顺利地讲授相应的知识。
    cautions:
