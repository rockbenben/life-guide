cards:
  - id: mindfulness-not-empty
    status: reviewed
    name: "冥想不必放空"
    source:
      anchor: '冥想不必让大脑放空：杂念 OK + 每天 10 分钟呼吸法'
    slot: anytime
    remind:
      text: '冥想时冒出杂念是理所当然的，察觉后把注意力放回当下。'
      quote:
        - '冥想时冒出杂念本来就是理所当然的。'
        - '察觉，然后把注意力放回当下。'
    steps:
      - id: notice-thought
        text: '杂念和情绪升起是自然的事，不必执着。'
        quote:
          - 杂念和情绪升起是自然的事，不必执着。
          - 那么它到底是什么？说明书采访了几位不同领域的人，答案高度一致——察觉，然后把注意力放回当下。一照禅师说，杂念和情绪升起是自然的事，不必执着。永泽哲（日本藏传佛教研究者）说得更细：不去干预的话，念头会像气泡一样升起又消融，水回到原状；照这样做下去，心会一点点静下来。
      - id: return-attention
        text: '察觉，然后把注意力放回当下。'
        quote: '察觉，然后把注意力放回当下。'
    review:
      by: benson
      date: 2026-10-21
      hash: 67deeafe21089b2a

  - id: notice-and-return-now
    status: reviewed
    name: "察觉后回到当下"
    source:
      anchor: '极意只有一个：察觉到，然后回到「现在」'
    slot: anytime
    remind:
      text: '以察觉后多快回到当下为练习重点。'
      quote: '也就是说，练习冥想练的不是「让杂念不出现」，而是「察觉之后能多快回到当下」。'
    effect:
      text: '但与此同时，随着经验增加，察觉杂念、重新回到当下所需的时间会变短。'
      quote: '但与此同时，随着经验增加，察觉杂念、重新回到当下所需的时间会变短。'
    steps:
      - id: goal-return-speed
        text: '也就是说，练习冥想练的不是「让杂念不出现」，而是「察觉之后能多快回到当下」。'
        quote: '也就是说，练习冥想练的不是「让杂念不出现」，而是「察觉之后能多快回到当下」。'
      - id: notice-return
        text: '察觉，然后把注意力放回当下。'
        quote:
          - 察觉，然后把注意力放回当下。
          - 关于冥想，最流行的说明是「要把杂念清空」。这份说明书第一个要推翻的就是它：坐禅四十年的僧人在座禅中被鸟叫声逗得笑出声，寺院里的杂念提示灯也是接连亮起——冥想时冒出杂念本来就是理所当然的。说明书用了一个很准确的概括：「冥想＝无」并不是必要的，「有杂念 OK」才是真的。^[「新・めい想」のトリセツ]
    review:
      by: benson
      date: 2026-10-21
      hash: 622dd4feec407e58

  - id: daily-breathing-meditation
    status: reviewed
    name: "每天 10 分钟呼吸冥想"
    source:
      anchor: '基本版：每天 10 分钟的呼吸冥想'
    slot: anytime
    remind:
      text: '每天 10 分钟为宜。'
      quote:
        - 每天 10 分钟为宜。
        - 说明书很贴心地准备了「随意篇」，标题直接写着一分钟也可以，由建仁寺两足院副住持伊藤东凌监督。它的核心观点是：在日常生活中把注意力换个方向，本来就是货真价实的冥想。
    effect:
      text: '持续下去能更容易察觉到身体的小变化和不适'
      quote: '持续下去能更容易察觉到身体的小变化和不适'
    dose:
      - value: 10
        unit: 分钟
        what: 每次练习时长
        quote: '每天 10 分钟为宜。'
    duration:
      basis: quote
      sec: 600
      quote: '每天 10 分钟为宜。'
    steps:
      - id: comfortable-breathing
        text: '用舒服的姿势，自然地呼吸'
        quote: '用舒服的姿势，自然地呼吸'
      - id: body-sensation
        text: '把注意力放在腹部和身体鼓起、收缩的感觉上'
        quote: '把注意力放在腹部和身体鼓起、收缩的感觉上'
      - id: notice-thought-return-breath
        text: '想法冒出来时，察觉它，然后让注意力回到呼吸上。'
        quote: '想法冒出来时，察觉它，然后让注意力回到呼吸上。'
      - id: no-self-blame
        text: '不要责怪自己。'
        quote: '不要责怪自己。'
    review:
      by: AI（作者授权代签）
      date: 2026-10-24
      hash: 44a815c6929a088a
    variants:
      busy:
        include:
          - comfortable-breathing
          - body-sensation
          - notice-thought-return-breath

