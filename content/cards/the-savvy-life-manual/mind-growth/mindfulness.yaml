    slot: anytime
    remind:
      text: '开始冥想前，正在精神科、心疗内科就诊或有就诊计划时，先和医生商量。'
      quote: '正在精神科、心疗内科就诊，或有就诊计划的人，请先和医生商量再开始冥想。'
    steps:
